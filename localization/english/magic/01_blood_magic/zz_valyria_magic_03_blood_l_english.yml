  ## Interaction
  zz_valyria_magic_blood_magic_032.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_hcm$\n\nThe use of the arcane forces of [blood_magic|E] to reduce the selected subject's miscast counter.\n\nEvery miscast leaves its mark in the blood: a sourness, a taint, a fever that never quite breaks. Through this mystery, the blood mage draws that taint out of the subject's veins and lets it run away with the spilt blood of the rite.\n\nWhat other schools must coax or erase, blood simply bleeds away. The subject's miscast counter is reduced, more so the greater the caster's skill."

  ## Spell Options
  ## event
  zz_valyria_magic_blood_magic.032.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.032.name$"
  zz_valyria_magic_blood_magic.032.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nThe subject's arm is laid across a basin of black stone, and the caster opens a vein with a silver knife. The blood that runs is dark at first, thick and sluggish, and smells of scorched metal. The caster murmurs over it, and slowly, drop by drop, it runs brighter and cleaner.\n\nThe blood mages of the Freehold held that every failed working poisons the blood a little. They also held that poisoned blood can be let.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_blood_magic.032.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nLeeches bred in the warm pools beneath the Fourteen Flames are set upon the subject's skin, one for each failed spell they have cast. As the caster chants, the leeches swell and darken, and then drop away, heavy with something that is not quite blood.\n\nThey are burned afterwards, and the smoke is very foul.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_blood_magic.032.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nThe caster cuts their own palm and presses it to the subject's, so that their blood mingles. As the incantation rises, the caster's face twists, and they draw the subject's taint into themselves, and then spit it out onto the stones, black and steaming.\n\nIn Valyria, this was a service the old taught to the young, and the young never forgot the taste.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_blood_magic.032.opt.a:0 "Yes, bleed the taint away!"
  zz_valyria_magic_blood_magic.032.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_blood_magic.032.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.032.name$"
  zz_valyria_magic_blood_magic.032.toast.desc:0 "$zz_toast_01$ [blood_magic|E], $zz_toast_02$ drawing the taint of failed magic out of the blood of [recipient.GetFirstName]."
  zz_valyria_magic_blood_magic.032.toast.tt:0 "$zz_valyria_magic_blood_magic.032.toast.desc$"

  zz_valyria_magic_blood_magic.032.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.032.name$"
  zz_valyria_magic_blood_magic.032.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.032.f.toast.tt:0 "$zz_valyria_magic_blood_magic.032.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_blood_magic_033.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_pcm$\n\nThe use of the arcane forces of [blood_magic|E] to prevent the selected subject from miscasting.\n\nThrough this mystery, a ward is written into the subject's blood itself. When a working begins to slip from their control, it is the blood that catches it, thickening and slowing in their veins until the surge has passed.\n\nThe blood remembers the shape of a spell rightly cast, and will not let it be cast wrongly. The subject is protected against miscasts, more so the greater the caster's skill."

  ## Spell Options
  ## event
  zz_valyria_magic_blood_magic.033.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.033.name$"
  zz_valyria_magic_blood_magic.033.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nThe caster paints sigils of binding along the inside of the subject's arms in their own blood, from the wrist to the crook of the elbow. As each sigil is completed it sinks into the skin and is gone, and the subject feels their pulse grow slow and steady and strong.\n\nThe sorcerers of the Freehold who wore such wards were said to be able to cast through fire and storm without a tremor.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_blood_magic.033.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nA cup of blood is drawn from the subject and mixed with powdered dragonbone and the ash of burnt spellbooks. The caster speaks over it until it glows faintly red, and then the subject drinks it, every drop.\n\nIn Valyria, it was said that blood which has tasted its own failures learns not to fail again.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_blood_magic.033.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nThe caster binds a thin red cord about the subject's wrist, soaked in the blood of both, and ties it with seven knots. With each knot a word is spoken, and with each word the cord tightens, until it sinks into the skin and leaves only a faint red line.\n\nThe blood mages called it the leash, for it held magic as a leash holds a hound.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_blood_magic.033.opt.a:0 "Yes, ward their blood!"
  zz_valyria_magic_blood_magic.033.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_blood_magic.033.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.033.name$"
  zz_valyria_magic_blood_magic.033.toast.desc:0 "$zz_toast_01$ [blood_magic|E], $zz_toast_02$ writing a ward against miscasting into the blood of [recipient.GetFirstName]."
  zz_valyria_magic_blood_magic.033.toast.tt:0 "$zz_valyria_magic_blood_magic.033.toast.desc$"

  zz_valyria_magic_blood_magic.033.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.033.name$"
  zz_valyria_magic_blood_magic.033.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.033.f.toast.tt:0 "$zz_valyria_magic_blood_magic.033.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_blood_magic_034.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_skl_pm$\n\nThe use of the arcane forces of [blood_magic|E] to permanently raise or lower the selected subject's [diplomacy|E].\n\nWhat the blood remembers, it can be made to forget, and what it has never known, it can be taught. Through this mystery the caster reworks the subject's blood to sharpen or dull their [diplomacy|E].\n\nThe change is small and slow to grow: one point for every 75 points of the caster's skill, and never less than one."

  ## Spell Options
  ## event
  zz_valyria_magic_blood_magic.034.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.034.name$"
  zz_valyria_magic_blood_magic.034.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nThe caster opens a vein in the subject's wrist and lets the blood run into a bowl of black stone. Over it they speak the old words of shaping, and the blood darkens and thickens as the rite reaches into the voice and the bearing.\n\nThe blood mages of the Freehold held that the blood remembers what a body is, and that what it remembers can be changed. Afterwards their words carry further, or falter and die in the mouth.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_blood_magic.034.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nThe caster's own blood and the subject's are mingled on a blade of Valyrian steel, and the caster draws a single line with it along the subject's brow. The cut closes as soon as it is made, but something beneath it does not.\n\nIt is slow work, and it was never meant to be quick: the blood yields a little at a time, and their words carry further, or falter and die in the mouth.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_blood_magic.034.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nA drop of the subject's blood is set upon the tongue of a sleeping dragon-egg, warm in its brazier. The caster chants until the egg's scales flush red, and then presses the subject's palm against the shell.\n\nIn Valyria it was said that the blood of a mage could be taught, like a hound, and that the voice and the bearing answered to it most of all.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_blood_magic.034.opt.a:0 "Let the blood reshape their [diplomacy|E]!"
  zz_valyria_magic_blood_magic.034.opt.z:0 "No, do not cast!"

  zz_valyria_magic_blood_magic.034.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.034.name$"
  zz_valyria_magic_blood_magic.034.toast.desc:0 "$zz_toast_01$ [blood_magic|E], $zz_toast_02$ reshaping the [diplomacy|E] of [recipient.GetFirstName]."
  zz_valyria_magic_blood_magic.034.toast.tt:0 "$zz_valyria_magic_blood_magic.034.toast.desc$"

  zz_valyria_magic_blood_magic.034.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.034.name$"
  zz_valyria_magic_blood_magic.034.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.034.f.toast.tt:0 "$zz_valyria_magic_blood_magic.034.f.toast.desc$"

