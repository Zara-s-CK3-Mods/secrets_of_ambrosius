  ## Interaction
  zz_valyria_magic_blood_magic_018.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tca$\n$zz_tough$\n\n The use of the arcane forces of [blood_magic|E] to empower the commanded troops of a chosen subject. \n\nThis forbidden application of the arcane forces of [blood_magic|E] reaches beyond flesh and bone, delving into the hidden architecture of life itself. Through ancient High Valyrian rites and the sacrificial spilling of blood, the spell temporarily reshapes the inherited essence of your soldiers, warping strength, endurance, and instinct at their source. What emerges is an army subtly rewritten—improved, hardened, and altered in ways unseen, their very blood carrying the echo of draconic mastery."

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.018.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.018.name$"
  zz_valyria_magic_blood_magic.018.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The blood resonates with an unnatural cadence, as though answering a distant call from ages long buried beneath ash and fire. Shadows bend and stretch as sigils of lineage and dominion are traced in the air, each mark a violation of the natural order once perfected by the dragonlords of old.\nHigh Valyrian invocations unravel the invisible threads that define mortal inheritance. Through this rite, the blood of countless soldiers is touched in unison, their shared essence bent and rewritten for a brief but potent span of time. Strength is drawn from forgotten ancestors, instincts are sharpened to inhuman precision, and bodies are reshaped to better serve the will of war.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to manipulate the very genetics of the soldiers of [recipient.GetFirstName], remaking them into something more efficient and more terrible. Yet such trespass into the foundations of life was once the pride—and the doom—of Valyria itself. Will unseen powers take offense at this manipulation, or will they merely watch and remember the hand that dared to rewrite the blood of an army?"
  zz_valyria_magic_blood_magic.018.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nHelmets taken from the host are set in a ring around the circle, each one turned to face the centre. As the caster bleeds, a low hum rises from them, the sound of many voices speaking together at the edge of hearing, and the blood upon the floor begins to move in time with it.\n\nThe Freehold's legions were said to fight as one creature, every soldier knowing the mind of the man beside him. Their blood mages had made them so, binding them together in rites like this one.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to manipulate the very genetics of the soldiers of [recipient.GetFirstName], remaking them into something more efficient and more terrible. Yet such trespass into the foundations of life was once the pride—and the doom—of Valyria itself. Will unseen powers take offense at this manipulation, or will they merely watch and remember the hand that dared to rewrite the blood of an army?"
  zz_valyria_magic_blood_magic.018.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster draws a lattice of lines upon the floor in blood, each line branching into others like the roots of a great tree. Into each branch they speak a name drawn from the muster rolls of the host, and at each name the lines glow briefly and then sink into the stone.\n\nThe flesh-shapers of Valyria did not only work upon single bodies. Given enough blood and enough will, they could reshape a whole army, sharpening its senses and hardening its flesh for the battles ahead.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to manipulate the very genetics of the soldiers of [recipient.GetFirstName], remaking them into something more efficient and more terrible. Yet such trespass into the foundations of life was once the pride—and the doom—of Valyria itself. Will unseen powers take offense at this manipulation, or will they merely watch and remember the hand that dared to rewrite the blood of an army?"
  zz_valyria_magic_blood_magic.018.opt.a:0 "Yes, twist and shape!"
  zz_valyria_magic_blood_magic.018.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.018.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.018.name$"
  zz_valyria_magic_blood_magic.018.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ instilling resistance into the army of [recipient.GetFirstName]."
  zz_valyria_magic_blood_magic.018.toast.tt:0 "$zz_valyria_magic_blood_magic.018.toast.desc$"

  zz_valyria_magic_blood_magic.018.f.toast.t:0 " Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.018.name$"
  zz_valyria_magic_blood_magic.018.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.018.f.toast.tt:0 "$zz_valyria_magic_blood_magic.018.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_blood_magic_019.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_ccs$\n\nThe use of the arcane forces of [blood_magic|E] to alter the sex of a child unborn. \n\nThis subtle yet deeply transgressive working of the arcane forces of [blood_magic|E] reaches into the most fragile threshold of existence. Through carefully measured sacrifice and whispered High Valyrian formulae, the rite bends the hidden currents of inheritance itself, guiding the shape of life before it has fully taken form. Such power was once considered trivial by the dragonlords, yet even they recorded it with unease, for it alters destiny before the child has ever drawn breath."
  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.019.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.019.name$"
  zz_valyria_magic_blood_magic.019.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The air grows hushed, heavy with expectation, as ancient words meant only for the shaping of bloodlines are murmured once more. The blood seems to listen, pulsing faintly in time with a life not yet born.\nIn the lost annals of Valyria, such manipulation of the unborn was dismissed as a mere cantrip, practiced by lesser adepts to satisfy dynastic anxieties and prophetic calculations. Yet the records also speak of unease, for to touch a child before its first breath is to trespass upon a mystery guarded even from gods.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to wield the magics of blood to determine the sex of the child growing within [recipient.GetFirstName], shaping lineage and legacy before fate has had its say. But power does not ask whether it should be used—only whether you will accept the weight of the choice, and whatever unseen consequences may follow."
  zz_valyria_magic_blood_magic.019.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA ring is threaded on a single hair and held above the mother's belly. As the caster's blood drips from the edge of the ring, it begins to swing, slowly at first, then in a steady circle, tracing a pattern that the caster watches with close attention.\n\nThe midwives of the provinces used such rings to guess at a child's sex. The blood mages of Valyria used them to choose it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to wield the magics of blood to determine the sex of the child growing within [recipient.GetFirstName], shaping lineage and legacy before fate has had its say. But power does not ask whether it should be used—only whether you will accept the weight of the choice, and whatever unseen consequences may follow."
  zz_valyria_magic_blood_magic.019.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nTwo candles are lit upon the ritual stone, one of white wax and one of red. The caster bleeds into a shallow dish between them and speaks the old words softly, and the flames lean together over the dish as if to whisper to one another.\n\nTo the great houses of the Freehold, the sex of an heir was too important to be left to the gods. Their blood mages did not ask the gods' permission to decide it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to wield the magics of blood to determine the sex of the child growing within [recipient.GetFirstName], shaping lineage and legacy before fate has had its say. But power does not ask whether it should be used—only whether you will accept the weight of the choice, and whatever unseen consequences may follow."
  zz_valyria_magic_blood_magic.019.opt.a:0 "Let the blood decide the child!"
  zz_valyria_magic_blood_magic.019.opt.z:0 "No, do not cast!"
  ## Blood 019 - choices
  zz_sex_selection_male:0 "A Son"
  zz_sex_selection_female:0 "A Daughter"
  ## Spell Toast
  zz_valyria_magic_blood_magic.019.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.019.name$"
  zz_valyria_magic_blood_magic.019.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ manipulating the sex of the uborn child of [recipient.GetFirstName]."
  zz_valyria_magic_blood_magic.019.toast.tt:0 "$zz_valyria_magic_blood_magic.019.toast.desc$"

