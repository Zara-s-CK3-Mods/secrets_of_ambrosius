  ## Interaction
  zz_valyria_magic_blood_magic_020.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_ppw$\n\n The use of the arcane forces of [blood_magic|E] to protect a mother from death in childbirth. \n\nThis solemn working of the arcane forces of [blood_magic|E] is meant to ward a mother from the perils of childbirth. \n\nThrough ancient High Valyrian rites and the careful spilling of sanctified blood, protective sigils are bound directly into the mother’s living essence. The magic interposes itself between life and death, guiding the body safely through the trial of birth.\n\nYet such protection is never freely given. While the mother is shielded from doom, the spell reaches also toward the unborn child, binding its fate to powers older than mercy. Blood magic can promise survival, but it cannot promise innocence, and what is spared in the mother may be claimed, subtly or otherwise, from the child she carries."

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.020.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.020.name$"
  zz_valyria_magic_blood_magic.020.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The air grows tense and reverent, as ancient High Valyrian phrases meant for the safeguarding of bloodlines are spoken once more. The blood does not simply fall—it lingers, trembling, as if aware of the fragile life it is meant to guard.\nIn the lost wisdom of Valyria, the manipulation of pregnancy was dismissed as a mere cantrip, a practical art refined to preserve dynasties and heirs. Protective wards were woven into the mother’s blood, guiding her safely through the ordeal of birth while fate itself was held at bay.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to wield the magics of blood to ensure that [recipient.GetName] is spared the mortal risks of her pregnancy, shielding her from the doom that has claimed so many before. Yet blood magic never intervenes without cost, and what shadows may fall upon the child unborn is a question no Valyrian text ever answered. Can you accept the consequences of such protection, or will you turn away from this intrusion into the deepest mysteries of life?"
  zz_valyria_magic_blood_magic.020.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster draws a circle of blood around the mother's bed, closing it with a mark at the head and another at the foot. The air within the circle grows warm and still, and the mother feels a strange calm settle over her, as though unseen hands were holding her gently in place.\n\nIn Old Valyria, a noblewoman did not die in childbed if her family could afford a blood mage. The wards woven by this mystery held back the dangers of birth as surely as walls hold back the sea.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to wield the magics of blood to ensure that [recipient.GetName] is spared the mortal risks of her pregnancy, shielding her from the doom that has claimed so many before. Yet blood magic never intervenes without cost, and what shadows may fall upon the child unborn is a question no Valyrian text ever answered. Can you accept the consequences of such protection, or will you turn away from this intrusion into the deepest mysteries of life?"
  zz_valyria_magic_blood_magic.020.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA charm of red coral, shaped like a closed hand, is wetted with the caster's blood and hung above the mother's bed. It turns slowly on its cord, though there is no wind, always coming to rest facing her.\n\nThe great houses of the Freehold kept such charms for generations, passing them from mother to daughter. Their blood mages renewed the wards upon them with each new pregnancy, and with each renewal, the price in blood was paid again.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to wield the magics of blood to ensure that [recipient.GetName] is spared the mortal risks of her pregnancy, shielding her from the doom that has claimed so many before. Yet blood magic never intervenes without cost, and what shadows may fall upon the child unborn is a question no Valyrian text ever answered. Can you accept the consequences of such protection, or will you turn away from this intrusion into the deepest mysteries of life?"
  zz_valyria_magic_blood_magic.020.opt.a:0 "Yes, keep her from death!"
  zz_valyria_magic_blood_magic.020.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.020.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.020.name$"
  zz_valyria_magic_blood_magic.020.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ blessing [recipient.GetFirstName] with a protection against death in child birth."
  zz_valyria_magic_blood_magic.020.toast.tt:0 "$zz_valyria_magic_blood_magic.020.toast.desc$"

  zz_valyria_magic_blood_magic.020.f.toast.t:0 " Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.020.name$"
  zz_valyria_magic_blood_magic.020.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.020.f.toast.tt:0 "$zz_valyria_magic_blood_magic.020.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_blood_magic_021.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_puc$\n\nThe use of the arcane forces of [blood_magic|E] to protect an unborn child from the risks of child birth. \n\nThis perilous working of the arcane forces of [blood_magic|E] is directed not at the mother, but at the fragile life forming within her. Through High Valyrian rites of binding and preservation, blood is offered to shield the unborn child from the mortal dangers of birth, wrapping it in wards etched directly into its nascent essence.\n\nYet such interference comes at a terrible risk. To touch a soul before it has entered the world is to invite instability—mutation, unnatural growth, and lingering deformities of body or spirit. Blood magic may ensure survival, but it cannot guarantee what kind of being will ultimately be born."

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.021.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.021.name$"
  zz_valyria_magic_blood_magic.021.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The blood coils and quivers as if drawn toward an unseen presence, answering the silent pulse of life hidden within the womb. Ancient High Valyrian phrases, reserved for the preservation of bloodlines, are spoken with grave care.\nIn the lost lore of Valyria, the manipulation of pregnancy was treated as a simple art, a calculated intrusion meant to secure heirs and silence fate itself. Yet even those texts speak of children born *changed*, marked by the touch of magic before their first breath.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to wield the magics of blood to try to ensure that the child slumbering in the womb of [recipient.GetFirstName] survives the perils of birth, shielded by wards older than empires. But to tamper with life at such a threshold is to gamble with forces that do not forgive easily. Can you accept the risk of what this child might become, or will you turn away from this forbidden mercy?"
  zz_valyria_magic_blood_magic.021.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster lays their bloodied palm upon the mother's belly and speaks softly in High Valyrian, as one might speak to a child. Beneath their hand there is a faint stirring, and for a moment the caster's own heartbeat seems to fall into step with a smaller, quicker one.\n\nThe blood mages of the Freehold did not only guard the mothers of great houses. They guarded the heirs within them, binding wards to their blood before they had ever drawn breath.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to wield the magics of blood to try to ensure that the child slumbering in the womb of [recipient.GetFirstName] survives the perils of birth, shielded by wards older than empires. But to tamper with life at such a threshold is to gamble with forces that do not forgive easily. Can you accept the risk of what this child might become, or will you turn away from this forbidden mercy?"
  zz_valyria_magic_blood_magic.021.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA tiny shirt of fine linen, made for a child not yet born, is laid upon the ritual stone. The caster bleeds upon its hem, and the blood spreads through the cloth in a pattern of tiny, interlocking sigils, too small and too perfect to have been drawn by any hand.\n\nThe old texts say that children so warded seldom took sick and seldom died young. They also say that such children were often strange, and that they grew up with dreams of red rooms and of voices speaking in a tongue they had never been taught.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to wield the magics of blood to try to ensure that the child slumbering in the womb of [recipient.GetFirstName] survives the perils of birth, shielded by wards older than empires. But to tamper with life at such a threshold is to gamble with forces that do not forgive easily. Can you accept the risk of what this child might become, or will you turn away from this forbidden mercy?"
  zz_valyria_magic_blood_magic.021.opt.a:0 "Yes, keep them safe!"
  zz_valyria_magic_blood_magic.021.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.021.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.021.name$"
  zz_valyria_magic_blood_magic.021.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ blessing [recipient.GetFirstName] with a protection for her unborn child."
  zz_valyria_magic_blood_magic.021.toast.tt:0 "$zz_valyria_magic_blood_magic.021.toast.desc$"

  zz_valyria_magic_blood_magic.021.f.toast.t:0 " Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.021.name$"
  zz_valyria_magic_blood_magic.021.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.021.f.toast.tt:0 "$zz_valyria_magic_blood_magic.021.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_blood_magic_022.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_gis$\n$zz_clde$\n$zz_cdb$\n\nThe use of the arcane forces of [blood_magic|E] to grant immortality \n\nGrant a chosen subject immortality \n\nThis ultimate and near-mythical application of the arcane forces of [blood_magic|E] seeks to unmoor a living being from the passage of time itself. The rite draws upon a vast and catastrophic well of sorcerous power, stabilized only through the sacrifice of multiple dragonbloods—each one a vessel of ancient fire and lineage.\n\nThrough High Valyrian invocations older than the Doom, the stolen lifeforce is gathered, refined, and violently bound into a single chosen subject. Their blood is rewritten as an eternal conduit, sustaining body and spirit beyond decay or age. Such a miracle grants unending life, but it forever marks the recipient as something altered—sustained not by nature, but by an atrocity remembered by the world."
  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.022.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.022.name$"
  zz_valyria_magic_blood_magic.022.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The blood does not fall silently—it hisses and steams, resonating with the latent fire of dragonlords long dead. The chamber trembles under the weight of power being gathered, as if reality itself recoils from what is about to be attempted.\nIn the deepest and most closely guarded lore of lost Valyria, there are fragmentary accounts of immortality wrested from the world by force. These rites did not create life from nothing; they stole it. The burning vitality of several dragonbloods was drained, broken, and reforged into a single, concentrated essence—enough to anchor one soul eternally against the erosion of time.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to wield the magics of blood to harvest the blazing lifeforce of multiple dragonbloods and infuse it into [recipient.GetFirstName], granting them an eternal span of life untouched by age or decay. Yet such an act is not merely forbidden—it is foundationally obscene, a theft from lineage, legacy, and fate itself. Should you proceed, the world may gain an immortal… but the price will be written in blood that even Valyria once feared to spill."
  zz_valyria_magic_blood_magic.022.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nSeveral bowls of blood, each drawn from one of the dragonbloods bound for this rite, are arranged in a ring about the circle. As the caster speaks, the blood rises from each bowl in a slow red thread, and the threads meet above the subject and twist together into one.\n\nThe Freehold's most closely guarded texts speak of only a handful of dragonlords who achieved true immortality. They do not say how many others died to grant it to them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to wield the magics of blood to harvest the blazing lifeforce of multiple dragonbloods and infuse it into [recipient.GetFirstName], granting them an eternal span of life untouched by age or decay. Yet such an act is not merely forbidden—it is foundationally obscene, a theft from lineage, legacy, and fate itself. Should you proceed, the world may gain an immortal… but the price will be written in blood that even Valyria once feared to spill."
  zz_valyria_magic_blood_magic.022.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster lights a brazier of dragonbone, and the flame burns pale and blue. Into it they pour blood drawn from many veins, and the fire roars up, green and gold and red, while the subject, standing within its heat, feels it pour into them rather than burn them.\n\nThe dragonlords believed that their blood held the fire of their dragons, and that fire, properly gathered, could hold off death forever. This rite was their proof, and their greatest crime.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] It is possible to wield the magics of blood to harvest the blazing lifeforce of multiple dragonbloods and infuse it into [recipient.GetFirstName], granting them an eternal span of life untouched by age or decay. Yet such an act is not merely forbidden—it is foundationally obscene, a theft from lineage, legacy, and fate itself. Should you proceed, the world may gain an immortal… but the price will be written in blood that even Valyria once feared to spill."
  zz_valyria_magic_blood_magic.022.opt.a:0 "Yes, Immortality!"
  zz_valyria_magic_blood_magic.022.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.022.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.022.name$"
  zz_valyria_magic_blood_magic.022.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ blessing [recipient.GetFirstName] with eternal life."
  zz_valyria_magic_blood_magic.022.toast.tt:0 "$zz_valyria_magic_blood_magic.022.toast.desc$"

  zz_valyria_magic_blood_magic.022.f.toast.t:0 " Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.022.name$"
  zz_valyria_magic_blood_magic.022.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.022.f.toast.tt:0 "$zz_valyria_magic_blood_magic.022.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_blood_magic_023.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_agep$\n$zz_nhp$\n\nThe use of the arcane forces of [blood_magic|E] to infuse vigor to combat aging. \n\nThis insidious application of the arcane forces of [blood_magic|E] does not halt time, but defies it. Through ancient High Valyrian rites and the controlled offering of blood, youthful vigour is drawn forth and bound back into a body already claimed by the passing years.\n\nMuscle remembers forgotten strength, breath comes easier, and reflexes sharpen as though age itself has been momentarily deceived. Yet such magic does not restore what was lost—it replaces it with something unnatural. \n\nThe rigours of age are kept at bay, but the question lingers in every Valyrian text: what is the true worth of vigour, when the years it defies still wait patiently to reclaim their due?"

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.023.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.023.name$"
  zz_valyria_magic_blood_magic.023.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The blood glistens unnaturally, reflecting faces long past and moments already lost to time. The air thickens with whispered High Valyrian syllables—rites once spoken in marble halls by dragonlords who feared decline more than death.\nAmong the great families of old Valyria, anxieties over succession and fading strength were constant. In answer, they forged rituals of youth, arts meant to coax vigor back into aging flesh. These workings did not rewind time, but forced the body to *remember* what it once was, reigniting strength, speed, and ferocity through sorcerous deceit.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You can have [recipient.GetFirstName] infused with stolen youthful energy, allowing them to fight and endure as they did in their prime. Yet such vitality is a mask stretched thin over mortality, and the blood remembers every lie it is made to tell. Do you truly desire to play with life in this way, knowing that age may yet return with compounded cruelty?"
  zz_valyria_magic_blood_magic.023.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA polished shield is set before the subject, so they may see their own reflection. As the caster's blood falls upon the floor, the reflection begins to change, the lines of age softening, the stoop of the shoulders straightening, until the figure in the shield is the subject as they were in their prime.\n\nThe Valyrian nobility feared weakness more than death. Through this mystery, they could fight as young men long after their hair had turned white, though their reflections were said to grow older again whenever they looked away.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You can have [recipient.GetFirstName] infused with stolen youthful energy, allowing them to fight and endure as they did in their prime. Yet such vitality is a mask stretched thin over mortality, and the blood remembers every lie it is made to tell. Do you truly desire to play with life in this way, knowing that age may yet return with compounded cruelty?"
  zz_valyria_magic_blood_magic.023.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster brings forth an old practice blade, chipped and worn, that the subject once used as a youth. They bleed upon its edge, and the subject, taking it up, feels the old ease in their arm return, the old speed in their feet, the old fire in their chest.\n\nThe blood mages of Valyria could not truly make anyone young again. But they could convince the body to forget, for a while, how old it had become.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You can have [recipient.GetFirstName] infused with stolen youthful energy, allowing them to fight and endure as they did in their prime. Yet such vitality is a mask stretched thin over mortality, and the blood remembers every lie it is made to tell. Do you truly desire to play with life in this way, knowing that age may yet return with compounded cruelty?"
  zz_valyria_magic_blood_magic.023.opt.a:0 "Yes, let their line be secure!"
  zz_valyria_magic_blood_magic.023.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.023.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.023.name$"
  zz_valyria_magic_blood_magic.023.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ enfusing [recipient.GetFirstName] with vitaility, stripping the trappings of age."
  zz_valyria_magic_blood_magic.023.toast.tt:0 "$zz_valyria_magic_blood_magic.023.toast.desc$"

  zz_valyria_magic_blood_magic.023.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.023.name$"
  zz_valyria_magic_blood_magic.023.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.023.f.toast.tt:0 "$zz_valyria_magic_blood_magic.023.f.toast.desc$"



  ## Interaction
  zz_valyria_magic_blood_magic_024.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_eb$\n\nThe use of the arcane forces of [blood_magic|E] to increase a chosen subject’s [learning_i][learning|E]. \n\nThis esoteric application of the arcane forces of [blood_magic|E] binds a living engine of improvement directly into the blood itself. Through High Valyrian rites of memory, lineage, and dominion, the subject’s mind is opened and reshaped, allowing knowledge to take root far beyond mortal limits.\n\nThe blood becomes a vessel of comprehension, ensuring the continuous and unnatural growth of the chosen subject’s [learning_i][learning|E]. Each passing year deepens their understanding, as forgotten lore, hidden patterns, and dangerous truths rise unbidden to the surface of their thoughts. What is learned is never forgotten, and what is forgotten may still whisper from within the veins."

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.024.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.024.name$"
  zz_valyria_magic_blood_magic.024.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The blood shivers as ancient High Valyrian words of remembrance and revelation are spoken, syllables once used to bind wisdom directly into flesh. Shadows lengthen, and the air hums with the weight of knowledge straining to be born.\nFor the Valyrians, it was possible to infuse an individual with an essence of understanding, a distilled force of insight that would build endlessly upon their [learning_i][learning|E]. Such power did not rely on study alone; it compelled the mind to grow, forcing comprehension, perception, and realization to unfold at a constant and relentless pace.\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To transform the very essence of life within [recipient.GetFirstName], expanding their [learning_i][learning|E] beyond natural bounds. To set their blood upon a path of ceaseless intellectual ascent, letting them grow with time into a more capable and effective individual. This rite is profoundly unnatural, a violation of the quiet limits placed upon mortal understanding—but do you wish to proceed, and bind their mind to knowledge that may never again let them rest?"
  zz_valyria_magic_blood_magic.024.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nScrolls and codices are piled high around the ritual circle, their pages open to texts in a dozen tongues. The caster bleeds upon the topmost, and the ink upon every page seems to stir and shift, as though the words themselves were straining towards the subject at the centre.\n\nThe scholars of the Freehold did not always learn by study. Some learned by blood, and their minds grew year upon year, filling with knowledge they never remembered gaining.\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To transform the very essence of life within [recipient.GetFirstName], expanding their [learning_i][learning|E] beyond natural bounds. To set their blood upon a path of ceaseless intellectual ascent, letting them grow with time into a more capable and effective individual. This rite is profoundly unnatural, a violation of the quiet limits placed upon mortal understanding—but do you wish to proceed, and bind their mind to knowledge that may never again let them rest?"
  zz_valyria_magic_blood_magic.024.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAn oil lamp burns at the subject's head, and its flame is fed with oil mixed with the caster's blood. As the incantation goes on, the light grows brighter and steadier, until the subject feels that they can see further and more clearly than ever before, not with their eyes, but with their mind.\n\nIn Old Valyria, wisdom was a thing that could be grown, like a crop or a dragon. This mystery plants the seed.\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To transform the very essence of life within [recipient.GetFirstName], expanding their [learning_i][learning|E] beyond natural bounds. To set their blood upon a path of ceaseless intellectual ascent, letting them grow with time into a more capable and effective individual. This rite is profoundly unnatural, a violation of the quiet limits placed upon mortal understanding—but do you wish to proceed, and bind their mind to knowledge that may never again let them rest?"
  zz_valyria_magic_blood_magic.024.opt.a:0 "Yes, enrich their blood with magic!"
  zz_valyria_magic_blood_magic.024.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.024.toast.t:0  "[blood_magic|E] - $zz_valyria_magic_blood_magic.024.name$"
  zz_valyria_magic_blood_magic.024.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ empowering the [learning_i][learning|E] of [recipient.GetFirstName]."
  zz_valyria_magic_blood_magic.024.toast.tt:0 "$zz_valyria_magic_blood_magic.024.toast.desc$"

  zz_valyria_magic_blood_magic.024.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.024.name$"
  zz_valyria_magic_blood_magic.024.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.024.f.toast.tt:0 "$zz_valyria_magic_blood_magic.024.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_blood_magic_025.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_eb$\n\nThe use of the arcane forces of [blood_magic|E] to increase a chosen subject’s [diplomacy_i][diplomacy|E]. \n\nThis subtle and insidious application of [blood_magic|E] reshapes not muscle or bone, but the currents of influence that flow through blood and breath alike. Through ancient High Valyrian rites of voice, bearing, and command, the chosen subject’s presence is altered at its source.\n\nA force of improvement is bound directly into the blood itself, ensuring a continuous and unnatural growth in the subject’s [diplomacy_i][diplomacy|E]. Words carry greater weight, gazes linger longer, and even silence becomes persuasive. Over time, the blood remembers how to bend others, and the art of influence grows without effort or restraint."
  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.025.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.025.name$"
  zz_valyria_magic_blood_magic.025.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The blood glimmers faintly as High Valyrian syllables of dominion and accord are whispered, each one a relic of an age when empires were ruled as much by words as by fire. The air grows close, heavy with unspoken pressure, as if the chamber itself were listening.\nIn lost Valyria, diplomats were not merely trained—they were forged. Through blood and spell, individuals were infused with a sorcerous charm that seeped into every gesture and utterance, causing their [diplomacy_i][diplomacy|E] to grow at a constant and unnatural rate. Others found themselves swayed without understanding why, their wills softened by forces buried deep within another’s veins.\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To transform the very essence of life within [recipient.GetFirstName], expanding their [diplomacy_i][diplomacy|E] beyond mortal bounds. To let them grow with time into a more capable and effective individual, one whose influence deepens with every passing year. Such power is profoundly unnatural, a quiet violation of free will and fate alike—but do you wish to proceed, and bind their blood to the art of command?"
  zz_valyria_magic_blood_magic.025.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster bleeds into a cup of fine wine and passes it to the subject, who drinks. The wine tastes of honey and of iron, and as it settles, the subject feels a curious warmth in their voice, as if every word they speak now carries a little more weight than before.\n\nThe envoys of the Freehold won as many cities with words as its dragons won with fire. It was said that no one could refuse them for long, and few understood why.\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To transform the very essence of life within [recipient.GetFirstName], expanding their [diplomacy_i][diplomacy|E] beyond mortal bounds. To let them grow with time into a more capable and effective individual, one whose influence deepens with every passing year. Such power is profoundly unnatural, a quiet violation of free will and fate alike—but do you wish to proceed, and bind their blood to the art of command?"
  zz_valyria_magic_blood_magic.025.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster traces the subject's lips with a fingertip wetted in blood and speaks a single word in High Valyrian. The word hangs in the air, and the subject feels it settle into their mouth, as though they had always known it, and always would.\n\nValyrian diplomats were said to have voices that could soften stone. Through this mystery, the subject's voice is set on that same path, growing more persuasive with every year that passes.\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To transform the very essence of life within [recipient.GetFirstName], expanding their [diplomacy_i][diplomacy|E] beyond mortal bounds. To let them grow with time into a more capable and effective individual, one whose influence deepens with every passing year. Such power is profoundly unnatural, a quiet violation of free will and fate alike—but do you wish to proceed, and bind their blood to the art of command?"
  zz_valyria_magic_blood_magic.025.opt.a:0 "Yes, enrich their blood with magic!"
  zz_valyria_magic_blood_magic.025.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.025.toast.t:0  "[blood_magic|E] - $zz_valyria_magic_blood_magic.025.name$"
  zz_valyria_magic_blood_magic.025.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ empowering the blood of [recipient.GetFirstName]."
  zz_valyria_magic_blood_magic.025.toast.tt:0 "$zz_valyria_magic_blood_magic.025.toast.desc$"

