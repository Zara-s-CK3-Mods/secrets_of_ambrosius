  ## Interaction

  zz_valyria_magic_blood_magic_011.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_lexp$\n\nThe use of the arcane forces of [blood_magic|E] to infuse a chosen subject with life, extending their natural span for a period of time.\n\nThis most perilous rite draws upon the deepest Valyrian heresies, where life was not merely preserved, but *lengthened* through force of will and blood-bound decree. By invoking High Valyrian formulae of persistence and renewal, the blood mage teaches flesh to resist the quiet pull of time.\n\nBlood is saturated with the raw essence of vitality, compelled to burn slower, mend more completely, and remember itself as unbroken. Years are pressed back, decay is delayed, and the body is wrapped in a fragile defiance of mortality.\n\nYet this extension is not true immortality, but an enforced endurance. The blood strains beneath the weight of stolen years, and the subject carries within them a sense of borrowed time—life prolonged by powers that were never meant to be entreated. In Valyrian sorcery, to live longer is not a blessing, but a negotiation whose cost is merely deferred."

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.011.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.011.name$"
  zz_valyria_magic_blood_magic.011.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The blood glows faintly, thick and slow, as though already refusing to age or settle. Shadows cling unnaturally close, and the air feels heavy with patience rather than urgency.\nIn shadowy Babylon, rumours abound of profane arts that will make a man endure the ages of the world. These are not tales of eternal youth, but of lives stretched thin across centuries, sustained by rites that deny time its claim. Through High Valyrian words of continuance and refusal, such secrets are called into being.\nIt might be possible to empower [recipient.GetFirstName] with the raw conceptual stuff of life itself—binding vigor, resilience, and renewal directly into their blood. Their body would endure where others wither, surviving the slow turning of years with unsettling calm.\nYet this magic intrudes upon the oldest boundary of all. To extend a life is to meddle with the rhythm of generations, to insist that one will not make room for those who follow. Those so altered are said to feel the weight of years yet unlived pressing upon them, a constant reminder that time has been cheated, not conquered.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] This will let them endure the changing of the ages, standing apart from the natural passing of men—but do you truly desire to play with life in this way, and invite the attention of forces that measure existence in centuries rather than years?"
  zz_valyria_magic_blood_magic.011.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAn hourglass of ancient make stands beside the ritual circle, its sand long since run through. As the caster's blood falls upon its frame, the last few grains in the upper bulb, which had seemed stuck fast, begin to fall again, slowly, one by one.\n\nThe blood mages of Valyria could not stop time. What they could do was teach a body to spend it more slowly, so that the years which wore at others would pass it by with only a gentle touch.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] This will let them endure the changing of the ages, standing apart from the natural passing of men—but do you truly desire to play with life in this way, and invite the attention of forces that measure existence in centuries rather than years?"
  zz_valyria_magic_blood_magic.011.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster opens a vein beneath the light of a dying star, chosen for this hour by long calculation. The blood falls slow and heavy, gleaming in the starlight, and the subject feels a strange stillness settle into their bones, as if the clock within them had been wound back and set to run more slowly.\n\nThe dragonlords of the Freehold lived long, longer than their subjects thought natural. This was one of the reasons why.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] This will let them endure the changing of the ages, standing apart from the natural passing of men—but do you truly desire to play with life in this way, and invite the attention of forces that measure existence in centuries rather than years?"
  zz_valyria_magic_blood_magic.011.opt.a:0 "Yes, Even death must bow!"
  zz_valyria_magic_blood_magic.011.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.011.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.011.name$"
  zz_valyria_magic_blood_magic.011.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ enfusing [recipient.GetFirstName] with extra years of life."
  zz_valyria_magic_blood_magic.011.toast.tt:0 "$zz_valyria_magic_blood_magic.011.toast.desc$"

  zz_valyria_magic_blood_magic.011.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.011.name$"
  zz_valyria_magic_blood_magic.011.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.011.f.toast.tt:0 "$zz_valyria_magic_blood_magic.011.f.toast.desc$"


  zz_valyria_magic_blood_magic_012.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_hlth_up$\n\nThe use of the arcane forces of [blood_magic|E] to infuse chosen character with vitality, bolstering their health and helping to protect them from misfortunes of health.\n\nThis rite belongs to the Valyrian mysteries of vital binding, where life itself was treated as a substance that could be measured, stored, and reinforced. Through solemn High Valyrian invocations of preservation and fortitude, the blood mage strengthens the subject’s bond to their own living essence.\n\nBlood is saturated with raw vitality, compelled to thicken with endurance and resist harm. Flesh becomes slower to fail, illness finds fewer openings, and the body clings more fiercely to wholeness when struck by injury or decay.\n\nYet such vitality is not merely abundance—it is pressure. Life, once intensified, strains against its vessel. Those so empowered often feel a constant, unsettling awareness of their own pulse, as though their blood now *insists* upon survival. In Valyrian sorcery, to be harder to kill is to be more tightly claimed by the forces that grant such resilience."

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.012.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.012.name$"
  zz_valyria_magic_blood_magic.012.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The blood gleams with unnatural richness, and the air grows heavy with the sensation of restrained life, as though something vital has been drawn too close to the surface.\nIn the darkest corners of the East, stories are told about the binding of vitality—rites where life is gathered, concentrated, and forced to dwell more fiercely within mortal flesh. High Valyrian words of fortification and refusal are spoken, each one an assertion that weakness may be denied.\nIt might be possible to empower [recipient.GetFirstName] with raw vital essence, weaving endurance and resilience directly into their blood. Their body would cling more stubbornly to health, turning aside sickness and injury that would fell others.\nYet this is a dangerous intrusion. To bind vitality is to interfere with the natural ebb of strength and frailty that defines mortal life. Such magic does not remove suffering—it delays it, compresses it, and demands that the body endure beyond what was ever intended.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] This will help them stave off injury and ailment, standing stronger against the misfortunes of flesh. But do you truly desire to play with life in this way, and bind its restless force so tightly within a single soul?"
  zz_valyria_magic_blood_magic.012.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster bleeds into a cup of hot red wine and stirs it with a sprig of rosemary. As the subject drinks, warmth runs through them, not the false warmth of drink but something deeper, a heat that settles into their limbs and stays there.\n\nThe blood mages of the Freehold prepared such cups for warriors before battle and for nobles before plague seasons. Those who drank of them stood a little firmer against every ill the world could throw at them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] This will help them stave off injury and ailment, standing stronger against the misfortunes of flesh. But do you truly desire to play with life in this way, and bind its restless force so tightly within a single soul?"
  zz_valyria_magic_blood_magic.012.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA heart, still warm, is set upon a silver dish at the centre of the circle. It is not human, though the caster does not say what creature it came from. As the blood is spilled, the heart begins to beat once more, slowly, and with each beat the subject feels their own heart strengthen.\n\nThe Valyrians held that vitality could be taken from one creature and given to another, as easily as water is poured from one cup into another. They were rarely troubled by where the first cup had come from.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] This will help them stave off injury and ailment, standing stronger against the misfortunes of flesh. But do you truly desire to play with life in this way, and bind its restless force so tightly within a single soul?"

  zz_valyria_magic_blood_magic.012.opt.a:0 "Yes, I am Life's Master!"
  zz_valyria_magic_blood_magic.012.opt.z:0 "No, do not cast!"
