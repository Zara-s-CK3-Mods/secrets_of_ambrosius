  ## Interaction
  zz_valyria_magic_blood_magic_016.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_ta$\n$zz_da$\n$zz_md$\n\nThe use of the arcane forces of [blood_magic|E] to strike at the armies of your enemy. Let the blood of the opposing armies become a plague within their veins.\n\nThis dreadful working is drawn from the war-rites of Old Valyria, where entire legions were unmade not by fire or steel, but by the betrayal of their own lifeblood. Through High Valyrian invocations of ruin and unbinding, the blood mage reaches across distance and number, laying claim to the vital essence of countless foes.\n\nThe spell does not wound the flesh directly. Instead, it whispers corruption into the blood itself, turning strength into weakness and unity into collapse. Soldiers find their vigor draining away, their bodies failing them as if struck by an unseen curse shared among them all.\n\nSuch magic is the language of domination, not battle. To wield it is to declare that no army is safe from the grasp of blood, and that war itself may be decided before blades ever meet. Yet this power is feared even among sorcerers, for blood remembers violence—and may one day answer it in kind."
## event
  zz_valyria_magic_blood_magic.016.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.016.name$"
  zz_valyria_magic_blood_magic.016.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The liquid does not pool as it should, instead steaming faintly as ancient Valyrian sigils are traced in the air, each one a blasphemous command once used by the dragonlords to break nations. The scent of iron is joined by something sharper, acrid, like brimstone and rot.\nOld chronicles of Valyria speak of this rite with dread: of entire hosts struck down not by blade or flame, but by betrayal from within. Blood was made to curdle and burn in the veins of soldiers, transforming lifegiving essence into a sulfurous poison that brought screaming agony, madness, and death. Men clawed at their own flesh as their bodies turned against them, formations collapsing into writhing heaps of suffering.\nThrough this ritual, the curse reaches outward, seeking the armies of [recipient.GetFirstName]. Should the incantation be completed, their warriors will find their strength withering, their bodies failing, and their will to fight drowned beneath torment drawn directly from their own blood.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You could unleash this forgotten Valyrian horror upon an army of [recipient.GetFirstName], spoiling their ability to make war and leaving ruin in its wake. Yet such a weapon is an abomination even by ancient standards, and it is said that powers beyond mortal reckoning take careful note of those who dare to turn the blood of thousands into an instrument of annihilation."
  zz_valyria_magic_blood_magic.016.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster bleeds into a cauldron of black iron, and the blood begins at once to bubble and smoke, though no fire burns beneath. A foul yellow vapour rises from it and drifts towards the map upon the wall, settling over the place where the enemy host is camped.\n\nThe Freehold's enemies feared its dragons, but those who had faced its blood mages feared them more. A dragon burns quickly. Blood that boils within a man's own veins takes its time.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You could unleash this forgotten Valyrian horror upon an army of [recipient.GetFirstName], spoiling their ability to make war and leaving ruin in its wake. Yet such a weapon is an abomination even by ancient standards, and it is said that powers beyond mortal reckoning take careful note of those who dare to turn the blood of thousands into an instrument of annihilation."
  zz_valyria_magic_blood_magic.016.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nUpon the ritual stone lies a dagger taken from a soldier of the enemy host. The caster bleeds upon its blade, and the steel begins to smoke and pit, as if eaten by acid, while somewhere far away, in a camp of tents and fires, the first screams begin.\n\nThe chronicles of Valyria describe armies that broke without ever seeing their foe, their ranks dissolving into madness and agony. This mystery is why.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You could unleash this forgotten Valyrian horror upon an army of [recipient.GetFirstName], spoiling their ability to make war and leaving ruin in its wake. Yet such a weapon is an abomination even by ancient standards, and it is said that powers beyond mortal reckoning take careful note of those who dare to turn the blood of thousands into an instrument of annihilation."
  zz_valyria_magic_blood_magic.016.opt.a:0 "Yes, There is nothing I won't do!"
  zz_valyria_magic_blood_magic.016.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.016.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.016.name$"
  zz_valyria_magic_blood_magic.016.toast.desc:0 "$zz_toast_01$ [blood_magic|E], $zz_toast_02$ making the blood of the soldiers of [target.GetFirstName] boil within their veins, causing them to die a hideous death."
  zz_valyria_magic_blood_magic.016.toast.tt:0 "$zz_valyria_magic_blood_magic.016.toast.desc$"

  zz_valyria_magic_blood_magic.016.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.016.name$"
  zz_valyria_magic_blood_magic.016.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.016.f.toast.tt:0 "$zz_valyria_magic_blood_magic.016.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_blood_magic_017.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_duel_move$\n$zz_duel_skill$\n\nThe use of the arcane forces of [blood_magic|E] to directly assault a chosen subject, stripping life and renewing the caster. \n\nThe most profane application of the arcane forces of [blood_magic|E], this rite reaches directly into the sanguine essence of a chosen victim. Through whispered High Valyrian invocations and the shedding of consecrated blood, the spell seeks to seize the living vitality bound within another’s veins, tearing strength, health, and fortune from them as one might draw breath from drowning lungs. What is taken is not merely physical vigor, but the unseen force that anchors body and spirit together."

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.017.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.017.name$"
  zz_valyria_magic_blood_magic.017.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room, thickening the air until it feels as though the walls themselves are listening. The blood does not simply spill—it stirs, trembling as if aware of a distant call.\nAncient Valyrian accounts speak of this rite in hushed tones: of victims who felt unseen hands clutch their hearts, of veins that burned and constricted as their own blood betrayed them. Through cruel syllables older than the Freehold’s fall, the life within a living body may be grasped, bound, and drained away, leaving only a hollow shell behind.\nThe power coils hungrily around the name of [recipient.GetName], eager to bridge the distance between sacrifice and prey. Should the rite be completed, their vitality will be wrenched from them, stolen by forces that care nothing for mercy or balance.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You could unleash this Valyrian horror upon [recipient.GetName], stripping them of strength and leaving them a broken remnant of what they once were. Yet such a weapon is an affront to the natural order, and it is said that higher powers do not forget those who dare to turn blood itself into an instrument of ruin."
  zz_valyria_magic_blood_magic.017.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA portrait of the subject, painted on wood, is set upon the ritual stone. The caster bleeds upon it, and the colours of the painting begin to fade, slowly, the cheeks growing pale and the eyes dull, as if the figure in it were sickening before the caster's eyes.\n\nThe blood mages of Valyria did not need to be near their victims. A likeness was enough, or a lock of hair, or a name spoken with enough hatred. Through such things, the life of another could be found, and drained away.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You could unleash this Valyrian horror upon [recipient.GetName], stripping them of strength and leaving them a broken remnant of what they once were. Yet such a weapon is an affront to the natural order, and it is said that higher powers do not forget those who dare to turn blood itself into an instrument of ruin."
  zz_valyria_magic_blood_magic.017.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster ties a cord of red thread around a lock of the subject's hair and binds the other end to their own wrist. As the incantation is spoken, the thread grows taut, then warm, and a slow pulse begins to travel along it towards the caster, one heartbeat at a time.\n\nThe dragonlords of the Freehold, it was whispered, did not age as other men did. Some said it was the blood of their dragons. Others said it was the blood of their enemies, taken in rites like this one.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You could unleash this Valyrian horror upon [recipient.GetName], stripping them of strength and leaving them a broken remnant of what they once were. Yet such a weapon is an affront to the natural order, and it is said that higher powers do not forget those who dare to turn blood itself into an instrument of ruin."
  zz_valyria_magic_blood_magic.017.opt.a:0 "Mmm, let them merely be crippled!"
  zz_valyria_magic_blood_magic.017.opt.b:0 "Mmm, rip their life from their lips!"
  zz_valyria_magic_blood_magic.017.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.017.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.017.name$"
  zz_valyria_magic_blood_magic.017.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ striking forth at [recipient.GetFirstName] seeking to consume their very life"
  zz_valyria_magic_blood_magic.017.toast.tt:0 "$zz_valyria_magic_blood_magic.017.toast.desc$"

  zz_valyria_magic_blood_magic.017.f.toast.t:0 " Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.007.name$"
  zz_valyria_magic_blood_magic.017.f.toast.desc:0 "$zz_toast_01$ [blood_magic], but [recipient.GetFirstName] resist's the effect."
  zz_valyria_magic_blood_magic.017.f.toast.tt:0 "$zz_valyria_magic_blood_magic.017.f.toast.desc$"

