  ## Interaction
  zz_valyria_magic_blood_magic_007.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_eb$\n\nThe use of the arcane forces of [blood_magic|E] to bind a force of improvement to a person's very blood. \nThis shall ensure the continuous growth in capabilities of the chosen subject.\n\nThis secret art was once reserved for Valyria’s most valued scions, a refinement of blood meant not merely to preserve life, but to *perfect* it over time. Through High Valyrian invocations of ascent and becoming, the blood mage awakens a restless hunger within the subject’s very essence.\n\nBlood is marked as a living vessel of change, bound with sigils that compel it to learn, adapt, and strengthen itself with every passing season. Each challenge faced, each wound endured, is remembered by the blood and transformed into quiet, irreversible improvement.\n\nYet such growth is neither natural nor benign. The blood no longer rests; it *strives*. Those so altered may feel an ever-present pressure within their veins, a whisper urging them toward greater heights. For in Valyrian sorcery, to improve without end is to deny the comfort of stagnation—and the blood will not forgive weakness once it has learned to despise it."

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.007.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.007.name$"
  zz_valyria_magic_blood_magic.007.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The air hums with restrained motion, as though something within the blood itself has been roused from long slumber.\nHigh Valyrian words of awakening and refinement are spoken, not as commands, but as promises. The blood answers eagerly, spreading in slow, deliberate patterns that suggest purpose rather than chance.\nSuch a magic would transform its subject, to let them grow with time into a more capable and effective individual. Strength, insight, and resilience would no longer be earned by chance alone, but cultivated relentlessly from within. The essence of life itself would become an instrument of improvement.\nYet this is a profound violation of the natural order. Mortals are meant to change through struggle and decay, not through an unending internal ascent. To reshape the blood in this way is to insist that potential has no ceiling, and that limitation is a flaw to be corrected.\n\nNow is the moment to choose, to transform the essence of life within [recipient.GetFirstName] and empower their existence. It is unnatural, and once begun it cannot be undone—but do you wish to proceed?"
  zz_valyria_magic_blood_magic.007.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA single drop of the caster's blood is let fall into a bowl of clear water, and it does not spread. It sinks, whole and bright, and then, impossibly, it begins to grow, drawing colour from nowhere until the bowl glows a deep and living red.\n\nSo too, the blood mages promised, would the subject's blood grow: never resting, never content, always becoming more. The Freehold's greatest families paid fortunes to have their children so enchanted, and few of them ever asked what such restless blood might cost.\n\nNow is the moment to choose, to transform the essence of life within [recipient.GetFirstName] and empower their existence. It is unnatural, and once begun it cannot be undone—but do you wish to proceed?"
  zz_valyria_magic_blood_magic.007.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster traces a spiral upon the subject's forearm in blood, beginning at the wrist and winding upwards. The line does not fade as it dries. Instead it sinks beneath the skin, and for a moment the subject's veins glow faintly along its path, as if something new has been set to flow within them.\n\nThe enchanted blood of the Valyrian nobility was the envy of the world. It made them stronger, sharper and quicker with every passing year, and it made them, the old songs say, something not quite like other men.\n\nNow is the moment to choose, to transform the essence of life within [recipient.GetFirstName] and empower their existence. It is unnatural, and once begun it cannot be undone—but do you wish to proceed?"

  zz_valyria_magic_blood_magic.007.opt.a:0 "Yes, enrich their blood with magic!"
  zz_valyria_magic_blood_magic.007.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.007.toast.t:0  "[blood_magic|E] - $zz_valyria_magic_blood_magic.007.name$"
  zz_valyria_magic_blood_magic.007.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ empowering the blood of [recipient.GetFirstName]."
  zz_valyria_magic_blood_magic.007.toast.tt:0 "$zz_valyria_magic_blood_magic.007.toast.desc$"

  zz_valyria_magic_blood_magic.007.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.007.name$"
  zz_valyria_magic_blood_magic.007.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.007.f.toast.tt:0 "$zz_valyria_magic_blood_magic.007.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_blood_magic_008.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_prov_cap$\n\nThe use of the arcane forces of [blood_magic|E] to empower someone's ability to travel, the chosen subject shall gain permanent boosts to their ability to gather resources for their adventures.\n\nThis subtle yet unsettling rite originates from Valyria’s path-mages, sorcerers who believed the world itself could be bent to favor those whose blood had been properly prepared. Through High Valyrian invocations of endurance, hoarding, and return, the blood mage reshapes the instincts of survival etched deep within the subject’s veins.\n\nBlood is marked with sigils of plenty and preservation, compelling it to remember abundance where there should be scarcity. Provisions last longer than they should, burdens feel lighter, and paths once barren seem to offer sustenance unbidden, as though the land itself were quietly yielding to the traveler’s presence.\n\nYet this gift is not merely fortune—it is insistence. The blood learns to *take*, drawing value from places long stripped bare. Those so empowered often sense an unnatural certainty on the road, a feeling that they are meant to endure where others would fail. In Valyrian magic, even travel becomes a form of dominion, and the world does not always appreciate being treated as larder and path alike."
  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.008.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.008.name$"
  zz_valyria_magic_blood_magic.008.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The blood does not spread aimlessly, but gathers in careful measures, as though weighing what may be taken and what must be preserved.\nHigh Valyrian words of journey and return are spoken, phrases once used to prepare explorers bound for lands from which few returned unchanged. The air seems to stretch outward, carrying the promise of distant roads, hidden caches, and sustenance drawn from unlikely places.\nWith magical aid, you can enable [recipient.GetFirstName] to store a much greater amount of provisions for their travels. Their blood would remember how to endure hunger, how to find value where others see none, and how to carry more than their body should reasonably bear.\nYet such preparation is profoundly unnatural. To teach the blood to hoard and endure beyond mortal limits is to alter the relationship between traveler and world. Roads may bend to favor them, but they may also come to feel less welcome in places that sense they are being quietly consumed.\n\nNow is the moment to choose, it is unnatural, but do you wish to proceed, and mark [recipient.GetFirstName] as one whose journeys are sustained by Valyrian will rather than mortal chance?"
  zz_valyria_magic_blood_magic.008.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nPacks and saddlebags are emptied upon the floor, and the caster bleeds onto a cloth laid over the subject's provisions: dried meat, hard bread, a skin of wine. As the incantation is spoken, the food seems somehow heavier than before, as if more had been packed into it than its size allows.\n\nThe explorers of the Freehold travelled to the edges of the known world and back. It was said their stores never ran out, and that their mages bled a little every morning to keep them so.\n\nNow is the moment to choose, it is unnatural, but do you wish to proceed, and mark [recipient.GetFirstName] as one whose journeys are sustained by Valyrian will rather than mortal chance?"
  zz_valyria_magic_blood_magic.008.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA worn pair of travelling boots is set before the circle, and the caster anoints the soles with blood. The leather drinks it greedily, and as it does, the subject feels a strange fullness, as though they had eaten a great meal that they cannot remember.\n\nThe blood mages of Valyria taught that the body keeps its own stores, deeper than any pack. Through this mystery those stores are widened, and the road may be walked far longer before it demands its due.\n\nNow is the moment to choose, it is unnatural, but do you wish to proceed, and mark [recipient.GetFirstName] as one whose journeys are sustained by Valyrian will rather than mortal chance?"

  zz_valyria_magic_blood_magic.008.opt.a:0 "Yes, let them store more!"
  zz_valyria_magic_blood_magic.008.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.008.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.008.name$"
  zz_valyria_magic_blood_magic.008.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ letting[recipient.GetFirstName] store many more provisions."
  zz_valyria_magic_blood_magic.008.toast.tt:0 "$zz_valyria_magic_blood_magic.008.toast.desc$"

