  ## Interaction
  zz_valyria_magic_blood_magic_027.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_eb$\n\nThe use of the arcane forces of [blood_magic|E] to increase a chosen subject’s [intrigue_i][intrigue|E]. \n\nThrough this forbidden application of [blood_magic|E], a hidden current of power is bound directly into the blood itself. Ancient sigils are etched into the soul through sacrifice, ensuring that the chosen subject’s [intrigue_i][intrigue|E] grows steadily and inexorably with time.\n\nSuch workings were vital to the survival of the Valyrian Freehold, where whispers, secrets, and unseen knives decided the fate of dynasties as surely as dragons. The blood remembers every lesson, every deception, and every shadowed truth."
  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.027.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.027.name$"
  zz_valyria_magic_blood_magic.027.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The air grows heavy with half-heard whispers, as though unseen witnesses lean closer to observe the rite. In Valyria of old, [intrigue_i][intrigue|E] was not merely a talent, but a necessity for survival among rival houses and plotting dragonlords.\nSuch knowledge could not be entrusted to chance or slow experience alone. Thus, the blood mages devised profane rites, binding cunning, suspicion, and foresight into the very lifeblood of their chosen subjects. With each passing year, the blood itself would teach, adapt, and sharpen the mind.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may transform the essence of life within [recipient.GetFirstName], reinforcing their [intrigue_i][intrigue|E] and allowing it to grow unnaturally with time. It is a violation of nature and fate alike — but do you wish to proceed?"
  zz_valyria_magic_blood_magic.027.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA mask of black lacquer is held over the subject's face as the caster's blood is spilled. When it is lifted away, the subject's expression has not changed, and yet those watching find it suddenly harder to read, as though a veil had been drawn just behind their eyes.\n\nIn the halls of the Freehold, a careless face could be a fatal one. Its blood mages taught their patrons' children to hide their thoughts, and to see through the thoughts of others.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may transform the essence of life within [recipient.GetFirstName], reinforcing their [intrigue_i][intrigue|E] and allowing it to grow unnaturally with time. It is a violation of nature and fate alike — but do you wish to proceed?"
  zz_valyria_magic_blood_magic.027.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster writes a secret upon a slip of parchment in their own blood, folds it, and gives it to the subject to burn unread. As the smoke rises, the subject feels a strange sharpness settle behind their eyes, and they find themselves noticing things they had never noticed before: a glance held too long, a hand that hesitates.\n\nAmong the dragonlord houses, intrigue was as necessary as breath. Through this mystery, the blood itself becomes a teacher of suspicion.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may transform the essence of life within [recipient.GetFirstName], reinforcing their [intrigue_i][intrigue|E] and allowing it to grow unnaturally with time. It is a violation of nature and fate alike — but do you wish to proceed?"
  zz_valyria_magic_blood_magic.027.opt.a:0 "Yes, enrich their blood with magic!"
  zz_valyria_magic_blood_magic.027.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.027.toast.t:0  "[blood_magic|E] - $zz_valyria_magic_blood_magic.027.name$"
  zz_valyria_magic_blood_magic.027.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ empowering the blood of [recipient.GetFirstName]."
