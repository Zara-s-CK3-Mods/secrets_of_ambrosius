  ## Interaction
  zz_valyria_magic_blood_magic_014.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_nhp$\n\nThe use of the arcane forces of [blood_magic|E] to infuse chosen character with fortitude, allowing them to resist negative health penalities.\n\nThis rite descends from the Valyrian discipline of sanguine endurance, where suffering was not alleviated, but rendered *irrelevant*. Through austere High Valyrian invocations of persistence and denial, the blood mage hardens the subject’s essence against weakness.\n\nBlood is bound with sigils of fortitude, compelling it to endure pain, sickness, and infirmity without yielding. Ailments linger, but their bite is dulled; the body continues to function even as it should falter, sustained by an unnatural refusal to give way.\n\nYet such strength is deeply unsettling. This magic does not heal—it *overrules*. The body learns to ignore its own limits, carrying on despite wounds and maladies that should demand rest or care. In Valyrian sorcery, fortitude is not comfort, but command, and the blood obeys even when the flesh protests."

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.014.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.014.name$"
  zz_valyria_magic_blood_magic.014.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The blood seems heavy, slow to move, as though already bearing a great and patient burden.\nAmong the common folk, poultices and potions are prized for their ability to soften the effects of ill health. Pain is eased, symptoms are hidden, and the body is coaxed gently back toward balance. But among old Valyria, such concerns were considered crude.\nHigh Valyrian blood mages achieved endurance not through comfort, but through domination. Words of perseverance and refusal are spoken, binding fortitude directly into the blood itself. The body is taught to carry illness without yielding, to endure weakness without acknowledging it.\nIt is only right, perhaps, that such power should lie within your grasp. You can have [recipient.GetFirstName] enfused with fortitude, allowing them to shrug off their ailments and continue on as though sickness and frailty were beneath their notice.\n\nYet this is a dangerous trespass. To deny the body its need to falter is to silence its warnings. Those so altered may stand tall in spite of suffering, but they do so at the cost of listening to their own flesh.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Do you wish to play with life in this way, and command the blood of [recipient.GetFirstName] to endure what it was never meant to bear?"
  zz_valyria_magic_blood_magic.014.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA heavy chain of iron is draped across the subject's shoulders and the caster bleeds upon its links. The chain grows heavier as the incantation is spoken, until the subject can barely stand beneath it. Then, all at once, the weight is gone, and they feel stronger than they did before it was laid upon them.\n\nThe blood mages of the Freehold taught that endurance must be forged, not given. Through this mystery the body learns to bear what it could not bear before, and to carry its ills without stumbling.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Do you wish to play with life in this way, and command the blood of [recipient.GetFirstName] to endure what it was never meant to bear?"
  zz_valyria_magic_blood_magic.014.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nBitter roots and dried flowers, the remedies of a hundred village healers, are crushed together in a mortar and wetted with the caster's blood. The paste is smeared upon the subject's chest, where it sinks into the skin and leaves no trace behind.\n\nWhat the common healers do gently, and for a little while, the blood mages of Valyria did by force and forever. The body so fortified does not forget its illnesses; it simply refuses to be troubled by them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Do you wish to play with life in this way, and command the blood of [recipient.GetFirstName] to endure what it was never meant to bear?"
  zz_valyria_magic_blood_magic.014.opt.a:0 "Yes, let them endure!"
  zz_valyria_magic_blood_magic.014.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.014.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.014.name$"
  zz_valyria_magic_blood_magic.014.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ enfusing [recipient.GetFirstName] with fortitude, enabling the resistence of health penalties"
  zz_valyria_magic_blood_magic.014.toast.tt:0 "$zz_valyria_magic_blood_magic.014.toast.desc$"

  zz_valyria_magic_blood_magic.014.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.014.name$"
  zz_valyria_magic_blood_magic.014.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.014.f.toast.tt:0 "$zz_valyria_magic_blood_magic.014.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_blood_magic_015.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_fert$\n\nThe use of the arcane forces of [blood_magic|E] to infuse chosen subject with fertility.\n\nThis ancient and unsettling rite descends from the dynastic obsessions of Old Valyria, where bloodlines were prized above all else and continuation was a sacred mandate. Through solemn High Valyrian invocations of genesis and succession, the blood mage stirs the hidden potential bound within flesh and lineage alike.\n\nBlood is marked with sigils of abundance and awakening, compelling the body to remember its purpose in the chain of generations. Dormant vitality is roused, cycles are aligned, and the unseen pathways of conception are strengthened by force of sorcery rather than chance.\n\nYet such fertility is not a gentle blessing. To command the blood to create is to bind future lives to an act of will and ritual. Those so infused often feel an eerie sense of expectancy, as though something unseen now waits patiently within them. In Valyrian magic, even birth is shaped by design—and the blood never forgets who called it to such purpose."

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.015.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.015.name$"
  zz_valyria_magic_blood_magic.015.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The air grows heavy with promise and unease, and the blood upon the floor seems to pulse slowly, as though counting generations yet unborn.\nAmong the families of old Valyria, fears about succession were rife. Dynasties rose and fell upon the certainty of heirs, and so blood mages were tasked with ensuring that lineage would not fail. Through High Valyrian rites of conception and continuation, fertility was not hoped for—it was *commanded*.\nThe ritual reaches beyond the present moment, intruding upon futures that have yet to take shape. Wombs, seed, and lineage are all drawn into the working, bound together by blood that insists upon continuation.\nYou can have [recipient.GetFirstName] enfused with fertility, letting them rest more certain in their prospects of progeny, their blood quietly urged toward creation and succession.\n\nYet this magic is a profound trespass. To meddle with fertility is to lay claim to lives not yet lived, to shape the course of generations with sorcery rather than fate.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Do you desire to play with life like this, and bind the future of [recipient.GetFirstName]—and those who may follow—to the ancient, watchful will of Valyria?"
  zz_valyria_magic_blood_magic.015.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA pomegranate is split open upon the ritual stone and the caster's blood is let to fall among its seeds. The seeds swell and darken, and as the incantation goes on, the fruit's broken halves begin slowly to close again, sealing the seeds within.\n\nAmong the dragonlord families of the Freehold, an heirless marriage was a disaster for the whole house. Its blood mages were paid well to make sure such disasters never came to pass.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Do you desire to play with life like this, and bind the future of [recipient.GetFirstName]—and those who may follow—to the ancient, watchful will of Valyria?"
  zz_valyria_magic_blood_magic.015.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAn old cradle, carved with the sigils of a long line of heirs, is set in the centre of the circle. The caster bleeds into it, and the blood soaks into the wood without leaving a stain, as though the cradle had been waiting for it.\n\nThe Valyrians held that a family's future lies in its blood as surely as its past. Through this mystery, that future is called upon, and urged to arrive a little sooner.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Do you desire to play with life like this, and bind the future of [recipient.GetFirstName]—and those who may follow—to the ancient, watchful will of Valyria?"
  zz_valyria_magic_blood_magic.015.opt.a:0 "Yes, let their line be secure!"
  zz_valyria_magic_blood_magic.015.opt.z:0 "No, do not cast!"
