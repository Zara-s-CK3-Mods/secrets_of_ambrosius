  ## Interaction
  zz_valyria_magic_blood_magic_029.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_eb$\n\nThe use of the arcane forces of [blood_magic|E] to increase a chosen subject’s [prowess_i][prowess|E]. \n\nThis rite uses the arcane forces of [blood_magic|E] to bind raw physical dominion into the blood itself. Through cruel refinement and forbidden harmonies of flesh and will, the subject is reshaped beyond mortal limits. \n\nThis rite ensures the continuous growth in the chosen subject's [prowess_i][prowess|E]. Such rituals helped correct the flaws of nature when forming the dragonlords, allowing strength, endurance, and lethal grace to be kindled by magic. To wield a warrior thus altered was considered a supreme utility of the old blood mages."
  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.029.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.029.name$"
  zz_valyria_magic_blood_magic.029.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The shadows seem to tense, as if anticipating violence yet to come. \n\nOld Valyria was a warrior nation—built upon fire, but even more so upon blood. The blood mages shaped rites to correct the failures of nature when it came to forming warriors worthy of dragonlords. Arcane invocations and shadowed rituals tore at the limits of flesh, allowing a subject’s [prowess_i][prowess|E] to grow far beyond their natural endowments, fed by sorcery and suffering alike. \n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To transform the essence of life within [recipient.GetFirstName] and empower their [prowess_i][prowess|E], binding relentless strength to their future. To let them grow with time into a more capable and effective instrument of violence. It is unnatural—but do you wish to proceed?"
  zz_valyria_magic_blood_magic.029.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA sword is driven into the floor of the chamber, and the caster bleeds upon its hilt. The blood runs down the blade and into the stone, and the subject, laying their hand upon the sword, feels a hunger in their arm that was not there before: a hunger to strike, and to strike again.\n\nThe warriors of the Freehold were feared not only for their dragons. Its blood mages made them stronger, quicker and more vicious than any natural man, and the gift grew with them as long as they lived. \n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To transform the essence of life within [recipient.GetFirstName] and empower their [prowess_i][prowess|E], binding relentless strength to their future. To let them grow with time into a more capable and effective instrument of violence. It is unnatural—but do you wish to proceed?"
  zz_valyria_magic_blood_magic.029.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster binds the subject's fists with strips of linen soaked in blood. As the cloth dries, it tightens, and the subject feels every muscle in their arms and back draw taut, as if being slowly pulled into a new and better shape.\n\nOld Valyria valued its warriors as it valued its dragons, and made them, where it could, just as dangerous. This mystery is one of the ways it did so. \n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To transform the essence of life within [recipient.GetFirstName] and empower their [prowess_i][prowess|E], binding relentless strength to their future. To let them grow with time into a more capable and effective instrument of violence. It is unnatural—but do you wish to proceed?"
  zz_valyria_magic_blood_magic.029.opt.a:0 "Yes, enrich their blood with magic!"
  zz_valyria_magic_blood_magic.029.opt.z:0 "No, do not cast!"
