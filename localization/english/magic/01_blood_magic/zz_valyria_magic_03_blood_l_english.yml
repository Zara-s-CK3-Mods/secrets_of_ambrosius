  ## Interaction

  zz_valyria_magic_blood_magic_010.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_prov_use$\n\nThe use of the arcane forces of [blood_magic|E] to infuse the chosen character with a much lower desire for sustance, this will let their supplies stretch further and further.\n\nThis unsettling rite is born of Valyria’s doctrines of endurance, where sorcerers sought to free their chosen from the tyranny of hunger itself. Through High Valyrian invocations of denial and restraint, the blood mage alters the body’s most ancient demands.\n\nBlood is bound with sigils of quiet starvation, compelling it to burn slowly and efficiently, drawing less from flesh and sustenance alike. Hunger dulls, thirst recedes, and the body learns to endure on what would leave others weakened or dead.\n\nYet this gift is deeply unnatural. To lessen the need for sustenance is to loosen the ties that bind a mortal to the rhythms of the living world. Those so altered often feel a hollow calm within themselves, as though part of their humanity has been quietly set aside. In Valyrian magic, even survival can be refined into something cold, patient, and faintly inhuman."

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.010.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.010.name$"
  zz_valyria_magic_blood_magic.010.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The blood settles unnaturally, moving with deliberate slowness, as if already learning to conserve itself.\nHigh Valyrian words of restraint and refusal are spoken, fragments of old rituals that spoke of changing the very nature of men. These were the spells of sieges without end, of journeys across lifeless wastes, where hunger was an enemy to be mastered rather than endured.\nIt is possible to enfuse [recipient.GetFirstName] in such a way that their sustence requires substantially less resources. Their body would no longer cry out as loudly for food or drink, surviving on a fraction of what others require, sustained by altered blood and silent discipline.\nBut such a transformation carries a quiet horror. To lessen hunger is to silence one of life’s most fundamental voices. Those so changed may find pleasure in food fading, warmth dulled, and the simple comforts of living growing distant and strange.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Such a ritual is unnatural, reshaping the bond between flesh and survival itself. Are you certain you wish to proceed, and leave [recipient.GetFirstName] changed in ways that cannot be easily seen?"
  zz_valyria_magic_blood_magic.010.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA single cup of water and a single loaf of bread are set before the subject, and the caster bleeds upon both. The subject eats and drinks, and finds, to their unease, that it is enough: that they will not hunger again for a long while, and that the thought of a feast now seems strange and distant.\n\nThe garrisons of the Freehold held out through sieges that should have starved them. Their mages, it is said, taught them to need less, and less again, until they barely needed at all.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Such a ritual is unnatural, reshaping the bond between flesh and survival itself. Are you certain you wish to proceed, and leave [recipient.GetFirstName] changed in ways that cannot be easily seen?"
  zz_valyria_magic_blood_magic.010.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster's blood is let into a bowl of salt, and the salt drinks it until it is dark red and dry. A pinch is placed upon the subject's tongue. It does not taste of salt or of blood, but of nothing at all, and the hunger in their belly fades away like a sound in another room.\n\nValyrian expeditions crossed deserts where no army could be fed. Their blood mages carried such salt with them, and with it, a quiet power over the most basic needs of the body.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Such a ritual is unnatural, reshaping the bond between flesh and survival itself. Are you certain you wish to proceed, and leave [recipient.GetFirstName] changed in ways that cannot be easily seen?"
  zz_valyria_magic_blood_magic.010.opt.a:0 "Yes, By the Blood and Fire!"
  zz_valyria_magic_blood_magic.010.opt.z:0 "No, do not cast!"
