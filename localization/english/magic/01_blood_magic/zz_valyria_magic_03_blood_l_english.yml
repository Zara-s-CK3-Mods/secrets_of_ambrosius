  ## Interaction
  zz_valyria_magic_blood_magic_028.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_eb$\n\nThe use of the arcane forces of [blood_magic|E] to increase a chosen subject’s [martial_i][martial|E]. \n\nThis rite is ause of the arcane forces of [blood_magic|E] to bind a living momentum of conquest into the blood itself. Through sigils older than stone and words once spoken only beneath dragonflame, the chosen subject’s very humours are rewritten. \n\nThis rite ensures the continuous growth in the chosen subject's [martial_i][martial|E], as instinct, discipline, and ruthless clarity are etched into their veins. Such magics helped forge the mighty leaders of the dragonlords—commanders of armies, breakers of hosts, and builders of empires whose wills bent battle itself."
  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.028.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.028.name$"
  zz_valyria_magic_blood_magic.028.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The air grows heavy with the weight of ancient wars, and whispers of long-dead conquerors seem to circle unseen. \n\nIn Valyria, warfare was the vocation of the nation. Generals and commanders were essential to the endless expansion of the Freehold, and their talents could not be left to fate alone. By arcane rites and blood-wrought oaths, it was possible to shape an individual's [martial_i][martial|E], forcing wisdom of war and hunger for victory into their very essence. Such powers proved vital in forging the mightiest empire known to the world. \n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To transform the essence of life within [recipient.GetFirstName] and let their [martial_i][martial|E] grow year upon year, guided by an unnatural hand. To let them ripen with time into a more capable and effective instrument of war. It is unnatural—but do you wish to proceed?"
  zz_valyria_magic_blood_magic.028.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA commander's baton, worn smooth by years of use, is laid upon the ritual stone. The caster bleeds upon it, and the subject, taking it up, feels the weight of a hundred campaigns settle into their hand, battles they never fought and victories they never won now somehow familiar.\n\nThe generals of the Freehold were often young, and rarely failed. Some of them owed their skill to talent. Many more owed it to blood. \n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To transform the essence of life within [recipient.GetFirstName] and let their [martial_i][martial|E] grow year upon year, guided by an unnatural hand. To let them ripen with time into a more capable and effective instrument of war. It is unnatural—but do you wish to proceed?"
  zz_valyria_magic_blood_magic.028.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster lays out a war-table, with carved pieces for horse and foot and siege, and bleeds onto the board. The pieces begin to move on their own, playing out a battle that no one in the chamber ordered, and the subject, watching, finds that they understand every move.\n\nIn Valyria, the arts of war were taught not only on the field, but in the veins. Through this mystery, the subject's mind is bent towards war, and will keep bending for years to come. \n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To transform the essence of life within [recipient.GetFirstName] and let their [martial_i][martial|E] grow year upon year, guided by an unnatural hand. To let them ripen with time into a more capable and effective instrument of war. It is unnatural—but do you wish to proceed?"
  zz_valyria_magic_blood_magic.028.opt.a:0 "Yes, enrich their blood with magic!"
  zz_valyria_magic_blood_magic.028.opt.z:0 "No, do not cast!"
