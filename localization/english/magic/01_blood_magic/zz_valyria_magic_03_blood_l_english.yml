  ## Interaction
  zz_valyria_magic_blood_magic_026.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_eb$\n\nThe use of the arcane forces of [blood_magic|E] to increase a chosen subject’s [stewardship_i][stewardship|E].  \n\nThrough the forbidden disciplines of [blood_magic|E], the very blood of the chosen subject is rewritten as a living ledger of order and command. Ancient Valyrian sigils are bound into their veins, compelling flesh and thought alike toward balance, calculation, and dominion over resources.\n\nThis rite binds an ever-growing current of unnatural aptitude into the blood itself, ensuring the chosen subject’s [stewardship_i][stewardship|E] will deepen and expand with each passing year. Yet such perfection of administration was never meant for mortal minds, and the blood remembers every change made to it."
  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.026.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.026.name$"
  zz_valyria_magic_blood_magic.026.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The air grows heavy, thick with the iron-sweet scent of sacrifice and the whisper of forgotten High Valyrian invocations. Shadows cling to the walls as if listening.\n\nIn the empire of the Dragonlords, governance was not entrusted to chance or birth alone. Those destined to rule ledgers and provinces were reforged through blood. Administrators were unmade and remade, their veins etched with sigils of order, abundance, and control, so their [stewardship_i][stewardship|E] would grow beyond mortal limitation.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may transform the essence of life within [recipient.GetFirstName], binding their blood to a relentless ascent of [stewardship_i][stewardship|E], year upon year. They will grow ever more capable, ever more precise—but such growth is unnatural, and the blood never forgets the hand that shaped it. Do you truly wish to proceed?"
  zz_valyria_magic_blood_magic.026.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nLedgers of the realm, their columns long and dense, are laid open around the ritual circle. The caster bleeds upon them, and the numbers in their pages seem to rearrange themselves, sums correcting, accounts falling into balance, as though a patient hand were working through them.\n\nThe Freehold's provinces were run with a precision that no other realm could match. Its administrators were not born to that precision. They were made.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may transform the essence of life within [recipient.GetFirstName], binding their blood to a relentless ascent of [stewardship_i][stewardship|E], year upon year. They will grow ever more capable, ever more precise—but such growth is unnatural, and the blood never forgets the hand that shaped it. Do you truly wish to proceed?"
  zz_valyria_magic_blood_magic.026.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAn abacus of polished dragonbone is set before the subject, and the caster wets each bead with blood. As the incantation is spoken, the beads begin to move on their own, clicking softly back and forth, counting something that only they can see.\n\nThe blood mages of Valyria held that order is a habit of the mind, and that habits may be written into the blood. Through this mystery, the subject's mind is set upon such a habit, and it will not let them go.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may transform the essence of life within [recipient.GetFirstName], binding their blood to a relentless ascent of [stewardship_i][stewardship|E], year upon year. They will grow ever more capable, ever more precise—but such growth is unnatural, and the blood never forgets the hand that shaped it. Do you truly wish to proceed?"
  zz_valyria_magic_blood_magic.026.opt.a:0 "Yes, enrich their blood with magic!"
  zz_valyria_magic_blood_magic.026.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.026.toast.t:0  "[blood_magic|E] - $zz_valyria_magic_blood_magic.026.name$"
  zz_valyria_magic_blood_magic.026.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ empowering the blood of [recipient.GetFirstName]."
  zz_valyria_magic_blood_magic.026.toast.tt:0 "$zz_valyria_magic_blood_magic.026.toast.desc$"

  zz_valyria_magic_blood_magic.026.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.026.name$"
  zz_valyria_magic_blood_magic.026.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
