  ## Interaction
  zz_valyria_magic_blood_magic_013.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_epr$\n\nThe use of the arcane forces of [blood_magic|E] to infuse chosen character with resilience, defending against disease and pestilence.\n\nThis rite draws upon the Valyrian doctrines of bloodwarding, where illness was treated not as chance misfortune, but as an invading will that could be resisted. Through stern High Valyrian invocations of endurance and refusal, the blood mage fortifies the subject’s very essence against corruption.\n\nBlood is bound with sigils of resistance, teaching it to recognize pestilence as an intruder rather than a fate. Fevers are dulled, sickness finds fewer paths to take root, and the body learns to endure where others would succumb.\n\nYet such resilience is an act of quiet defiance against the natural cycle of decay. Disease is not destroyed, only held at bay, pressed back by force of will and blood. Those so protected often feel a constant tension within themselves, as though their blood stands ever watchful, braced against an enemy that never truly stops knocking."

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.013.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.013.name$"
  zz_valyria_magic_blood_magic.013.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The blood carries a heavy stillness, as if it knows it is about to be taught vigilance rather than surrender.\nWithin tribal communities there are knowledges of horrid exchanges, rites where pestilence and disease are driven back by invocations paid for in blood. These practices do not cure sickness—they bargain with it, warning it away through fear, memory, and sacrifice.\nHigh Valyrian words of endurance and warding are spoken, binding resilience directly into the blood. It is fitting, perhaps, to empower [recipient.GetFirstName] with an unnatural resistance to the ravages of pestilence, hardening their flesh and spirit against rot and fever alike.\nYet this magic trespasses upon the quiet balance of life. Illness is one of the world’s oldest correctives, and to deny it passage is to draw its attention. Those so fortified may walk untouched through sickness, but they carry within them blood that has learned to stand its ground.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] This will help them stave off disease and endure where others falter. But do you truly desire to play with life in this way, and bind such relentless vigilance into a living soul?"
  zz_valyria_magic_blood_magic.013.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nSmall charms of carved bone hang from threads around the chamber, each one shaped like a sickness: a fever, a cough, a sore. As the caster's blood is flicked upon them, the charms turn slowly away from the subject, one after another, as if refusing to look at them.\n\nThe hill tribes of the Freehold's borderlands made such charms long before the dragonlords came. The blood mages of Valyria took the practice, refined it, and made it work.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] This will help them stave off disease and endure where others falter. But do you truly desire to play with life in this way, and bind such relentless vigilance into a living soul?"
  zz_valyria_magic_blood_magic.013.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster draws a ring of blood around the subject's bed and sets a lamp at each of its four quarters. The flames burn tall and steady, and the subject has the strange sense that something has been standing just outside the ring for a long time, and has now, reluctantly, turned to go.\n\nSickness, the old mages held, is patient. It does not break down doors; it waits for one to open. This mystery teaches the blood to keep watch.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] This will help them stave off disease and endure where others falter. But do you truly desire to play with life in this way, and bind such relentless vigilance into a living soul?"
  zz_valyria_magic_blood_magic.013.opt.a:0 "Yes, let pestilence be undone!"
  zz_valyria_magic_blood_magic.013.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.013.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.013.name$"
  zz_valyria_magic_blood_magic.013.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ enfusing [recipient.GetFirstName] with vital energies, bolstering their epidemic resistence."
  zz_valyria_magic_blood_magic.013.toast.tt:0 "$zz_valyria_magic_blood_magic.013.toast.desc$"

  zz_valyria_magic_blood_magic.013.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.013.name$"
