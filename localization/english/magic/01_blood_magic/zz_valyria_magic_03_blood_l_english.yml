  ## Interaction
  zz_valyria_magic_blood_magic_030.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_bmem$\n\nThrough the forbidden powers of [blood_magic|E], it is possible to preserve the deepest truths hidden within the blood of another being. \n\nThis rite allows the essence of a chosen subject to be harvested and recorded through arcane means, preserving their lineage, inherited gifts, and hidden strengths for future acts of sorcerous manipulation. Such knowledge was of immense value to the blood mages of Old Valyria, who catalogued the flesh of dragonlords, slaves, and monsters alike in pursuit of perfect creation. \n\nThe captured blood-pattern may later serve as the foundation for future transmutations of flesh and lineage."

  ## Spell Options
  ## event
  zz_valyria_magic_blood_magic.030.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.030.name$"
  zz_valyria_magic_blood_magic.030.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nBowls of darkened glass and glyph-carved needles are arranged carefully across the chamber as the ritual begins. The scent of iron thickens the air while crimson threads spill from the veins of [recipient.GetFirstName], suspended unnaturally within circles of flickering sorcerous light. \n\nThe blood mages of Valyria understood that flesh was not merely matter, but memory. Within blood itself lingered the hidden architecture of life—the truths of ancestry, form, strength, beauty, and corruption. By preserving these patterns through ritual means, the old sorcerers stored living templates from which future creations might be shaped. \n\nTo capture the essence of [recipient.GetFirstName] would be to preserve their very nature for future experiments and transformations. Their lineage, strengths, and inherited qualities would become tools to be wielded by your hand. Such knowledge is perilous beyond measure—but do you wish to proceed?"
  zz_valyria_magic_blood_magic.030.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA rack of small glass phials stands upon the workbench, each one stoppered with wax and marked with a sigil. The caster draws blood from [recipient.GetFirstName] into the empty phial at the end of the row, and as it fills, the blood within begins to glow faintly, holding its colour in a way that blood should not.\n\nThe flesh-shapers of Valyria kept vast libraries of such phials, each holding the pattern of a life. From them, they could draw whatever qualities they wished to give to others. \n\nTo capture the essence of [recipient.GetFirstName] would be to preserve their very nature for future experiments and transformations. Their lineage, strengths, and inherited qualities would become tools to be wielded by your hand. Such knowledge is perilous beyond measure—but do you wish to proceed?"
  zz_valyria_magic_blood_magic.030.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster pricks the fingertip of [recipient.GetFirstName] and lets a single drop fall onto a disc of polished silver. The drop does not spread. It holds its shape perfectly, and within it, if one looks closely, the faint outline of a figure can be seen, curled as if asleep.\n\nThe blood mages of the Freehold believed that every life was a book written in blood. With the right rites, that book could be copied, kept, and read again whenever it was needed. \n\nTo capture the essence of [recipient.GetFirstName] would be to preserve their very nature for future experiments and transformations. Their lineage, strengths, and inherited qualities would become tools to be wielded by your hand. Such knowledge is perilous beyond measure—but do you wish to proceed?"
  zz_valyria_magic_blood_magic.030.opt.a:0 "Yes, preserve their essence for future works!"
  zz_valyria_magic_blood_magic.030.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_blood_magic.030.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.030.name$"
  zz_valyria_magic_blood_magic.030.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ preserving the blood-pattern of [recipient.GetFirstName] for future experimentation."
