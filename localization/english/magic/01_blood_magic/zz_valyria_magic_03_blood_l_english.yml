  ## Interaction
  zz_valyria_magic_blood_magic_031.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_cpt$\n\nThrough the dark powers of [blood_magic|E], it is possible to overwrite the flesh of one being with the preserved essence of another. \n\nThis rite reshapes the target at the deepest level of existence, rewriting inherited traits and altering the hidden structure of their blood itself. Such arts were once used by the blood mages of Valyria to refine noble bloodlines, correct perceived flaws, and cultivate servants and dragonlords according to carefully crafted designs. \n\nThe chosen subject shall be remade in accordance with a previously preserved blood-pattern."

  ## Spell Options
  ## event
  zz_valyria_magic_blood_magic.031.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.031.name$"
  zz_valyria_magic_blood_magic.031.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAncient vessels containing preserved blood-essence are placed around the ritual chamber, each glowing faintly with imprisoned life. As the incantations begin, the veins of [recipient.GetFirstName] darken beneath their skin while unseen forces pull at the foundations of their being. \n\nThe blood mages of Old Valyria believed that flesh was mutable and that the essence of one creature could be imposed upon another through sufficient sacrifice and sorcerous mastery. By invoking preserved blood-patterns harvested from prior subjects, they reshaped the lineages of servants, nobles, and dragonlords alike—rewriting inherited destiny according to their own desires. \n\nNow you stand upon the threshold of this forbidden mystery. The preserved essence shall overwrite the natural structure of [recipient.GetFirstName], altering their genetic inheritance to mirror the chosen blood-pattern. Once begun, such a transformation may never be fully undone. Do you wish to proceed?"
  zz_valyria_magic_blood_magic.031.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA preserved phial of blood is unstoppered, and its contents poured into a basin beside [recipient.GetFirstName]. The blood is not dark, as old blood should be, but bright and fresh, and as the caster speaks, it begins to rise in a slow red mist that settles over the subject's skin and sinks into it.\n\nThe flesh-shapers of Valyria did not merely heal or harm. They remade. Through this mystery, the inheritance of one life is written over another, and the old pattern is lost. \n\nNow you stand upon the threshold of this forbidden mystery. The preserved essence shall overwrite the natural structure of [recipient.GetFirstName], altering their genetic inheritance to mirror the chosen blood-pattern. Once begun, such a transformation may never be fully undone. Do you wish to proceed?"
  zz_valyria_magic_blood_magic.031.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster draws a pattern upon the floor in preserved blood, a pattern of lines and branches like a family tree drawn by a madman. As [recipient.GetFirstName] steps into its centre, the lines begin to shift and rearrange themselves, branches folding back and others growing in their place.\n\nIn the Freehold, a family's bloodline was its greatest treasure, and the blood mages its keepers. They could guard a line, or prune it, or graft upon it whatever they wished. \n\nNow you stand upon the threshold of this forbidden mystery. The preserved essence shall overwrite the natural structure of [recipient.GetFirstName], altering their genetic inheritance to mirror the chosen blood-pattern. Once begun, such a transformation may never be fully undone. Do you wish to proceed?"
  zz_valyria_magic_blood_magic.031.opt.a:0 "Yes, remake their blood and flesh!"
  zz_valyria_magic_blood_magic.031.opt.z:0 "No, do not cast!"

