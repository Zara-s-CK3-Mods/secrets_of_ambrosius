  ## Interaction
  zz_valyria_magic_blood_magic_009.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_trvl_h$\n$zz_ms_up$\n\nThe use of the arcane forces of [blood_magic|E] to empower the ability of a chosen characcter to travel rapidly, the chosen subject will move with improved speed as they travel.\n\nThis perilous rite stems from Valyria’s path-mages, sorcerers who believed distance itself could be bled away. Through sharp High Valyrian invocations of pursuit and command, the blood mage teaches the veins to hunger for motion.\n\nBlood is quickened with sigils of haste and release, driven to flow faster than mortal flesh was ever meant to endure. Muscles respond with unnatural immediacy, breath comes easier under strain, and the body learns to outrun its own limits, carrying the subject across leagues with terrifying efficiency.\n\nYet this swiftness is not without cost. The blood remembers speed, and it begins to demand it. Those so altered often feel a constant pressure beneath their skin, an urge to move, to flee, to *never* be still. In Valyrian magic, to be faster than nature allows is to live forever on the edge of collapse."

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.009.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.009.name$"
  zz_valyria_magic_blood_magic.009.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The blood pulses unnaturally, beating faster than the heart that spilled it, as though it already longs to be in motion.\nHigh Valyrian words of pursuit, flight, and inevitability are spoken, once used by Valyrian couriers who outran storms and armies alike. The air itself seems to stretch and thin, bending in anticipation of sudden movement.\nYou can enfuse the very body of [recipient.GetFirstName] with magical energies, granting to them an unnatural haste. Their muscles will answer thought instantly, their breath will defy exhaustion, and the road before them will seem shorter than it has any right to be.\nYet such speed is deeply unnatural. The body was not shaped to move so swiftly, nor the blood to burn so hot. Those touched by this rite often find stillness unbearable, as if stopping for too long invites something unseen to catch up.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] This shall let them move much more rapidly, outrunning fatigue and danger alike—but do you wish to proceed, knowing that the blood may never again be content to move at a mortal pace?"
  zz_valyria_magic_blood_magic.009.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe caster bleeds onto a feather and lets it fall. It does not drift as a feather should. It drops straight and fast, striking the floor with a sound like a hoof upon stone, and the subject feels their own pulse leap to match it.\n\nThe couriers of the Freehold carried messages between its cities faster than any horse could run. The people of the provinces believed their mounts were enchanted. It was the riders, not the horses, who had been changed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] This shall let them move much more rapidly, outrunning fatigue and danger alike—but do you wish to proceed, knowing that the blood may never again be content to move at a mortal pace?"
  zz_valyria_magic_blood_magic.009.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA sand-glass is set upon the ritual stone and turned. As the caster's blood falls upon it, the sand within begins to slow, grain by grain, until it almost hangs in the air. To the subject, watching, the world beyond the circle seems to slow with it, while their own breath and heartbeat run on unchanged.\n\nThis mystery does not hasten the world. It hastens the one it touches, letting them move between moments that others are still living through.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] This shall let them move much more rapidly, outrunning fatigue and danger alike—but do you wish to proceed, knowing that the blood may never again be content to move at a mortal pace?"
  zz_valyria_magic_blood_magic.009.opt.a:0 "Yes, empower their movement!"
  zz_valyria_magic_blood_magic.009.opt.z:0 "No, do not cast!"
