  zz_valyria_magic_blood_magic.0003.t:0 "Name the Simulacrum"
  zz_valyria_magic_blood_magic.0003.desc:0 "It is time to give a name to the creation of [blood_magic|E] that stands before you. They breathe, they watch, and in their gaze is an unsettling certainty—as though they already know who they are meant to be.\nBlood remembers names, and names carry power. To grant this being the name of their genetic ancestor is to bind them tightly to an existing legacy, anchoring their identity to a life that once was. Such a choice may steady them, or it may deepen the shadow of comparison that follows their every thought.\nTo grant them a new name is an act of creation unto itself. It declares that this being is not merely an echo, but something distinct—born of blood, will, and forbidden knowledge. Yet even a new name cannot fully erase the whispers that stir within them, murmuring of borrowed memories and half-remembered lives.\nChoose carefully, for in Valyrian sorcery, a name is never just a sound. It is a chain, a promise, and a truth the blood will strive to obey."

  ## Interaction
  zz_valyria_magic_blood_magic_006.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_dimm$\n\nThe use of the arcane forces of [blood_magic|E] to enfuse a living being against disease. \n\nThrough this mystery, it is possible to render someone untouchable to pestilence for several years.\n\nThis secret rite is drawn from Valyria’s most heretical medical sorceries, where plague was not cured but *commanded*. By invoking High Valyrian formulae of preservation and defiance, the blood mage declares that rot, fever, and decay hold no dominion here.\n\nBlood is inscribed with sigils of endurance and bound back into the subject, carrying with it a reshaped truth: that corruption will not take hold. Invisible barriers are woven into flesh and breath alike, turning sickness aside as though it were an unwelcome spirit barred from crossing a threshold.\n\nYet such protection is profoundly unnatural. The magic does not destroy disease—it denies it. Those so warded are said to feel an eerie stillness within their bodies, as if time itself has slowed. For in resisting pestilence, the subject stands briefly outside the natural order, sustained by a Valyrian defiance that even the gods once learned to fear."

  ##Spell Options
  ## event
  zz_valyria_magic_blood_magic.006.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.006.name$"
  zz_valyria_magic_blood_magic.006.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The air chills and thickens, heavy with the sense that something ancient has been challenged. The blood does not pool as it should, instead spreading in careful patterns, as though guided by unseen intent. \nHigh Valyrian words of denial and warding are spoken—phrases once used to bar plague from Valyrian cities even as the world beyond them rotted. Each syllable carries quiet arrogance, the assertion that flesh may be made inviolate, and that decay itself may be refused entry. \nThis rite does not merely strengthen the body; it intrudes upon the boundary between life and death. Disease is a messenger of the gods, a reminder of mortality and balance. To turn it aside is to declare that this soul will not heed such summons. \nThose protected by this magic may walk untouched through sickness for years, their blood hostile to corruption and their breath untainted by miasma. Yet whispers claim that pestilence remembers such defiance, and that the gods do not forget being denied their due. \n\nNow is the moment to choose, whether you wish to intrude into the realm of life and death, to make [recipient.GetFirstName] resilient to the forces of pestilence, or whether you dare not press further and instead allow the blood to fall silent before the gods take notice."
  zz_valyria_magic_blood_magic.006.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nBundles of bitter herbs smoulder in the corners of the chamber, the same that were burned in the streets of Valyrian cities when plague came to their gates. The caster bleeds into a bowl of vinegar and ash and paints the subject's wrists and throat with it, and the smoke draws back from them as if repelled.\n\nThe Freehold boasted that no plague ever took root within its walls. Its blood mages knew why, and knew too that the plagues it refused went elsewhere. \n\nNow is the moment to choose, whether you wish to intrude into the realm of life and death, to make [recipient.GetFirstName] resilient to the forces of pestilence, or whether you dare not press further and instead allow the blood to fall silent before the gods take notice."
  zz_valyria_magic_blood_magic.006.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe subject is bathed in water drawn from a well no sickness has ever touched, and the caster's blood is stirred into the water until it runs pink. As it dries upon the skin, it leaves faint lines behind, like the outline of armour drawn by an unsteady hand.\n\nDisease, the old mages held, is a guest that enters wherever a door is left open. This mystery closes the doors, one by one, and bars them with blood. \n\nNow is the moment to choose, whether you wish to intrude into the realm of life and death, to make [recipient.GetFirstName] resilient to the forces of pestilence, or whether you dare not press further and instead allow the blood to fall silent before the gods take notice."

  zz_valyria_magic_blood_magic.006.opt.a:0 "Yes, I am closer to a God than a Man!"
  zz_valyria_magic_blood_magic.006.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.006.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.006.name$"
  zz_valyria_magic_blood_magic.006.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ empowering [recipient.GetFirstName] against diseaase for several years."
  zz_valyria_magic_blood_magic.006.toast.tt:0 "$zz_valyria_magic_blood_magic.006.toast.desc$"

