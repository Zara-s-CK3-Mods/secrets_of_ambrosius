  zz_valyria_magic_blood_magic.039.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.039.name$"
  zz_valyria_magic_blood_magic.039.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nThe caster opens a vein in the subject's wrist and lets the blood run into a bowl of black stone. Over it they speak the old words of shaping, and the blood darkens and thickens as the rite reaches into the sinew and the strength of the arm.\n\nThe blood mages of the Freehold held that the blood remembers what a body is, and that what it remembers can be changed. Afterwards the blade grows light in their hand, or heavy as lead.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_blood_magic.039.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nThe caster's own blood and the subject's are mingled on a blade of Valyrian steel, and the caster draws a single line with it along the subject's brow. The cut closes as soon as it is made, but something beneath it does not.\n\nIt is slow work, and it was never meant to be quick: the blood yields a little at a time, and the blade grows light in their hand, or heavy as lead.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_blood_magic.039.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nA drop of the subject's blood is set upon the tongue of a sleeping dragon-egg, warm in its brazier. The caster chants until the egg's scales flush red, and then presses the subject's palm against the shell.\n\nIn Valyria it was said that the blood of a mage could be taught, like a hound, and that the sinew and the strength of the arm answered to it most of all.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_blood_magic.039.opt.a:0 "Let the blood reshape their [prowess|E]!"
  zz_valyria_magic_blood_magic.039.opt.z:0 "No, do not cast!"

  zz_valyria_magic_blood_magic.039.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.039.name$"
  zz_valyria_magic_blood_magic.039.toast.desc:0 "$zz_toast_01$ [blood_magic|E], $zz_toast_02$ reshaping the [prowess|E] of [recipient.GetFirstName]."
  zz_valyria_magic_blood_magic.039.toast.tt:0 "$zz_valyria_magic_blood_magic.039.toast.desc$"

  zz_valyria_magic_blood_magic.039.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.039.name$"
  zz_valyria_magic_blood_magic.039.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.039.f.toast.tt:0 "$zz_valyria_magic_blood_magic.039.f.toast.desc$"

  # Blood 040 - Vital Theft (Drain Health)
  zz_valyria_magic_blood_magic_040.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_hlth_steal$\n$zz_dury$\n\nThe use of the arcane forces of [blood_magic|E] to draw the life from a chosen subject into the caster.\n\nThe subject's [health|E] falls and the caster's rises by the same measure, for some years: the greater the caster's mastery, the longer the theft lasts. A new theft replaces an old one.\n\nThe blood-mages of the Freehold taught that life is not made, only moved; and that the wise mage moves it towards themselves."
  zz_valyria_magic_blood_magic.040.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.040.name$"
  zz_valyria_magic_blood_magic.040.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nThe caster takes the subject's hand, as though in greeting, and does not let go. Warmth passes from one palm to the other, and the subject grows pale while the caster's cheeks fill with colour.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw [recipient.GetFirstName]'s vitality into [secondary_recipient.GetFirstName]. Will you take it?"
  zz_valyria_magic_blood_magic.040.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nA single drop of the subject's blood is let fall into a cup of the caster's wine. The caster drinks, and somewhere far away the subject feels a sudden weariness settle into their bones.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw [recipient.GetFirstName]'s vitality into [secondary_recipient.GetFirstName]. Will you take it?"
  zz_valyria_magic_blood_magic.040.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')]\n\nThe caster traces a line of red upon their own wrist and another, unseen, upon the subject's. Through that bridge of blood, the strength of one life flows quietly into the other.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw [recipient.GetFirstName]'s vitality into [secondary_recipient.GetFirstName]. Will you take it?"
  zz_valyria_magic_blood_magic.040.opt.a:0 "Take their strength."
  zz_valyria_magic_blood_magic.040.opt.z:0 "No, let them keep what is theirs."
  zz_valyria_magic_blood_magic.040.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.040.name$"
  zz_valyria_magic_blood_magic.040.toast.desc:0 "$zz_toast_01$ [blood_magic|E], $zz_toast_02$ draining the vitality of [recipient.GetFirstName]."
  zz_valyria_magic_blood_magic.040.toast.tt:0 "$zz_valyria_magic_blood_magic.040.toast.desc$"
  zz_valyria_magic_blood_magic.040.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.040.name$"
  zz_valyria_magic_blood_magic.040.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$ as the stolen life slips back to its owner."
  zz_valyria_magic_blood_magic.040.f.toast.tt:0 "$zz_valyria_magic_blood_magic.040.f.toast.desc$"

  # Blood 041 - the Blood Price (Single Combat)
  zz_valyria_magic_blood_magic_041.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_duel_move$\n$zz_duel_skill$\n\nThe use of the arcane forces of [blood_magic|E] to open the caster's own veins and spend the blood for strength.\n\nThe caster's duel success rises greatly, the more so with greater skill in Blood Magic, but their own injury risk rises too."
  zz_valyria_magic_blood_magic.041.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.041.name$"
  zz_valyria_magic_blood_magic.041.desc:0 "This [zz_mystery|E] is worked only in [single_combat_fight|E]."
  zz_valyria_magic_blood_magic.041.opt.z:0 "Very well."
  zz_valyria_magic_blood_magic.041.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.041.name$"
  zz_valyria_magic_blood_magic.041.toast.desc:0 "$zz_toast_01$ [blood_magic|E], $zz_toast_02$ in single combat."
  zz_valyria_magic_blood_magic.041.toast.tt:0 "$zz_valyria_magic_blood_magic.041.toast.desc$"
  zz_valyria_magic_blood_magic.041.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.041.name$"
  zz_valyria_magic_blood_magic.041.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.041.f.toast.tt:0 "$zz_valyria_magic_blood_magic.041.f.toast.desc$"
