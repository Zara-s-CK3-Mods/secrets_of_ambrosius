## Blood Magic
  zz_valyria_magic_blood_magic.0003.opt.a:0 "Let them be known as ... "

  ##recipient_secondary_

  ## Blood Magic - Mysteries of Restoration
  zz_valyria_magic_blood_magic_001.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_hc$\n$zz_sh$\n\nThe use of the arcane forces of [blood_magic|E] to heal and restore a living creature.\n\nThis forbidden rite descends from the dread mysteries of Old Valyria, where flesh, flame, and fate were mastered through blood and whispered prophecy. By invoking High Valyrian incantations etched into memory and scarred into skin, the sorcerer commands life itself to obey.\n\nBlood is both offering and conduit. Its heat calls forth ancient powers that stir beyond the veil, dragging stolen vitality from sacrifice, memory, or shadow and forcing it into the broken form of another.\n\nThough wounds may close and strength return, the magic leaves a lingering stain. The healed are often watched by unseen eyes, their souls echoing with the voices of long-dead dragonlords, for the blood never forgets—and neither do the powers awakened by its call."
  ## event
  zz_valyria_magic_blood_magic.001.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.001.name$"
  zz_valyria_magic_blood_magic.001.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room, thickening the air with heat and dread.\nThe scent of iron and ash mingles as ancient words are murmured in High Valyrian, each syllable cutting deeper than any blade. Shadows writhe along the walls, drawn to the offering as if alive.\nThere are many powers hidden away within the hidden murks of the lifegiving liquid. Among them, few are as mysterious—or as feared—as the ability to influence the health and wellbeing of a living being. In Old Valyria, such knowledge was guarded by sorcerer-lords who learned that blood remembers every pain it has ever known. \n\nNow is the moment to choose, whether you wish to heal [recipient.GetFirstName], binding their fate to this blasphemous rite, or whether you wish to stop this now and let the gathered powers fade back into silence."
  zz_valyria_magic_blood_magic.001.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA basin of beaten bronze is set beside the subject, and the caster opens a vein above it with a thin obsidian knife. The blood strikes the metal with a sound like distant rain, and the wounds and aches of the subject begin, faintly, to answer it, as if recognising a voice they had forgotten.\n\nThe healers of the Freehold held that the body keeps a record of every injury, written in its blood. A skilled hand may read that record, and with enough will, may strike out the entries one by one. \n\nNow is the moment to choose, whether you wish to heal [recipient.GetFirstName], binding their fate to this blasphemous rite, or whether you wish to stop this now and let the gathered powers fade back into silence."
  zz_valyria_magic_blood_magic.001.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nCandles of rendered tallow burn low around a circle of salt, and within it the subject lies still. The caster draws a single red line along their own palm and presses it to the subject's brow, and a slow warmth spreads outward from the touch, as though something long cold were being coaxed back to life.\n\nIn Old Valyria it was said that blood given freely heals more surely than any herb, for it carries the giver's strength with it. It was also said that the giver never quite gets all of it back. \n\nNow is the moment to choose, whether you wish to heal [recipient.GetFirstName], binding their fate to this blasphemous rite, or whether you wish to stop this now and let the gathered powers fade back into silence."
  zz_valyria_magic_blood_magic.001.opt.a:0 "Yes, Heal Them!"
  zz_valyria_magic_blood_magic.001.opt.z:0 "No, do not cast!"

  ##Spell Toast
  zz_valyria_magic_blood_magic.001.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.001.name$"
  zz_valyria_magic_blood_magic.001.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ healing [recipient.GetFirstName]."
  zz_valyria_magic_blood_magic.001.toast.tt:0 "$zz_valyria_magic_blood_magic.001.toast.desc$"

  zz_valyria_magic_blood_magic.001.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.001.name$"
  zz_valyria_magic_blood_magic.001.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.001.f.toast.tt:0 "$zz_valyria_magic_blood_magic.001.f.toast.desc$"

  ## Blood Magic - Mysteries of Transmogrification
  ## Intereraction

  zz_valyria_magic_blood_magic_002.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_cpt$\n\nThe use of the arcane forces of [blood_magic|E] to alter the physical make up of a chosen subject.\n\nThis abhorrent art traces its origins to the flesh-sculptors of Old Valyria, who believed the body to be merely another text upon which blood and will could be inscribed. Through High Valyrian invocations older than the Freehold itself, the sorcerer commands bone, sinew, and skin to remember a different shape.\n\nBlood is spilled not only as payment, but as instruction. It carries the echo of ancestral forms and forgotten perfection, seeping into the subject and rewriting them from within. Limbs twist, features shift, and hidden changes take root beneath the surface as the magic forces the body to obey a foreign design.\n\nThe transformation is rarely painless, nor entirely complete. Those altered by this rite often feel something else awaken inside them—an echo of the ancient power that remade their flesh. Though the body may be improved or corrected, it is forever marked by the knowledge that it was unmade, and remade, by the will of Valyria."


  ## event
  zz_valyria_magic_blood_magic.002.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.002.name$"
  zz_valyria_magic_blood_magic.002.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room, pressing against the senses like unseen heat. The air trembles as if something vast has turned its attention here.\nAncient High Valyrian words are spoken softly, each syllable heavy with command and blasphemy. Sigils traced in blood shimmer briefly before sinking into flesh and stone alike, as though the world itself were being persuaded to forget its natural laws.\nFew powers wielded by the blood mage are more steeped in mystery than the ability to transform the physical characteristics of a living entity. Such arts were once the province of Valyrian flesh-shapers and dragon-scholars, who dared to blur the line between mortal design and divine creation. To reshape living form is to declare that the gods’ work is unfinished—and subject to correction.\nBone may bend, skin may crawl, and hidden truths of lineage and blood may surface as the magic takes hold. What emerges will not merely be changed, but rewritten, carrying within them the echo of ancient will and borrowed perfection. \n\nNow is the moment to choose, whether you wish to bring about the physical alteration of [recipient.GetFirstName], sealing them within this forbidden legacy, or whether you wish to stop this now and banish the gathering power before it demands more than blood."
  zz_valyria_magic_blood_magic.002.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nMirrors of polished silver stand in a ring about the chamber, each angled so that the subject is reflected endlessly inward. As the caster's blood falls upon the floor, the reflections begin to disagree with one another: a jaw set differently here, eyes a shade paler there, as if each mirror were proposing a new shape.\n\nThe flesh-shapers of Valyria worked in such rooms, choosing among a hundred possible faces before they set their knives and their blood to the one they wanted. It is said they never once asked the subject which face they preferred. \n\nNow is the moment to choose, whether you wish to bring about the physical alteration of [recipient.GetFirstName], sealing them within this forbidden legacy, or whether you wish to stop this now and banish the gathering power before it demands more than blood."
  zz_valyria_magic_blood_magic.002.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA sculptor's tools lie upon a cloth beside the ritual circle, though no stone is present. The caster wets each in blood in turn, and as the words are spoken, the subject feels the pressure of a chisel that is not there, gentle and deliberate, against bone and skin.\n\nTo the blood mages of the Freehold, the body was only clay that had set too soon. Through this mystery it may be softened again, reshaped by a patient hand, and left to harden in its new form. \n\nNow is the moment to choose, whether you wish to bring about the physical alteration of [recipient.GetFirstName], sealing them within this forbidden legacy, or whether you wish to stop this now and banish the gathering power before it demands more than blood."
  zz_valyria_magic_blood_magic.002.opt.a:0 "Yes, I fear nothing!"
  zz_valyria_magic_blood_magic.002.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.002.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.002.name$"
  zz_valyria_magic_blood_magic.002.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ changing the very flesh of [recipient.GetFirstName]."
  zz_valyria_magic_blood_magic.002.toast.tt:0 "$zz_valyria_magic_blood_magic.002.toast.desc$"

  zz_valyria_magic_blood_magic.002.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.002.name$"
  zz_valyria_magic_blood_magic.002.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.002.f.toast.tt:0 "$zz_valyria_magic_blood_magic.002.f.toast.desc$"


  ## Blood Magic - Mysteries of Regeneration
  zz_valyria_magic_blood_magic_003.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tr$\n$zz_hr$\n$zz_suh$\n\nThe use of the arcane forces of [blood_magic|E] to restore strength to a Men at Arm Company.\n\nThis dread rite was once practiced by the war-sorcerers of Old Valyria, who understood that armies, like dragons, could be fed by blood alone. Through thunderous High Valyrian invocations and the ritual spilling of life, the mage calls upon ancient powers that delight in slaughter and endurance.\n\nBlood is poured upon weapons, armor, and the scarred earth itself, binding the warriors together in a crimson covenant. Fatigue is burned away, wounds knit with unnatural speed, and shattered morale is reforged into ruthless resolve. Those who moments before lay broken rise again, eyes alight with borrowed vigor and unholy purpose.\n\nYet this strength is not freely given. The soldiers feel чужd whispers at the edge of their thoughts, urging them toward violence and sacrifice. Though their bodies march renewed, their spirits carry the weight of Valyrian war-magic, forever marked by the knowledge that their survival was bought by forces that feast upon blood and battle."
  ## event
  zz_valyria_magic_blood_magic.003.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.003.name$"
  zz_valyria_magic_blood_magic.003.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room, seeping into stone and steel alike. The air grows heavy with the copper stench of sacrifice, and distant echoes seem to answer words spoken only in thought.\nHigh Valyrian incantations are intoned with measured reverence, each syllable an ancient command once used to bind legions to the will of the dragonlords. Sigils of war and endurance are traced in blood, glowing faintly before sinking into the ground like wounds that refuse to close.\nThe spilled life reaches outward, seeking the broken ranks of your warriors. Through this blasphemous communion, pain is dulled, torn flesh knits itself anew, and shattered resolve is reforged into grim obedience. Men who should no longer stand draw breath once more, sustained by power stolen from darker places.\nYet such salvation is never without consequence. The regiment so restored will carry the echo of this rite with them—haunted by dreams of fire, chains, and unseen masters who remember every drop of blood spent in their name. \n\nNow is the moment to choose, whether you wish to bring about healing to one of your personal regiments, binding them to this Valyrian war-mystery, or whether you wish to stop this now and let the gathering horror disperse."
  zz_valyria_magic_blood_magic.003.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA regimental standard is brought into the chamber and laid across the ritual stone, its cloth stiff with old campaigns. The caster bleeds upon it, and the stains spread through the weave in branching lines, like rivers on a map, reaching towards every man who has ever marched beneath it.\n\nThe war-mages of the Freehold bound their legions to their banners in just this way. Where the banner's blood went, strength followed, and men who should have been carried from the field instead rose and took their places in the line once more. \n\nNow is the moment to choose, whether you wish to bring about healing to one of your personal regiments, binding them to this Valyrian war-mystery, or whether you wish to stop this now and let the gathering horror disperse."
  zz_valyria_magic_blood_magic.003.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nIron arrowheads, drawn from the wounds of the regiment's fallen, are arranged in rows upon a field of red cloth. As the caster's blood wets them, each one grows warm, then hot, and a low murmur fills the room, like the sound of a camp at night heard from far away.\n\nValyrian commanders were said to keep such relics of every war they fought. The dead, they held, owe something to the living who still serve, and through blood, that debt may be called in. \n\nNow is the moment to choose, whether you wish to bring about healing to one of your personal regiments, binding them to this Valyrian war-mystery, or whether you wish to stop this now and let the gathering horror disperse."
  zz_valyria_magic_blood_magic.003.opt.a:0 "Yes, Restore my Forces!"
  zz_valyria_magic_blood_magic.003.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.003.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.003.name$"
  zz_valyria_magic_blood_magic.003.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ restoring the troop strength of [target.GetName]."
  zz_valyria_magic_blood_magic.003.toast.tt:0 "$zz_valyria_magic_blood_magic.003.toast.desc$"

  zz_valyria_magic_blood_magic.003.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.003.name$"
  zz_valyria_magic_blood_magic.003.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.003.f.toast.tt:0 "$zz_valyria_magic_blood_magic.003.f.toast.desc$"


  ## Blood Magic - Mysteries of Renewal

  zz_valyria_magic_blood_magic_004.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_ta$\n$zz_hra$\n$zz_lh$\n\nThe use of the arcane forces of [blood_magic|E] to restore strength and power to a whole army.\n\nThis grand and terrible rite descends from the highest war-mysteries of Old Valyria, where entire legions were sustained by blood and will alone. Through thunderous High Valyrian invocations, the sorcerer calls upon ancient powers that once marched beside dragonfire, binding thousands of lives into a single, bleeding purpose.\n\nBlood is spilled in vast measure, poured upon banners, blades, and sacred ground. Its power spreads outward like a tide, threading through every soldier touched by the ritual. Broken bodies rise, exhaustion burns away, and fear is drowned beneath a roaring, unnatural resolve that unites the host as one living instrument of war.\n\nYet such power exacts a dreadful toll. The army so restored becomes marked by the rite, haunted by shared dreams of fire, chains, and distant commands whispered in High Valyrian. Though they march renewed and terrible to behold, their strength is sustained by forces that remember every battle—and demand repayment in blood yet to come."

  ## event
  zz_valyria_magic_blood_magic.004.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.004.name$"
  zz_valyria_magic_blood_magic.004.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room, swelling like a gathering storm. The walls seem to tremble as if recalling ancient marches, and the air grows thick with the promise of violence.\nHigh Valyrian words of command and dominion are spoken, once used by dragonlords to bend entire hosts to their will. Each syllable carries the weight of countless fallen warriors, and the blood upon the floor stirs, seeking distant fields of battle and broken ranks.\nThrough this forbidden communion, the life spilled here reaches out to an army far away. Wounds ache as they begin to close, weary limbs fill with brutal strength, and faltering courage is reforged into iron obedience. Thousands feel the pull of the same unseen hand, binding them together in a single, dreadful rhythm.\nSuch power skirts the edge of blasphemy, for to heal an army is to challenge the natural price of war itself. The magic does not ask whether the soldiers wish to be saved—it simply claims them. \n\nNow is the moment to choose, whether you wish to bring about healing to one of your armies, sealing them within this Valyrian war-rite, or whether you wish to stop this now and let the rising horror fade before it consumes more than blood."
  zz_valyria_magic_blood_magic.004.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA great map of the realm is unrolled across the floor, and upon it a single carved token marks the host. The caster's blood is let to fall beside the token, and it does not pool but runs, swift and certain, along the roads and rivers until it surrounds the place where the army stands.\n\nThe dragonlords of old did not send healers to their armies. They sent blood, carried along unseen roads by their mages, and whole hosts woke from their wounds as one. \n\nNow is the moment to choose, whether you wish to bring about healing to one of your armies, sealing them within this Valyrian war-rite, or whether you wish to stop this now and let the rising horror fade before it consumes more than blood."
  zz_valyria_magic_blood_magic.004.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nThe chamber fills with the sound of a war drum, though no drummer is present. With each beat the caster's blood pulses from the wound in time, and with each beat, far away, the soldiers of the host feel their own hearts quicken and steady together.\n\nThe Freehold's war-mages taught that an army is one body with ten thousand hearts. Mend the body, they said, and every heart within it will mend as well, whether it wishes to or not. \n\nNow is the moment to choose, whether you wish to bring about healing to one of your armies, sealing them within this Valyrian war-rite, or whether you wish to stop this now and let the rising horror fade before it consumes more than blood."
  zz_valyria_magic_blood_magic.004.opt.a:0 "Yes, Restore my Forces!"
  zz_valyria_magic_blood_magic.004.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_blood_magic.004.toast.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.004.name$"
  zz_valyria_magic_blood_magic.004.toast.desc:0 "$zz_toast_01$ [blood_magic], $zz_toast_02$ regenerating the health of the army of [recipient.GetFirstName]."
  zz_valyria_magic_blood_magic.004.toast.tt:0 "$zz_valyria_magic_blood_magic.004.toast.desc$"

  zz_valyria_magic_blood_magic.004.f.toast.t:0 "Failure [blood_magic|E] - $zz_valyria_magic_blood_magic.004.name$"
  zz_valyria_magic_blood_magic.004.f.toast.desc:0 "$zz_toast_01$ [blood_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_blood_magic.004.f.toast.tt:0 "$zz_valyria_magic_blood_magic.004.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_blood_magic_005.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_ccc$\n\nThe use of the arcane forces of [blood_magic|E] to create a replication of a targeted individual. With a small contribution from a chosen individual it is possible to bring about an impossible magic, the replication of a person, mind, body, and soul.\n\nThis most forbidden rite is whispered of only in fragments, a relic of Valyria’s final and greatest blasphemy—the refusal to accept that identity itself must end. Through High Valyrian incantations spoken over mingled blood, the sorcerer calls upon powers that remember what a person truly is.\n\nBlood serves as both anchor and blueprint. From the chosen subject it carries memory, lineage, and essence; from the sacrifice it provides motion and breath. Flesh is shaped, thoughts are impressed, and the echo of a soul is drawn screaming from beyond the veil, bound into a new and waiting vessel.\n\nThe result is no mere imitation. What rises bears the face, the voice, and the knowing mind of the original, animated by blood that insists it has always been so. Yet such creations are deeply unsettling, for Valyrian scholars long warned that the soul does not like to be copied—and what answers this summons may not be entirely whole."

  ##Spell Options
  zz_valyria_magic_blood_magic_005_option_clone:0 "Create a Clone"

  ## event
  zz_valyria_magic_blood_magic.005.t:0 "[blood_magic|E] - $zz_valyria_magic_blood_magic.005.name$"
  zz_valyria_magic_blood_magic.005.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nAs freely shed blood begins to flow from their veins, a dark and unsettling energy takes the room. The air grows heavy and still, as though the world itself is holding its breath. Reflections seem to linger too long, and shadows bend toward the ritual circle with hungry intent.\nHigh Valyrian words of naming and unmaking are spoken, phrases once forbidden even among the dragonlords. The blood upon the floor begins to move of its own accord, tracing the outline of a form that does not yet exist, yet feels disturbingly familiar.\nThis rite reaches beyond flesh alone. It calls to memory, will, and identity, daring to insist that a soul may be summoned, shaped, and compelled to dwell again within newly wrought flesh. Such magic was said to be the final proof of Valyria’s arrogance—the belief that even the self could be mastered.\nWhat emerges will not simply resemble [actor.GetVariable( 'zz_valyria_selected_character' ).Char.GetFirstName]. It will *know* them. Their thoughts, their instincts, their secrets may awaken fully formed, as if no division had ever occurred.\n\nNow is the moment to choose, whether you wish to bring about a most strange ritual, making a replication of [recipient.GetFirstName], or whether you wish to stop this now and disperse the gathering power before something answers that should never have been called."
  zz_valyria_magic_blood_magic.005.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nA vessel of clouded glass stands at the centre of the circle, filled with blood from both the caster and the subject. As the incantation deepens, the two bloods refuse to mix, coiling about one another like serpents until, slowly, a third colour begins to show between them.\n\nThe Freehold's most daring blood mages sought to raise the dead in new flesh, or to copy the living entire. Few succeeded, and those who did seldom spoke afterwards of what had looked back at them from the vessel.\n\nNow is the moment to choose, whether you wish to bring about a most strange ritual, making a replication of [recipient.GetFirstName], or whether you wish to stop this now and disperse the gathering power before something answers that should never have been called."
  zz_valyria_magic_blood_magic.005.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_blood_magic')] \n\nLocks of hair, nail clippings, a child's tooth kept in a velvet pouch: every trace of the subject that could be gathered is laid in a careful spiral upon the ritual stone. The caster bleeds upon the spiral, and each relic in turn darkens and grows warm, as though remembering the body it once belonged to.\n\nThe old texts warn that blood remembers everything, even what the living would rather forget. To call a whole person out of it is to call all of that as well.\n\nNow is the moment to choose, whether you wish to bring about a most strange ritual, making a replication of [recipient.GetFirstName], or whether you wish to stop this now and disperse the gathering power before something answers that should never have been called."

  blood_magic_clone_01:0 "Restore life!"
  blood_magic_clone_02:0 "Restore a child!"
  blood_magic_clone_03:0 "Restore life (sex-changed)"
  blood_magic_clone_04:0 "Restore a child (sex-changed)"

  zz_valyria_magic_blood_magic.005.opt.a:0 "Yes,I am a God and they live!"
  zz_valyria_magic_blood_magic.005.opt.z:0 "No, do not cast!"


