l_english:
  zz_valyria_magic_contracts.00101.desc.round.2:0 "The second of my workings in [task_contract_location.GetTitle.GetBaseNameNoTier] is at hand. The first has taught me much about the temper of these lands, and I adjust my preparations accordingly."
  zz_valyria_magic_contracts.00101.desc.round.3:0 "One last working remains before I must leave [task_contract_location.GetTitle.GetBaseNameNoTier]. Whatever I have learned here must now be brought to bear, for there will be no further chances."
  zz_valyria_magic_contracts.00101.desc.scene.01:0 "\n\nDawn finds me in a ruined watchtower above the fields, its broken stones still warm from a fire no one remembers lighting. I chalk my circles upon the floor while crows watch from the rafters."
  zz_valyria_magic_contracts.00101.desc.scene.02:0 "\n\nI have taken rooms above a tannery, the only place the townsfolk would rent to a stranger who asks for so many candles. The stench is appalling, but no one will think to look for sorcery here."
  zz_valyria_magic_contracts.00101.desc.scene.03:0 "\n\nA ring of standing stones crowns a hill outside the town. The shepherds will not graze their flocks within sight of it, which suits my purposes admirably."
  zz_valyria_magic_contracts.00101.desc.scene.04:0 "\n\nThe local lord's steward has granted me the use of a disused cellar. Wine-racks line the walls, and the damp air hums faintly when I speak the old words aloud."
  zz_valyria_magic_contracts.00101.desc.scene.05:0 "\n\nRain has not let up for three days. I work by lamplight in a borrowed barn, my reagents laid out on a threshing floor, the drumming on the roof drowning out my chanting."
  zz_valyria_magic_contracts.00101.desc.scene.06:0 "\n\nWord of my arrival has spread. Children dare one another to peer through the shutters, and a pair of old women have taken to leaving charms of twisted straw upon my doorstep."
  zz_valyria_magic_contracts.00101.desc.scene.07:0 "\n\nI have found a cave by the river, its walls scored with marks far older than any living tongue. Whoever worked here before me, they knew something of the art."
  zz_valyria_magic_contracts.00101.desc.scene.08:0 "\n\nA merchant caravan has camped beside my lodgings, and their curious guards keep finding reasons to wander past. I shall have to be discreet, or else entertaining."
  zz_valyria_magic_contracts.00101.desc.scene.09:0 "\n\nThe night sky over [task_contract_location.GetTitle.GetBaseNameNoTier] is uncommonly clear. Every star seems sharp enough to cut, and I fancy the currents of power run closer to the surface tonight."
  zz_valyria_magic_contracts.00101.desc.scene.10:0 "\n\nMy workings have drawn the attention of a hedge-witch who lives at the edge of the woods. She watches from a distance, saying nothing, and I cannot tell whether she means to help or hinder."
  zz_valyria_magic_contracts.00101.desc.scene.11:0 "\n\nI have spent the day bartering in the market for the materials I need. Half of what was sold to me is useless, but the other half may yet prove worth the coin."
  zz_valyria_magic_contracts.00101.desc.scene.12:0 "\n\nA fever is going around the village, and the sick look at me with a mixture of hope and dread. They believe I could cure them. Perhaps I could, if I knew more."
  zz_valyria_magic_contracts.00101.desc.scene.paranoid:0 "\n\nI have moved my workshop twice already. Someone has been through my notes; I am certain of it, though nothing is missing."
  zz_valyria_magic_contracts.00101.desc.scene.diligent:0 "\n\nI have laid out every instrument in careful order and rehearsed each incantation a dozen times. Nothing will be left to chance."
  zz_valyria_magic_contracts.00101.desc.scene.lazy:0 "\n\nIf the old masters could do this, surely there is a shorter path. I spent the morning looking for it, and the afternoon regretting that."
  zz_valyria_magic_contracts.00101.desc.scene.impatient:0 "\n\nThe preparations drag on interminably. Every hour spent measuring and chalking is an hour not spent actually wielding power."
  zz_valyria_magic_contracts.00101.desc.scene.brave:0 "\n\nThe locals warn me that the last person to meddle with such things here was found burned black in a ditch. I thank them for the warning and carry on."
  zz_valyria_magic_contracts.00101.desc.scene.craven:0 "\n\nEvery creak of the floorboards sets my heart pounding. I keep a bolt-hole in mind should the working go wrong."
  zz_valyria_magic_contracts.00101.desc.progress.higher_mysteries.1:0 "\n\nThe currents of power are clearer to me now. I can feel where they pool and where they run thin, like a fisherman reading a river."
  zz_valyria_magic_contracts.00101.desc.progress.higher_mysteries.2:0 "\n\nMy earlier working left a faint resonance in the air, and I mean to build upon it rather than start anew."
  zz_valyria_magic_contracts.00101.desc.progress.higher_mysteries.3:0 "\n\nEach casting strips away a little more of the clumsiness of my technique. Today I attempt something more ambitious."
  zz_valyria_magic_contracts.00101.desc.progress.blood_magic.1:0 "\n\nThe bandages upon my forearm are still fresh from the last working. Blood remembers, the old texts say, and mine is eager to answer again."
  zz_valyria_magic_contracts.00101.desc.progress.blood_magic.2:0 "\n\nI have obtained a goat from a farmer who asked no questions. Its blood will not carry the potency of a man's, but it will serve for practice."
  zz_valyria_magic_contracts.00101.desc.progress.blood_magic.3:0 "\n\nThe iron tang hangs in the air of my workshop. The sigils I painted last time have dried dark and cracked, and still they pulse faintly."
  zz_valyria_magic_contracts.00101.desc.progress.dream_magic.1:0 "\n\nI have not slept properly since I arrived. The dreams come whether I will them or no, and I am beginning to steer them."
  zz_valyria_magic_contracts.00101.desc.progress.dream_magic.2:0 "\n\nLast night I walked in the dreams of the innkeeper's daughter and found her fears laid out like a market stall. Tonight I go deeper."
  zz_valyria_magic_contracts.00101.desc.progress.dream_magic.3:0 "\n\nMy waking hours feel thin and grey beside the vivid country of sleep. I must be careful not to lose my way back."
  zz_valyria_magic_contracts.00101.desc.progress.alchemy_magic.1:0 "\n\nMy retorts and alembics bubble day and night. The last batch turned a colour I have never seen in nature, which I take to be promising."
  zz_valyria_magic_contracts.00101.desc.progress.alchemy_magic.2:0 "\n\nA scorch mark on the ceiling bears witness to my previous attempt. This time I have adjusted the proportions."
  zz_valyria_magic_contracts.00101.desc.progress.alchemy_magic.3:0 "\n\nThe base metals are surrendering their secrets one by one. Lead has begun to show a faint, unnatural sheen."
  zz_valyria_magic_contracts.00101.desc.progress.shadow_magic.1:0 "\n\nThe shadows in my lodgings do not quite match the shapes that cast them any more. That, I think, is progress."
  zz_valyria_magic_contracts.00101.desc.progress.shadow_magic.2:0 "\n\nSomething answered my call last time, though it would not show itself. Tonight I shall offer it a more tempting invitation."
  zz_valyria_magic_contracts.00101.desc.progress.shadow_magic.3:0 "\n\nI have extinguished every lamp but one. In its guttering light, the darkness at the edges of the room leans in to listen."
  zz_valyria_magic_contracts.00101.desc.progress.air_magic.1:0 "\n\nThe weathervanes of the town turned against the wind during my last working. The locals blame the season; I know better."
  zz_valyria_magic_contracts.00101.desc.progress.air_magic.2:0 "\n\nI have climbed to the highest place I can find. Up here, the breath of the sky is closer, and more willing."
  zz_valyria_magic_contracts.00101.desc.progress.air_magic.3:0 "\n\nMy candles no longer gutter when I speak the words. The air has learned to hold still at my command, if only for a moment."
  zz_valyria_magic_contracts.00101.desc.progress.fire_magic.1:0 "\n\nMy hands still smell of smoke from the last working. The flame answered me, but it did not obey; this time it will."
  zz_valyria_magic_contracts.00101.desc.progress.fire_magic.2:0 "\n\nI have built my brazier from stones the locals say were taken from an old dragon's lair. Superstition, most likely, but the fire burns hotter for it."
  zz_valyria_magic_contracts.00101.desc.progress.fire_magic.3:0 "\n\nThe scorched circle on the ground has not cooled in three days. Whatever I awoke there is waiting for me to call again."
  zz_valyria_magic_contracts.00101.desc.progress.water_magic.1:0 "\n\nThe well behind my lodgings has risen a full hand's breadth since my arrival. I have not told the villagers why."
  zz_valyria_magic_contracts.00101.desc.progress.water_magic.2:0 "\n\nI have spent the morning wading in the shallows, feeling the pull of the current against my will. It is stronger than I am. For now."
  zz_valyria_magic_contracts.00101.desc.progress.water_magic.3:0 "\n\nFog clings to the riverbank wherever I walk. It follows me like a loyal hound, and I mean to teach it new tricks."
  zz_valyria_magic_contracts.00101.desc.stakes.3:0 "\n\nThis is but the first of my workings. Much may yet be gained, or lost."
  zz_valyria_magic_contracts.00101.desc.stakes.2:0 "\n\nI have one more working after this one. I would rather not be relying on it."
  zz_valyria_magic_contracts.00101.desc.stakes.1:0 "\n\nThis is my final working here. Everything I have done in [task_contract_location.GetTitle.GetBaseNameNoTier] comes down to this moment."
  zz_valyria_magic_contracts.00101.a.higher_mysteries:0 "My understanding of the art is beyond question"
  zz_valyria_magic_contracts.00101.b.higher_mysteries:0 "Slowly, carefully, I weave the energies together..."
  zz_valyria_magic_contracts.00101.a.blood_magic:0 "I know precisely how much blood the working requires"
  zz_valyria_magic_contracts.00101.b.blood_magic:0 "I draw the knife, and hope my reckoning is true..."
  zz_valyria_magic_contracts.00101.a.dream_magic:0 "I shall shape the dream with a master's hand"
  zz_valyria_magic_contracts.00101.b.dream_magic:0 "I close my eyes and step into the uncertain dark..."
  zz_valyria_magic_contracts.00101.a.alchemy_magic:0 "My formulae are exact; the mixture cannot fail"
  zz_valyria_magic_contracts.00101.b.alchemy_magic:0 "I add the final reagent, and step back..."
  zz_valyria_magic_contracts.00101.a.shadow_magic:0 "The shadows know my name, and they will heed it"
  zz_valyria_magic_contracts.00101.b.shadow_magic:0 "I whisper into the darkness, and wait for an answer..."
  zz_valyria_magic_contracts.00101.a.air_magic:0 "I call the winds, and the winds will come"
  zz_valyria_magic_contracts.00101.b.air_magic:0 "I raise my arms to the sky and speak the words..."
  zz_valyria_magic_contracts.00101.a.fire_magic:0 "The flame is mine to command"
  zz_valyria_magic_contracts.00101.b.fire_magic:0 "I kindle the flame, and pray it does not turn on me..."
  zz_valyria_magic_contracts.00101.a.water_magic:0 "The currents bend to my learned will"
  zz_valyria_magic_contracts.00101.b.water_magic:0 "I wade into the water and begin the incantation..."
  zz_valyria_magic_contracts.00102.desc.higher_mysteries:0 "The energies flowed through me like water through a channel cut to its exact measure. When the working was done, I understood the shape of things a little better than before."
  zz_valyria_magic_contracts.00103.desc.higher_mysteries:0 "The energies slipped away from me at the critical moment, scattering like startled birds. My circles are scuffed and my candles burnt to nothing, with naught to show for it."
  zz_valyria_magic_contracts.00102.desc.blood_magic:0 "The blood ran, and the sigils drank it greedily. For a long moment the whole workshop seemed to beat with a single heart, and that heart was mine."
  zz_valyria_magic_contracts.00103.desc.blood_magic:0 "I bled, and the sigils did not drink. The blood dried brown and dead upon the stones, and I am left light-headed and empty-handed."
  zz_valyria_magic_contracts.00102.desc.dream_magic:0 "I walked through the dreams of the sleeping town as easily as through my own house, and when I woke, I brought back more than I had carried in."
  zz_valyria_magic_contracts.00103.desc.dream_magic:0 "I lost my way in the dream and woke screaming, with no memory of what I had seen. The innkeeper has asked me, politely, to find other lodgings."
  zz_valyria_magic_contracts.00102.desc.alchemy_magic:0 "The mixture settled into a liquid of impossible clarity, and the metal I dipped into it came out changed. Nature has bent, if only a little, to my design."
  zz_valyria_magic_contracts.00103.desc.alchemy_magic:0 "The mixture boiled over and ate through the table. The stench will linger in these rooms for weeks, and the metal is as base as ever."
  zz_valyria_magic_contracts.00102.desc.shadow_magic:0 "Something came when I called, and this time it did not merely watch. It bowed, after its own fashion, and I felt its cold attention turn to my bidding."
  zz_valyria_magic_contracts.00103.desc.shadow_magic:0 "The shadows recoiled from my call, and for one terrible moment I felt something look back at me with contempt. I lit every lamp in the house and did not sleep."
  zz_valyria_magic_contracts.00102.desc.air_magic:0 "The wind rose at my word and fell silent at my gesture. The leaves of the trees outside hung motionless in mid-air until I released them."
  zz_valyria_magic_contracts.00103.desc.air_magic:0 "The wind came, but not as I bade it. It tore through my workshop, scattering notes and reagents to the four corners of [task_contract_location.GetTitle.GetBaseNameNoTier]."
  zz_valyria_magic_contracts.00102.desc.fire_magic:0 "The flame leapt high and white, and it did not burn me. I held it in my bare palm and it was as obedient as a hound."
  zz_valyria_magic_contracts.00103.desc.fire_magic:0 "The flame turned on me. I smothered it before it took the building, but my hands are blistered and my eyebrows will take some time to grow back."
  zz_valyria_magic_contracts.00102.desc.water_magic:0 "The river paused in its course, just for a heartbeat, and then flowed on as if nothing had happened. But I had felt it obey."
  zz_valyria_magic_contracts.00103.desc.water_magic:0 "The water would not heed me. I stood in the river until my legs were numb, chanting to a current that did not care."
  zz_valyria_magic_contracts.00102.desc.employer.1:0 "\n\n[employer.GetTitledFirstName] was most impressed by the reports of my work, and has sent word that I may return to [task_contract_location.GetTitle.GetBaseNameNoTier] whenever I please."
  zz_valyria_magic_contracts.00102.desc.employer.2:0 "\n\nThe locals now cross the street to avoid me, which I choose to take as a compliment."
  zz_valyria_magic_contracts.00102.desc.employer.3:0 "\n\nI have filled a whole new journal with my observations. Some of them may even be legible later."
  zz_valyria_magic_contracts.00103.desc.employer.1:0 "\n\n[employer.GetTitledFirstName] has made it quite clear that I have worn out my welcome."
  zz_valyria_magic_contracts.00103.desc.employer.2:0 "\n\nThe villagers have begun hanging iron over their doors. I cannot say I blame them."
  zz_valyria_magic_contracts.00103.desc.employer.3:0 "\n\nI burn my notes from this venture. There is nothing in them worth keeping."
  zz_valyria_magic_contracts.00091.desc.intro.1:0 "You have climbed to a hermit's cell carved into the cliffs above [task_contract_location.GetTitle.GetBaseNameNoTier]. Its last occupant left behind nothing but a straw mat and a single line scratched into the wall: 'It listens.'"
  zz_valyria_magic_contracts.00091.desc.intro.2:0 "A disused shrine on the outskirts of [task_contract_location.GetTitle.GetBaseNameNoTier] offers you shelter. The faces of forgotten gods watch from the walls as you settle cross-legged upon the cold flagstones."
  zz_valyria_magic_contracts.00091.desc.intro.3:0 "You have rented a small boat and rowed out to the middle of a still lake near [task_contract_location.GetTitle.GetBaseNameNoTier]. With no shore within earshot, the silence is nearly perfect."
  zz_valyria_magic_contracts.00091.desc.intro.4:0 "Deep in the woods near [task_contract_location.GetTitle.GetBaseNameNoTier] you have found a hollow beneath an ancient tree, its roots arching overhead like the vault of a hall. The air here is thick and old."
  zz_valyria_magic_contracts.00091.desc.intro.5:0 "You have shut yourself in a tower room in [task_contract_location.GetTitle.GetBaseNameNoTier] and ordered that food be left outside the door. No one is to disturb you, on pain of your considerable displeasure."
  zz_valyria_magic_contracts.00091.desc.body:0 "\n\nWithin your meditations it might be possible to reach towards the ebbs and flows of esoteric energies and grasp in its fullness one of these arcane powers. Doing so would let you grow in stature as what the fearful call a mage.\n\nBut such secrets take effort to uncover. Are you fully committed to this arduous path?"
  zz_valyria_magic_contracts.00091.desc.hint.1:0 "\n\nAs the hours pass, you become aware of a faint pressure behind your eyes, as though something on the other side of thought is leaning against a door."
  zz_valyria_magic_contracts.00091.desc.hint.2:0 "\n\nYour breathing slows. The world shrinks to the flicker of a single candle, and then even that is gone."
  zz_valyria_magic_contracts.00091.desc.hint.3:0 "\n\nFragments of half-remembered Valyrian verse drift through your mind unbidden, as though someone were reciting them in another room."
  zz_valyria_magic_contracts.00091.desc.hint.4:0 "\n\nYour body aches from stillness, but your mind has never felt so wide awake."
  zz_valyria_magic_contracts.00092.desc.variant.1:0 "Somewhere in the long stillness, a door in my mind swung open. Beyond it lay a mystery I had only glimpsed in old texts, now plain as daylight, waiting for me to take it up."
  zz_valyria_magic_contracts.00092.desc.variant.2:0 "A voice, or something like a voice, spoke a single word in High Valyrian. I did not recognise it, yet I understood it entirely, and with that understanding came power."
  zz_valyria_magic_contracts.00092.desc.variant.3:0 "I saw lost Valyria as it was: its towers of fused stone, its fourteen flames, its sorcerers at their work. I watched, and I learned."
  zz_valyria_magic_contracts.00093.desc.variant.1:0 "For a moment I thought I had it, a thread of something vast and luminous, but it slipped through my fingers and was gone. I am left with nothing but a headache and a growing sense of foolishness."
  zz_valyria_magic_contracts.00093.desc.variant.2:0 "My meditations were plagued by distractions: an itch, a draught, the memory of some petty slight from years ago. The mysteries do not reveal themselves to so cluttered a mind."
  zz_valyria_magic_contracts.00093.desc.variant.3:0 "I sat and waited and listened, and heard nothing but my own heartbeat. Whatever powers dwell beyond the veil, they did not consider me worth their notice."
  zz_valyria_magic_contracts.00011.desc.arrival.1:0 "Our arrival in [employer.GetPrimaryTitle.GetBaseNameNoTier] is met with little fanfare. The locals are in some measure of frustration at our desire to access the records stored here."
  zz_valyria_magic_contracts.00011.desc.arrival.2:0 "The archivist of House [employer.GetHouse.GetBaseNameNoTooltip] is a stooped, suspicious old man who demands to know exactly what we seek before he will unlock so much as a cupboard. I tell him as little as I can."
  zz_valyria_magic_contracts.00011.desc.arrival.3:0 "The archives of [employer.GetPrimaryTitle.GetBaseNameNoTier] turn out to be three damp cellars and a tower room, crammed floor to ceiling with chests, rolls and bundles tied with faded ribbon. No one has catalogued them in living memory."
  zz_valyria_magic_contracts.00011.desc.arrival.4:0 "We are shown to a reading room with a single narrow window and a guard posted at the door, 'for our protection'. Every page I turn, I can feel him watching."
  zz_valyria_magic_contracts.00011.desc.arrival.5:0 "A priest has charge of the house's records, and he plainly believes that whatever I am looking for would be better left unfound."
  zz_valyria_magic_contracts.00011.desc.warning:0 "\n\nWithout our rapid completion of our examinations, the local population may become antagonised by our presence.$zz_valyria_magic_contracts.00011.desc.outro$"
  zz_valyria_magic_contracts.00021.desc.arrival.1:0 "Our arrival in [employer.GetPrimaryTitle.GetBaseNameNoTier] is met with little fanfare. The trail of Freehold fragments has led here, to archives that few have thought worth opening in generations."
  zz_valyria_magic_contracts.00021.desc.arrival.2:0 "Here the stones themselves remember Valyria. Old glyphs are cut into the lintels of the archive doors, worn almost smooth, and the air smells of ash and old parchment."
  zz_valyria_magic_contracts.00021.desc.arrival.3:0 "The keepers of these records speak of the Freehold only in whispers. Some of the oldest chests, they say, have not been opened since before the Doom, and they would prefer it stayed that way."
  zz_valyria_magic_contracts.00021.desc.arrival.4:0 "Among bundles of dull household accounts I glimpse the curling script of High Valyrian. Somewhere in this chaos is the fragment I have come for."
  zz_valyria_magic_contracts.00021.desc.warning:0 "\n\nWithout our rapid completion of our examinations, the local population may become antagonised by our presence.$zz_valyria_magic_contracts.00021.desc.outro$"
  zz_valyria_magic_contracts.00031.desc.arrival.1:0 "My visions of the fall of Valyria have led me to [employer.GetPrimaryTitle.GetBaseNameNoTier]. Our arrival is met with little fanfare, and the locals are wary of our desire to access the records stored here."
  zz_valyria_magic_contracts.00031.desc.arrival.2:0 "I have dreamed of this place for weeks: a doorway, a stair, a chest bound in blackened iron. Now that I stand before the real door, I find it is exactly as I saw it."
  zz_valyria_magic_contracts.00031.desc.arrival.3:0 "The Doom haunts my sleep. Fourteen flames, a sky turned to fire, the sea boiling. The visions have narrowed to a single place, and it is here, among the records of House [employer.GetHouse.GetBaseNameNoTooltip]."
  zz_valyria_magic_contracts.00031.desc.arrival.4:0 "Those who fled the Doom came this way, centuries ago. Their descendants have long forgotten it, but their papers have not."
  zz_valyria_magic_contracts.00031.desc.warning:0 "\n\nWithout our rapid completion of our examinations, the local population may become antagonised by our presence.$zz_valyria_magic_contracts.00031.desc.outro$"
  zz_valyria_magic_contracts.archive.desc.obstacle.1:0 "\n\nHalf the oldest scrolls have been gnawed by mice, and the remainder are stuck together by damp."
  zz_valyria_magic_contracts.archive.desc.obstacle.2:0 "\n\nThe most promising chests are sealed with locks whose keys were lost a century ago. The archivist shrugs; he has never needed them."
  zz_valyria_magic_contracts.archive.desc.obstacle.3:0 "\n\nSomeone has been here before me. The gaps on the shelves are fresh, and a scattering of wax suggests the thief worked by candlelight."
  zz_valyria_magic_contracts.archive.desc.obstacle.4:0 "\n\nThe records are written in a dozen hands and as many dialects, and whoever filed them seems to have done so by colour rather than subject."
  zz_valyria_magic_contracts.archive.desc.obstacle.5:0 "\n\nA rival scholar has also been granted access, and makes a point of requesting every volume I reach for a moment before I do."
  zz_valyria_magic_contracts.archive.desc.obstacle.6:0 "\n\nWater has seeped into the lower vault. What it has not ruined, it has glued into solid blocks of parchment."
  zz_valyria_magic_contracts.archive.desc.obstacle.7:0 "\n\nFragments of the oldest texts are written in cipher. Whoever recorded them did not wish them to be read by just anyone."
  zz_valyria_magic_contracts.00012.desc.find.1:0 "\n\nIt is wrapped in oiled silk, tucked inside the binding of a book of genealogies. Whoever hid it meant for it to survive."
  zz_valyria_magic_contracts.00012.desc.find.2:0 "\n\nThe scroll's edges are scorched, yet the script within is as crisp as the day it was written, as though the fire itself had been refused."
  zz_valyria_magic_contracts.00012.desc.find.3:0 "\n\nI find it rolled inside a hollow candlestick, among the ordinary oddments of a long-dead scholar's bequest."
  zz_valyria_magic_contracts.00022.desc.find.1:0 "\n\nThe fragment is written on a sheet of something finer than vellum, and the ink shimmers faintly red when the light catches it."
  zz_valyria_magic_contracts.00022.desc.find.2:0 "\n\nIt bears the seal of a dragonlord house extinct for centuries: a single, perfect impression in black wax."
  zz_valyria_magic_contracts.00022.desc.find.3:0 "\n\nThe scroll was folded into the lining of a chest that had been mistaken for firewood. A few more winters and it would have been ash."
  zz_valyria_magic_contracts.00032.desc.find.1:0 "\n\nThe account is written in a shaking hand, the words of someone who watched the sky catch fire and fled with nothing but what they could carry."
  zz_valyria_magic_contracts.00032.desc.find.2:0 "\n\nPressed between its pages is a single flake of black glass, warm to the touch, still faintly humming with the power that destroyed a world."
  zz_valyria_magic_contracts.00032.desc.find.3:0 "\n\nIts margins are crammed with notes in High Valyrian, a refugee sorcerer recording what they could remember of the art before it was lost forever."
  zz_valyria_magic_contracts.archive.desc.success_outro.1:0 "\n\nWith the prize in hand, I make my exit before the local authorities can find a reason to 'confiscate' my findings."
  zz_valyria_magic_contracts.archive.desc.success_outro.2:0 "\n\n[employer.GetTitledFirstName|U] insists on seeing what I have found. I show them something else entirely, and they seem satisfied."
  zz_valyria_magic_contracts.archive.desc.success_outro.3:0 "\n\nI leave a generous donation for the upkeep of the archives. It seems the least I can do, and it may make my next visit easier."
  zz_valyria_magic_contracts.archive.desc.failure_outro.1:0 "\n\nThe archivists see me to the door with barely concealed relief."
  zz_valyria_magic_contracts.archive.desc.failure_outro.2:0 "\n\nI must leave [employer.GetPrimaryTitle.GetBaseNameNoTier] empty-handed. The secrets I came for are here somewhere; I simply could not find them in time."
  zz_valyria_magic_contracts.archive.desc.failure_outro.3:0 "\n\n[employer.GetTitledFirstName|U] has made it quite clear that my welcome has been exhausted."
  zz_valyria_magic_contracts.00501.desc.round.2:0 "The first heat is done, and the steel has taken the fire. Now it must be folded again, and the working renewed."
  zz_valyria_magic_contracts.00501.desc.round.3:0 "The final tempering is upon me. If the steel is to become what the Freehold's smiths once made, it will be in this heat or never."
  zz_valyria_magic_contracts.00501.desc.scene.1:0 "\n\nThe heat of the forge is almost unbearable. My assistants work stripped to the waist, their skin blistering, while I chant over the anvil."
  zz_valyria_magic_contracts.00501.desc.scene.2:0 "\n\nSulphurous smoke rises from the crucible and hangs beneath the rafters of the forge. The whole keep smells of it, and so restless is the metal that it seems to breathe."
  zz_valyria_magic_contracts.00501.desc.scene.3:0 "\n\nThe steel glows a colour that has no name in the common tongue. When I lay my hand near it, I can feel it listening."
  zz_valyria_magic_contracts.00501.desc.scene.4:0 "\n\nTwice the bellows have caught fire. The smith I hired has begun to mutter prayers under his breath with every stroke of the hammer."
  zz_valyria_magic_contracts.00501.desc.scene.5:0 "\n\nI have traced the old Valyrian glyphs into the clay of the crucible. As the metal melts, they glow, one by one, like waking eyes."
  zz_valyria_magic_contracts.00501.desc.scene.6:0 "\n\nAsh falls like grey snow over the forge. Somewhere below, in the cellars of the keep, something rumbles in answer to my chanting."
  zz_valyria_magic_contracts.00501.desc.stakes.3:0 "\n\nThis is but the first heat. The steel must be worked thrice before it is done."
  zz_valyria_magic_contracts.00501.desc.stakes.2:0 "\n\nOne more heat will follow this one. A flaw now will be hard to mend later."
  zz_valyria_magic_contracts.00501.desc.stakes.1:0 "\n\nThis is the last heat. What leaves the forge now will be either a legend or slag."
  zz_valyria_magic_contracts.00502.desc.variant.1:0 "\n\nWhen I plunge the ingot into the quench, the water does not hiss; it sings."
  zz_valyria_magic_contracts.00502.desc.variant.2:0 "\n\nThe ripples across the steel's surface move, slowly, like smoke trapped beneath ice."
  zz_valyria_magic_contracts.00502.desc.variant.3:0 "\n\nThe smith I hired weeps openly when he sees it. He says he never thought to see such a thing in his lifetime."
  zz_valyria_magic_contracts.00503.desc.variant.1:0 "\n\nThe crucible split in the final heat, spilling ruined metal across the forge floor."
  zz_valyria_magic_contracts.00503.desc.variant.2:0 "\n\nThe steel shattered on the anvil at the first stroke of the hammer, brittle as glass."
  zz_valyria_magic_contracts.00503.desc.variant.3:0 "\n\nMy assistants have fled, and I cannot say I blame them. Half the forge has collapsed, and the smoke still rises over the walls."
