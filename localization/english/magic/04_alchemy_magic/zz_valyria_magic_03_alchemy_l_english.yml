  zz_valyria_magic_alchemy_magic.014.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.014.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_alchemy_magic_015.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_tmaac$\n\nThe use of the arcane forces of [alchemy_magic|E] to increase the number of title men-at-arms regiments a chosen subject can raise.\n\nThe lands a ruler holds bring with them their own martial traditions and obligations. Through this mystery, those obligations are refined and multiplied, so that the subject's titles yield more professional soldiers than they ordinarily would.\n\nThe subject can raise more regiments of title [men_at_arms|E].\n\nThe provinces of the Freehold were each bound to supply soldiers to the legions. Alchemy ensured that they always supplied more than the quota."

  ##event
  zz_valyria_magic_alchemy_magic.015.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.015.name$"
  zz_valyria_magic_alchemy_magic.015.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A wax seal bearing the arms of a ruler's title rests within the circle, and as the elixirs are poured over it, it seems to multiply, the same seal appearing upon a growing stack of writs.\n\nThe administrator-alchemists of Valyria bound this working to the governors of the empire's provinces, so that every title of the Freehold yielded its full measure of soldiers and more.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may multiply the regiments that the titles of [recipient.GetFirstName] can raise. Will you summon more title men-at-arms?"
  zz_valyria_magic_alchemy_magic.015.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA blank writ of muster is laid beneath a crystal vessel, and the alchemist pours a dark ink into the vessel from above. As the ink drips through, it spells out the names of soldiers on the writ below, page after page, until a stack of writs stands where there was one.\n\nIn the Freehold, a title's worth was measured in the soldiers it could raise. The alchemists made sure that worth was always high.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may multiply the regiments that the titles of [recipient.GetFirstName] can raise. Will you summon more title men-at-arms?"
  zz_valyria_magic_alchemy_magic.015.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA ruler's seal, carved from green stone, is set upon a pad of soft red wax. As the alchemist speaks, the seal presses down again and again of its own accord, each impression a summons to arms, until the wax is crowded with them.\n\nThe governors of Valyria's provinces commanded more soldiers than their lands should have been able to raise. Alchemy was the reason.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may multiply the regiments that the titles of [recipient.GetFirstName] can raise. Will you summon more title men-at-arms?"
  zz_valyria_magic_alchemy_magic.015.opt.a:0 "Summon more title regiments!"
  zz_valyria_magic_alchemy_magic.015.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.015.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.015.name$"
  zz_valyria_magic_alchemy_magic.015.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ multiplying the title men-at-arms regiments of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.015.toast.tt:0 "$zz_valyria_magic_alchemy_magic.015.toast.desc$"
  zz_valyria_magic_alchemy_magic.015.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.015.name$"
  zz_valyria_magic_alchemy_magic.015.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_alchemy_magic.015.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.015.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_alchemy_magic_016.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_tmaas$\n\nThe use of the arcane forces of [alchemy_magic|E] to enlarge the title men-at-arms regiments of a chosen subject.\n\nThrough this mystery, the title regiments that the chosen subject's lands supply are made to swell, drawing more soldiers into each company than the land would ordinarily provide.\n\nEach regiment of title [men_at_arms|E] the subject raises is larger than it would ordinarily be.\n\nThe provincial legions of the Freehold were famous for their size. Few of their enemies ever realised how much of that size was conjured."

  ##event
  zz_valyria_magic_alchemy_magic.016.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.016.name$"
  zz_valyria_magic_alchemy_magic.016.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A provincial standard rests within the circle, and as the incantation proceeds, the fabric ripples and the threads multiply, the banner growing ever larger and heavier.\n\nThe provincial governors of the Freehold competed to field the greatest title regiments, and the best alchemists were courted like princes for the service.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may enlarge the title regiments of [recipient.GetFirstName], so that each company their lands provide is greater in number. Will you swell them?"
  zz_valyria_magic_alchemy_magic.016.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA regimental standard is unfurled across the workbench, and the alchemist anoints its edges with a bright, metallic oil. As the incantation proceeds, the standard grows larger, its fringe lengthening and its colours deepening, as though more and more soldiers were gathering beneath it.\n\nIn the Freehold, a province's regiment was the pride of its governor, and alchemy made that pride well founded.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may enlarge the title regiments of [recipient.GetFirstName], so that each company their lands provide is greater in number. Will you swell them?"
  zz_valyria_magic_alchemy_magic.016.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA small model of a fortress is set within the circle, its walls lined with tiny carved soldiers. As the alchemist speaks, the ranks of soldiers grow, new figures appearing upon the walls until the model can scarcely hold them all.\n\nThe provincial governors of Valyria paid well for this working, for a great title regiment was the surest way to the dragonlords' favour.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may enlarge the title regiments of [recipient.GetFirstName], so that each company their lands provide is greater in number. Will you swell them?"
  zz_valyria_magic_alchemy_magic.016.opt.a:0 "Enlarge their title regiments!"
  zz_valyria_magic_alchemy_magic.016.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.016.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.016.name$"
  zz_valyria_magic_alchemy_magic.016.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ enlarging the title men-at-arms regiments of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.016.toast.tt:0 "$zz_valyria_magic_alchemy_magic.016.toast.desc$"

  zz_valyria_magic_alchemy_magic.016.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.016.name$"
  zz_valyria_magic_alchemy_magic.016.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_alchemy_magic.016.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.016.f.toast.desc$"



  ## Interaction
  zz_valyria_magic_alchemy_magic_017.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_duel_move$\n$zz_duel_skill$\n\nThe use of the arcane forces of [alchemy_magic|E] to assail a chosen subject with uncontrolled transmutative energies.\n\nEvery transmutation carries the risk of going wrong. This mystery is that risk made into a weapon: a torrent of raw transmutative force hurled at a chosen subject, warping their flesh, twisting their bones, and turning their own body against them.\n\nIn the instant of the assault, the caster may choose whether to maim or to slay. Either way, the subject will not be the same afterwards.\n\nThe alchemists of the Freehold used this working rarely, for it was considered crude, but they never hesitated to use it when crudeness was called for."

  ##event
  zz_valyria_magic_alchemy_magic.017.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.017.name$"
  zz_valyria_magic_alchemy_magic.017.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. The vessels on the table begin to tremble, and the liquids within them boil and change colour, cycling through every hue as raw, uncontrolled transmutative force gathers in the air.\n\nIn the duelling circles of the Freehold, alchemists fought with this working, and the losers were seldom recognisable afterwards.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may hurl a torrent of transmutative energy at [recipient.GetFirstName], warping and twisting them as you see fit. Will you have them broken?"
  zz_valyria_magic_alchemy_magic.017.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist draws a ring of salt around themselves and sets the vessels about them shuddering with a single word. A storm of coloured vapour rises from the crucibles, swirling faster and faster, crackling with a force that seeks only something to change.\n\nThe duelling alchemists of the Freehold were feared by sorcerer and soldier alike. What they struck was rarely the same afterwards.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may hurl a torrent of transmutative energy at [recipient.GetFirstName], warping and twisting them as you see fit. Will you have them broken?"
  zz_valyria_magic_alchemy_magic.017.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA flask of black liquid is unstoppered, and a thick vapour pours out, writhing like a living thing. The alchemist speaks a name into it, and the vapour gathers itself into a tight, shimmering knot, straining to be released towards its target.\n\nIn Valyria, transmutation was not only a craft. In the right hands, it was a weapon that could turn flesh to stone, or worse.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may hurl a torrent of transmutative energy at [recipient.GetFirstName], warping and twisting them as you see fit. Will you have them broken?"
  zz_valyria_magic_alchemy_magic.017.opt.a:0 "Have them broken, but not destroyed!"
  zz_valyria_magic_alchemy_magic.017.opt.b:0 "Yes, render them to nothing!"
  zz_valyria_magic_alchemy_magic.017.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.017.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.017.name$"
  zz_valyria_magic_alchemy_magic.017.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ assailing [recipient.GetFirstName] with uncontrolled transmutative energies."
  zz_valyria_magic_alchemy_magic.017.toast.tt:0 "$zz_valyria_magic_alchemy_magic.017.toast.desc$"

  zz_valyria_magic_alchemy_magic.017.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.017.name$"
  zz_valyria_magic_alchemy_magic.017.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_alchemy_magic.017.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.017.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_alchemy_magic_018.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_infl$\n\nThe use of the arcane forces of [alchemy_magic|E] to transmute base matter into seals of office and tokens of favour.\n\nLesser alchemists spend their lives in pursuit of a single transmutation and never achieve it. The adepts of the Freehold regarded such transmutations as the first lessons of their art: the reshaping of base matter into whatever the world values most.\n\nThrough this mystery, the alchemist conjures objects of political weight: seals of office, writs of authority, and tokens of favour that open doors and bend officials to the bearer's will, granting [influence|E].\n\nSuch tokens are never quite counterfeit. They are simply real in a way that no court ever authorised."

  ##event
  zz_valyria_magic_alchemy_magic.018.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.018.name$"
  zz_valyria_magic_alchemy_magic.018.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A blank sheet of vellum rests beneath a crystal vessel. As the incantation proceeds, ink blooms across its surface, forming a writ in an immaculate hand, sealed with wax that was not there a moment before.\n\nThe courtiers of the Freehold were masters of intrigue, and the alchemists who served them were masters of the documents that intrigue required.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure tokens of favour for [recipient.GetFirstName], increasing [recipient.GetHerHis] influence over the institutions of the realm. Will you manufacture authority?"
  zz_valyria_magic_alchemy_magic.018.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA quill of silver is dipped in an ink that shimmers like oil on water, and the alchemist begins to write. The words flow faster than their hand moves, filling page after page with letters of introduction, favours owed, and promises of support, each one sealed and signed.\n\nIn the Freehold, influence was a matter of paper as much as of power, and the alchemists made a great deal of paper.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure tokens of favour for [recipient.GetFirstName], increasing [recipient.GetHerHis] influence over the institutions of the realm. Will you manufacture authority?"
  zz_valyria_magic_alchemy_magic.018.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA small golden key is laid upon a sheet of vellum, and the alchemist pours a thin wash of quicksilver over both. As the liquid dries, the outlines of doors appear upon the vellum, dozens of them, each one standing slightly open.\n\nThe courtiers of Valyria were masters of access, and the alchemists who served them could open doors that no bribe could reach.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure tokens of favour for [recipient.GetFirstName], increasing [recipient.GetHerHis] influence over the institutions of the realm. Will you manufacture authority?"
  zz_valyria_magic_alchemy_magic.018.opt.a:0 "Conjure tokens of favour!"
  zz_valyria_magic_alchemy_magic.018.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.018.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.018.name$"
  zz_valyria_magic_alchemy_magic.018.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ conjuring tokens of favour that increase the influence of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.018.toast.tt:0 "$zz_valyria_magic_alchemy_magic.018.toast.desc$"

  zz_valyria_magic_alchemy_magic.018.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.018.name$"
  zz_valyria_magic_alchemy_magic.018.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_alchemy_magic.018.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.018.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_alchemy_magic_019.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_trsy$\n\nThe use of the arcane forces of [alchemy_magic|E] to transmute base matter into the stores and revenues of a realm.\n\nLesser alchemists spend their lives in pursuit of a single transmutation and never achieve it. The adepts of the Freehold regarded such transmutations as the first lessons of their art: the reshaping of base matter into whatever the world values most.\n\nThrough this mystery, the alchemist conjures the instruments of a state's wealth: tribute chests, granary stores, and sealed revenues that swell a realm's [treasury|E] rather than a ruler's purse.\n\nUnlike personal gold, such wealth belongs to the realm, and is spent upon the realm's needs."

  ##event
  zz_valyria_magic_alchemy_magic.019.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.019.name$"
  zz_valyria_magic_alchemy_magic.019.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A small iron chest rests within the circle, and as the incantation proceeds, it grows heavier and heavier until the table creaks beneath it, its seams straining with conjured wealth.\n\nThe treasuries of the Freehold were the envy of the world, and the alchemists who kept them full were among the most honoured servants of the empire.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure imperial stores for the realm of [recipient.GetFirstName], swelling [recipient.GetHerHis] treasury. Will you fill the coffers of the state?"
  zz_valyria_magic_alchemy_magic.019.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA merchant's scale is set at the centre of the circle, one pan empty and the other holding a single coin. As the alchemist speaks, the empty pan slowly sinks, weighed down by nothing that can be seen, until it rests heavily upon the table.\n\nThe treasuries of the Freehold never ran dry. Its alchemists were among the reasons why.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure imperial stores for the realm of [recipient.GetFirstName], swelling [recipient.GetHerHis] treasury. Will you fill the coffers of the state?"
  zz_valyria_magic_alchemy_magic.019.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA worn leather purse is laid open upon the workbench and dusted with gold powder. As the incantation proceeds, the purse fills and swells, coins spilling from its mouth onto the table in a steady, glittering stream.\n\nIn Valyria, the honoured treasury-alchemists were spoken of in the same breath as the dragonlords themselves.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure imperial stores for the realm of [recipient.GetFirstName], swelling [recipient.GetHerHis] treasury. Will you fill the coffers of the state?"
  zz_valyria_magic_alchemy_magic.019.opt.a:0 "Conjure imperial stores!"
  zz_valyria_magic_alchemy_magic.019.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.019.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.019.name$"
  zz_valyria_magic_alchemy_magic.019.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ conjuring stores and revenues for the treasury of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.019.toast.tt:0 "$zz_valyria_magic_alchemy_magic.019.toast.desc$"

