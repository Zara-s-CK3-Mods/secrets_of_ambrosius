  # Alchemy 024
  zz_valyria_magic_alchemy_magic_024.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_tcc$\n$zz_bdmg$\n$zz_gold$\n\nThe use of the arcane forces of [alchemy_magic|E] to transmute a building back into the wealth it was made from.\n\nThe alchemists of the Freehold taught that every made thing is only prime matter that has been persuaded to hold a shape. Persuaded otherwise, stone and timber remember that they were once silver.\n\nA random building in one of the subject's counties is destroyed or brought down a level, and the subject receives [gold|E], more the greater the caster's skill. Nothing is gained if the county has no building to unmake."
  zz_valyria_magic_alchemy_magic.024.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.024.name$"
  zz_valyria_magic_alchemy_magic.024.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe caster lays a ledger open upon the floor and reads aloud the costs of every stone and beam, line by line. As each sum is spoken, a building in the county grows faint and thin, until only its value is left.\n\nThe alchemists of the Freehold taught that every made thing is only prime matter persuaded to hold a shape.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may unmake a building of [recipient.GetFirstName]'s, and return it to them as gold. Will you cast?"
  zz_valyria_magic_alchemy_magic.024.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA crucible is set over a slow flame, and into it the caster drops a single brick taken from the county. It melts, and runs, and when it cools it is silver.\n\nIn Valyria, it was said that the richest lords kept their treasuries in their walls, and their walls in their treasuries.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may unmake a building of [recipient.GetFirstName]'s, and return it to them as gold. Will you cast?"
  zz_valyria_magic_alchemy_magic.024.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe caster draws the plan of a building in chalk and slowly rubs it out, line by line. With each line, coins gather in a dish beside the drawing.\n\nThe alchemists of the Freehold held that nothing is ever destroyed, only returned to what it was.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may unmake a building of [recipient.GetFirstName]'s, and return it to them as gold. Will you cast?"
  zz_valyria_magic_alchemy_magic.024.opt.a:0 "Unmake it!"
  zz_valyria_magic_alchemy_magic.024.opt.z:0 "No, let it stand."
  zz_valyria_magic_alchemy_magic.024.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.024.name$"
  zz_valyria_magic_alchemy_magic.024.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ unmaking a building of [recipient.GetFirstName]'s into gold."
  zz_valyria_magic_alchemy_magic.024.toast.tt:0 "$zz_valyria_magic_alchemy_magic.024.toast.desc$"
  zz_valyria_magic_alchemy_magic.024.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.024.name$"
  zz_valyria_magic_alchemy_magic.024.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$ as the stones stubbornly keep their shape."
  zz_valyria_magic_alchemy_magic.024.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.024.f.toast.desc$"

  # Alchemy 026
  zz_valyria_magic_alchemy_magic_026.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_ta$\n$zz_da$\n$zz_md$\n$zz_gold$\n\nThe use of the arcane forces of [alchemy_magic|E] to turn the soldiers of an army to base metal where they stand.\n\nThis is the transmutation every lesser alchemist dreams of, turned upon the one substance they dare not touch. Flesh becomes lead and iron from the skin inwards, and in the heart of each soldier, a little gold.\n\nThe chosen army loses soldiers, more the greater the caster's skill. The commander collects the gold left behind: a quarter of a [gold|E] piece for every soldier transmuted."
  zz_valyria_magic_alchemy_magic.026.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.026.name$"
  zz_valyria_magic_alchemy_magic.026.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe caster pours molten lead into a sand-table model of the field, filling the hollows where the enemy stands. Far away, men stumble as their legs grow heavy, and do not rise again.\n\nThe alchemists of the Freehold called this the Last Transmutation, and swore never to work it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn the soldiers of an army to metal and gold. Will you cast?"
  zz_valyria_magic_alchemy_magic.026.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA handful of iron filings is cast over a map of the enemy's camp, and the caster speaks a single word of binding. Where each filing falls, a soldier stiffens and turns grey.\n\nIn Valyria, it was said that the battlefields of the Freehold's wars could be mined for years afterwards.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn the soldiers of an army to metal and gold. Will you cast?"
  zz_valyria_magic_alchemy_magic.026.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe caster rubs a pinch of gold dust between two fingers and blows it towards the enemy's banners. It settles on their ranks, and spreads.\n\nThe alchemists of the Freehold taught that gold is only matter that has stopped changing, and that an army can be made to stop.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn the soldiers of an army to metal and gold. Will you cast?"
  zz_valyria_magic_alchemy_magic.026.opt.a:0 "Turn them to metal!"
  zz_valyria_magic_alchemy_magic.026.opt.z:0 "No, let them march on."
  zz_valyria_magic_alchemy_magic.026.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.026.name$"
  zz_valyria_magic_alchemy_magic.026.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ turning the soldiers of an enemy army to base metal and gold."
  zz_valyria_magic_alchemy_magic.026.toast.tt:0 "$zz_valyria_magic_alchemy_magic.026.toast.desc$"
  zz_valyria_magic_alchemy_magic.026.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.026.name$"
  zz_valyria_magic_alchemy_magic.026.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$ as the soldiers shake the weight from their limbs."
  zz_valyria_magic_alchemy_magic.026.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.026.f.toast.desc$"

  # Alchemy 025
  zz_valyria_magic_alchemy_magic_025.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_potion_make$\n\nThe use of the arcane forces of [alchemy_magic|E] to brew a potion of the caster's choosing.\n\nThe alchemists of the Freehold kept cellars of bottled workings, so that a lord could carry a mystery with them that no one at their side knew how to cast.\n\nThe subject receives a potion: an elixir with a permanent effect, a draught that lasts some years, or a potion that works a mystery when it is taken. Any potion on the list can be brewed. Stronger casters brew stronger potions. A potion is given with the Administer Potion interaction, and is used up."
  zz_valyria_magic_alchemy_magic.025.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.025.name$"
  zz_valyria_magic_alchemy_magic.025.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA row of glass vessels stands upon the bench, each over its own low flame. The caster tends them one by one, adding a pinch here and a drop there, until one of them begins to glow.\n\nThe alchemists of the Freehold kept cellars of bottled workings.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may brew a potion for [recipient.GetFirstName]. Choose what it will do. Will you cast?"
  zz_valyria_magic_alchemy_magic.025.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe caster grinds a handful of strange salts into a mortar, pours in quicksilver, and speaks a word into the mixture. It clears, and turns the colour of the working it holds.\n\nIn Valyria, it was said that a lord's physician and their alchemist were rarely on speaking terms.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may brew a potion for [recipient.GetFirstName]. Choose what it will do. Will you cast?"
  zz_valyria_magic_alchemy_magic.025.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA single flask is held over a candle while the caster recites a mystery under their breath, from beginning to end. When the last word is spoken, the flask is stoppered, and the working is inside it.\n\nThe alchemists of the Freehold taught that a spell can be poured, as easily as wine.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may brew a potion for [recipient.GetFirstName]. Choose what it will do. Will you cast?"
  zz_valyria_magic_alchemy_magic.025.opt.a:0 "Brew it!"
  zz_valyria_magic_alchemy_magic.025.opt.z:0 "No, not today."
  zz_valyria_magic_alchemy_magic.025.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.025.name$"
  zz_valyria_magic_alchemy_magic.025.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ brewing a potion for [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.025.toast.tt:0 "$zz_valyria_magic_alchemy_magic.025.toast.desc$"
  zz_valyria_magic_alchemy_magic.025.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.025.name$"
  zz_valyria_magic_alchemy_magic.025.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$ as the mixture curdles and spoils."
  zz_valyria_magic_alchemy_magic.025.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.025.f.toast.desc$"

  # Alchemy 043 - Transmutation (Development)
  zz_valyria_magic_alchemy_magic_043.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_dev$\n\nThe use of the arcane forces of [alchemy_magic|E] to transmute the substance of a county, raising its [prosperity|E].\n\nThe chosen county gains between one and five levels of prosperity, growing with the caster's mastery.\n\nThe alchemists of the Freehold held that a land is only a slower kind of metal, and that a patient hand can refine anything."
  zz_valyria_magic_alchemy_magic.043.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.043.name$"
  zz_valyria_magic_alchemy_magic.043.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe caster pours a phial of quicksilver into the earth at a crossroads. Over the following seasons the roads straighten, the mills turn faster and the market swells.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may refine one of [recipient.GetFirstName]'s counties. Will you transmute it?"
  zz_valyria_magic_alchemy_magic.043.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA grain of the philosopher's salt is dropped into the county's well. Those who drink find their crafts come easier, their fields yield more, and their town grows around them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may refine one of [recipient.GetFirstName]'s counties. Will you transmute it?"
  zz_valyria_magic_alchemy_magic.043.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe caster walks the county's bounds with a smoking censer, and where the smoke settles, mud becomes stone, thatch becomes tile and hovels become houses.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may refine one of [recipient.GetFirstName]'s counties. Will you transmute it?"
  zz_valyria_magic_alchemy_magic.043.opt.a:0 "Transmute the county."
  zz_valyria_magic_alchemy_magic.043.opt.z:0 "No, leave the land as it is."
  zz_valyria_magic_alchemy_magic.043.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.043.name$"
  zz_valyria_magic_alchemy_magic.043.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ transmuting the substance of a county."
  zz_valyria_magic_alchemy_magic.043.toast.tt:0 "$zz_valyria_magic_alchemy_magic.043.toast.desc$"
  zz_valyria_magic_alchemy_magic.043.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.043.name$"
  zz_valyria_magic_alchemy_magic.043.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$ as the transmutation curdles and fails."
  zz_valyria_magic_alchemy_magic.043.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.043.f.toast.desc$"

  # Alchemy 044 - Quicksilver Skin (Single Combat)
  zz_valyria_magic_alchemy_magic_044.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_duel_move$\n$zz_duel_skill$\n\nThe use of the arcane forces of [alchemy_magic|E] to turn the caster's skin to living quicksilver, so that steel slides from it like water.\n\nA share of the caster's injury risk is washed away, growing with skill in Alchemy until, with mastery, none is left."
  zz_valyria_magic_alchemy_magic.044.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.044.name$"
  zz_valyria_magic_alchemy_magic.044.desc:0 "This [zz_mystery|E] is worked only in [single_combat_fight|E]."
  zz_valyria_magic_alchemy_magic.044.opt.z:0 "Very well."
  zz_valyria_magic_alchemy_magic.044.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.044.name$"
  zz_valyria_magic_alchemy_magic.044.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ in single combat."
  zz_valyria_magic_alchemy_magic.044.toast.tt:0 "$zz_valyria_magic_alchemy_magic.044.toast.desc$"
  zz_valyria_magic_alchemy_magic.044.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.044.name$"
  zz_valyria_magic_alchemy_magic.044.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_alchemy_magic.044.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.044.f.toast.desc$"
