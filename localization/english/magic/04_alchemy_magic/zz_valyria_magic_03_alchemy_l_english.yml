  ## Alchemy Magic - Mystery of the Long Road
  zz_valyria_magic_alchemy_magic_029.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_trlen$\n\nThe use of the arcane forces of [alchemy_magic|E] upon every [trade_route|E] a chosen subject owns, so that their merchants can travel further than they could before.\n\nThrough this mystery the subject's merchants are given draughts that keep them hale on the longest roads, and their beasts and ships are anointed against wear and weather. Roads that once ended at the edge of the known world now reach a little past it.\n\nEvery [trade_route|E] the subject owns, now and in the future, can permanently stretch further, more the greater the alchemist's skill."
  zz_valyria_magic_alchemy_magic.029.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.029.name$"
  zz_valyria_magic_alchemy_magic.029.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA long cord, knotted once for every league of the subject's trade roads, is laid out on the floor. The alchemist anoints it from end to end with a pale oil, and as the incantation goes on, the cord seems to grow longer than the room should allow.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you lengthen the roads?"
  zz_valyria_magic_alchemy_magic.029.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA map of the subject's trade routes is laid upon the workbench, each road traced in a thin line of ink. The alchemist runs a finger dipped in quicksilver along each line, and as they do, the roads seem to stretch, reaching out towards markets that were too far away a moment before.\n\nThe merchant-alchemists of the Freehold sent their caravans further than any other traders dared to go.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you lengthen the roads?"
  zz_valyria_magic_alchemy_magic.029.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA pair of worn traveller's boots is set upon the workbench, and the alchemist anoints their soles with a dark, sweet-smelling oil. The leather drinks the oil greedily, and as it does, the boots seem to grow lighter, as if they could walk forever without tiring.\n\nIn Valyria, the roads of trade were as long as the alchemists could make them, and they could make them very long indeed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you lengthen the roads?"
  zz_valyria_magic_alchemy_magic.029.opt.a:0 "Let the roads run further!"
  zz_valyria_magic_alchemy_magic.029.opt.z:0 "No, do not cast!"
  zz_valyria_magic_alchemy_magic.029.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.029.name$"
  zz_valyria_magic_alchemy_magic.029.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ lengthening the trade roads of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.029.toast.tt:0 "$zz_valyria_magic_alchemy_magic.029.toast.desc$"
  zz_valyria_magic_alchemy_magic.029.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.029.name$"
  zz_valyria_magic_alchemy_magic.029.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_alchemy_magic.029.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.029.f.toast.desc$"
  ## Alchemy Magic - Mystery of the Open Road
  zz_valyria_magic_alchemy_magic_030.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_mtr$\n\nThe use of the arcane forces of [alchemy_magic|E] to open a new road for a chosen subject's trade, letting them run one more [trade_route|E] than they otherwise could.\n\nThe merchant-alchemists of the Freehold kept a lodestone for every road their houses ran, and it was said a new road could only be opened when a new stone was made. Through this mystery such a stone is quickened and bound to the subject, and their factors find a way where there was none.\n\nThe subject can permanently run an additional [trade_route|E], two for a master alchemist."
  zz_valyria_magic_alchemy_magic.030.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.030.name$"
  zz_valyria_magic_alchemy_magic.030.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA plain grey stone sits in a bowl of quicksilver. As the incantation is spoken, the alchemist turns it slowly, and the quicksilver begins to pull at it, always towards the same distant point, no matter how the bowl is turned.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you open the road?"
  zz_valyria_magic_alchemy_magic.030.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA small iron key is set within a ring of glyphs, and the alchemist pours a glowing liquid over it. As it cools, the key's shadow lengthens across the table, stretching out like a road that leads to a door no one has yet opened.\n\nThe merchant-alchemists of the Freehold opened trade roads where there had been none, and the wealth that flowed along them filled the empire's coffers.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you open the road?"
  zz_valyria_magic_alchemy_magic.030.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA bundle of milestones in miniature, carved from white stone, is laid out in a line upon the workbench. The alchemist anoints the last one with a drop of quicksilver, and a new stone appears at the end of the line, and then another, leading away towards some distant and unknown market.\n\nIn Valyria, a new trade road was a gift beyond price, and the alchemists who could open one were honoured as princes.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you open the road?"
  zz_valyria_magic_alchemy_magic.030.opt.a:0 "Open a new road!"
  zz_valyria_magic_alchemy_magic.030.opt.z:0 "No, do not cast!"
  zz_valyria_magic_alchemy_magic.030.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.030.name$"
  zz_valyria_magic_alchemy_magic.030.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ opening a new trade road for [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.030.toast.tt:0 "$zz_valyria_magic_alchemy_magic.030.toast.desc$"
  zz_valyria_magic_alchemy_magic.030.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.030.name$"
  zz_valyria_magic_alchemy_magic.030.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_alchemy_magic.030.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.030.f.toast.desc$"
  ## Alchemy Magic - Mystery of Many Markets
  zz_valyria_magic_alchemy_magic_031.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_mkt$\n\nThe use of the arcane forces of [alchemy_magic|E] to let every [trade_route|E] of a chosen subject reach more [trade_market|E]s along its way.\n\nThe merchant-alchemists of the Freehold were said to keep a ledger whose pages never ran out, and every market a caravan passed through was written into it in ink that would not fade. Through this mystery such a ledger is bound to the subject, and their merchants find a welcome in more markets than any caravan could otherwise manage.\n\nEvery [trade_route|E] the subject owns, now and in the future, can permanently pass through an additional [trade_market|E], two for a master alchemist."
  zz_valyria_magic_alchemy_magic.031.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.031.name$"
  zz_valyria_magic_alchemy_magic.031.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA heavy ledger bound in grey leather lies open on the workbench, its pages blank. The alchemist writes the name of each market along the subject's roads in an ink that shines like quicksilver, and as the incantation goes on, new names begin to appear on the page in the same silver hand, written by no one.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you open the ledger?"
  zz_valyria_magic_alchemy_magic.031.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA merchant's map is laid out upon the workbench, its roads marked in black ink. The alchemist dips a fine brush in quicksilver and touches it to each road in turn, and wherever the brush touches, new markets bloom along the route like flowers along a garden path.\n\nThe merchant-alchemists of the Freehold made their patrons' caravans welcome in markets that turned all others away.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you open the ledger?"
  zz_valyria_magic_alchemy_magic.031.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA string of small coins, each from a different land, is threaded upon a silver cord and laid across the workbench. As the alchemist speaks, new coins appear upon the cord, one after another, each one marking a market where the subject's goods will now be welcome.\n\nIn Valyria, the longest trade roads passed through the most markets, and the alchemists could add markets as easily as a clerk adds names to a ledger.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you open the ledger?"
  zz_valyria_magic_alchemy_magic.031.opt.a:0 "Fill the ledger with markets!"
  zz_valyria_magic_alchemy_magic.031.opt.z:0 "No, do not cast!"
  zz_valyria_magic_alchemy_magic.031.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.031.name$"
  zz_valyria_magic_alchemy_magic.031.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ opening new markets to the roads of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.031.toast.tt:0 "$zz_valyria_magic_alchemy_magic.031.toast.desc$"
  zz_valyria_magic_alchemy_magic.031.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.031.name$"
  zz_valyria_magic_alchemy_magic.031.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_alchemy_magic.031.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.031.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_alchemy_magic_032.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_vs_ingot$\n\nThe use of the arcane forces of [alchemy_magic|E] to transmute common metals into Valyrian steel.\n\nThe smiths of the Freehold forged their steel with fire and spellsong; the alchemists remembered that every substance is but one shape of a single prime matter, and simply asked the iron to become something else. Through this mystery the alchemist turns base metal into ingots of Valyrian steel, from which every great work of magical craft must begin.\n\nThe subject receives one Valyrian Steel Ingot for every 500 points of the alchemist's skill, and always at least one."

  ## Spell Options
  ## event
  zz_valyria_magic_alchemy_magic.032.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.032.name$"
  zz_valyria_magic_alchemy_magic.032.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nIron, silver and a pinch of powdered dragonglass are laid in a crucible of black clay, and the alchemist speaks the old formula of the Freehold over them. The metals do not melt so much as forget themselves, flowing together into something darker and harder, rippled like smoke beneath ice.\n\nThe smiths of Valyria needed fire and spellsong. The alchemists needed only to remember what the steel had once been.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_alchemy_magic.032.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA common bar of castle iron is wrapped in parchment written over with sigils, and the alchemist lays it in a bath of quicksilver. Through the long night the quicksilver darkens and the sigils fade one by one, and by dawn the bar that rises from the bath is no longer iron at all.\n\nIn the Freehold, it was whispered that the alchemists could make Valyrian steel in a bowl. The smiths never forgave them for it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_alchemy_magic.032.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist grinds lodestone, ash and the alchemist's own blood together in a mortar, then scatters the powder over a heap of old blades. Where it falls, the steel shivers and runs together, folding itself a hundred times without a hammer ever touching it.\n\nWhat is left when the shivering stops is small, and heavy, and very dark.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_alchemy_magic.032.opt.a:0 "Let the iron remember what it was!"
  zz_valyria_magic_alchemy_magic.032.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.032.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.032.name$"
  zz_valyria_magic_alchemy_magic.032.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ transmuting common metal into Valyrian steel for [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.032.toast.tt:0 "$zz_valyria_magic_alchemy_magic.032.toast.desc$"

  zz_valyria_magic_alchemy_magic.032.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.032.name$"
  zz_valyria_magic_alchemy_magic.032.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_alchemy_magic.032.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.032.f.toast.desc$"
  zz_valyria_magic_has_trade_routes_tt:0 "Owns at least one [trade_route|E]"


  ## Alchemy 033
  zz_valyria_magic_alchemy_magic_033.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sa$\n$zz_nrep$\n\nThe use of the arcane forces of [alchemy_magic|E] to give motion to bronze.\n\nThrough this mystery, a company of bronze automatons is cast, quickened and set in the service of the chosen subject. They are few, but each stands as firm as a veteran of the line.\n\nThey are made and not born, and no recruit can take the place of one that falls. What is broken stays broken."
  zz_valyria_magic_alchemy_magic.033.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.033.name$"
  zz_valyria_magic_alchemy_magic.033.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nMolten bronze runs along channels cut into the floor, and fills a row of waiting moulds. As it cools, something within begins to knock."
  zz_valyria_magic_alchemy_magic.033.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe caster presses a lead tablet, marked with a single word, into a bronze chest. Slowly and with a grinding of joints, the figure lifts its head."
  zz_valyria_magic_alchemy_magic.033.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nRows of hollow figures stand in the workshop, dull and still. The caster walks between them, touching each brow, and each in turn begins to turn its head."
  zz_valyria_magic_alchemy_magic.033.opt.a:0 "Awaken, and serve."
  zz_valyria_magic_alchemy_magic.033.opt.z:0 "No, do not cast!"
  zz_valyria_magic_alchemy_magic.033.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.033.name$"
  zz_valyria_magic_alchemy_magic.033.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ casting bronze sentinels for [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.033.toast.tt:0 "$zz_valyria_magic_alchemy_magic.033.toast.desc$"
  zz_valyria_magic_alchemy_magic.033.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.033.name$"
  zz_valyria_magic_alchemy_magic.033.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_alchemy_magic.033.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.033.f.toast.desc$"


  ## Alchemy 034
  zz_valyria_magic_alchemy_magic_034.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sa$\n$zz_nrep$\n\nThe use of the arcane forces of [alchemy_magic|E] to raise giants of iron.\n\nThrough this mystery, towering automatons are forged and woken for the chosen subject. There are never more than a handful, but each can break a battle line by itself, and they tear down walls as readily as they tear down men.\n\nNo mystery of alchemy is more costly, and none is less forgiving. A fallen colossus can never be replaced."
  zz_valyria_magic_alchemy_magic.034.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.034.name$"
  zz_valyria_magic_alchemy_magic.034.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe furnace roars until the walls glow. From its mouth comes a slow, heavy tread, and the floor of the chamber shakes."
  zz_valyria_magic_alchemy_magic.034.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe caster climbs a scaffold to reach an iron brow, and inscribes a last line upon it. High above, a great hand closes."
  zz_valyria_magic_alchemy_magic.034.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nGreat plates of iron drag themselves across the workshop floor. They fit together with a sound like a closing gate, and stand."
  zz_valyria_magic_alchemy_magic.034.opt.a:0 "Rise, and break their walls!"
  zz_valyria_magic_alchemy_magic.034.opt.z:0 "No, do not cast!"
  zz_valyria_magic_alchemy_magic.034.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.034.name$"
  zz_valyria_magic_alchemy_magic.034.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ forging iron colossi for [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.034.toast.tt:0 "$zz_valyria_magic_alchemy_magic.034.toast.desc$"
  zz_valyria_magic_alchemy_magic.034.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.034.name$"
  zz_valyria_magic_alchemy_magic.034.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_alchemy_magic.034.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.034.f.toast.desc$"

  zz_bronze_sentinels:0 "Bronze Sentinels"
  zz_bronze_sentinels_flavor:0 "They do not tire, they do not fear, and they do not stop. Nor do they mend: a broken sentinel is scrap."
  zz_valyria_bronze_host:0 "Host of Bronze"
  zz_iron_colossi:0 "Iron Colossi"
  zz_iron_colossi_flavor:0 "Each one strides over the shield wall and walks through the gate. There are never many, and no forge can repair them once they fall."
  zz_valyria_iron_host:0 "Host of Iron"

  ## Interaction
  zz_valyria_magic_alchemy_magic_035.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_hcm$\n\nThe use of the arcane forces of [alchemy_magic|E] to reduce the selected subject's miscast counter.\n\nTo the alchemist, a miscast is dross: the slag a working leaves behind when it is poorly made. Through this mystery, the subject is refined as metal is refined, heated and skimmed until the impurity is drawn off.\n\nNo school purges the residue of failed magic as thoroughly as alchemy, but its reagents are costly. The subject's miscast counter is greatly reduced, more so the greater the caster's skill."

  ## Spell Options
  ## event
  zz_valyria_magic_alchemy_magic.035.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.035.name$"
  zz_valyria_magic_alchemy_magic.035.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe subject sits within a ring of seven crucibles, each holding a different metal kept molten over a low flame. The caster chants the stages of the Great Work, and with each stage a dull grey film rises on the surface of one crucible and is skimmed away with a silver spoon.\n\nWhen the last crucible runs clear, the subject feels lighter, as though something heavy had been poured out of them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_alchemy_magic.035.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA bitter draught of quicksilver, salt and sulphur, prepared over many days, is given to the subject to drink. They sweat for an hour, and the sweat comes out grey and leaves a crust upon the skin, which the caster scrapes into a jar and seals with lead.\n\nThe alchemists of the Freehold kept such jars in deep cellars and never opened them again.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_alchemy_magic.035.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe caster sets an alembic over the subject's head and recites the formula of separation. Vapour rises from the subject's skin, is caught in the glass, and condenses into a few drops of black liquid that hiss when they touch the bench.\n\nIn Valyria it was said that every failed spell left a residue, and that a wise mage had it distilled out before it could set.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_alchemy_magic.035.opt.a:0 "Yes, purge the dross!"
  zz_valyria_magic_alchemy_magic.035.opt.z:0 "No, do not cast!"

  zz_valyria_magic_alchemy_magic.035.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.035.name$"
  zz_valyria_magic_alchemy_magic.035.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ refining the dross of failed magic out of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.035.toast.tt:0 "$zz_valyria_magic_alchemy_magic.035.toast.desc$"

  zz_valyria_magic_alchemy_magic.035.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.035.name$"
  zz_valyria_magic_alchemy_magic.035.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_alchemy_magic.035.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.035.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_alchemy_magic_036.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_pcm$\n\nThe use of the arcane forces of [alchemy_magic|E] to prevent the selected subject from miscasting.\n\nIron that is quenched and tempered holds its edge. Through this mystery, the subject is tempered in the same way, so that a working which begins to slip from their control bends instead of breaking.\n\nThe subject is protected against miscasts, more so the greater the caster's skill."

  ## Spell Options
  ## event
  zz_valyria_magic_alchemy_magic.036.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.036.name$"
  zz_valyria_magic_alchemy_magic.036.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe subject's hands are plunged into a vat of brine and oil while the caster speaks the formula of tempering. Then they are drawn out and held over the coals, and plunged again, seven times, until the skin is flushed and the pulse beats slow and even.\n\nSteel is made strong by heat and cold in turn. The alchemists held that mages were no different.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_alchemy_magic.036.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nFine filings of iron, silver and gold are mixed into a paste and painted in bands around the subject's wrists and throat. As the caster chants, the bands warm and harden into a thin metallic sheen, and then fade into the skin.\n\nWhen a working goes awry, it is said the bands grow hot, and the magic runs to earth through them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_alchemy_magic.036.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe caster sets the subject's palm upon an anvil of black iron and strikes a single ringing blow beside it with a hammer of bronze. The note does not fade. It sinks into the subject's bones, and they carry it with them, steady and unbroken.\n\nThe alchemists called it the tempering note, for a mage who hears it will not shatter.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_alchemy_magic.036.opt.a:0 "Yes, temper them!"
  zz_valyria_magic_alchemy_magic.036.opt.z:0 "No, do not cast!"

  zz_valyria_magic_alchemy_magic.036.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.036.name$"
  zz_valyria_magic_alchemy_magic.036.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ tempering [recipient.GetFirstName] against miscasting."
  zz_valyria_magic_alchemy_magic.036.toast.tt:0 "$zz_valyria_magic_alchemy_magic.036.toast.desc$"

  zz_valyria_magic_alchemy_magic.036.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.036.name$"
  zz_valyria_magic_alchemy_magic.036.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_alchemy_magic.036.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.036.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_alchemy_magic_037.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_skl_pm$\n\nThe use of the arcane forces of [alchemy_magic|E] to permanently raise or lower the selected subject's [diplomacy|E].\n\nTo the alchemist a person is only another substance, to be refined or debased. Through this mystery the caster transmutes the subject to sharpen or dull their [diplomacy|E].\n\nThe change is small and slow to grow: one point for every 80 points of the caster's skill, and never less than one."

  ## Spell Options
  ## event
  zz_valyria_magic_alchemy_magic.037.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.037.name$"
  zz_valyria_magic_alchemy_magic.037.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe subject lies within a circle of seven crucibles, each holding a different metal. The caster speaks the formula of transmutation, and a thin vapour rises from the crucibles and settles upon the subject, seeping into the voice and the bearing.\n\nThe alchemists held that a person could be refined like any other substance, and that their words carry further, or falter and die in the mouth.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_alchemy_magic.037.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA draught distilled over many weeks from quicksilver, salt and the ashes of old books is given to the subject. As it takes hold, the caster traces the signs of change upon their skin with a stylus of gold.\n\nThe work is patient and precise. Little changes at once, but what does change does not change back, and their words carry further, or falter and die in the mouth.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_alchemy_magic.037.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe caster sets an alembic over a brazier and fills it with a few drops of the subject's sweat, tears and breath, caught in glass. As the mixture boils, they recite the stages of the Great Work, and the subject feels the voice and the bearing shift like sand settling in water.\n\nIn Valyria it was said that the alchemist's true crucible was the body itself.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_alchemy_magic.037.opt.a:0 "Transmute their [diplomacy|E]!"
  zz_valyria_magic_alchemy_magic.037.opt.z:0 "No, do not cast!"

