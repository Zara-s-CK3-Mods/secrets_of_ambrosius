

l_english:

  ## Alchemical Magic
  ## Interaction
  ##\n\nThe use of the arcane forces of [alchemy_magic|E] to increase the prosperity in the chosen province of the selected subject.
  zz_valyria_magic_alchemy_magic_001.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_ccd$\n$zz_devg$\n\nThe use of the arcane forces of [alchemy_magic|E] to quicken the prosperity of a chosen county.\n\nThe alchemists of the Freehold held that land, too, is a substance, and may be refined like any other. Through this mystery, the soil, the water, and the very air of a county are enriched, so that crops grow fuller, trades flourish, and towns swell with new life.\n\nThe effect is subtle but profound. [prosperity|E] comes more swiftly to a county so blessed, and the gains it makes are lasting long after the working fades.\n\nIt is said that the gardens of Old Valyria bore fruit in every season, and that its cities grew from villages in a single generation. If so, this was the art that made them."

  ## event
  zz_valyria_magic_alchemy_magic.001.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.001.name$"
  zz_valyria_magic_alchemy_magic.001.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. At their centre lies a handful of earth from the chosen county, which begins to darken and glisten as the elixirs are poured over it, giving off the rich smell of rain on ploughed fields.\n\nThe land-alchemists of the Freehold walked the provinces of the empire as healers walk the wards of a hospital, tending the sick soil and fattening the lean.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Through such transmutation you may quicken the prosperity of the lands of [recipient.GetFirstName], bringing growth and prosperity to their people. Will you enrich the land?"
  zz_valyria_magic_alchemy_magic.001.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA clay tablet stamped with the outline of the chosen county is set upon the workbench, and the alchemist pours a green and bitter tincture over it, drop by drop. Where each drop falls, the clay softens and darkens, and tiny shoots of moss begin to push up through its surface.\n\nThe land-alchemists of Valyria held that the soil is as much a living thing as any beast, and as willing to be fed and fattened.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Through such transmutation you may quicken the prosperity of the lands of [recipient.GetFirstName], bringing growth and prosperity to their people. Will you enrich the land?"
  zz_valyria_magic_alchemy_magic.001.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nSeeds of wheat and barley are steeped in a bath of golden liquid until they swell to twice their size. The alchemist scatters them across a map of the county and speaks the old words, and the scent of harvest, of cut grain and warm bread, rises from the parchment.\n\nIn the Freehold, a lean county was a failure of the alchemist assigned to it, and failures were not long tolerated.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Through such transmutation you may quicken the prosperity of the lands of [recipient.GetFirstName], bringing growth and prosperity to their people. Will you enrich the land?"
  zz_valyria_magic_alchemy_magic.001.opt.a:0 "Let the land flourish!"
  zz_valyria_magic_alchemy_magic.001.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_alchemy_magic.001.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.001.name$"
  zz_valyria_magic_alchemy_magic.001.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ quickening the prosperity of [target.GetName]."
  zz_valyria_magic_alchemy_magic.001.toast.tt:0 "$zz_valyria_magic_alchemy_magic.001.toast.desc$"
  zz_valyria_magic_alchemy_magic.001.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.001.name$"
  zz_valyria_magic_alchemy_magic.001.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_alchemy_magic.001.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.001.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_alchemy_magic_002.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tp$\n$zz_bld$\n\nThe use of the arcane forces of [alchemy_magic|E] to hasten the raising of buildings in a chosen province.\n\nStone is merely earth that has been persuaded to hold a shape. Through this mystery, the stone, timber, and mortar used in a province's construction are made more willing: blocks fit more readily, mortar sets more swiftly, and beams resist warping and rot.\n\nBuilding works in the province advance far faster than the labour of mortal masons alone would allow.\n\nThe great cities of the Freehold were raised with such haste that their enemies took them for the work of gods. The truth was only a little less remarkable."

  ##event
  zz_valyria_magic_alchemy_magic.002.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.002.name$"
  zz_valyria_magic_alchemy_magic.002.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A small block of stone rests in a basin of quicksilver, and as the incantation proceeds it softens, flows, and sets again into a shape more perfect than any mason's chisel could achieve.\n\nThe builder-alchemists of Valyria were the true architects of the Freehold. The dragons may have conquered the world, but it was the alchemists who rebuilt it in Valyria's image.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may hasten the construction of works in the lands of [recipient.GetFirstName], so that walls, halls, and markets rise in a fraction of the usual time. Will you lend your art to the builders?"
  zz_valyria_magic_alchemy_magic.002.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA mason's plumb line hangs above a basin of quicksilver, perfectly still. As the alchemist speaks, the quicksilver rises to meet it, climbing the line in a thin silver thread and setting, as it cools, into a slender column straighter than any builder's art could make.\n\nThe great roads and walls of Valyria were built in years, not generations. Its alchemists made sure of it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may hasten the construction of works in the lands of [recipient.GetFirstName], so that walls, halls, and markets rise in a fraction of the usual time. Will you lend your art to the builders?"
  zz_valyria_magic_alchemy_magic.002.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nBricks of raw clay are laid in a ring around the crucible, and the alchemist anoints each with a pale, chalky paste. As the incantation proceeds, the bricks harden and grow smooth, their edges sharpening until they could be fitted together without a single gap.\n\nThe builder-alchemists of the Freehold could raise a city in the time it took other lords to raise a tower.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may hasten the construction of works in the lands of [recipient.GetFirstName], so that walls, halls, and markets rise in a fraction of the usual time. Will you lend your art to the builders?"
  zz_valyria_magic_alchemy_magic.002.opt.a:0 "Let the stone obey!"
  zz_valyria_magic_alchemy_magic.002.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_alchemy_magic.002.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.002.name$"
  zz_valyria_magic_alchemy_magic.002.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ hastening the construction of buildings in the lands of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.002.toast.tt:0 "$zz_valyria_magic_alchemy_magic.002.toast.desc$"

  zz_valyria_magic_alchemy_magic.002.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.002.name$"
  zz_valyria_magic_alchemy_magic.002.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_alchemy_magic.002.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.002.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_alchemy_magic_003.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_gold$\n\nThe use of the arcane forces of [alchemy_magic|E] to transmute base matter into gleaming gold.\n\nLesser alchemists spend their lives in pursuit of a single transmutation and never achieve it. The adepts of the Freehold regarded such transmutations as the first lessons of their art: the reshaping of base matter into whatever the world values most.\n\nThrough this mystery, lead, iron, and common stone are transformed into gleaming [gold|E], conjuring wealth from nothing. The alchemist need only supply the base matter and the will.\n\nThe Valyrians were careful never to flood the markets of the world with sorcerous gold, lest its value collapse. Those who practise this art in secret would do well to remember their caution."

  ##event
  zz_valyria_magic_alchemy_magic.003.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.003.name$"

  zz_valyria_magic_alchemy_magic.003.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A heap of lead shot lies in the largest crucible. As the incantations are spoken, the dull grey of the metal begins to warm, then to glow, then to shine with the unmistakable yellow of true gold.\n\nThe treasuries of the dragonlords were said to be bottomless. Few outside the Freehold ever guessed why.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may transmute base metal into gold for [recipient.GetFirstName], filling [recipient.GetHerHis] coffers with wealth conjured from nothing. Will you make gold from lead?"
  zz_valyria_magic_alchemy_magic.003.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA ladle of molten lead is poured slowly into a mould of carved stone, and the alchemist sprinkles a red powder into the stream as it falls. Where the powder touches the metal, the grey turns warm and bright, and by the time the mould is full, it holds a bar of pure gold.\n\nThe Freehold paid its armies, its builders and its bribes in gold. Little of it ever came from a mine.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may transmute base metal into gold for [recipient.GetFirstName], filling [recipient.GetHerHis] coffers with wealth conjured from nothing. Will you make gold from lead?"
  zz_valyria_magic_alchemy_magic.003.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA heap of copper coins, the small change of a market town, is tipped into a crucible and covered with a pale, shimmering liquid. As the alchemist stirs, the coins begin to hiss and glow, and when the liquid is poured away, they gleam like the sun.\n\nThe coffers of the dragonlords were never empty, and the alchemists who filled them were never poor.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may transmute base metal into gold for [recipient.GetFirstName], filling [recipient.GetHerHis] coffers with wealth conjured from nothing. Will you make gold from lead?"

  zz_valyria_magic_alchemy_magic.003.opt.a:0 "Transmute the gold!"
  zz_valyria_magic_alchemy_magic.003.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.003.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.003.name$"

  zz_valyria_magic_alchemy_magic.003.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ transmuting base metal into gold for [recipient.GetFirstName]."

  zz_valyria_magic_alchemy_magic.003.toast.tt:0 "$zz_valyria_magic_alchemy_magic.003.toast.desc$"

  zz_valyria_magic_alchemy_magic.003.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.003.name$"

  zz_valyria_magic_alchemy_magic.003.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_alchemy_magic.003.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.003.f.toast.desc$"

  ### Interaction
  valyria_magic_craft_potion:0 "Myseries of Formulas"
  actor_secondary_valyria_magic_craft_potion:0 "Caster"
  recipient_valyria_magic_craft_potion:0 "Spell Subject"

  ## Interaction
  zz_valyria_magic_alchemy_magic_004.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_knl$\n\nThe use of the arcane forces of [alchemy_magic|E] to draw more knights into the service of a chosen subject.\n\nThrough this mystery, the spirit of martial loyalty itself is distilled and bound to the chosen subject, drawing warriors of renown to their banner who might otherwise have sworn to another.\n\nThe subject finds themselves able to field more [knight|E]s than their station would ordinarily allow, as champions seek them out and remain at their side.\n\nThe alchemists of the Freehold did not think of loyalty as a virtue. They thought of it as a substance, and a substance can always be manufactured."

  ##event
  zz_valyria_magic_alchemy_magic.004.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.004.name$"
  zz_valyria_magic_alchemy_magic.004.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A single golden spur rests in a dish of quicksilver, and as the elixir is poured over it, the spur seems to multiply, its reflection appearing again and again in the polished vessels around it.\n\nThe Valyrians called this the Distillation of Fealty, and used it to bind the warrior castes of conquered peoples to the service of their new masters.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw more knights to the banner of [recipient.GetFirstName], enlarging the champions who fight at their side. Is it right to purchase loyalty with sorcery?"
  zz_valyria_magic_alchemy_magic.004.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA knight's gauntlet, worn and scarred from many battles, rests within a circle of glyphs. The alchemist pours a silver tincture into its palm, and the liquid spreads through the leather and steel, and the gauntlet's reflection in the polished vessels begins to multiply.\n\nIn Valyria, the bonds of knightly service were made as much in the alchemist's workshop as in the hall of oaths.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw more knights to the banner of [recipient.GetFirstName], enlarging the champions who fight at their side. Is it right to purchase loyalty with sorcery?"
  zz_valyria_magic_alchemy_magic.004.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA ring of bronze, engraved with an oath of service, is dropped into a flask of golden liquid. As it sinks, the flask fills with tiny gleaming rings, each a perfect copy of the first, until they crowd against the glass.\n\nThe Freehold's warrior castes were never short of champions. Its alchemists saw to it that every lord had the knights they needed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw more knights to the banner of [recipient.GetFirstName], enlarging the champions who fight at their side. Is it right to purchase loyalty with sorcery?"
  zz_valyria_magic_alchemy_magic.004.opt.a:0 "Summon more champions!"
  zz_valyria_magic_alchemy_magic.004.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.004.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.004.name$"
  zz_valyria_magic_alchemy_magic.004.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ drawing more knights to the banner of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.004.toast.tt:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ granting improved armaments to the forces of [recipient.GetFirstName]."

  zz_valyria_magic_alchemy_magic.004.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.004.name$"
  zz_valyria_magic_alchemy_magic.004.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_alchemy_magic.004.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.004.f.toast.desc$"

  ## Interaction

  zz_valyria_magic_alchemy_magic_005.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_dml$\n\nThe use of the arcane forces of [alchemy_magic|E] to extend the reach of a chosen ruler's personal rule.\n\nA ruler's attention is a finite thing, and the lands they can hold directly are limited by it. Through this mystery, the essence of rulership is refined within the chosen subject, so that their gaze reaches further and their grip holds firmer.\n\nThe subject's [domain_limit|E] increases, allowing them to hold more holdings personally without the inefficiency that normally follows.\n\nThe archons of the Freehold were said to govern vast estates without ever seeming to tire. Alchemy, more than talent, was the secret of their stamina."


  ##event
  zz_valyria_magic_alchemy_magic.005.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.005.name$"
  zz_valyria_magic_alchemy_magic.005.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A tiny crown of hammered gold sits within a sealed flask, and as the vapours rise, it seems to grow, filling the vessel until the glass groans and creaks around it.\n\nThe administrator-alchemists of the Freehold refined the governors of the empire's provinces as a smith tempers a blade, so that a single archon could rule what would otherwise have required a dozen.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may extend the reach of [recipient.GetFirstName]'s personal rule, allowing them to hold more of their realm in their own hands. Will you refine their rulership?"
  zz_valyria_magic_alchemy_magic.005.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA seal of office, heavy and ornate, is pressed into a pool of warm wax upon the workbench. The alchemist pours a fine silver dust into the impression, and as the incantation proceeds, the impression deepens and widens, until it is far larger than the seal that made it.\n\nThe archons of the Freehold ruled more land than any lord before them, and did so without seeming to tire.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may extend the reach of [recipient.GetFirstName]'s personal rule, allowing them to hold more of their realm in their own hands. Will you refine their rulership?"
  zz_valyria_magic_alchemy_magic.005.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA small model of a palace, carved from white stone, rests within a ring of glyphs. As the alchemist works, its walls seem to stretch outward, its halls lengthening and its courtyards widening, until the model is twice the size it was.\n\nIn Valyria, a ruler's reach was a matter of refinement. The administrator-alchemists refined it, and the empire grew.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may extend the reach of [recipient.GetFirstName]'s personal rule, allowing them to hold more of their realm in their own hands. Will you refine their rulership?"
  zz_valyria_magic_alchemy_magic.005.opt.a:0 "Extend their reach!"
  zz_valyria_magic_alchemy_magic.005.opt.b:0 "Yes, Vassal Efficiencies!"
  zz_valyria_magic_alchemy_magic.005.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_alchemy_magic.005.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.005.name$"
  zz_valyria_magic_alchemy_magic.005.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ extending the reach of [recipient.GetFirstName]'s personal rule."
  zz_valyria_magic_alchemy_magic.005.toast.tt:0 "$zz_valyria_magic_alchemy_magic.005.toast.desc$"

  zz_valyria_magic_alchemy_magic.005.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.005.name$"
  zz_valyria_magic_alchemy_magic.005.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_alchemy_magic.005.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.005.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_alchemy_magic_006.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tci$\n$zz_cci$\n\nThe use of the arcane forces of [alchemy_magic|E] to enchant a chosen item with new and greater potencies.\n\nEvery object has an essence, and an essence can be refined. Through this mystery, an item is broken down and rebuilt at the most fundamental level, gaining new properties: a sharper edge, a deeper wisdom, a hunger for magic, or a share of its owner's fortune.\n\nThe nature of the enchantment depends on the caster's will and skill, and no two enchanted items are ever quite the same.\n\nThe treasures of the Freehold, the blades and crowns and rings that survived the Doom, were all made this way. They still hum with the power that was folded into them."

  ##event
  zz_valyria_magic_alchemy_magic.006.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.006.name$"
  zz_valyria_magic_alchemy_magic.006.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. The chosen item rests within a circle of glyphs, and as the elixirs are poured over it, its surface ripples like water and glows with a faint inner light.\n\nThe artificers of Valyria were alchemists first and craftsmen second. Their workshops were filled not with hammers and anvils but with crucibles and furnaces, and their creations were as much spell as substance.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may enchant the treasure of [recipient.GetFirstName], granting it new and greater potencies. Will you make it glow?"
  zz_valyria_magic_alchemy_magic.006.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe chosen item is wrapped in a cloth of woven silver thread and laid upon a slab of black stone. The alchemist pours a thin stream of glowing liquid over the cloth, and where it soaks through, the item beneath begins to hum faintly, as though something within it had woken.\n\nThe artificers of the Freehold made treasures that still pass from hand to hand, centuries after their makers were dust.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may enchant the treasure of [recipient.GetFirstName], granting it new and greater potencies. Will you make it glow?"
  zz_valyria_magic_alchemy_magic.006.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA small furnace is lit beneath a crucible of dark glass, and the chosen item is lowered into it on a silver chain. The flames rise blue and then white, and when the item is drawn out, its surface shines with a light that does not come from the fire.\n\nIn Valyria, there was no object so plain that an alchemist could not make it wondrous.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may enchant the treasure of [recipient.GetFirstName], granting it new and greater potencies. Will you make it glow?"
  zz_valyria_magic_alchemy_magic.006.opt.a:0 "Make it glow!"
  zz_valyria_magic_alchemy_magic.006.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_alchemy_magic.006.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.006.name$"
  zz_valyria_magic_alchemy_magic.006.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ enchanting a treasure belonging to [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.006.toast.tt:0 "$zz_valyria_magic_alchemy_magic.006.toast.desc$"
  zz_mana_gain_extra_cost_400:0 "This Mystery will cost an additional 400 [drops_of_power]."
  zz_valyria_magic_alchemy_magic.006.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.006.name$"
  zz_valyria_magic_alchemy_magic.006.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_alchemy_magic.006.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.006.f.toast.desc$"


    ## Interaction
  zz_valyria_magic_alchemy_magic_007.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_pty$\n\nThe use of the arcane forces of [alchemy_magic|E] to transmute base matter into sacred relics.\n\nLesser alchemists spend their lives in pursuit of a single transmutation and never achieve it. The adepts of the Freehold regarded such transmutations as the first lessons of their art: the reshaping of base matter into whatever the world values most.\n\nThrough this mystery, the alchemist conjures objects of profound sanctity: relics, icons, and hallowed treasures whose very presence inspires devotion, granting their owner [piety|E].\n\nWhether such relics are truly holy is a matter for theologians. Their effect upon the faithful is undeniable."

  ##event
  zz_valyria_magic_alchemy_magic.007.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.007.name$"
  zz_valyria_magic_alchemy_magic.007.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A small, unremarkable bone rests in a dish of silver. As the incantation proceeds, it begins to glow with a soft, warm light, and a scent like incense fills the chamber.\n\nThe priests of the Freehold's many gods were often surprised by the frequency with which miraculous relics appeared in Valyrian temples. The alchemists were rarely surprised at all.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure sacred relics for [recipient.GetFirstName], granting [recipient.GetHerHim] the respect and devotion of the faithful. But is it right to manufacture holiness?"
  zz_valyria_magic_alchemy_magic.007.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA cup of plain clay is set within a circle of incense burners, and the alchemist fills it with water drawn from a temple well. As the incantation proceeds, the cup grows warm and the water within it glows, and the faint sound of distant singing fills the chamber.\n\nThe priests of the Freehold were often grateful for the relics that its alchemists provided, and seldom asked where they came from.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure sacred relics for [recipient.GetFirstName], granting [recipient.GetHerHim] the respect and devotion of the faithful. But is it right to manufacture holiness?"
  zz_valyria_magic_alchemy_magic.007.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA strip of plain linen is laid upon the workbench and anointed with sacred oils, one after another. As the last is poured, the linen begins to shimmer, and those who look upon it feel a sudden and unaccountable sense of reverence.\n\nIn Valyria, holiness was a substance like any other, and the alchemists knew how to refine it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure sacred relics for [recipient.GetFirstName], granting [recipient.GetHerHim] the respect and devotion of the faithful. But is it right to manufacture holiness?"
  zz_valyria_magic_alchemy_magic.007.opt.a:0 "Conjure holy relics!"
  zz_valyria_magic_alchemy_magic.007.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.007.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.007.name$"
  zz_valyria_magic_alchemy_magic.007.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ conjuring sacred relics for [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.007.toast.tt:0 "$zz_valyria_magic_alchemy_magic.007.toast.desc$"

  zz_valyria_magic_alchemy_magic.007.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.007.name$"
  zz_valyria_magic_alchemy_magic.007.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_alchemy_magic.007.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.007.f.toast.desc$"


    ## Interaction
  zz_valyria_magic_alchemy_magic_008.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_prs$\n\nThe use of the arcane forces of [alchemy_magic|E] to transmute base matter into wondrous regalia.\n\nLesser alchemists spend their lives in pursuit of a single transmutation and never achieve it. The adepts of the Freehold regarded such transmutations as the first lessons of their art: the reshaping of base matter into whatever the world values most.\n\nThrough this mystery, the alchemist conjures objects of dazzling grandeur: regalia, triumphal treasures, and symbols of greatness that fill all who behold them with awe, granting their owner personal [prestige|E].\n\nSuch treasures are often more impressive than any made by human hands, which is precisely the point."

  ##event
  zz_valyria_magic_alchemy_magic.008.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.008.name$"
  zz_valyria_magic_alchemy_magic.008.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A crown of plain iron rests in the largest crucible. As the incantation proceeds, it begins to gleam, then to sparkle, as gemstones bloom upon its surface like flowers.\n\nThe dragonlords of the Freehold dressed themselves in treasures so magnificent that the kings of other lands felt like beggars in their presence.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure wondrous regalia for [recipient.GetFirstName], increasing [recipient.GetHerHis] renown among the great and powerful. Will you make them magnificent?"
  zz_valyria_magic_alchemy_magic.008.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA plain iron goblet is set in a bath of quicksilver and gold leaf, and the alchemist stirs the bath slowly with a rod of crystal. As the incantation proceeds, the goblet grows heavier and brighter, until it seems carved from a single great jewel.\n\nThe dragonlords displayed their wealth as a weapon, and their alchemists forged it for them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure wondrous regalia for [recipient.GetFirstName], increasing [recipient.GetHerHis] renown among the great and powerful. Will you make them magnificent?"
  zz_valyria_magic_alchemy_magic.008.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA rough, uncut stone is held in a pair of silver tongs over a blue flame. As the alchemist speaks, the stone's dull surface begins to clear, and facets appear upon it, catching the light and throwing it in brilliant shards across the room.\n\nIn the courts of the Freehold, splendour was a form of power, and few lords could compete with the treasures of Valyria.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure wondrous regalia for [recipient.GetFirstName], increasing [recipient.GetHerHis] renown among the great and powerful. Will you make them magnificent?"
  zz_valyria_magic_alchemy_magic.008.opt.a:0 "Conjure glorious treasures!"
  zz_valyria_magic_alchemy_magic.008.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.008.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.008.name$"
  zz_valyria_magic_alchemy_magic.008.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ conjuring wondrous regalia that increase the prestige of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.008.toast.tt:0 "$zz_valyria_magic_alchemy_magic.008.toast.desc$"

  zz_valyria_magic_alchemy_magic.008.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.008.name$"
  zz_valyria_magic_alchemy_magic.008.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_alchemy_magic.008.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.008.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_alchemy_magic_009.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_rnw$\n\nThe use of the arcane forces of [alchemy_magic|E] to transmute base matter into storied heirlooms.\n\nLesser alchemists spend their lives in pursuit of a single transmutation and never achieve it. The adepts of the Freehold regarded such transmutations as the first lessons of their art: the reshaping of base matter into whatever the world values most.\n\nThrough this mystery, the alchemist conjures objects of ancestral weight: heirlooms, storied treasures, and icons of legacy that seem to have been in the family for generations, adding to the [dynasty_prestige|E] of the chosen subject's dynasty.\n\nFamilies that possess such heirlooms are respected for their antiquity, even when that antiquity is entirely conjured."

  ##event
  zz_valyria_magic_alchemy_magic.009.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.009.name$"
  zz_valyria_magic_alchemy_magic.009.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A plain wooden box rests within a circle of glyphs. As the incantation proceeds, it ages before the watchers' eyes, its wood darkening and its fittings tarnishing until it seems a thousand years old.\n\nMore than one great house of the Freehold owed its ancient lineage to an alchemist who could make yesterday's trinket into a relic of an age long forgotten.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure storied heirlooms for [recipient.GetFirstName], adding to the renown of [recipient.GetHerHis] dynasty. Will you forge a legacy?"
  zz_valyria_magic_alchemy_magic.009.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA newly forged sword is laid upon a bed of ash and buried in it, and the alchemist pours a dark, smoky liquid over the ash until it is soaked. When the sword is drawn out again, its blade is notched and its hilt worn smooth, as though carried by a hundred generations of heroes.\n\nIn Valyria, a family's history could be made as well as inherited, and the alchemists made a great deal of it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure storied heirlooms for [recipient.GetFirstName], adding to the renown of [recipient.GetHerHis] dynasty. Will you forge a legacy?"
  zz_valyria_magic_alchemy_magic.009.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA freshly written scroll is held over a smouldering brazier of herbs, and the alchemist speaks the words of age and memory. The parchment yellows and curls, its ink fading to brown, until it looks as though it had been written before the Freehold was founded.\n\nThe great houses of Valyria boasted of ancient lineages, and their alchemists provided the evidence.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure storied heirlooms for [recipient.GetFirstName], adding to the renown of [recipient.GetHerHis] dynasty. Will you forge a legacy?"
  zz_valyria_magic_alchemy_magic.009.opt.a:0 "Conjure icons of legacy!"
  zz_valyria_magic_alchemy_magic.009.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.009.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.009.name$"
  zz_valyria_magic_alchemy_magic.009.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ conjuring storied heirlooms that add to the renown of [recipient.GetFirstName]'s dynasty."
  zz_valyria_magic_alchemy_magic.009.toast.tt:0 "$zz_valyria_magic_alchemy_magic.009.toast.desc$"

  zz_valyria_magic_alchemy_magic.009.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.009.name$"
  zz_valyria_magic_alchemy_magic.009.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_alchemy_magic.009.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.009.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_alchemy_magic_010.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_yng$\n\nThe use of the arcane forces of [alchemy_magic|E] to transmute away years of a chosen subject's age. The stronger the caster, the more years may be taken, and the caster chooses how many.\n\nTime is a substance like any other, the alchemists of the Freehold taught, and a substance may be extracted. Through this mystery, years of age are drawn out of the chosen subject's body and distilled into nothing.\n\nThe subject grows younger in body. The effect is permanent, and may be repeated, though each repetition is said to grow more difficult.\n\nThe archons of the Freehold were famously long-lived. Some lived so long that their own grandchildren came to resent them."

  ##event
  zz_valyria_magic_alchemy_magic.010.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.010.name$"
  zz_valyria_magic_alchemy_magic.010.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. An hourglass rests at the centre of the circle, and as the incantation proceeds, its sand begins to flow upward, grain by grain, back into the upper chamber.\n\nThe Valyrians called this the Unwinding, and it was among the most jealously guarded of their alchemical secrets. Many a war was fought over a single practitioner who knew it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw years of age out of [recipient.GetFirstName], leaving them younger in body. Choose the age they will be. Is it right to steal back time from the world?"
  zz_valyria_magic_alchemy_magic.010.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA single grey hair, plucked from the subject's head, is laid in a dish of clear liquid. As the alchemist speaks, the hair darkens slowly from root to tip, until it is as black and glossy as it was in the subject's youth.\n\nThe Unwinding was among the Freehold's most coveted secrets. Lords would trade provinces for a single treatment.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw years of age out of [recipient.GetFirstName], leaving them younger in body. Choose the age they will be. Is it right to steal back time from the world?"
  zz_valyria_magic_alchemy_magic.010.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA candle that has burned half away is set within a circle of glyphs, and the alchemist relights it. As the incantation proceeds, the flame burns not down but up, and the wax rises to meet it, until the candle stands as tall as the day it was made.\n\nIn Valyria, it was said that time was only another substance, and that a skilled alchemist could pour it back into the flask.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw years of age out of [recipient.GetFirstName], leaving them younger in body. Choose the age they will be. Is it right to steal back time from the world?"
  zz_valyria_magic_alchemy_magic.010.opt.a:0 "Unwind the years!"
  zz_valyria_magic_alchemy_magic.010.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_alchemy_magic.010.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.010.name$"
  zz_valyria_magic_alchemy_magic.010.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ drawing years of age out of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.010.toast.tt:0 "$zz_valyria_magic_alchemy_magic.010.toast.desc$"

  zz_valyria_magic_alchemy_magic.010.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.010.name$"
  zz_valyria_magic_alchemy_magic.010.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_alchemy_magic.010.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.010.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_alchemy_magic_011.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_old$\n\nThe use of the arcane forces of [alchemy_magic|E] to add years to a chosen subject's age. The stronger the caster, the more years may be added, and the caster chooses how many.\n\nWhat can be drawn out can also be poured in. Through this mystery, years of age are distilled and forced into the chosen subject's body, leaving them older in an instant.\n\nSome use it to hasten a child into adulthood. Others use it as a weapon, ageing their enemies year by year until there is nothing left of them.\n\nThe Valyrians called this the Winding, and considered it a punishment fit only for traitors."

  ##event
  zz_valyria_magic_alchemy_magic.011.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.011.name$"
  zz_valyria_magic_alchemy_magic.011.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. An hourglass rests at the centre of the circle, and as the incantation proceeds, its sand pours down far faster than it should, a year's worth of grains falling in a single heartbeat.\n\nIn the courts of the Freehold, an enemy might be punished not with death but with time, aged a year for every insult until they were too frail to be dangerous.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may force years of age upon [recipient.GetFirstName], leaving them older in body. Choose the age they will be. Will you hasten the passing of their years?"
  zz_valyria_magic_alchemy_magic.011.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA fresh flower is set in a vase of water at the centre of the circle. As the alchemist speaks, its petals curl and brown, its stem droops, and within moments it has withered and died, as though a whole season had passed in a breath.\n\nIn the courts of the Freehold, there were punishments worse than death, and the alchemists were their most inventive executioners.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may force years of age upon [recipient.GetFirstName], leaving them older in body. Choose the age they will be. Will you hasten the passing of their years?"
  zz_valyria_magic_alchemy_magic.011.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA polished bronze mirror is held up before the circle, and the alchemist breathes upon it, speaking the words of years. The reflection in the mirror grows older, its lines deepening and its hair greying, and somewhere far away, the subject feels a sudden, heavy weariness.\n\nIn Valyria, time could be given as well as taken. It was seldom given as a gift.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may force years of age upon [recipient.GetFirstName], leaving them older in body. Choose the age they will be. Will you hasten the passing of their years?"
  zz_valyria_magic_alchemy_magic.011.opt.a:0 "Wind on the years!"
  zz_valyria_magic_alchemy_magic.011.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_alchemy_magic.011.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.011.name$"
  zz_valyria_magic_alchemy_magic.011.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ forcing years of age upon [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.011.toast.tt:0 "$zz_valyria_magic_alchemy_magic.011.toast.desc$"

  zz_valyria_magic_alchemy_magic.011.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.011.name$"
  zz_valyria_magic_alchemy_magic.011.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_alchemy_magic.011.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.011.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_alchemy_magic_012.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_kne$\n\nThe use of the arcane forces of [alchemy_magic|E] to strengthen the arms and armour of a chosen subject's knights.\n\nThrough this mystery, the steel carried by the chosen subject's knights is refined at the most fundamental level, made lighter, harder, and keener than the work of any mortal smith.\n\nThe subject's [knight|E]s fight with far greater effectiveness, their weapons cutting deeper and their armour turning blows that would otherwise have felled them.\n\nThe champions of the Freehold rode to war in arms of such quality that the knights of other lands seemed to be dressed in tin."

  ##event
  zz_valyria_magic_alchemy_magic.012.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.012.name$"
  zz_valyria_magic_alchemy_magic.012.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A sword lies within the circle, and as the elixirs are poured along its length, the steel ripples and darkens, its edge growing so fine it seems to vanish when viewed side-on.\n\nThe armourer-alchemists of Valyria worked alongside its smiths, refining every blade and plate before it was given to the Freehold's champions.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may refine the arms of [recipient.GetFirstName]'s knights, making them far deadlier in battle. Will you temper their steel?"
  zz_valyria_magic_alchemy_magic.012.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA knight's helm is set upon a stand of iron, and the alchemist pours a dark, viscous oil over it until it gleams. As the oil soaks into the metal, the helm seems to grow lighter, its lines sharper, its steel harder than any natural forge could make it.\n\nThe champions of the Freehold fought in armour that had passed through the alchemists' workshops before ever it saw a battlefield.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may refine the arms of [recipient.GetFirstName]'s knights, making them far deadlier in battle. Will you temper their steel?"
  zz_valyria_magic_alchemy_magic.012.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA whetstone of grey slate is dipped in a silver solution and drawn along the edge of a lance. Each stroke leaves a trail of faint light upon the steel, and by the time the alchemist is finished, the lance seems to hum with eagerness.\n\nIn Valyria, a knight's strength was measured not only in their arm, but in the work of the alchemists who equipped them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may refine the arms of [recipient.GetFirstName]'s knights, making them far deadlier in battle. Will you temper their steel?"
  zz_valyria_magic_alchemy_magic.012.opt.a:0 "Empower their arms!"
  zz_valyria_magic_alchemy_magic.012.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.012.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.012.name$"
  zz_valyria_magic_alchemy_magic.012.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ refining the arms and armour of the knights of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.012.toast.tt:0 "$zz_valyria_magic_alchemy_magic.012.toast.desc$"

  zz_valyria_magic_alchemy_magic.012.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.012.name$"
  zz_valyria_magic_alchemy_magic.012.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_alchemy_magic.012.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.012.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_alchemy_magic_013.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_maac$\n\nThe use of the arcane forces of [alchemy_magic|E] to increase the number of men-at-arms regiments a chosen subject can raise.\n\nThrough this mystery, the essence of soldiery is distilled and bound to the chosen subject, drawing professional warriors to their service in numbers their realm could not ordinarily support.\n\nThe subject can raise more regiments of [men_at_arms|E] than their station would ordinarily allow.\n\nThe legions of the Freehold seemed to grow from nothing. Their enemies never understood that this was, in a sense, exactly true."

  ##event
  zz_valyria_magic_alchemy_magic.013.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.013.name$"
  zz_valyria_magic_alchemy_magic.013.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A row of tiny lead soldiers stands within the circle, and as the incantation proceeds, they seem to multiply, new ranks appearing behind the old until the circle can hold no more.\n\nThe war-alchemists of Valyria bound this working to the commanders of the Freehold's legions, so that no army of the empire ever lacked for soldiers.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw more men-at-arms to the service of [recipient.GetFirstName], allowing them to raise more regiments. Will you swell their ranks?"
  zz_valyria_magic_alchemy_magic.013.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA muster roll, its columns half empty, is laid open upon the workbench, and the alchemist sprinkles a fine silver dust across its pages. As the incantation proceeds, new names appear in the empty columns, written in a careful hand that is not the alchemist's own.\n\nThe legions of the Freehold never lacked for soldiers. Where men were short, alchemy made up the difference.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw more men-at-arms to the service of [recipient.GetFirstName], allowing them to raise more regiments. Will you swell their ranks?"
  zz_valyria_magic_alchemy_magic.013.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA single iron spearhead is dropped into a crucible of quicksilver and gold. As the alchemist stirs, the spearhead divides, and divides again, until the crucible is filled with a forest of gleaming points, each identical to the first.\n\nIn Valyria, an army was a substance like any other, and the war-alchemists knew how to multiply it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw more men-at-arms to the service of [recipient.GetFirstName], allowing them to raise more regiments. Will you swell their ranks?"
  zz_valyria_magic_alchemy_magic.013.opt.a:0 "Raise more regiments!"
  zz_valyria_magic_alchemy_magic.013.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.013.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.013.name$"
  zz_valyria_magic_alchemy_magic.013.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ drawing more men-at-arms to the service of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.013.toast.tt:0 "$zz_valyria_magic_alchemy_magic.013.toast.desc$"

  zz_valyria_magic_alchemy_magic.013.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.013.name$"
  zz_valyria_magic_alchemy_magic.013.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_alchemy_magic.013.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.013.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_alchemy_magic_014.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_maas$\n\nThe use of the arcane forces of [alchemy_magic|E] to enlarge the men-at-arms regiments of a chosen subject.\n\nThrough this mystery, the companies of the chosen subject's army are made to swell, as soldiers who would have served elsewhere are drawn into their ranks.\n\nEach regiment of [men_at_arms|E] the subject raises is larger than it would ordinarily be.\n\nThe companies of the Freehold's legions were said to be twice the size of those of any other army. This was the reason."

  ##event
  zz_valyria_magic_alchemy_magic.014.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.014.name$"
  zz_valyria_magic_alchemy_magic.014.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A single banner rests within the circle, and as the incantation proceeds, it seems to grow heavier and broader, as though more and more hands were reaching out to hold it.\n\nThe quartermasters of the Freehold worked hand in hand with its alchemists, so that every company that marched beneath the dragons marched at full strength and more.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may enlarge the regiments of [recipient.GetFirstName], so that each company they raise is greater in number. Will you swell their companies?"
  zz_valyria_magic_alchemy_magic.014.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA drum of stretched hide is set at the centre of the circle, and the alchemist strikes it once with a stick dipped in a red tincture. The beat echoes far longer than it should, and with each echo the sound grows deeper and fuller, as though more and more drums were joining in.\n\nThe companies of the Freehold always marched at full strength, and often at more than full strength. Its alchemists saw to that.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may enlarge the regiments of [recipient.GetFirstName], so that each company they raise is greater in number. Will you swell their companies?"
  zz_valyria_magic_alchemy_magic.014.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA soldier's cloak, cut to the pattern of a company's livery, is laid out upon the workbench and dusted with a fine golden powder. As the alchemist speaks, the cloak seems to grow broader and heavier, as though it were being worn by a hundred men at once.\n\nIn Valyria, every company was made larger in the alchemist's workshop before it ever marched to war.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may enlarge the regiments of [recipient.GetFirstName], so that each company they raise is greater in number. Will you swell their companies?"
  zz_valyria_magic_alchemy_magic.014.opt.a:0 "Enlarge their companies!"
  zz_valyria_magic_alchemy_magic.014.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.014.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.014.name$"
  zz_valyria_magic_alchemy_magic.014.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ enlarging the regiments of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.014.toast.tt:0 "$zz_valyria_magic_alchemy_magic.014.toast.desc$"

  zz_valyria_magic_alchemy_magic.014.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.014.name$"
