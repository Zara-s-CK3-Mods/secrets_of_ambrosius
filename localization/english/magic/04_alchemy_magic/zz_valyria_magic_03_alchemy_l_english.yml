  zz_valyria_magic_alchemy_magic.019.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.019.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_alchemy_magic_020.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_vsl$\n\nThe use of the arcane forces of [alchemy_magic|E] to refine a chosen ruler's capacity to command many vassals.\n\nA ruler can only keep so many vassals before their loyalty frays and their oversight fails. Through this mystery, the essence of authority is distilled and refined within the chosen subject, so that their command extends over far more lords than would ordinarily be possible.\n\nThe subject's [vassal_limit|E] increases considerably.\n\nThe archons of the Freehold commanded great webs of subordinate lords, each bound to them by oaths that alchemy made stronger than any mortal promise."

  ##event
  zz_valyria_magic_alchemy_magic.020.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.020.name$"
  zz_valyria_magic_alchemy_magic.020.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist's tools are laid out in careful order: crucibles, alembics, and vessels of crystal etched with Valyrian glyphs. A ring of tiny keys rests within the circle, and as the elixirs are poured over it, more and more keys appear upon it, each bearing the device of a different lord.\n\nThe greatest adepts of lost Valyria understood that authority itself could be distilled, strengthened, and refined, and the archons of the Freehold were the proof of their art.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may refine the essence of rulership within [recipient.GetFirstName], so that [recipient.GetHerHis] authority extends over a far greater number of vassals. Will you strengthen their command?"
  zz_valyria_magic_alchemy_magic.020.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA heavy signet ring is set upon a pedestal of black stone, and the alchemist pours a gleaming liquid over it. As it drips down, it forms new rings upon the stone, each bearing a different device, each the seal of a lord who might be bound in service.\n\nThe archons of the Freehold ruled over countless vassals, and their alchemists made sure that none of them ever stood alone.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may refine the essence of rulership within [recipient.GetFirstName], so that [recipient.GetHerHis] authority extends over a far greater number of vassals. Will you strengthen their command?"
  zz_valyria_magic_alchemy_magic.020.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA long chain of linked iron is laid in a spiral upon the workbench, and the alchemist anoints each link with a bright red oil. As the incantation proceeds, the chain lengthens, new links forming at its end, until it reaches all the way across the room.\n\nIn Valyria, authority was a substance that could be refined, and a ruler who held more of it could bind more lords to their service.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may refine the essence of rulership within [recipient.GetFirstName], so that [recipient.GetHerHis] authority extends over a far greater number of vassals. Will you strengthen their command?"
  zz_valyria_magic_alchemy_magic.020.opt.a:0 "Refine the essence of rulership!"
  zz_valyria_magic_alchemy_magic.020.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_alchemy_magic.020.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.020.name$"
  zz_valyria_magic_alchemy_magic.020.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ refining the essence of rulership within [recipient.GetFirstName], allowing them to command more vassals."
  zz_valyria_magic_alchemy_magic.020.toast.tt:0 "$zz_valyria_magic_alchemy_magic.020.toast.desc$"

  zz_valyria_magic_alchemy_magic.020.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.020.name$"
  zz_valyria_magic_alchemy_magic.020.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_alchemy_magic.020.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.020.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_alchemy_magic_021.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_hom$\n\nThe use of the arcane forces of [alchemy_magic|E] to distil a homunculus from a preserved pattern of living essence.\n\nThrough this mystery, the alchemist shapes an artificial being from preserved genetic patterns, creating a homunculus in the image of the chosen bloodline.\n\nThe construct emerges as a child, possessing the exact inherited qualities of the pattern it was made from. Raised and educated like any other child, it may grow to be indistinguishable from one born of woman.\n\nThe ancient alchemists of Valyria believed that flesh itself was but another substance to be refined. The homunculi of the Freehold were their proof, and their most disturbing legacy."

  ##event
  zz_valyria_magic_alchemy_magic.021.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.021.name$"
  zz_valyria_magic_alchemy_magic.021.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nWithin crystal vessels and engraved alchemical circles rests the preserved pattern of living essence: distilled, measured, and reduced to its most fundamental principles. As the incantation proceeds, a pale shape begins to form within the largest vessel, curled and small, its features slowly sharpening.\n\nThe ancient alchemists of Valyria believed that flesh itself was but another substance to be refined. Their homunculi served the Freehold as heirs, servants, and spies, and some, it is said, were never discovered at all.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may distil new life from the preserved essence and give it into the keeping of [recipient.GetFirstName]. But what manner of soul will dwell within a body made in a flask?"
  zz_valyria_magic_alchemy_magic.021.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA great flask of clouded glass stands at the centre of the workbench, filled with a pale and milky fluid. As the alchemist works, the fluid thickens and darkens, and something within it begins to turn, slowly, as though stirring in sleep.\n\nThe homunculi of the Freehold were the alchemists' greatest triumph, and their greatest secret. Few who met one ever guessed what it was.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may distil new life from the preserved essence and give it into the keeping of [recipient.GetFirstName]. But what manner of soul will dwell within a body made in a flask?"
  zz_valyria_magic_alchemy_magic.021.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nThe alchemist draws a careful sigil upon a slab of polished stone, and lays upon it a vessel filled with distilled essence. As the incantation proceeds, the essence rises from the vessel in a slow mist and settles upon the sigil, and within the mist, a small shape begins to take form.\n\nIn Valyria, life was a recipe, and the alchemists who knew it were both honoured and feared.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may distil new life from the preserved essence and give it into the keeping of [recipient.GetFirstName]. But what manner of soul will dwell within a body made in a flask?"
  zz_valyria_magic_alchemy_magic.021.opt.a:0 "Let new life be distilled!"
  zz_valyria_magic_alchemy_magic.021.opt.z:0 "No, do not cast!"

  alchemy_magic_clone_01:0 "Exact Copy!"
  alchemy_magic_clone_02:0 "Sex-Switched Copy!"


  ## Spell Toast
  zz_valyria_magic_alchemy_magic.021.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.021.name$"
  zz_valyria_magic_alchemy_magic.021.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ distilling a homunculus from preserved living essence."
  zz_valyria_magic_alchemy_magic.021.toast.tt:0 "$zz_valyria_magic_alchemy_magic.021.toast.desc$"

  zz_valyria_magic_alchemy_magic.021.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.021.name$"
  zz_valyria_magic_alchemy_magic.021.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_alchemy_magic.021.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.021.f.toast.desc$"

  ## Alchemy Magic - Mysteries of Transmutation
  zz_valyria_magic_alchemy_magic_022.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tp$\n$zz_prodg$\n\nThe use of the arcane forces of [alchemy_magic|E] to make a chosen province bring forth more of a chosen [trade_good|E].\n\nThe alchemists of the Freehold taught that every substance is but one shape of a single prime matter, and that what the earth yields is only a habit of the earth. Through this mystery the alchemist chooses what the land shall make: timber thickens in the forests, ore swells in the seams of the hills, the looms and kilns of the province turn out more than the hands that work them should allow.\n\nThe chosen [trade_good|E] is permanently produced in greater quantity, more so the greater the alchemist's skill. The land does not forget what it has been taught, and it never settles back into its old habits."
  zz_valyria_magic_alchemy_magic.022.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.022.name$"
  zz_valyria_magic_alchemy_magic.022.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA map of the province is pinned beneath a sheet of glass, and on the glass the alchemist has traced the sigils of the prime matter in quicksilver. Samples of the land's yield are set at its corners: a splinter of wood, a pinch of salt, a twist of wool, a shard of ore. The crucible at the centre waits empty, for the alchemist has yet to name what the land shall make.\n\nThe old texts warn that the earth answers only one question at a time. Choose the province to be changed, and the [trade_good|E] it shall bring forth.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you work the transmutation upon the land, or let the quicksilver run back into its flask?"
  zz_valyria_magic_alchemy_magic.022.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA row of small crucibles stands upon the workbench, each holding a sample of something the land might yield: a sliver of timber, a pinch of dye, a fleck of ore, a grain of spice. A map of the province lies beneath them, and the alchemist's hand hovers over it, waiting.\n\nThe old texts say that every land holds the seeds of many things, and that the alchemist need only choose which to wake. Choose the province to be changed, and the [trade_good|E] it shall bring forth.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you work the transmutation upon the land, or let the quicksilver run back into its flask?"
  zz_valyria_magic_alchemy_magic.022.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA great flask of prime matter, grey and formless, bubbles slowly over a low flame. The alchemist has marked a single province upon the map before it, and set out the tools to draw from the flask whatever the land should yield.\n\nThe land-alchemists of the Freehold changed what the provinces of the empire produced as easily as a farmer changes his crop. Choose the province to be changed, and the [trade_good|E] it shall bring forth.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you work the transmutation upon the land, or let the quicksilver run back into its flask?"
  zz_valyria_magic_alchemy_magic.022.opt.a:0 "Let the land bring forth what I ask!"
  zz_valyria_magic_alchemy_magic.022.opt.z:0 "No, do not cast!"
  zz_valyria_magic_alchemy_magic.022.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.022.name$"
  zz_valyria_magic_alchemy_magic.022.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ transmuting the land of [target.GetName] to bring forth new riches."
  zz_valyria_magic_alchemy_magic.022.toast.tt:0 "$zz_valyria_magic_alchemy_magic.022.toast.desc$"
  zz_valyria_magic_alchemy_magic.022.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.022.name$"
  zz_valyria_magic_alchemy_magic.022.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_alchemy_magic.022.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.022.f.toast.desc$"

  ## Alchemy Magic - Mysteries of Expansion
  zz_valyria_magic_alchemy_magic_023.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tp$\n$zz_hsize$\n\nThe use of the arcane forces of [alchemy_magic|E] to make a chosen [holding|E] grow beyond its natural bounds.\n\nThe alchemists of the Freehold held that a settlement, like a living thing, has a natural size that it strives towards: so many mouths as its fields can feed, so many roofs as its walls can shelter. Through this mystery that measure is rewritten. Wells run deeper, fields bear more, walls seem to stand a little further apart each spring, and the holding swells to fill the new bounds the alchemist has set for it.\n\nThe [holding|E] grows at once, by one point of [settlement_size|E] for every level of the alchemist's skill, a full size level for a master. The land does not forget its old measure, though, and over many years the holding slowly shrinks back towards what it can bear unaided."
  zz_valyria_magic_alchemy_magic.023.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.023.name$"
  zz_valyria_magic_alchemy_magic.023.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA plan of the settlement has been drawn in silver ink upon vellum, every wall and well and field marked with care. The alchemist sets a ring of bronze upon it and pours a measure of quicksilver within, and slowly, as the incantation is spoken, the ring begins to widen, and the silver lines beneath it stretch and spread to fill it.\n\nWhat is drawn here, the old texts say, the land will remember.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you widen the bounds of the holding, or let the ring close again?"
  zz_valyria_magic_alchemy_magic.023.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA model of the settlement, carved in soft white wax, stands at the centre of the workbench. The alchemist sets a ring of silver about it and warms the ring with a slow flame, and as the wax softens, the model spreads outward to fill the ring, its streets lengthening and its walls drawing back.\n\nThe builder-alchemists of the Freehold could make a town into a city in a single season. The land would remember, for a while.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you widen the bounds of the holding, or let the ring close again?"
  zz_valyria_magic_alchemy_magic.023.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA handful of earth from the settlement's fields is sealed in a crystal jar and set upon the workbench. The alchemist pours in a measure of golden liquid, and the earth begins to stir and swell, rising up the sides of the jar until it presses against the lid.\n\nIn Valyria, it was said that a settlement could be made to grow as surely as a crop, if only the right elixir were poured upon its soil.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you widen the bounds of the holding, or let the ring close again?"
  zz_valyria_magic_alchemy_magic.023.opt.a:0 "Let the holding grow!"
  zz_valyria_magic_alchemy_magic.023.opt.z:0 "No, do not cast!"
  zz_valyria_magic_alchemy_magic.023.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.023.name$"
  zz_valyria_magic_alchemy_magic.023.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ widening the bounds of [target.GetName]."
  zz_valyria_magic_alchemy_magic.023.toast.tt:0 "$zz_valyria_magic_alchemy_magic.023.toast.desc$"
  zz_valyria_magic_alchemy_magic.023.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.023.name$"
  zz_valyria_magic_alchemy_magic.023.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_alchemy_magic.023.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.023.f.toast.desc$"
  ## Alchemy Magic - Mystery of Mercantile Reach
  zz_valyria_magic_alchemy_magic_027.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_tpl$\n\nThe use of the arcane forces of [alchemy_magic|E] to bind a chosen subject's name to far-off markets, letting them hold more [trade_posts|E] than any merchant could otherwise manage.\n\nThe alchemists of the Freehold sealed their trading charters with a wax of their own making, and it was said that no factor who broke such a seal ever prospered. Through this mystery the same wax binds distant agents to the subject, and their reach stretches across the map.\n\nThe subject can permanently hold up to three more [trade_posts|E], more the greater the alchemist's skill."
  zz_valyria_magic_alchemy_magic.027.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.027.name$"
  zz_valyria_magic_alchemy_magic.027.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA stick of dark red wax is warmed over a blue flame until it runs like blood. The alchemist presses the subject's seal into it, once for each distant market named in the incantation, and the impressions glow faintly as they cool.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you seal the charters?"
  zz_valyria_magic_alchemy_magic.027.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA merchant's ledger is laid open upon the workbench, and the alchemist writes the names of distant markets in its margins with a quill dipped in gleaming ink. As each name is written, a tiny mark appears beside it, like the seal of a trading house that has agreed to deal.\n\nThe merchant-alchemists of the Freehold held posts in markets across the world, and none could ever say how they had come by them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you seal the charters?"
  zz_valyria_magic_alchemy_magic.027.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA small brass compass is set upon a map of the known world, and the alchemist anoints its needle with a single drop of quicksilver. The needle spins, then stops, then spins again, each time pointing to a different market, and wherever it points, a faint red mark appears upon the map.\n\nIn Valyria, a merchant's reach was measured in the trade posts they held. The alchemists could stretch that reach across the world.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you seal the charters?"
  zz_valyria_magic_alchemy_magic.027.opt.a:0 "Seal the charters!"
  zz_valyria_magic_alchemy_magic.027.opt.z:0 "No, do not cast!"
  zz_valyria_magic_alchemy_magic.027.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.027.name$"
  zz_valyria_magic_alchemy_magic.027.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ sealing distant charters in the name of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.027.toast.tt:0 "$zz_valyria_magic_alchemy_magic.027.toast.desc$"
  zz_valyria_magic_alchemy_magic.027.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.027.name$"
  zz_valyria_magic_alchemy_magic.027.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_alchemy_magic.027.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.027.f.toast.desc$"
  ## Alchemy Magic - Mystery of Bountiful Caravans
  zz_valyria_magic_alchemy_magic_028.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_trcap$\n\nThe use of the arcane forces of [alchemy_magic|E] upon every [trade_route|E] a chosen subject owns, so that their caravans and holds carry more than they should.\n\nThrough this mystery the packs and barrels of the subject's merchants are worked with quiet transmutations: sacks hold a little more than their size, casks never quite run dry, and goods that should spoil on the road arrive fresh.\n\nEvery [trade_route|E] the subject owns, now and in the future, permanently gains capacity, more the greater the alchemist's skill."
  zz_valyria_magic_alchemy_magic.028.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.028.name$"
  zz_valyria_magic_alchemy_magic.028.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA single empty sack from each of the subject's caravans has been gathered on the workbench. The alchemist dusts each with a fine silver powder and folds it closed, and though nothing has been put inside, each sack grows heavy in the hand.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you fill the caravans?"
  zz_valyria_magic_alchemy_magic.028.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA wooden crate, of the kind used to carry goods along the trade roads, is set upon the workbench and anointed inside with a pale silver oil. The alchemist closes its lid, and when it is opened again, the empty space within seems somehow deeper than it was.\n\nThe caravans of the Freehold carried more than any caravan should, and arrived with their goods as fresh as the day they set out.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you fill the caravans?"
  zz_valyria_magic_alchemy_magic.028.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_alchemy_magic')]\n\nA merchant's scale is balanced upon the workbench, and the alchemist pours a fine grey powder into one of its pans. The powder weighs nothing, and yet the pan sinks, and the alchemist smiles, for the trade routes of the subject will now carry far more than their size allows.\n\nIn Valyria, it was said that a single caravan could carry the wealth of a province, if its packs had been touched by alchemy.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you fill the caravans?"
  zz_valyria_magic_alchemy_magic.028.opt.a:0 "Let the caravans carry more!"
  zz_valyria_magic_alchemy_magic.028.opt.z:0 "No, do not cast!"
  zz_valyria_magic_alchemy_magic.028.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.028.name$"
  zz_valyria_magic_alchemy_magic.028.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ swelling the caravans of [recipient.GetFirstName]."
  zz_valyria_magic_alchemy_magic.028.toast.tt:0 "$zz_valyria_magic_alchemy_magic.028.toast.desc$"
