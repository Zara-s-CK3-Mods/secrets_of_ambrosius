l_english:
  zz_valyria_magic_further_education.desc.setting.1:0 "\n\nI work late into the night, the candles burning down to stubs, while the rest of the court sleeps."
  zz_valyria_magic_further_education.desc.setting.2:0 "\n\nPetitioners wait outside my solar, but they can wait a little longer. This matters more."
  zz_valyria_magic_further_education.desc.setting.3:0 "\n\nI have retreated to a garden pavilion, far from the clamour of court, with my scrolls weighted down against the breeze."
  zz_valyria_magic_further_education.desc.setting.4:0 "\n\nEven on the road, I study: my notes spread across my knees as the carriage jolts and sways."
  zz_valyria_magic_further_education.desc.setting.5:0 "\n\nMy physician has urged me to rest. I have ignored the advice, as I usually do."
  zz_valyria_magic_further_education.desc.setting.6:0 "\n\nA servant spilled ink across a week of my notes this morning. I begin again, more carefully."
  zz_valyria_magic_further_education.desc.setting.7:0 "\n\nRain hammers the shutters. It is the perfect weather for study: no one expects me anywhere."
  zz_valyria_magic_further_education.desc.setting.diligent:0 "\n\nI have set myself a strict regimen: so many hours of reading, so many of recitation, so many of practice. I will not deviate from it."
  zz_valyria_magic_further_education.desc.setting.lazy:0 "\n\nI had intended to begin at dawn. It is now well past noon, but I am beginning, which is surely what matters."
  zz_valyria_magic_further_education.desc.setting.patient:0 "\n\nThere is no hurrying this. The Valyrians spent centuries on what I am attempting; I can spare a few more weeks."
  zz_valyria_magic_further_education.desc.setting.impatient:0 "\n\nEvery hour of study feels like an hour stolen from actually wielding the power I seek."
  zz_valyria_magic_further_education.desc.setting.paranoid:0 "\n\nI keep my most important notes in cipher and under lock. Not everyone at court would be pleased to know what I study."
  zz_valyria_magic_further_education.desc.setting.arrogant:0 "\n\nLesser minds have spent their lives on this. I expect to master it rather more quickly."
  zz_valyria_magic_further_education.desc.focus.generalist_magic:0 "\n\nMy aim is the foundation of the art itself: the weaving and channelling of power that underlies every school."
  zz_valyria_magic_further_education.desc.focus.blood_magic:0 "\n\nEverything I learn, I weigh against the art of blood: what it costs, what it buys, and whose veins must pay."
  zz_valyria_magic_further_education.desc.focus.dream_magic:0 "\n\nI keep a journal beside my bed, and what I study by day I seek in my dreams by night."
  zz_valyria_magic_further_education.desc.focus.alchemy_magic:0 "\n\nMy workbench is crowded with alembics, and I test every principle I read against the stubborn reality of matter."
  zz_valyria_magic_further_education.desc.focus.shadow_magic:0 "\n\nI study with the shutters drawn. The things I seek to command are more at ease in the dark."
  zz_valyria_magic_further_education.desc.focus.air_magic:0 "\n\nI open the windows as I study, and the pages stir though there is no wind."
  zz_valyria_magic_further_education.desc.focus.fire_magic:0 "\n\nA brazier burns beside me at all hours. I find I understand the texts better with flame in the corner of my eye."
  zz_valyria_magic_further_education.desc.focus.water_magic:0 "\n\nA basin of still water sits on my desk. When my mind wanders, its surface ripples."
  zz_valyria_magic_further_education.desc.success.1:0 "\n\nI find myself grinning like a child, alone in my study."
  zz_valyria_magic_further_education.desc.success.2:0 "\n\nI write the insight down at once, and then again in a second place, lest I lose it."
  zz_valyria_magic_further_education.desc.success.3:0 "\n\nFor the first time in weeks, I sleep soundly."
  zz_valyria_magic_further_education.desc.success.4:0 "\n\nSomething in the air of the room seems to shift, as though the art itself has taken notice of me."
  zz_valyria_magic_further_education.desc.success.5:0 "\n\nI am tempted to tell someone, but who at court would understand?"
  zz_valyria_magic_further_education.desc.failure.1:0 "\n\nI hurl the offending scroll across the room, then go to retrieve it before it can be damaged."
  zz_valyria_magic_further_education.desc.failure.2:0 "\n\nMy head aches, and my eyes are raw from reading. Tomorrow I will try again."
  zz_valyria_magic_further_education.desc.failure.3:0 "\n\nI begin to wonder whether the old masters deliberately obscured their teachings."
  zz_valyria_magic_further_education.desc.failure.4:0 "\n\nA servant finds me staring at the wall and quietly withdraws."
  zz_valyria_magic_further_education.desc.failure.stubborn:0 "\n\nI refuse to accept this. I shall go over every word again, as many times as it takes."
  zz_valyria_magic_further_education.desc.failure.impatient:0 "\n\nThis is intolerable. Every wasted hour is a wound."
  zz_valyria_magic_further_education.desc.failure.humble:0 "\n\nPerhaps I was too sure of myself. The mysteries teach humility, if nothing else."
  zz_valyria_magic_further_education.desc.failure.arrogant:0 "\n\nThe fault, clearly, lies with whoever wrote these wretched texts."
  zz_valyria_magic_further_education.0001.desc.variant.1:0 "\n\nMy notes have grown into a small book of their own. I suspect future students would pay handsomely for it."
  zz_valyria_magic_further_education.0001.desc.variant.2:0 "\n\nThe court has noticed a change in me, though none of them can quite say what it is."
  zz_valyria_magic_further_education.0001.desc.variant.3:0 "\n\nI close the last scroll with a sense of quiet triumph. The work is done, and I am the better for it."
  zz_valyria_magic_further_education.0002.desc.variant.1:0 "\n\nWeeks of reading, reciting, and practice, and I am no closer to mastery than when I began."
  zz_valyria_magic_further_education.0002.desc.variant.2:0 "\n\nMy notes are a tangle of crossed-out lines and contradictions. Perhaps they will make sense to me in a year. Perhaps not."
  zz_valyria_magic_further_education.0002.desc.variant.3:0 "\n\nThe mysteries have closed their doors against me this time. They will not keep them closed for ever."
  zz_valyria_magic_further_education.0002.desc.variant.4:0 "\n\nI have learned only how much I do not know. That, I suppose, is a lesson of sorts."
  valyria_blood_sacrifices.1.desc.setting.1:0 "The rite begins at midnight, beneath a moon the colour of old bone.\n\n"
  valyria_blood_sacrifices.1.desc.setting.2:0 "A storm rolls in as the participants gather, and the first peal of thunder seems to answer the opening chant.\n\n"
  valyria_blood_sacrifices.1.desc.setting.3:0 "The pyre has been built in the old way: nine layers of wood, each soaked in oil and inscribed with the proper glyphs.\n\n"
  valyria_blood_sacrifices.1.desc.setting.4:0 "We gather in a cavern beneath the castle, where the torchlight barely reaches the walls and every whisper echoes.\n\n"
  valyria_blood_sacrifices.1.desc.setting.5:0 "The courtyard has been cleared and the gates barred. No one who has not been invited will witness what happens here tonight.\n\n"
  valyria_blood_sacrifices.1.desc.setting.6:0 "Incense hangs thick in the air, but it cannot quite mask the smell of the blood already spilled to prepare the circle.\n\n"
  valyria_blood_sacrifices.1.desc.mood.sadistic:0 "\n\nI find I am looking forward to this more than I should."
  valyria_blood_sacrifices.1.desc.mood.compassionate:0 "\n\nI tell myself that the power gained will spare far more lives than this one rite will cost. I almost believe it."
  valyria_blood_sacrifices.1.desc.mood.zealous:0 "\n\nThis is no mere sorcery; it is an offering, and the powers that receive it will remember who gave it."
  valyria_blood_sacrifices.1.desc.mood.cynical:0 "\n\nThe participants murmur prayers. I do not. The power is real; the gods are merely decoration."
  valyria_blood_sacrifices.1.desc.mood.callous:0 "\n\nA life is a life. What matters is what it buys."
  valyria_blood_sacrifices.1.desc.mood.paranoid:0 "\n\nI watch the faces of the participants closely. Any one of them might speak of this, if it served them."
  valyria_blood_sacrifices.1.desc.mood.craven:0 "\n\nMy hands are not quite steady as I take up the knife. I hope no one notices."
  valyria_blood_sacrifices.1.desc.mood.1:0 "\n\nThe participants fall silent as I step into the circle. Every eye is on me."
  valyria_blood_sacrifices.1.desc.mood.2:0 "\n\nSomewhere beyond the light, a dog begins to howl, and does not stop."
  valyria_blood_sacrifices.1.desc.mood.3:0 "\n\nThe flames lean towards the altar, as though hungry."
  zz_valyria_item_crafting_human_sacrifice.01.desc.setting.1:0 "The workshop is silent save for the hiss of the forge. My creation lies upon the anvil, waiting for the last ingredient.\n\n"
  zz_valyria_item_crafting_human_sacrifice.01.desc.setting.2:0 "Every other step of the working is complete. The glyphs are traced, the metal is ready, the words are prepared.\n\n"
  zz_valyria_item_crafting_human_sacrifice.01.desc.setting.3:0 "The texts were unambiguous: no lesser offering will bind the enchantment. It must be a life.\n\n"
  zz_valyria_item_crafting_human_sacrifice.01.desc.setting.4:0 "My apprentices have been sent away. What happens next, I would rather no one else saw.\n\n"
  zz_valyria_item_crafting_human_sacrifice.01.desc.mood.sadistic:0 "\n\nI confess I have been looking forward to this part."
  zz_valyria_item_crafting_human_sacrifice.01.desc.mood.compassionate:0 "\n\nI have delayed this moment as long as I could. There is no delaying it further."
  zz_valyria_item_crafting_human_sacrifice.01.desc.mood.zealous:0 "\n\nLet the gods witness that this is done in the service of something greater."
  zz_valyria_item_crafting_human_sacrifice.01.desc.mood.callous:0 "\n\nIt is a cost, like any other material. I will not pretend otherwise."
  zz_valyria_item_crafting_human_sacrifice.01.desc.mood.ambitious:0 "\n\nWhatever this costs, the masterpiece will be worth it. History will remember the work, not the price."
  zz_valyria_item_crafting_human_sacrifice.01.desc.mood.1:0 "\n\nThe half-finished piece seems to hum in anticipation."
  zz_valyria_item_crafting_human_sacrifice.01.desc.mood.2:0 "\n\nI wipe my hands, and find them already stained red with forge-dust. An omen, perhaps."
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.1:0 "The dream came again last night: the same door, the same voice, the same promise.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.2:0 "I woke with the taste of ash in my mouth and the shape of this place burned behind my eyes.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.3:0 "Each night the vision grows sharper, as if impatient for me to arrive.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.4:0 "The prophet's words still circle in my mind, half riddle and half command.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.5:0 "I have dreamed this journey so often that the road feels like a memory rather than a discovery.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.6:0 "In the dream, the thing I seek was glowing. Here, in the waking world, it will surely be harder to find.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.success_outro.1:0 "\n\nThe prophecy has proven true, every word of it. I wonder what else the dreams have shown that I have yet to understand."
  zz_valyria_magic_dream_magic_prophecy_task.desc.success_outro.2:0 "\n\nAs I leave, I could swear I hear, faintly, the voice from my dreams laughing with satisfaction."
  zz_valyria_magic_dream_magic_prophecy_task.desc.success_outro.3:0 "\n\nThat night I sleep without dreaming at all, for the first time in weeks."
  zz_valyria_magic_dream_magic_prophecy_task.desc.failure_outro.1:0 "\n\nPerhaps I misread the dream. Perhaps the dream misread me."
  zz_valyria_magic_dream_magic_prophecy_task.desc.failure_outro.2:0 "\n\nThat night the vision returns, unchanged, as if mocking my failure."
  zz_valyria_magic_dream_magic_prophecy_task.desc.failure_outro.3:0 "\n\nProphecy is a treacherous guide. I begin to wonder whether the prophet saw what they claimed to see."
