l_english:
  zz_valyria_magic_dream_magic_prophecy_task.desc.obstacle.1:0 "\n\nThe prophecy's words are clearer in my dreams than they are by day. In the waking world, every clue seems to point in two directions at once."
  zz_valyria_magic_dream_magic_prophecy_task.desc.obstacle.2:0 "\n\nThe locals are wary of strangers who ask about old legends, and wary of anyone who claims to dream true."
  zz_valyria_magic_dream_magic_prophecy_task.desc.obstacle.3:0 "\n\nEach night the dream returns, but each night it shows me something slightly different, as if the place itself were shifting."
  zz_valyria_magic_dream_magic_prophecy_task.desc.obstacle.4:0 "\n\nSome other seeker has been here before me. Their footprints are in the dust of every place I search."
  zz_valyria_magic_dream_magic_prophecy_task.desc.obstacle.5:0 "\n\nThe landmarks from my dream are here, but time has changed them: a river has moved, a tower has fallen, a road has vanished."
  zz_valyria_magic_dream_magic_prophecy_task.desc.obstacle.6:0 "\n\nI am beginning to suspect that the prophecy is a riddle, and that the obvious answer is the wrong one."
  zz_valyria_magic_dream_magic_prophecy_task.desc.patience.1:0 "\n\n[employer.GetTitledFirstName|U] has allowed our search to proceed, but makes it plain that our welcome is not unlimited."
  zz_valyria_magic_dream_magic_prophecy_task.desc.patience.2:0 "\n\n[employer.GetTitledFirstName|U] expects a share of whatever we find, and is watching closely to make sure they receive it."
  zz_valyria_magic_dream_magic_prophecy_task.desc.patience.3:0 "\n\nThe people of [employer.GetPrimaryTitle.GetBaseNameNoTier] grow uneasy at our presence. We must not linger."
  zz_valyria_magic_dream_magic_prophecy_task.desc.prophet.1:0 "\n\nI think of [secondary_recipient.GetFirstName], whose dream set me on this road. Their prophecy has proven true."
  zz_valyria_magic_dream_magic_prophecy_task.desc.prophet.2:0 "\n\nI must send word to [secondary_recipient.GetFirstName]. Whatever they saw in their sleep, they saw truly."
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.gold.1:0 "In the dream, coins spilled from a split sack beneath a hearthstone, and they rang like bells as they fell.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.gold.2:0 "I have seen the gold three nights running now: a dull gleam in the dark, and a hand that was not mine reaching for it.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.gold.3:0 "The prophecy spoke of 'a debt the dead never paid'. I am beginning to think it meant a hoard.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.gold.1:0 "\n\nThe hoard lies beneath a chapel floor, wrapped in rotted leather: coin of a dozen mints, some of them older than any kingdom I know."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.gold.2:0 "\n\nIt is exactly as I dreamed it: a split sack beneath a hearthstone, and the coins ringing like bells as they spill across the floor."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.gold.3:0 "\n\nBehind a false wall in a disused cellar, the gold has waited for longer than anyone has remembered it existed."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.gold.1:0 "\n\nI found the hearthstone from my dream. Beneath it was nothing but an empty, rotted sack. Someone came here before me."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.gold.2:0 "\n\nEvery likely hiding place has been turned over, and every one is empty. Perhaps the gold was spent long ago."
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.relic.1:0 "In the dream, a light burned behind a temple wall, and a voice I did not know called me by name.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.relic.2:0 "I have dreamed of a reliquary wrapped in white linen, and of hands that would not let it go.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.relic.3:0 "The prophecy spoke of 'a saint who sleeps beneath the wrong altar'. I mean to wake them.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.relic.1:0 "\n\nBeneath a cracked altar stone lies a small, plain casket. When I open it, the air smells of incense, though none has been burned here in a century."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.relic.2:0 "\n\nThe relic is wrapped in linen so old it crumbles at a touch, and yet the thing within is perfect, untouched by the years."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.relic.3:0 "\n\nIt hangs forgotten behind a tapestry in a disused chapel, and when the light falls upon it, the novices with me fall to their knees."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.relic.1:0 "\n\nThe altar from my dream is real, and the space beneath it is empty, save for the faint outline of something that once rested there."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.relic.2:0 "\n\nThe priests here guard their secrets well. Whatever holy thing my dream promised, they have hidden it beyond my reach."
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.glory.1:0 "In the dream, I saw my own name carved into ancient stone, beside the names of heroes.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.glory.2:0 "I have dreamed of a battle I never fought, and of songs sung about it in halls I have never seen.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.glory.3:0 "The prophecy spoke of 'a victory the chroniclers forgot to write down'. I mean to find it.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.glory.1:0 "\n\nBuried in a soldier's letter home is the account of a deed so bold that, once I make it known, the halls of the realm will ring with it."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.glory.2:0 "\n\nThe chronicle was miscatalogued for a century. In it, the deed my dream foretold is set down plainly, waiting for someone to read it aloud."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.glory.3:0 "\n\nA faded tapestry, rolled away in a storeroom, shows a battle no living person remembers, and a banner that links it to me."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.glory.1:0 "\n\nThe chronicles here are full of gaps, and the deed my dream promised has fallen into one of them."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.glory.2:0 "\n\nEvery account I find contradicts the last. Whatever glory the prophecy foretold, it remains a rumour."
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.bloodline.1:0 "In the dream, a long line of ancestors stood before me, and each one pointed towards a buried truth.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.bloodline.2:0 "I have dreamed of a family tree whose branches reached back further than any herald has ever traced.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.bloodline.3:0 "The prophecy spoke of 'a crown hidden in the roots'. I think it meant my blood.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.bloodline.1:0 "\n\nA marriage contract, three centuries old, proves a link between my line and a house of legend."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.bloodline.2:0 "\n\nIn the margin of a herald's roll, a single faded entry rewrites the story of my family's origins."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.bloodline.3:0 "\n\nA sealed letter, never delivered, names my ancestor as heir to a great and storied name."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.bloodline.1:0 "\n\nThe genealogies are a thicket of contradictions, and the line my dream showed me vanishes into it."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.bloodline.2:0 "\n\nThe one record that could prove the prophecy has been burned. Only its charred edge remains."
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.influence.1:0 "In the dream, councils bowed their heads and doors opened before me without a single word spoken.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.influence.2:0 "I have dreamed of a ledger full of names, and of every name owing me a favour.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.influence.3:0 "The prophecy spoke of 'the keys to a hundred doors'. I begin to see what it meant.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.influence.1:0 "\n\nA bundle of old letters records favours owed to my house by families who now sit on the highest councils of the realm."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.influence.2:0 "\n\nThe ledger from my dream is real: page after page of debts, each one a lever I may now pull."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.influence.3:0 "\n\nHidden in a chest of dull accounts is a list of secrets that half the court would pay dearly to keep buried."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.influence.1:0 "\n\nThe debts are real, but those who owed them are long dead, and their heirs feel no obligation at all."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.influence.2:0 "\n\nThe ledger I sought has been taken. Someone else, it seems, also dreams of influence."
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.power.1:0 "In the dream, radiant lines of power crossed the earth and converged upon a single point.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.power.2:0 "I have dreamed of a place where the ground hums, and the air tastes of lightning.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.power.3:0 "The prophecy spoke of 'a well that never runs dry'. It did not mean water.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.power.1:0 "\n\nAt the meeting of three old roads, the earth thrums beneath my feet, and I feel power flowing into me like warmth from a fire."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.power.2:0 "\n\nIn a ring of fallen stones, the air shimmers, and every breath I draw fills me with strength."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.power.3:0 "\n\nThe nexus is a spring in a forgotten grove, and its water glows faintly in the dark."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.power.1:0 "\n\nI found the place from my dream, but the power that once pooled there has drained away. Only an echo remains."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.power.2:0 "\n\nThe lines of power shift and wander, and by the time I reach the meeting place, they have moved on."
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.provisions.1:0 "In the dream, sealed granaries and forgotten wagons laden with grain appeared out of the mist.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.provisions.2:0 "I have dreamed of cellars full of salted meat and barrels of wine, and no one left alive who knew they were there.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.provisions.3:0 "The prophecy spoke of 'a harvest no one reaped'. I mean to reap it.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.provisions.1:0 "\n\nBehind a collapsed wall lies a cellar of sealed jars and barrels, preserved as perfectly as the day they were stored."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.provisions.2:0 "\n\nA forgotten army's supply depot, abandoned in some long-ago war, still holds enough to feed a host for months."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.provisions.3:0 "\n\nThe granary from my dream stands in a ruined village, its stores dry and sound beneath a sod roof."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.provisions.1:0 "\n\nThe stores were real, but rats and rot found them long before I did."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.provisions.2:0 "\n\nThe cellar from my dream has been emptied. Only scattered husks and broken barrels remain."
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.treasury.1:0 "In the dream, sealed vaults and forgotten tribute chests rose from beneath shattered milestones.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.treasury.2:0 "I have dreamed of an imperial seal pressed into wax, and of chests that no one has opened in a hundred years.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.echo.treasury.3:0 "The prophecy spoke of 'the tribute of a vanished empire'. I mean to claim it for the realm.\n\n"
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.treasury.1:0 "\n\nBeneath a broken milestone, a sealed vault holds tribute chests bearing the mark of an empire long fallen."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.treasury.2:0 "\n\nThe old tax rolls lead me to a forgotten strongroom, its contents enough to fill a realm's coffers for years."
  zz_valyria_magic_dream_magic_prophecy_task.desc.find.treasury.3:0 "\n\nAn imperial cache, buried when the empire fell, lies exactly where the dream said it would."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.treasury.1:0 "\n\nThe vault is real, but it was emptied when the empire fell. Only the seals remain, broken."
  zz_valyria_magic_dream_magic_prophecy_task.desc.miss.treasury.2:0 "\n\nThe milestones from my dream have been moved and reused a dozen times. The vault beneath them is lost."
