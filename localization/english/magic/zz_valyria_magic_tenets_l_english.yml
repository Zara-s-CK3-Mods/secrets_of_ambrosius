  # Tenet discovery (zz_valyria_magic_tenet.0001)
  zz_valyria_magic_tenet.0001.t:0 "A Forgotten Treatise"
  zz_valyria_magic_tenet.0001.desc:0 "Among a merchant's bundle of water-stained books, sold for the weight of their bindings, I found one that did not belong. Its leaves are older than the rest, written in a careful, cramped hand. It is no grimoire of spells, but a book of belief. Somebody once worshipped by these words.\n\n"
  zz_valyria_magic_tenet.0001.desc.blood_rites:0 "It teaches that life is the oldest of the mysteries. Blood freely given is no crime, it says, but a holy offering, and its author writes of the rites they kept with the calm of a priest describing the mass."
  zz_valyria_magic_tenet.0001.desc.faceless_arts:0 "It teaches that there is holiness in what is hidden. Its author wrote of going unseen among the faithless, and of wearing other faces as a monk wears his habit. Half the pages have been cut away, perhaps on purpose."
  zz_valyria_magic_tenet.0001.desc.greensight:0 "It is a record of dreams, kept night after night for a lifetime. Its author believed the gods speak only to those who sleep, and that the dreamer who comes back with their words is sacred."
  zz_valyria_magic_tenet.0001.desc.the_undying:0 "It is an alchemist's creed. Death, it says, is a flaw in the work, and every flaw can be corrected. The margins are full of recipes, and the dates written beside them span more years than any one life should."
  zz_valyria_magic_tenet.0001.desc.sacred_flame:0 "Its pages are scorched at every edge, yet none of them has burned through. Fire, it says, is the voice of the divine, and to call it forth is to pray."
  zz_valyria_magic_tenet.0001.desc.stormspeakers:0 "It is a sailor's book of prayers to the wind. Its author read the storm as others read scripture, and claimed that a faithful voice could still it, or raise it."
  zz_valyria_magic_tenet.0001.desc.drowned_mysteries:0 "The pages smell of salt and are swollen with old seawater. It teaches that all things come from the deep and return to it, and that the faithful may borrow its slow and patient power."
  zz_valyria_magic_tenet.0001.desc.living_wellspring:0 "It teaches that power flows through the faithful as water through a spring, and that a life lived rightly lets it flow more freely. Its author set out the disciplines by which they kept their own spring clear."
  zz_valyria_magic_tenet.0001.desc.deep_vessel:0 "It teaches that the body is a vessel for the divine, and that devotion widens it. Its author describes long years of fasting and vigil, each of which let them hold a little more."
  zz_valyria_magic_tenet.0001.desc.font_of_mysteries:0 "It teaches that the world itself gives up its power to those who know how to ask. Its author never cast a spell without first giving thanks to the land, the air and the stones."
  zz_valyria_magic_tenet.0001.desc.end:0 "\n\nWhoever wrote this understood the Higher Mysteries as I do. They simply called it faith. This is the [zz_found_tenet.GetBaseName] [tenet|E]."
  zz_valyria_magic_tenet.0001.a:0 "I will study it."
  zz_valyria_magic_tenet.0001.b:0 "Some faiths are better forgotten. Into the fire with it."

  # Sorcery Anathema discovery (zz_valyria_anathema_discovery_effect)
  zz_valyria_anathema_learned_desc:0 "Having felt the touch of sorcery from [secondary_recipient.GetTitledFirstNameNoTooltip], you have come to understand why some faiths hold the Higher Mysteries to be an abomination."
