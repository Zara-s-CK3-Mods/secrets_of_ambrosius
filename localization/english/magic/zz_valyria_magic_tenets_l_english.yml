l_english:

  # Tenets
  tenet_zz_blood_rites_name:0 "Blood Rites"
  tenet_zz_blood_rites_desc:0 "Life is the oldest of the mysteries. Our faith holds that blood freely given is a holy offering, and those who work with it are honoured for their devotion.\n\n#weak Blood Magic is 25% stronger, and magic is accepted.#!"
  tenet_zz_sacred_flame_name:0 "Sacred Flame"
  tenet_zz_sacred_flame_desc:0 "Fire is the voice of the divine. To call it forth is an act of worship, and those who can do so are revered as blessed.\n\n#weak Fire Magic is 25% stronger, casting Fire Magic grants [piety|E], and magic is revered.#!"
  tenet_zz_faceless_arts_name:0 "Faceless Arts"
  tenet_zz_faceless_arts_desc:0 "There is holiness in what is hidden. The faithful learn to walk unseen, and to wear whatever shape their purpose demands.\n\n#weak Shadow Magic is 25% stronger, and magic is accepted.#!"
  tenet_zz_greensight_name:0 "Greensight"
  tenet_zz_greensight_desc:0 "The gods speak in dreams. Those who can walk that road and bring back what they have seen are sacred to us.\n\n#weak Dream Magic is 25% stronger, and magic is accepted.#!"
  tenet_zz_drowned_mysteries_name:0 "Drowned Mysteries"
  tenet_zz_drowned_mysteries_desc:0 "All things come from the deep, and return to it. The faithful learn its slow and patient power.\n\n#weak Water Magic is 25% stronger, and magic is accepted.#!"
  tenet_zz_stormspeakers_name:0 "Stormspeakers"
  tenet_zz_stormspeakers_desc:0 "The wind carries the words of heaven. Our holy men read the storm as others read a book, and they can command it.\n\n#weak Air Magic is 25% stronger, and magic is accepted.#!"
  tenet_zz_the_undying_name:0 "The Undying"
  tenet_zz_the_undying_desc:0 "Death is a flaw in the work, and flaws can be corrected. The faithful seek the secret of the unending life.\n\n#weak Alchemy is 25% stronger, and magic is accepted.#!"
  tenet_zz_living_wellspring_name:0 "Living Wellspring"
  tenet_zz_living_wellspring_desc:0 "Power flows through the faithful as water flows through a spring. Those who live rightly find it comes to them more readily.\n\n#weak All gains of [drops_of_power|E] are multiplied by an extra 50%, and magic is accepted.#!"
  tenet_zz_deep_vessel_name:0 "Deep Vessel"
  tenet_zz_deep_vessel_desc:0 "The body of the faithful is a vessel for the divine, and devotion widens it.\n\n#weak Maximum [drops_of_power|E] is increased by 250, and magic is accepted.#!"
  tenet_zz_font_of_mysteries_name:0 "Font of Mysteries"
  tenet_zz_font_of_mysteries_desc:0 "The world itself gives up its power to those who know how to ask. Mages of this faith gather it as they breathe.\n\n#weak Passive gain of [drops_of_power|E] is increased by 2, and magic is accepted.#!"
  tenet_zz_sorcery_anathema_name:0 "Sorcery Anathema"
  tenet_zz_sorcery_anathema_desc:0 "The higher mysteries are an abomination, and those who practise them are enemies of the gods. Our faith protects its followers from their foul works.\n\n#weak Magic is criminal, and followers are harder to kill with the killing mysteries.#!"

