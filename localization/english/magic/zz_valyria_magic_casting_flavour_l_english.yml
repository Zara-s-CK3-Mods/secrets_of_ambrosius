l_english:
  # Cast event openers: general, then per school, then by the caster's personality
  zz_valyria_magic_cast.opener.general.1:0 "[ROOT.Char.GetFirstName] stands ready to enact a mystery."
  zz_valyria_magic_cast.opener.general.2:0 "[ROOT.Char.GetFirstName] has made the final preparations, and the mystery waits only to be enacted."
  zz_valyria_magic_cast.opener.general.3:0 "The circle is drawn and the words of power wait on [ROOT.Char.GetFirstName]'s lips."
  zz_valyria_magic_cast.opener.general.4:0 "[ROOT.Char.GetFirstName] takes a slow breath, and the room falls silent as the working begins."
  zz_valyria_magic_cast.opener.general.5:0 "Every preparation is complete. [ROOT.Char.GetFirstName] needs only your word to begin."
  zz_valyria_magic_cast.opener.general.6:0 "[ROOT.Char.GetFirstName] lays out the last of the instruments and turns, waiting."
  zz_valyria_magic_cast.opener.general.7:0 "The hour is chosen, the signs are favourable, and [ROOT.Char.GetFirstName] stands ready."
  zz_valyria_magic_cast.opener.blood_magic.1:0 "A silver knife rests in [ROOT.Char.GetFirstName]'s hand, its edge already wet."
  zz_valyria_magic_cast.opener.blood_magic.2:0 "[ROOT.Char.GetFirstName] binds a strip of linen about one wrist, ready to loose it when the blood is called for."
  zz_valyria_magic_cast.opener.blood_magic.3:0 "The bowl is set, the knife cleansed in flame, and [ROOT.Char.GetFirstName] waits to spill what must be spilled."
  zz_valyria_magic_cast.opener.shadow_magic.1:0 "[ROOT.Char.GetFirstName] snuffs the candles one by one until only a single flame remains."
  zz_valyria_magic_cast.opener.shadow_magic.2:0 "The shutters are barred, and [ROOT.Char.GetFirstName]'s shadow stretches further than the light should allow."
  zz_valyria_magic_cast.opener.shadow_magic.3:0 "In the dimness, [ROOT.Char.GetFirstName] seems less a person than an outline waiting to be filled."
  zz_valyria_magic_cast.opener.dream_magic.1:0 "[ROOT.Char.GetFirstName] lies back upon the cushions, the sleeping draught already warm in [ROOT.Char.GetHerHis] veins."
  zz_valyria_magic_cast.opener.dream_magic.2:0 "Incense curls through the chamber, and [ROOT.Char.GetFirstName]'s eyes grow heavy with more than weariness."
  zz_valyria_magic_cast.opener.dream_magic.3:0 "[ROOT.Char.GetFirstName] murmurs the words that open the way between waking and dreaming."
  zz_valyria_magic_cast.opener.alchemy_magic.1:0 "The alembics bubble and hiss as [ROOT.Char.GetFirstName] measures out the final reagent."
  zz_valyria_magic_cast.opener.alchemy_magic.2:0 "[ROOT.Char.GetFirstName] sets a crucible over the coals, the mixture within already beginning to glow."
  zz_valyria_magic_cast.opener.alchemy_magic.3:0 "Powders, salts and quicksilver are laid out in careful order before [ROOT.Char.GetFirstName]."
  zz_valyria_magic_cast.opener.fire_magic.1:0 "A brazier roars to life at a gesture from [ROOT.Char.GetFirstName]."
  zz_valyria_magic_cast.opener.fire_magic.2:0 "[ROOT.Char.GetFirstName] stares into the flames, and the flames seem to stare back."
  zz_valyria_magic_cast.opener.fire_magic.3:0 "The heat in the chamber rises as [ROOT.Char.GetFirstName] begins to murmur the invocation."
  zz_valyria_magic_cast.opener.air_magic.1:0 "A wind with no source stirs the hangings as [ROOT.Char.GetFirstName] lifts both hands."
  zz_valyria_magic_cast.opener.air_magic.2:0 "[ROOT.Char.GetFirstName] stands at the open window, breathing in a storm that has not yet come."
  zz_valyria_magic_cast.opener.air_magic.3:0 "Dust and loose pages begin to circle [ROOT.Char.GetFirstName], drawn by an unseen current."
  zz_valyria_magic_cast.opener.water_magic.1:0 "[ROOT.Char.GetFirstName] kneels beside a basin of still water, and its surface trembles though nothing touches it."
  zz_valyria_magic_cast.opener.water_magic.2:0 "The air grows damp and cool as [ROOT.Char.GetFirstName] begins the invocation."
  zz_valyria_magic_cast.opener.water_magic.3:0 "Salt water is poured in a circle, and [ROOT.Char.GetFirstName] steps within it."
  zz_valyria_magic_cast.opener.trait.calm:0 "Unhurried as ever, [ROOT.Char.GetFirstName] stands ready to enact a mystery."
  zz_valyria_magic_cast.opener.trait.wrathful:0 "[ROOT.Char.GetFirstName] stands ready, a barely contained fury lending an edge to every word of the invocation."
  zz_valyria_magic_cast.opener.trait.arrogant:0 "[ROOT.Char.GetFirstName] stands ready, plainly certain that the mystery will bend to [ROOT.Char.GetHerHis] will."
  zz_valyria_magic_cast.opener.trait.humble:0 "[ROOT.Char.GetFirstName] stands ready, head bowed in respect for the powers about to be called upon."
  zz_valyria_magic_cast.opener.trait.paranoid:0 "[ROOT.Char.GetFirstName] checks the doors twice before standing ready to enact the mystery."
  zz_valyria_magic_cast.opener.trait.zealous:0 "[ROOT.Char.GetFirstName] murmurs a prayer before turning to the mystery."
  zz_valyria_magic_cast.opener.trait.craven:0 "[ROOT.Char.GetFirstName]'s hands tremble, but [ROOT.Char.GetSheHe] stands ready all the same."
  zz_valyria_magic_cast.opener.trait.brave:0 "[ROOT.Char.GetFirstName] stands ready, unafraid of whatever answers the call."
  zz_valyria_magic_cast.opener.trait.ambitious:0 "[ROOT.Char.GetFirstName] stands ready, eager to prove what the art can do."
  zz_valyria_magic_cast.opener.trait.sadistic:0 "[ROOT.Char.GetFirstName] stands ready, a thin smile on [ROOT.Char.GetHerHis] lips."
  zz_valyria_magic_cast.opener.trait.impatient:0 "[ROOT.Char.GetFirstName] has been ready for some time, and makes no effort to hide it."

  # The lead-in to the cast decision
  zz_valyria_magic_cast.moment.1:0 "Now is the moment to choose."
  zz_valyria_magic_cast.moment.2:0 "The choice now rests with you."
  zz_valyria_magic_cast.moment.3:0 "All now waits upon your word."
  zz_valyria_magic_cast.moment.4:0 "The moment of decision has come."
  zz_valyria_magic_cast.moment.5:0 "The gathered power hangs, waiting for your command."
  zz_valyria_magic_cast.moment.6:0 "There can be no more delay; you must decide."

  # Spell toasts: zz_toast_01
  zz_valyria_magic_cast.arts.1:0 "By the secret arts of"
  zz_valyria_magic_cast.arts.2:0 "Through the hidden arts of"
  zz_valyria_magic_cast.arts.3:0 "Wielding the forbidden arts of"
  zz_valyria_magic_cast.arts.4:0 "Calling upon the mysteries of"
  zz_valyria_magic_cast.arts.5:0 "Drawing on the ancient powers of"
  zz_valyria_magic_cast.arts.6:0 "By the old Valyrian arts of"

  # zz_toast_02
  zz_valyria_magic_cast.enacted.1:0 "[ROOT.Char.GetFirstName] has enacted a [zz_mystery],"
  zz_valyria_magic_cast.enacted.2:0 "[ROOT.Char.GetFirstName] has worked a [zz_mystery],"
  zz_valyria_magic_cast.enacted.3:0 "[ROOT.Char.GetFirstName] has performed a [zz_mystery],"
  zz_valyria_magic_cast.enacted.4:0 "[ROOT.Char.GetFirstName] has invoked a [zz_mystery],"
  zz_valyria_magic_cast.enacted.5:0 "[ROOT.Char.GetFirstName] has woven a [zz_mystery],"

  # zz_toast_03 (the toast adds the full stop)
  zz_valyria_magic_cast.failed.1:0 "but it failed to be realised"
  zz_valyria_magic_cast.failed.2:0 "but the power slipped from their grasp"
  zz_valyria_magic_cast.failed.3:0 "but the working unravelled before it could take hold"
  zz_valyria_magic_cast.failed.4:0 "but the powers called upon would not answer"
  zz_valyria_magic_cast.failed.5:0 "but it collapsed in a backlash of wasted power"
  zz_valyria_magic_cast.failed.6:0 "but the mystery would not yield"
