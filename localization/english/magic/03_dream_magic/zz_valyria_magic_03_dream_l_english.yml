  zz_valyria_magic_dream_magic.099.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.099.name$"
  zz_valyria_magic_dream_magic.099.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ reshaping the [prowess|E] of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.099.toast.tt:0 "$zz_valyria_magic_dream_magic.099.toast.desc$"

  zz_valyria_magic_dream_magic.099.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.099.name$"
  zz_valyria_magic_dream_magic.099.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.099.f.toast.tt:0 "$zz_valyria_magic_dream_magic.099.f.toast.desc$"

  zz_valyria_magic_dream_magic_100.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_ward_assassin$\n$zz_chg$\n\nThe use of the arcane forces of [dream_magic|E] to send a chosen subject warning dreams of the hands raised against their life.\n\nAn assassin's work is done in silence, and the victim rarely sees the blow until it falls. Through this mystery, the subject sees it first: the cup that should not be drunk, the stair that should not be climbed, the stranger who lingers too long at the door.\n\nEach time a murder plot against the subject comes to its moment, a vision warns them in time and the attempt fails. Each warning spends one vision. The greater the caster's skill, the more visions are granted."
  zz_valyria_magic_dream_magic.100.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.100.name$"
  zz_valyria_magic_dream_magic.100.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster sets a cup of water beside the subject's bed and drops a single bead of blood into it. By morning the water has turned dark, and in the subject's dream a hooded figure stands at the foot of the bed, a knife in their hand, and the subject wakes before the blade can fall.\n\nThe soothsayers of the Freehold said that no murder is so well hidden that it casts no shadow before it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.100.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA black thread is tied around the subject's wrist and the caster speaks a name over it, the name of a death that has not yet come. All night the subject dreams of corridors and closing doors, and each time a door closes, they see whose hand closed it.\n\nIn Valyria, a dragonlord who slept without such dreams was thought careless.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.100.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster burns a sprig of nightshade over the subject's pillow and breathes the smoke into their face. The subject sleeps uneasily, and in their dreams poison glitters in wine, a blade waits in the dark, and a friendly face smiles a moment too long.\n\nThe soothsayers taught that a warned man is half saved. This mystery saves the other half.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.100.opt.a:0 "Let no blade find them unwarned!"
  zz_valyria_magic_dream_magic.100.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.100.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.100.name$"
  zz_valyria_magic_dream_magic.100.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending warning dreams to [recipient.GetFirstName] against those who would murder them."
  zz_valyria_magic_dream_magic.100.toast.tt:0 "$zz_valyria_magic_dream_magic.100.toast.desc$"
  zz_valyria_magic_dream_magic.100.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.100.name$"
  zz_valyria_magic_dream_magic.100.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.100.f.toast.tt:0 "$zz_valyria_magic_dream_magic.100.f.toast.desc$"
  zz_valyria_magic_dream_magic.100.buff.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.100.name$"
  zz_valyria_magic_dream_magic.100.buff.toast.desc:0 "An assassin came for [zz_story_owner.GetFirstName], but a vision gave warning in time"
  zz_valyria_magic_dream_magic.100.buff.toast.tt:0 "$zz_valyria_magic_dream_magic.100.buff.toast.desc$"

  zz_valyria_magic_dream_magic_101.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_ward_battle$\n$zz_chg$\n\nThe use of the arcane forces of [dream_magic|E] to show a chosen subject the blows that would kill them on the field of battle, and in single combat.\n\nIn the press of battle, death comes from every side at once: an arrow from nowhere, a horse gone down, a blade in the crush. Through this mystery, the subject has seen such moments before, in dreams, and the body remembers what the mind has forgotten.\n\nEach time the subject would be slain in battle or in single combat, a vision turns the blow aside, and they come through unharmed. Each escape spends one vision. The greater the caster's skill, the more visions are granted."
  zz_valyria_magic_dream_magic.101.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.101.name$"
  zz_valyria_magic_dream_magic.101.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a sword across the subject's knees and bleeds a little upon the blade. That night the subject dreams of battle, of the sound of it and the smell, and in the dream every blow aimed at them is seen a heartbeat before it lands.\n\nThe soothsayers of the Freehold sent no dragonlord to war without such dreams, for a dragonlord's death was a family's ruin.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.101.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA circle of shields is set around the subject's bed, and the caster walks it three times, singing softly in High Valyrian. In the subject's dream, the shields become a wall, and the wall becomes a field, and on the field a hundred deaths come for them, and each of them is turned aside.\n\nIt is said that warriors who have dreamed this way move in battle as though they hear a voice no one else can hear.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.101.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster binds a lock of the subject's hair with a strand of red thread and casts it into a brazier. As it burns, the subject sees in the smoke the shape of a duel, and the moment their opponent's blade would find them, and the step that carries them clear.\n\nThe soothsayers taught that every death has a moment, and a moment foreseen can be stepped around.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.101.opt.a:0 "Let them see every blow before it falls!"
  zz_valyria_magic_dream_magic.101.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.101.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.101.name$"
  zz_valyria_magic_dream_magic.101.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ showing [recipient.GetFirstName] in dreams the blows that would kill them in battle and single combat."
  zz_valyria_magic_dream_magic.101.toast.tt:0 "$zz_valyria_magic_dream_magic.101.toast.desc$"
  zz_valyria_magic_dream_magic.101.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.101.name$"
  zz_valyria_magic_dream_magic.101.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.101.f.toast.tt:0 "$zz_valyria_magic_dream_magic.101.f.toast.desc$"
  zz_valyria_magic_dream_magic.101.buff.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.101.name$"
  zz_valyria_magic_dream_magic.101.buff.toast.desc:0 "Death came for [zz_story_owner.GetFirstName] in battle, but a vision turned the blow aside"
  zz_valyria_magic_dream_magic.101.buff.toast.tt:0 "$zz_valyria_magic_dream_magic.101.buff.toast.desc$"
  ## Soothsaying (Assassination) murder save
  zz_valyria_magic_dream_magic.1100.t:0 "Forewarned"
  zz_valyria_magic_dream_magic.1100.desc:0 "Everything was in place, and [target.GetFirstName] should have died. But at the last moment [target.GetSheHe] turned aside, as though [target.GetSheHe] had seen it coming in a dream. The attempt has failed."
  zz_valyria_magic_dream_magic.2100.desc:0 "I had dreamed of this moment: the hand, the blade, the shadow at the door. When it came, I knew it, and I stepped aside. Someone wants me dead, and only a vision saved me."
  zz_valyria_magic_dream_magic.2100.a:0 "Who would do this?"

  # Dream 102 - Secret Weaving (False Memory)
  zz_valyria_magic_dream_magic_102.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_csec$\n$zz_sec_rv$\n\nThe use of the arcane forces of [dream_magic|E] to give the subject a false memory of something they did to another, chosen character.\n\nThrough this mystery, the dream-walker weaves a memory into the subject's sleep so finely that they wake believing it: a love affair, or an attempt on the other's life.\n\nThe subject gains a secret involving the chosen character, and the commander knows it. A love affair also makes them lovers, and cannot be woven between spouses or the betrothed.\n\nThe dream-weavers of the Freehold said that a memory is only a dream that has been believed, and that belief is the easiest thing in the world to give."
  zz_valyria_magic_dream_magic.102.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.102.name$"
  zz_valyria_magic_dream_magic.102.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster sits beside the sleeping subject and speaks softly of things that never happened, as though recounting old times. In the dream, the words take shape, and the subject lives them.\n\nThe dream-weavers of the Freehold said that a memory is only a dream that has been believed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may give [recipient.GetFirstName] a memory of something done to another of your choosing. Will you weave it?"
  zz_valyria_magic_dream_magic.102.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA single black thread is drawn through a needle and stitched, again and again, through a square of pale silk laid over the subject's brow. With each stitch, the dream grows clearer, until it is no longer a dream at all.\n\nIn Valyria, it was said that the deepest secrets were never committed, only remembered.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may give [recipient.GetFirstName] a memory of something done to another of your choosing. Will you weave it?"
  zz_valyria_magic_dream_magic.102.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster burns a lock of the subject's hair together with a scrap of cloth taken from another, and lets the smoke drift over the sleeper. In the dream, two lives become tangled in a way neither will ever be able to deny.\n\nThe dream-weavers of the Freehold held that a false memory, once believed, binds as surely as a true one.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may give [recipient.GetFirstName] a memory of something done to another of your choosing. Will you weave it?"
  zz_valyria_magic_dream_magic.102.opt.a:0 "Weave the memory."
  zz_valyria_magic_dream_magic.102.opt.z:0 "No, let them remember only what was."
  zz_valyria_magic_dream_magic.102.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.102.name$"
  zz_valyria_magic_dream_magic.102.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ weaving a false memory into [recipient.GetFirstName]'s sleep."
  zz_valyria_magic_dream_magic.102.toast.tt:0 "$zz_valyria_magic_dream_magic.102.toast.desc$"
  zz_valyria_magic_dream_magic.102.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.102.name$"
  zz_valyria_magic_dream_magic.102.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$ as the woven memory frays and is forgotten upon waking."
  zz_valyria_magic_dream_magic.102.f.toast.tt:0 "$zz_valyria_magic_dream_magic.102.f.toast.desc$"
  zz_weave_lover:0 "A Love Affair"
  zz_weave_murder_attempt:0 "An Attempted Murder"

  # Dream 103 - Secret Weaving (Sleep-Talk)
  zz_valyria_magic_dream_magic_103.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_csec$\n$zz_sec_rv$\n\nThe use of the arcane forces of [dream_magic|E] to plant a guilty secret in the subject's dreams, and make them speak of it in their sleep.\n\nThrough this mystery, the subject comes to believe in a sin of the commander's choosing, and murmurs of it night after night.\n\nThe subject gains the secret, and the commander alone hears them confess it.\n\nThe dream-weavers of the Freehold said that no one keeps a secret in their sleep."
  zz_valyria_magic_dream_magic.103.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.103.name$"
  zz_valyria_magic_dream_magic.103.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster leans close to the sleeping subject and whispers a confession into their ear, over and over, until the sleeper's lips begin to move with it.\n\nThe dream-weavers of the Freehold said that no one keeps a secret in their sleep, least of all one they have been given.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may plant a guilty secret in [recipient.GetFirstName]'s dreams, and listen as they confess it. Will you whisper it?"
  zz_valyria_magic_dream_magic.103.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA small silver bell is hung above the subject's bed, and the caster strikes it once. In the dream, the subject kneels before you, and finds they cannot stop speaking of the thing they have done.\n\nIn Valyria, it was said that the only safe confessor was one who could enter your dreams.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may plant a guilty secret in [recipient.GetFirstName]'s dreams, and listen as they confess it. Will you whisper it?"
  zz_valyria_magic_dream_magic.103.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a sprig of nightshade beneath the subject's pillow and speaks a single word. The sleeper turns and mutters, and the words they speak are carried to you alone.\n\nThe dream-weavers of the Freehold held that a sin confessed in sleep is believed more readily than one confessed awake.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may plant a guilty secret in [recipient.GetFirstName]'s dreams, and listen as they confess it. Will you whisper it?"
  zz_valyria_magic_dream_magic.103.opt.a:0 "Whisper the confession."
  zz_valyria_magic_dream_magic.103.opt.z:0 "No, let them sleep in peace."
  zz_valyria_magic_dream_magic.103.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.103.name$"
  zz_valyria_magic_dream_magic.103.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ planting a secret that [recipient.GetFirstName] now speaks of in their sleep."
  zz_valyria_magic_dream_magic.103.toast.tt:0 "$zz_valyria_magic_dream_magic.103.toast.desc$"
  zz_valyria_magic_dream_magic.103.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.103.name$"
  zz_valyria_magic_dream_magic.103.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$ as the whispered confession fades, and [recipient.GetFirstName] sleeps on in silence."
  zz_valyria_magic_dream_magic.103.f.toast.tt:0 "$zz_valyria_magic_dream_magic.103.f.toast.desc$"

  # Dream 104
  zz_valyria_magic_dream_magic_104.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_frp_self$\n$zz_chg$\n\nThe use of the arcane forces of [dream_magic|E] to show a chosen subject, in their dreams, the way out of every prison that waits for them.\n\nThe soothsayers of Valyria held that every cell has a door, and that the door is always seen first in a dream. Through this mystery, the subject dreams of the locks, the guards and the hour, long before they are ever taken.\n\nWhenever the subject is imprisoned, a vision is spent and they escape the next day, until the visions are spent. Stronger casters grant more visions."
  zz_valyria_magic_dream_magic.104.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.104.name$"
  zz_valyria_magic_dream_magic.104.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster draws a door in ash upon the floor beside the subject's bed, and asks them, as they sleep, to walk through it. In the dream, they pass through a hundred doors, and every one of them opens.\n\nThe soothsayers of Valyria held that every cell has a door, and that the door is always seen first in a dream.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may show [recipient.GetFirstName] the way out of any cell that waits for them. Will you cast?"
  zz_valyria_magic_dream_magic.104.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA key of old bronze is pressed into the sleeping subject's hand, and the caster closes their fingers around it. They dream of dungeons they have never seen, and learn the way out of each.\n\nIn Valyria, it was said that no dreamer of the Freehold was ever held for long.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may show [recipient.GetFirstName] the way out of any cell that waits for them. Will you cast?"
  zz_valyria_magic_dream_magic.104.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster binds the subject's wrists with a thread of silk as they sleep, then cuts it with a single word. In the dream, chains fall from them, again and again, until falling chains are all they remember.\n\nThe soothsayers of the Freehold sold this working to envoys who were sent to treat with dangerous lords.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may show [recipient.GetFirstName] the way out of any cell that waits for them. Will you cast?"
  zz_valyria_magic_dream_magic.104.opt.a:0 "Let no cell hold them!"
  zz_valyria_magic_dream_magic.104.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.104.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.104.name$"
  zz_valyria_magic_dream_magic.104.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ granting [recipient.GetFirstName] dreams of the way out of every prison."
  zz_valyria_magic_dream_magic.104.toast.tt:0 "$zz_valyria_magic_dream_magic.104.toast.desc$"
  zz_valyria_magic_dream_magic.104.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.104.name$"
  zz_valyria_magic_dream_magic.104.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.104.f.toast.tt:0 "$zz_valyria_magic_dream_magic.104.f.toast.desc$"
  zz_valyria_magic_dream_magic.104.buff.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.104.name$"
  zz_valyria_magic_dream_magic.104.buff.toast.desc:0 "A prison was foreseen in a dream, and the way out of it"
  zz_valyria_magic_dream_magic.104.buff.toast.tt:0 "$zz_valyria_magic_dream_magic.104.buff.toast.desc$"

  # Dream 105
  zz_valyria_magic_dream_magic_105.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_adv$\n$zz_chg$\n\nThe use of the arcane forces of [dream_magic|E] to show a chosen commander their battles before they are fought.\n\nThe soothsayers of Valyria marched with the legions of the Freehold, and slept in the commanders' tents the night before each battle. What they dreamed, the commanders knew by morning.\n\nWhenever the subject commands an army into battle, a vision is spent and they gain combat advantage for that battle, until the visions are spent. Stronger casters grant a greater advantage and more visions."
  zz_valyria_magic_dream_magic.105.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.105.name$"
  zz_valyria_magic_dream_magic.105.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster spreads a map across the subject's bed and pricks it with a silver pin wherever they turn in their sleep. In the dream, the subject stands on a hill above a field they have never seen, and watches the battle that will be fought there.\n\nThe soothsayers of Valyria slept in the commanders' tents the night before each battle.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may let [recipient.GetFirstName] see their battles before they are fought. Will you cast?"
  zz_valyria_magic_dream_magic.105.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA war-horn is laid beside the sleeping subject, and the caster sounds it once, very softly. The subject dreams of a hundred battles, and in each of them they know where the enemy will break.\n\nIn Valyria, it was said that a commander with a soothsayer was never surprised, and never needed to be brave.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may let [recipient.GetFirstName] see their battles before they are fought. Will you cast?"
  zz_valyria_magic_dream_magic.105.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster casts bones upon a shield held over the subject as they sleep, and reads them by the light of a single candle. In the dream, the subject sees the banners of their enemies, and every gap in their lines.\n\nThe soothsayers of the Freehold held that a battle is lost or won the night before it is fought.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may let [recipient.GetFirstName] see their battles before they are fought. Will you cast?"
  zz_valyria_magic_dream_magic.105.opt.a:0 "Let them see the battle before it begins!"
  zz_valyria_magic_dream_magic.105.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.105.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.105.name$"
  zz_valyria_magic_dream_magic.105.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ granting [recipient.GetFirstName] dreams of the battles to come."
  zz_valyria_magic_dream_magic.105.toast.tt:0 "$zz_valyria_magic_dream_magic.105.toast.desc$"
  zz_valyria_magic_dream_magic.105.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.105.name$"
  zz_valyria_magic_dream_magic.105.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.105.f.toast.tt:0 "$zz_valyria_magic_dream_magic.105.f.toast.desc$"
  zz_valyria_magic_dream_magic.105.buff.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.105.name$"
  zz_valyria_magic_dream_magic.105.buff.toast.desc:0 "A battle was foreseen in a dream, and the commander knew where the blows would fall"
  zz_valyria_magic_dream_magic.105.buff.toast.tt:0 "$zz_valyria_magic_dream_magic.105.buff.toast.desc$"

  # Dream 106 - the Dream of Fealty (Leave Faction)
  zz_valyria_magic_dream_magic_106.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_fealty$\n\nThe use of the arcane forces of [dream_magic|E] to send a plotter dreams of the oath they swore.\n\nThe subject leaves their [faction|E] and cannot join another for between 2 and 10 years, by the caster's mastery.\n\nThe Freehold had little patience for faction among its subjects. A dragonlord whose vassals muttered would send for a dreamer, and the muttering would stop."
  zz_valyria_magic_dream_magic.106.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.106.name$"
  zz_valyria_magic_dream_magic.106.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nIn the dream, the subject kneels again in the hall where they first swore their oath. The words come back to them one by one, and with each word the faces of their fellow plotters grow dimmer.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn [recipient.GetFirstName] from [recipient.GetHerHis] faction. Will you send the dream?"
  zz_valyria_magic_dream_magic.106.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe subject dreams of the faction's banner raised at last, and of the burning, the hanging and the empty fields that follow it. They wake cold and do not sleep again that night.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn [recipient.GetFirstName] from [recipient.GetHerHis] faction. Will you send the dream?"
  zz_valyria_magic_dream_magic.106.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nEvery night for a week the subject dreams that their fellow plotters sit at a table and divide the subject's lands between them. By the seventh night, no promise the faction makes can be believed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn [recipient.GetFirstName] from [recipient.GetHerHis] faction. Will you send the dream?"
  zz_valyria_magic_dream_magic.106.opt.a:0 "Send the dream."
  zz_valyria_magic_dream_magic.106.opt.z:0 "No, let them plot."
  zz_valyria_magic_dream_magic.106.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.106.name$"
  zz_valyria_magic_dream_magic.106.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ turning [recipient.GetFirstName] from [recipient.GetHerHis] faction."
  zz_valyria_magic_dream_magic.106.toast.tt:0 "$zz_valyria_magic_dream_magic.106.toast.desc$"
  zz_valyria_magic_dream_magic.106.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.106.name$"
  zz_valyria_magic_dream_magic.106.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$ as the subject wakes and forgets the dream."
  zz_valyria_magic_dream_magic.106.f.toast.tt:0 "$zz_valyria_magic_dream_magic.106.f.toast.desc$"

  # Dream 107 - Foresight (Single Combat)
  zz_valyria_magic_dream_magic_107.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_duel_move$\n$zz_duel_skill$\n\nThe use of the arcane forces of [dream_magic|E] to dream the duel before it is fought, so that the caster sees each blow coming.\n\nFor the rest of the duel, the caster's duel success rises and their injury risk falls every round, the more so with greater skill in Dream Magic. It can be cast once in each duel."
  zz_valyria_magic_dream_magic.107.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.107.name$"
  zz_valyria_magic_dream_magic.107.desc:0 "This [zz_mystery|E] is worked only in [single_combat_fight|E]."
  zz_valyria_magic_dream_magic.107.opt.z:0 "Very well."
  zz_valyria_magic_dream_magic.107.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.107.name$"
  zz_valyria_magic_dream_magic.107.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ in single combat."
  zz_valyria_magic_dream_magic.107.toast.tt:0 "$zz_valyria_magic_dream_magic.107.toast.desc$"
  zz_valyria_magic_dream_magic.107.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.107.name$"
  zz_valyria_magic_dream_magic.107.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.107.f.toast.tt:0 "$zz_valyria_magic_dream_magic.107.f.toast.desc$"
