  zz_valyria_magic_dream_magic_014.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sec_rv$\n\nThe use of the arcane forces of [dream_magic|E] to uncover a secret that others hold against the subject.\n\nThrough this mystery, the dream-walker follows the subject's anxieties to their source: someone else's secret, held over them like a blade.\n\nThe secret is revealed to the subject, so that they may know what others hold against them.\n\nEvery secret lives in a mind, and every mind dreams. The dream-walkers of the Freehold held that there was no truth so well hidden that it could not be found by one who knew how to walk through sleep."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.014.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.014.name$"
  zz_valyria_magic_dream_magic.014.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject's sleep is troubled by faces that smile too much and whispers that stop when they enter a room.\n\nThe dream-walkers of Valyria served the dragonlords as keepers of secrets, and as their unmakers. The great families of the Freehold paid fortunes to know what their rivals dreamed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and uncover a secret that is held against [recipient.GetFirstName]. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.014.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lights a candle of grey wax and sets it upon a likeness of the target. As the subject sleeps, the light seems to fall within the target's dreams, illuminating rooms they had always kept in shadow.\n\nThe dream-walkers of the Freehold were paid well by the great houses to learn what their rivals dreamed, and what their rivals feared.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and uncover a secret that is held against [recipient.GetFirstName]. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.014.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA thread is drawn from the target's clothing and tied about the subject's finger as they sleep. In the dream, the thread leads them through dark corridors to a room where a secret has been left lying in plain sight.\n\nIn Valyria, it was said that every secret has a door, and every door has a key, if only one knows where to look.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and uncover a secret that is held against [recipient.GetFirstName]. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.014.opt.a:0 "Find what threatens them."
  zz_valyria_magic_dream_magic.014.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.014.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.014.name$"
  zz_valyria_magic_dream_magic.014.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ uncovering a secret that is held against [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.014.toast.tt:0 "$zz_valyria_magic_dream_magic.014.toast.desc$"

  zz_valyria_magic_dream_magic.014.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.014.name$"
  zz_valyria_magic_dream_magic.014.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.014.f.toast.tt:0 "$zz_valyria_magic_dream_magic.014.f.toast.desc$"


  zz_valyria_magic_dream_magic_015.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sec_rv$\n\nThe use of the arcane forces of [dream_magic|E] to steal a secret that the subject happens to know.\n\nThrough this mystery, the dream-walker searches through the memories the subject carries, and takes one of the secrets they know for their own.\n\nThe caster learns the secret as surely as if they had witnessed it themselves.\n\nEvery secret lives in a mind, and every mind dreams. The dream-walkers of the Freehold held that there was no truth so well hidden that it could not be found by one who knew how to walk through sleep."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.015.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.015.name$"
  zz_valyria_magic_dream_magic.015.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject's dreams are full of overheard words and glimpsed scenes, memories they were never meant to keep.\n\nThe dream-walkers of Valyria served the dragonlords as keepers of secrets, and as their unmakers. The great families of the Freehold paid fortunes to know what their rivals dreamed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and steal a secret that [recipient.GetFirstName] knows. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.015.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a written list of names beside the sleeping subject, each one belonging to someone whose secret is already known. In their dream, the subject walks among them, and the secrets they hold grow clearer and sharper, every detail returning in full.\n\nThe dream-walkers of the Freehold forgot nothing, and taught their patrons to forget nothing either.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and steal a secret that [recipient.GetFirstName] knows. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.015.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA drop of ink is let fall into a glass of water and set beside the subject as they sleep. In the dream, the ink spreads into words, and the words into memories, and every secret they have ever learned stands before them, clear and whole.\n\nIn Valyria, knowledge was power, and remembered knowledge doubly so.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and steal a secret that [recipient.GetFirstName] knows. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.015.opt.a:0 "Take what they know."
  zz_valyria_magic_dream_magic.015.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.015.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.015.name$"
  zz_valyria_magic_dream_magic.015.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ stealing a secret that [recipient.GetFirstName] knows."
  zz_valyria_magic_dream_magic.015.toast.tt:0 "$zz_valyria_magic_dream_magic.015.toast.desc$"

  zz_valyria_magic_dream_magic.015.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.015.name$"
  zz_valyria_magic_dream_magic.015.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.015.f.toast.tt:0 "$zz_valyria_magic_dream_magic.015.f.toast.desc$"



  zz_valyria_magic_dream_magic_016.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sec_pr$\n\nThe use of the arcane forces of [dream_magic|E] to seal away one of the subject's own secrets.\n\nThrough this mystery, the dream-walker follows one of the subject's secrets to every mind that holds it, and binds those minds so that they can never speak of it.\n\nThe secret becomes impossible for those who know it to expose.\n\nEvery secret lives in a mind, and every mind dreams. The dream-walkers of the Freehold held that there was no truth so well hidden that it could not be found by one who knew how to walk through sleep."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.016.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.016.name$"
  zz_valyria_magic_dream_magic.016.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject's sleep is uneasy, haunted by the fear of discovery, and the dream-walker begins to follow that fear outward.\n\nThe dream-walkers of Valyria served the dragonlords as keepers of secrets, and as their unmakers. The great families of the Freehold paid fortunes to know what their rivals dreamed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and seal away one of [recipient.GetFirstName]'s own secrets. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.016.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster seals a scroll with black wax and lays it upon the subject's chest as they sleep. In their dream, a secret they have long feared being revealed is folded small, tied with thread, and placed in a box that no one will ever open.\n\nThe great families of the Freehold paid dearly for such workings, for in Valyria a secret exposed could be fatal.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and seal away one of [recipient.GetFirstName]'s own secrets. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.016.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA heavy key is pressed into the subject's hand as they drift to sleep. In the dream, they lock a door upon a room they never wish anyone to enter, and the key, when they wake, is cold and heavy in their palm.\n\nIn Valyria, it was not enough to keep a secret. One had to bind it, so that it could never escape.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and seal away one of [recipient.GetFirstName]'s own secrets. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.016.opt.a:0 "Bind every tongue."
  zz_valyria_magic_dream_magic.016.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.016.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.016.name$"
  zz_valyria_magic_dream_magic.016.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sealing away one of [recipient.GetFirstName]'s own secrets."
  zz_valyria_magic_dream_magic.016.toast.tt:0 "$zz_valyria_magic_dream_magic.016.toast.desc$"

  zz_valyria_magic_dream_magic.016.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.016.name$"
  zz_valyria_magic_dream_magic.016.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.016.f.toast.tt:0 "$zz_valyria_magic_dream_magic.016.f.toast.desc$"


  zz_valyria_magic_dream_magic_017.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sec_pr$\n\nThe use of the arcane forces of [dream_magic|E] to silence a secret that others hold against the subject.\n\nThrough this mystery, the dream-walker finds a secret that someone holds against the subject, and binds the minds of those who know it, so that it can never be used.\n\nThe secret can no longer be exposed by those who know it, leaving the subject safe from its threat.\n\nEvery secret lives in a mind, and every mind dreams. The dream-walkers of the Freehold held that there was no truth so well hidden that it could not be found by one who knew how to walk through sleep."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.017.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.017.name$"
  zz_valyria_magic_dream_magic.017.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject's dreams are dark with the shadow of a threat that has not yet fallen.\n\nThe dream-walkers of Valyria served the dragonlords as keepers of secrets, and as their unmakers. The great families of the Freehold paid fortunes to know what their rivals dreamed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and silence a secret that is held against [recipient.GetFirstName]. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.017.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster draws a circle of salt around a likeness of the target and sets a stone at its centre. As the subject sleeps, the stone grows heavy in their dream, and they understand that something the target knows has been pressed down, held fast, and made silent.\n\nThe dream-walkers of the Freehold could bind another's secret as easily as their own.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and silence a secret that is held against [recipient.GetFirstName]. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.017.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA thread of red silk is wound about a lock of the target's hair, and the knot is pulled tight as the subject sleeps. In the dream, a door closes in the target's mind, and a whisper that was meant to be spoken falls still.\n\nIn Valyria, a secret could be a weapon. Through this mystery, it can be locked away where no one will ever draw it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and silence a secret that is held against [recipient.GetFirstName]. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.017.opt.a:0 "Silence the threat."
  zz_valyria_magic_dream_magic.017.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.017.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.017.name$"
  zz_valyria_magic_dream_magic.017.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ silencing a secret that is held against [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.017.toast.tt:0 "$zz_valyria_magic_dream_magic.017.toast.desc$"

  zz_valyria_magic_dream_magic.017.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.017.name$"
  zz_valyria_magic_dream_magic.017.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.017.f.toast.tt:0 "$zz_valyria_magic_dream_magic.017.f.toast.desc$"

  zz_valyria_magic_dream_magic_018.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sec_pr$\n\nThe use of the arcane forces of [dream_magic|E] to seal away a secret that the subject happens to know.\n\nThrough this mystery, the dream-walker binds a secret the subject knows, so that neither they nor anyone else who knows it can ever expose it.\n\nThe secret is locked away in every mind that holds it.\n\nEvery secret lives in a mind, and every mind dreams. The dream-walkers of the Freehold held that there was no truth so well hidden that it could not be found by one who knew how to walk through sleep."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.018.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.018.name$"
  zz_valyria_magic_dream_magic.018.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject's dreams hold a memory that glows like a coal, dangerous to touch.\n\nThe dream-walkers of Valyria served the dragonlords as keepers of secrets, and as their unmakers. The great families of the Freehold paid fortunes to know what their rivals dreamed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and seal away a secret that [recipient.GetFirstName] knows. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.018.desc_04:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a sealed letter upon the subject's pillow, its wax unbroken. In their dream, a secret they already know is folded into the letter, and the seal hardens over it like iron, so that it cannot be spoken until the subject wishes.\n\nThe dream-walkers of the Freehold taught their patrons that a secret held in reserve was worth more than one spent.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and seal away a secret that [recipient.GetFirstName] knows. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.018.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA small iron casket is set beside the sleeping subject, its lock cold to the touch. In the dream, they place within it a secret they have learned, and the lock closes with a sound like a heavy door falling shut.\n\nIn Valyria, it was said that the best secrets are those kept until the moment they are most needed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and seal away a secret that [recipient.GetFirstName] knows. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.018.opt.a:0 "Lock it away."
  zz_valyria_magic_dream_magic.018.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.018.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.018.name$"
  zz_valyria_magic_dream_magic.018.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sealing away a secret that [recipient.GetFirstName] knows."
  zz_valyria_magic_dream_magic.018.toast.tt:0 "$zz_valyria_magic_dream_magic.018.toast.desc$"

  zz_valyria_magic_dream_magic.018.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.018.name$"
  zz_valyria_magic_dream_magic.018.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.018.f.toast.tt:0 "$zz_valyria_magic_dream_magic.018.f.toast.desc$"

  zz_valyria_magic_dream_magic_019.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_br$\n\nThe use of the arcane forces of [dream_magic|E] to breach the concealment of a scheme that targets the subject.\n\nThrough this mystery, the dream-walker strikes at the shadows that hide a plot against the subject, tearing open a breach that its conspirators cannot easily close.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.019.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.019.name$"
  zz_valyria_magic_dream_magic.019.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, a curtain of darkness hangs over a gathering of whispering figures, and the dream-walker begins to tear at it.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and breach the concealment of a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.019.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster draws a curtain across the doorway of the chamber and speaks a word into its folds. In the subject's dream, another curtain hangs across a gathering of whispering figures, and the dream-walker's hand reaches out to pull it aside.\n\nThe dream-walkers of the Freehold made sure that no plot against their patrons stayed hidden for long.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and breach the concealment of a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.019.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA lantern with its shutters closed is set beside the sleeping subject. As the dream deepens, the caster opens the shutters one by one, and in the dream, light spills into the dark places where a scheme has been carefully hidden.\n\nIn Valyria, there was no shadow so deep that a dream could not reach into it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and breach the concealment of a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.019.opt.a:0 "Tear open the veil."
  zz_valyria_magic_dream_magic.019.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.019.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.019.name$"
  zz_valyria_magic_dream_magic.019.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ breaching the concealment of a scheme aimed at [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.019.toast.tt:0 "$zz_valyria_magic_dream_magic.019.toast.desc$"

  zz_valyria_magic_dream_magic.019.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.019.name$"
  zz_valyria_magic_dream_magic.019.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.019.f.toast.tt:0 "$zz_valyria_magic_dream_magic.019.f.toast.desc$"




  zz_valyria_magic_dream_magic_020.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_br$\n\nThe use of the arcane forces of [dream_magic|E] to breach the concealment of one of the subject's own schemes.\n\nThrough this mystery, the dream-walker strikes at the concealment of one of the subject's own plots, tearing open a breach that will make it far harder to keep hidden.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.020.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.020.name$"
  zz_valyria_magic_dream_magic.020.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, a carefully woven veil of secrecy stirs, and the dream-walker reaches for its edge.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and breach the concealment of one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.020.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster draws a veil of grey gauze across the subject's sleeping face. In their dream, a scheme they have been weaving stirs and shifts, and a careful hand begins to tug at the edges of the secrecy that protects it, testing for a way through.\n\nThe dream-walkers of the Freehold could breach a plot as easily from within as from without.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and breach the concealment of one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.020.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA ring of keys is laid upon the subject's chest as they sleep. In the dream, each key opens a door within a scheme, revealing its paths and passages to the dream-walker's patient gaze.\n\nIn Valyria, it was said that no plot could stay secret from its own maker's dreams.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and breach the concealment of one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.020.opt.a:0 "Tear open the veil."
  zz_valyria_magic_dream_magic.020.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.020.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.020.name$"
  zz_valyria_magic_dream_magic.020.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ breaching the concealment of one of [recipient.GetFirstName]'s own schemes."
  zz_valyria_magic_dream_magic.020.toast.tt:0 "$zz_valyria_magic_dream_magic.020.toast.desc$"

  zz_valyria_magic_dream_magic.020.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.020.name$"
  zz_valyria_magic_dream_magic.020.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.020.f.toast.tt:0 "$zz_valyria_magic_dream_magic.020.f.toast.desc$"

  zz_valyria_magic_dream_magic_021.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_op_up$\n\nThe use of the arcane forces of [dream_magic|E] to grant new opportunities to a scheme that targets the subject.\n\nThrough this mystery, the dream-walker whispers in the sleep of all who stand near a plot against the subject, so that chances fall into the conspirators' hands as if by fate.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.021.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.021.name$"
  zz_valyria_magic_dream_magic.021.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, doors left unlocked and guards looking the wrong way drift past like leaves on a stream.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and empower a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.021.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster sets a model of a great house upon the table, its doors and windows carefully drawn. As the subject sleeps, those doors swing open in their dreams, and the guards within turn their heads, just for a moment, the wrong way.\n\nThe dream-walkers of the Freehold opened doors no locksmith could, and ensured that their patrons' plots found the way clear.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and empower a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.021.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA handful of seeds is scattered upon the sleeping subject's pillow. In the dream, they sprout into a garden, and every plant is an opportunity: a servant ready to be bribed, a door left unbarred, a watchman soon to sleep.\n\nIn Valyria, every plot needed luck, and the dream-walkers were very good at making it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and empower a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.021.opt.a:0 "Let fortune favour the plot."
  zz_valyria_magic_dream_magic.021.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.021.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.021.name$"
  zz_valyria_magic_dream_magic.021.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ empowering a scheme aimed at [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.021.toast.tt:0 "$zz_valyria_magic_dream_magic.021.toast.desc$"

  zz_valyria_magic_dream_magic.021.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.021.name$"
  zz_valyria_magic_dream_magic.021.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.021.f.toast.tt:0 "$zz_valyria_magic_dream_magic.021.f.toast.desc$"

  zz_valyria_magic_dream_magic_022.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_op_up$\n\nThe use of the arcane forces of [dream_magic|E] to grant new opportunities to one of the subject's own schemes.\n\nThrough this mystery, the dream-walker whispers in the sleep of all who stand near the subject's plot, so that chances fall into the subject's hands as if by fate.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.022.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.022.name$"
  zz_valyria_magic_dream_magic.022.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, opportunities drift past like leaves on a stream, waiting to be seized.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and empower one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.022.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA small brazier of sweet herbs smoulders beside the subject's bed. In their dream, the smoke takes the shape of open doors and turned backs, and every one of them leads towards the goal of the scheme they are weaving.\n\nThe dream-walkers of the Freehold made their patrons' plots run smoothly, as if the world itself were helping them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and empower one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.022.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a map beside the sleeping subject, marked with every path their scheme might take. In the dream, the paths grow clearer and brighter, while the obstacles upon them fade like mist in the morning sun.\n\nIn Valyria, it was said that a plot dreamed well was a plot half accomplished.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and empower one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.022.opt.a:0 "Let fortune favour the plot."
  zz_valyria_magic_dream_magic.022.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.022.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.022.name$"
  zz_valyria_magic_dream_magic.022.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ empowering one of [recipient.GetFirstName]'s own schemes."
  zz_valyria_magic_dream_magic.022.toast.tt:0 "$zz_valyria_magic_dream_magic.022.toast.desc$"

  zz_valyria_magic_dream_magic.022.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.022.name$"
  zz_valyria_magic_dream_magic.022.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.022.f.toast.tt:0 "$zz_valyria_magic_dream_magic.022.f.toast.desc$"



  zz_valyria_magic_dream_magic_023.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_fb$\n\nThe use of the arcane forces of [dream_magic|E] to turn a participant away from a scheme that targets the subject.\n\nThrough this mystery, the dream-walker enters the dreams of one who conspires against the subject, and fills them with such dread of the plot that they can no longer bring themselves to take part in it.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.023.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.023.name$"
  zz_valyria_magic_dream_magic.023.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, the conspirators against them gather, and one of them begins to tremble.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and turn a conspirator away from a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.023.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster sets a row of small wooden figures upon the table, each representing a conspirator in a scheme against the subject. As they sleep, one of the figures begins to tremble, and then to topple, and somewhere in the waking world, a conspirator lies awake in the dark, afraid.\n\nThe dream-walkers of the Freehold could turn a plot's own agents against it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and turn a conspirator away from a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.023.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA single thread is drawn from a bundle tied with black cord, and the caster speaks a name into it. In the subject's dream, the conspirators against them gather, and one of them looks over their shoulder, suddenly and terribly uncertain.\n\nIn Valyria, plots were undone not by force but by doubt, and the dream-walkers sowed doubt as easily as farmers sow wheat.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and turn a conspirator away from a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.023.opt.a:0 "Break their resolve."
  zz_valyria_magic_dream_magic.023.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.023.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.023.name$"
  zz_valyria_magic_dream_magic.023.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ turning a conspirator away from a scheme aimed at [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.023.toast.tt:0 "$zz_valyria_magic_dream_magic.023.toast.desc$"


  zz_valyria_magic_dream_magic.023.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.023.name$"
  zz_valyria_magic_dream_magic.023.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.023.f.toast.tt:0 "$zz_valyria_magic_dream_magic.023.f.toast.desc$"


  zz_valyria_magic_dream_magic_024.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_fb$\n\nThe use of the arcane forces of [dream_magic|E] to turn a participant away from one of the subject's own schemes.\n\nThrough this mystery, the dream-walker enters the dreams of one who takes part in the subject's plot, and turns them away from it, so that they can no longer join it.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.024.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.024.name$"
  zz_valyria_magic_dream_magic.024.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, the faces of their fellow conspirators appear, and one of them begins to fade.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and turn a conspirator away from one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.024.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a row of small portraits upon the subject's pillow, each showing one of their fellow conspirators. In the dream, one of the faces begins to fade, and the subject understands, without knowing how, that this one could be turned, replaced, or set aside.\n\nThe dream-walkers of the Freehold arranged their patrons' plots as carefully as a general arranges his troops.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and turn a conspirator away from one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.024.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA goblet of dark wine is shared by caster and subject before they sleep. In the dream, the subject walks among those who serve their plot, and the dream-walker points out the weakest among them, the one most likely to fail.\n\nIn Valyria, a plot was only as strong as its weakest agent. Through this mystery, the subject may learn which that is.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and turn a conspirator away from one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.024.opt.a:0 "Turn them away."
  zz_valyria_magic_dream_magic.024.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.024.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.024.name$"
  zz_valyria_magic_dream_magic.024.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ turning a conspirator away from one of [recipient.GetFirstName]'s own schemes."
  zz_valyria_magic_dream_magic.024.toast.tt:0 "$zz_valyria_magic_dream_magic.024.toast.desc$"

  zz_valyria_magic_dream_magic.024.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.024.name$"
  zz_valyria_magic_dream_magic.024.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.024.f.toast.tt:0 "$zz_valyria_magic_dream_magic.024.f.toast.desc$"


  zz_valyria_magic_dream_magic_025.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_ag$\n\nThe use of the arcane forces of [dream_magic|E] to unmask an agent of a scheme that targets the subject.\n\nThrough this mystery, the dream-walker follows a plot against the subject to one of the agents carrying it out, and drags that agent's face into the light.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.025.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.025.name$"
  zz_valyria_magic_dream_magic.025.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, a hooded figure stands in a doorway, and the hood begins to slip.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and unmask an agent of a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.025.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lights a single candle and holds it close to a hooded figure painted upon a screen. In the subject's dream, the figure stands in a doorway, its face hidden, and as the candle burns lower, the hood slowly begins to slip.\n\nThe dream-walkers of the Freehold made sure that no one who plotted against their patrons stayed hidden for long.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and unmask an agent of a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.025.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA mask of white porcelain is laid upon the subject's chest as they sleep. In their dream, it lies upon another face, one that has been plotting against them, and the caster's hand reaches out to lift it away.\n\nIn Valyria, every conspirator wore a mask. The dream-walkers knew how to take it off.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and unmask an agent of a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.025.opt.a:0 "Unmask the agent!"
  zz_valyria_magic_dream_magic.025.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.025.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.025.name$"
  zz_valyria_magic_dream_magic.025.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ unmasking an agent of a scheme aimed at [recipient.GetFirstName]."
	zz_valyria_magic_dream_magic.025.toast.tt:0 "$zz_valyria_magic_dream_magic.025.toast.desc$"

  zz_valyria_magic_dream_magic.025.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.025.name$"
