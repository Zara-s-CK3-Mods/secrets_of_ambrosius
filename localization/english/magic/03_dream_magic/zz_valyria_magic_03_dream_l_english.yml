  zz_valyria_magic_dream_magic.072.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.072.name$"

  zz_valyria_magic_dream_magic.072.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, sealed vaults and forgotten tribute chests rise from beneath shattered milestones.\n\nThe prophets of the Freehold sent such dreams to the servants of the dragonlords, guiding them to treasures, allies, and opportunities that would otherwise have lain undiscovered for centuries.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards forgotten stores of imperial wealth. Will you show them the way?"
  zz_valyria_magic_dream_magic.072.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a key of tarnished bronze beside the subject's pillow. In the dream, it opens a sealed vault beneath a crumbling milestone, and within, forgotten tribute chests lie waiting, their contents untouched for generations.\n\nThe prophets of the Freehold guided its servants to the lost treasures of fallen kingdoms, and the dragonlords grew richer still.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards forgotten stores of imperial wealth. Will you show them the way?"
  zz_valyria_magic_dream_magic.072.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA coffer of iron, empty and open, is set beside the subject's bed. In the dream, it fills with coin, and the subject sees the road that leads to where that coin has lain hidden since the fall of some long-forgotten lord.\n\nIn Valyria, the wealth of the past belonged to whoever dreamed of it first.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards forgotten stores of imperial wealth. Will you show them the way?"

