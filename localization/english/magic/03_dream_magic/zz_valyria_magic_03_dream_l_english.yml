  zz_valyria_magic_dream_magic_030.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_op_dn$\n\nThe use of the arcane forces of [dream_magic|E] to strip opportunities from one of the subject's own schemes.\n\nThrough this mystery, the dream-walker whispers caution into the sleep of all who stand near the subject's plot, so that its opportunities slip away.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.030.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.030.name$"
  zz_valyria_magic_dream_magic.030.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, the openings they had been counting on close one by one.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and weaken one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.030.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a map beside the sleeping subject and covers it, a little at a time, with dark cloth. In the dream, the openings their own scheme had been counting on close one by one, until only a few remain.\n\nThe dream-walkers of the Freehold could weaken a plot as easily as strengthen it, and were sometimes hired to do both.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and weaken one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.030.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA candle is lit for every opportunity the subject's scheme might seize, and the caster snuffs them out in turn as the subject sleeps. In the dream, those same opportunities slip away, out of reach.\n\nIn Valyria, the dream-walkers held that every plot must pay its due, and that sometimes the due was to fail.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and weaken one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.030.opt.a:0 "Close every door."
  zz_valyria_magic_dream_magic.030.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.030.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.030.name$"
  zz_valyria_magic_dream_magic.030.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ weakening one of [recipient.GetFirstName]'s own schemes."
  zz_valyria_magic_dream_magic.030.toast.tt:0 "$zz_valyria_magic_dream_magic.030.toast.desc$"

  zz_valyria_magic_dream_magic.030.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.030.name$"
  zz_valyria_magic_dream_magic.030.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.030.f.toast.tt:0 "$zz_valyria_magic_dream_magic.030.f.toast.desc$"

  zz_valyria_magic_dream_magic_031.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_rs$\n\nThe use of the arcane forces of [dream_magic|E] to undo the progress of a scheme that targets the subject.\n\nThrough this mystery, the dream-walker scatters the memories and plans of those who plot against the subject, so that all their careful work must begin again.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.031.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.031.name$"
  zz_valyria_magic_dream_magic.031.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, a carefully drawn map of a plot against them begins to blur and fade.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and disrupt a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.031.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster sets a map of a plot against the subject beside them as they sleep, drawn in careful ink. As the dream deepens, the ink begins to run, the lines blurring and smearing until the map is no longer readable.\n\nThe dream-walkers of the Freehold could unpick a plot from within, until its makers no longer knew what they had planned.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and disrupt a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.031.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA sheet of written orders is held over a candle flame, and as it burns, the caster speaks softly into the smoke. In the subject's dream, the scheme against them falls into confusion, its agents forgetting their parts, their timing, their purpose.\n\nIn Valyria, a plot that could not remember itself was a plot that would never succeed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and disrupt a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.031.opt.a:0 "Scatter their plans."
  zz_valyria_magic_dream_magic.031.opt.z:0 "No, do not cast!"
