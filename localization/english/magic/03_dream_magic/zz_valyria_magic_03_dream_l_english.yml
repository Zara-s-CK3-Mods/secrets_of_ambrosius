  zz_valyria_magic_dream_magic_087.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_copn_dn$\n$zz_dur10$\n$zz_stk$\n\nThe use of the arcane forces of [dream_magic|E] to send a county a nightmare of betrayal that lingers for a decade.\n\nThrough this mystery, the people of a county dream, night after night, that their ruler has sold them. No one can say when they first believed it, only that they cannot stop.\n\nThe county's [popular_opinion|E] falls for ten years. The loss is slight, even for a great master, but every further casting adds to it."
  zz_valyria_magic_dream_magic.087.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.087.name$"
  zz_valyria_magic_dream_magic.087.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA seal is pressed into black wax and broken in the same motion. Far away, a village wakes all at once in the dark."
  zz_valyria_magic_dream_magic.087.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster reads a list of names aloud, and after each one they spit. The shadows in the room begin to mutter along."
  zz_valyria_magic_dream_magic.087.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA coin is turned over and over between the fingers until the ruler's face has worn clean away."
  zz_valyria_magic_dream_magic.087.opt.a:0 "Let them dream of betrayal."
  zz_valyria_magic_dream_magic.087.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.087.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.087.name$"
  zz_valyria_magic_dream_magic.087.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending a long nightmare of betrayal to the lands of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.087.toast.tt:0 "$zz_valyria_magic_dream_magic.087.toast.desc$"
  zz_valyria_magic_dream_magic.087.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.087.name$"
  zz_valyria_magic_dream_magic.087.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.087.f.toast.tt:0 "$zz_valyria_magic_dream_magic.087.f.toast.desc$"
  ## Spell Options
