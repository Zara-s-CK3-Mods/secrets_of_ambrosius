  ## Interaction
  zz_valyria_magic_dream_magic_069.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_scq$\n\nThe use of the arcane forces of [dream_magic|E] to send a chosen subject a prophetic dream that will guide them towards the lost glories of their bloodline.\n\nThrough this mystery, a prophecy is seeded in the subject's sleep: a vision that shows them where the lost glories of their bloodline may be found. They wake with the dream burning in their mind, and the chance to set out and seek its fulfilment.\n\nThe subject is given the chance to undertake a quest that may add greatly to the [dynasty_prestige|E] of their dynasty.\n\nProphecy is a gift, but it is not a certainty. The dream shows the way; the dreamer must still walk it."

  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.069.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.069.name$"
  zz_valyria_magic_dream_magic.069.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, a long line of ancestors stands before them, each one pointing towards a buried truth.\n\nThe prophets of the Freehold sent such dreams to the servants of the dragonlords, guiding them to treasures, allies, and opportunities that would otherwise have lain undiscovered for centuries.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards the lost glories of their bloodline. Will you show them the way?"
  zz_valyria_magic_dream_magic.069.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a family tree, drawn in faded ink, beside the subject as they sleep. In the dream, the ancestors upon it step out of the parchment, and each one points towards a deed that would bring honour to their name.\n\nThe prophets of the Freehold reminded the great houses of their past, and showed them how to make it greater still.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards the lost glories of their bloodline. Will you show them the way?"
  zz_valyria_magic_dream_magic.069.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA signet ring bearing the arms of the subject's dynasty is pressed into their palm as they sleep. In the dream, the ring grows warm, and the voices of their forebears speak from it, each one telling of a chance to raise the house higher than before.\n\nIn Valyria, a family's renown was its greatest treasure, and the prophets were its guardians.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards the lost glories of their bloodline. Will you show them the way?"

  zz_valyria_magic_dream_magic.069.opt.a:0 "Seek the lost legacy."
