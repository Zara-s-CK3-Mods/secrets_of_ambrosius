

l_english:

  
  ## Dream Magic Magic
  zz_valyria_magic_dream_magic_001.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_minion$\n$zz_gh$\n$zz_cf$\n$zz_ccul$\n\nThe use of the arcane forces of [dream_magic|E] to bind a chosen subject's mind to the caster's will.\n\nThis is the darkest of the dream arts: the conquest of a mind through its own sleep. Night after night, the subject's dreams are reshaped, until their will bends and their loyalties turn, and they awaken as a servant of the one who walked in their sleep.\n\nThe subject becomes the caster's minion, bound to them by a hook, and adopts the caster's own faith and culture as though they had always held them.\n\nThe dragonlords kept many such servants. Few of those servants ever knew that their devotion had been sown in a dream."
  ## event
  zz_valyria_magic_dream_magic.001.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.001.name$"
  zz_valyria_magic_dream_magic.001.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject's eyelids flutter, and their breathing slows. Somewhere behind their eyes, a door opens, and the caster steps through.\n\nThe dream-binders of Valyria were feared above almost all other sorcerers, for they did not need to kill their enemies. They simply made them into friends.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bind the mind of [recipient.GetFirstName] to your will, making them your servant in faith, culture, and loyalty. But a mind conquered is a soul stolen. Will you take it?"
  zz_valyria_magic_dream_magic.001.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster takes the subject's hands in their own and begins to hum, low and tuneless, until the subject's eyes grow heavy and close. In their dream they find themselves in a familiar room, and in the chair across from them sits the caster, smiling as though they had always been the dearest of friends.\n\nThe dream-binders of the Freehold never raised their voices. They did not need to.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bind the mind of [recipient.GetFirstName] to your will, making them your servant in faith, culture, and loyalty. But a mind conquered is a soul stolen. Will you take it?"
  zz_valyria_magic_dream_magic.001.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA bowl of warm milk sweetened with poppy is pressed into the subject's hands, and they drink without quite meaning to. Sleep comes quickly, and with it a voice, gentle and reasonable, that agrees with every thought they have, and then, slowly, begins to suggest new ones.\n\nIn Valyria it was said that the surest chains are the ones the prisoner forges for themselves.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bind the mind of [recipient.GetFirstName] to your will, making them your servant in faith, culture, and loyalty. But a mind conquered is a soul stolen. Will you take it?"
  zz_valyria_magic_dream_magic.001.opt.a:0 "Your mind is mine."
  zz_valyria_magic_dream_magic.001.opt.z:0 "No, do not cast!"
  ## Dream 001 - choices
  zz_domination_mind:0 "Mind"
  zz_domination_soul:0 "Mind, Body, and Soul"
  ## Spell Toast
  zz_valyria_magic_dream_magic.001.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.001.name$"
  zz_valyria_magic_dream_magic.001.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ binding the mind of [recipient.GetFirstName] to their will."
  zz_valyria_magic_dream_magic.001.toast.tt:0 "$zz_valyria_magic_dream_magic.001.toast.desc$"

  zz_valyria_magic_dream_magic.001.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.001.name$"
  zz_valyria_magic_dream_magic.001.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.001.f.toast.tt:0 "$zz_valyria_magic_dream_magic.001.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_002.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_glt$\n\nThe use of the arcane forces of [dream_magic|E] to grant a chosen subject the experience of lives they never lived.\n\nIn dreams, a lifetime may pass in a single night. Through this mystery, the subject dreams of years spent mastering an art: the scholar's library, the commander's campaigns, the courtier's halls. They wake with the experience of those years still in their hands.\n\nThe subject gains experience in their lifestyle traits, as though they had truly lived the dreamed years.\n\nThe dream-tutors of the Freehold educated the heirs of the great houses in this way, cramming decades of learning into a few weeks of sleep."

  #event
  zz_valyria_magic_dream_magic.002.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.002.name$"
  zz_valyria_magic_dream_magic.002.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject sleeps, and in their sleep the seasons turn: summers and winters of study and practice pass behind their closed eyes in the space of a single night.\n\nThe Valyrians called this the Long Dream, and those who underwent it woke wiser and older in spirit, though not a day had passed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] the experience of lives unlived, deepening their mastery of their chosen arts. Will you send them into the Long Dream?"
  zz_valyria_magic_dream_magic.002.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nIncense of sandalwood and myrrh fills the chamber, and the subject drifts into a sleep so deep it seems to last a lifetime. In it they live another life: an apprenticeship, a long practice, a mastery hard won, all of it vivid and all of it theirs.\n\nThe dream-masters of the Freehold could grant a lifetime's habit in a single night, and the habits they granted were rarely forgotten.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] the experience of lives unlived, deepening their mastery of their chosen arts. Will you send them into the Long Dream?"
  zz_valyria_magic_dream_magic.002.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a silver coin upon each of the subject's eyelids and begins to count, slowly, backwards from a hundred. Long before the count is done, the subject is asleep, and in their sleep the years unspool, filled with the patient work of becoming something new.\n\nValyria's nobility sent their heirs into such dreams as other lords sent theirs to tutors, and expected far more of them on waking.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] the experience of lives unlived, deepening their mastery of their chosen arts. Will you send them into the Long Dream?"
  zz_valyria_magic_dream_magic.002.opt.a:0 "Let them dream of mastery."
  zz_valyria_magic_dream_magic.002.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.002.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.002.name$"
  zz_valyria_magic_dream_magic.002.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ granting [recipient.GetFirstName] the experience of lives unlived."
  zz_valyria_magic_dream_magic.002.toast.tt:0 "$zz_valyria_magic_dream_magic.002.toast.desc$"

  zz_valyria_magic_dream_magic.002.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.002.name$"
  zz_valyria_magic_dream_magic.002.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.002.f.toast.tt:0 "$zz_valyria_magic_dream_magic.002.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_003.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_glx$\n\nThe use of the arcane forces of [dream_magic|E] to let a chosen subject learn at the feet of the great masters in their dreams.\n\nThe memories of the great masters of every art linger in the world of dreams. Through this mystery, the subject is led to them in sleep, and learns from them as an apprentice learns from a teacher.\n\nThe subject gains experience in their current lifestyle focus.\n\nSome of those who underwent this working claimed to have studied with masters dead for a thousand years. They could rarely say how they knew the names."
  #event
  zz_valyria_magic_dream_magic.003.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.003.name$"
  zz_valyria_magic_dream_magic.003.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's dreams, a door opens onto a hall filled with shadowy figures: scholars bent over books, generals over maps, courtiers whispering in corners.\n\nThe dream-tutors of the Freehold kept these halls of memory, and guided the favoured children of Valyria through them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may lead [recipient.GetFirstName] into the dream-halls of the masters, deepening their study of their chosen focus. Will you open the door?"
  zz_valyria_magic_dream_magic.003.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA small brass bell is rung once above the subject's head, and its note lingers far longer than it should. As it fades, the subject sleeps, and in their dream they find themselves among masters of their craft, watching, listening, learning without effort.\n\nThe dream-tutors of Valyria taught a hundred students at once, in a hundred different dreams, and never once raised their voices.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may lead [recipient.GetFirstName] into the dream-halls of the masters, deepening their study of their chosen focus. Will you open the door?"
  zz_valyria_magic_dream_magic.003.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster reads aloud from an old book as the subject drifts off, and the words follow them down into sleep. In the dream, the pages become rooms and the rooms become lessons, each one opening onto the next like the chambers of a great library.\n\nIn the Freehold, a single night in the dream-halls was said to be worth a season of study.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may lead [recipient.GetFirstName] into the dream-halls of the masters, deepening their study of their chosen focus. Will you open the door?"
  zz_valyria_magic_dream_magic.003.opt.a:0 "Learn from the masters."
  zz_valyria_magic_dream_magic.003.opt.b:0 "Yes,  dream of Diplomacy!"
  zz_valyria_magic_dream_magic.003.opt.c:0 "Yes,  dream of Stewardship!"
  zz_valyria_magic_dream_magic.003.opt.d:0 "Yes,  dream of Intrigue!"
  zz_valyria_magic_dream_magic.003.opt.e:0 "Yes,  dream of Martial!"
  zz_valyria_magic_dream_magic.003.opt.f:0 "Yes,  dream of Wandering!"
  zz_valyria_magic_dream_magic.003.opt.g:0 "Yes,  dream of Prowess!"
  zz_valyria_magic_dream_magic.003.opt.h:0 "Yes,  dream of Leadership!"
  zz_valyria_magic_dream_magic.003.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.003.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.003.name$"
  zz_valyria_magic_dream_magic.003.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ leading [recipient.GetFirstName] to learn at the feet of the great masters."
  zz_valyria_magic_dream_magic.003.toast.tt:0 "$zz_valyria_magic_dream_magic.003.toast.desc$"

  zz_valyria_magic_dream_magic.003.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.003.name$"
  zz_valyria_magic_dream_magic.003.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.003.f.toast.tt:0 "$zz_valyria_magic_dream_magic.003.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_004.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_esec$\n$zz_sch_exp_all$\n\nThe use of the arcane forces of [dream_magic|E] to grant a chosen subject recurring dreams that lay bare the secrets and schemes around them.\n\nThrough this mystery, the subject is gifted with soothsaying dreams that continue for a long time after the working is done. Night after night, the dreams reveal the hidden truths of the people around them: secrets they keep, and plots they are weaving.\n\nThe revelations come gradually, and not always clearly, but over time the subject comes to know far more than anyone around them suspects.\n\nThe soothsayers of the Freehold sat at the right hand of the dragonlords, and few conspiracies escaped their dreams for long."

  #event
  zz_valyria_magic_dream_magic.004.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.004.name$"
  zz_valyria_magic_dream_magic.004.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject's dreams fill with whispers and half-glimpsed faces, and through them all runs a thread of light, leading always towards the hidden and the unsaid.\n\nThe soothsayers of Valyria were prized above any spy, for their sources could never be bribed, threatened, or turned.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] the soothsaying dreams, revealing to them over time the secrets and schemes of those around them. Will you open their eyes in sleep?"
  zz_valyria_magic_dream_magic.004.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster burns a page of a letter that was never meant to be read, and lets its ash fall upon the subject's pillow. In their sleep, other ashes stir and reassemble, other letters spell themselves out, and the hidden things of the world begin to whisper their names.\n\nThe soothsayers of the Freehold knew more secrets than all its spies together, and they never once had to bribe a servant.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] the soothsaying dreams, revealing to them over time the secrets and schemes of those around them. Will you open their eyes in sleep?"
  zz_valyria_magic_dream_magic.004.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA cup of dark wine, drugged with something bitter, is shared between caster and subject. As they sleep, their dreams run together, and the caster leads the subject through a city of closed doors, opening each in turn to show what lies behind it.\n\nIn Valyria, no secret was truly safe so long as the one who kept it still slept.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] the soothsaying dreams, revealing to them over time the secrets and schemes of those around them. Will you open their eyes in sleep?"
  zz_valyria_magic_dream_magic.004.opt.a:0 "Let their dreams reveal all."
  zz_valyria_magic_dream_magic.004.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.004.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.004.name$"
  zz_valyria_magic_dream_magic.004.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ granting [recipient.GetFirstName] dreams that lay bare the secrets and schemes around them."
  zz_valyria_magic_dream_magic.004.toast.tt:0 "$zz_valyria_magic_dream_magic.004.toast.desc$"

  zz_valyria_magic_dream_magic.004.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.004.name$"
  zz_valyria_magic_dream_magic.004.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.004.f.toast.tt:0 "$zz_valyria_magic_dream_magic.004.f.toast.desc$"

  zz_valyria_magic_dream_magic.004.buff.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.004.name$"
  zz_valyria_magic_dream_magic.004.buff.toast.desc:0 "Your dreams have shown to you a secret relating to [dreaming_magic_secret_target.GetNameNoTooltip]"
  zz_valyria_magic_dream_magic.004.buff.toast.tt:0 "$zz_valyria_magic_dream_magic.048.buff.toast.desc$"



  ## Interaction
  zz_valyria_magic_dream_magic_005.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_mpt$\n\nThe use of the arcane forces of [dream_magic|E] to reshape the personality of a chosen subject through whispered dreams.\n\nCharacter is shaped by experience, and experience can be dreamed. Through this mystery, careful whispers are planted in the subject's sleep, nudging them night by night until a trait of their personality is changed.\n\nA coward may wake brave; a kind heart may wake cruel. The subject rarely notices the change, and never knows its cause.\n\nThe dream-whisperers of the Freehold shaped the temperaments of heirs and rivals alike. Some of the greatest dragonlords were, in a sense, their creations."
  ##Spell Options
  ## event
  zz_valyria_magic_dream_magic.005.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.005.name$"
  zz_valyria_magic_dream_magic.005.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. A soft voice begins to murmur in the subject's sleep, too low to make out the words, but insistent, patient, and endlessly repeated.\n\nThe Valyrians held that a person was only the sum of the stories they told themselves, and the dream-whisperers were masters at changing the story.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may reshape the nature of [recipient.GetFirstName] through whispered dreams. But a soul remade is no longer the soul that was. Will you change them?"
  zz_valyria_magic_dream_magic.005.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster sits at the subject's bedside through the night, speaking softly, never stopping. The words are simple and patient, repeated again and again: you are this, you are not that, you have always been so. By the morning, the subject believes it.\n\nThe dream-whisperers of the Freehold could change a man's temper as easily as a smith changes the shape of iron.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may reshape the nature of [recipient.GetFirstName] through whispered dreams. But a soul remade is no longer the soul that was. Will you change them?"
  zz_valyria_magic_dream_magic.005.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA small mirror is set beside the subject's pillow, angled so that their face is reflected as they sleep. In the dream, the reflection speaks to them, and slowly, as the night wears on, it begins to change, its expression settling into something new.\n\nThe Valyrians held that character is only a habit of the mind, and that habits can be broken in sleep as easily as they are made in waking.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may reshape the nature of [recipient.GetFirstName] through whispered dreams. But a soul remade is no longer the soul that was. Will you change them?"
  zz_valyria_magic_dream_magic.005.opt.a:0 "Whisper them into a new shape."
  zz_valyria_magic_dream_magic.005.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.005.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.005.name$"
  zz_valyria_magic_dream_magic.005.toast.desc:0  "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ reshaping the nature of [recipient.GetFirstName] through whispered dreams."
  zz_valyria_magic_dream_magic.005.toast.tt:0 "$zz_valyria_magic_dream_magic.005.toast.desc$"

  zz_valyria_magic_dream_magic.005.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.005.name$"
  zz_valyria_magic_dream_magic.005.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.005.f.toast.tt:0 "$zz_valyria_magic_dream_magic.005.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_006.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_get$\n\nThe use of the arcane forces of [dream_magic|E] to rewrite the education of a chosen subject through dreams of a childhood that never was.\n\nThrough this mystery, the subject dreams of a youth they never lived, of tutors and lessons that never happened. When they wake, the knowledge of that dreamed education remains, and their education is changed accordingly.\n\nA poorly schooled ruler may wake as though they had studied under the finest tutors of their age, or an educated mind may be steered towards a different discipline.\n\nThe dream-tutors of Valyria remade the education of many a disappointing heir, saving the honour of their house."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.006.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.006.name$"
  zz_valyria_magic_dream_magic.006.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, the years run backwards. They are a child again, sitting at a desk before a tutor whose face they will not remember on waking.\n\nThe Valyrians called this the Second Schooling, and considered it a kindness.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may rewrite the education of [recipient.GetFirstName] with dreams of a childhood that never was. Will you send them back to school in their sleep?"
  zz_valyria_magic_dream_magic.006.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster burns a tutor's old rod in the brazier and lets its smoke drift over the sleeping subject. In their dream, they sit once more in a schoolroom of their childhood, though the lessons now are different, and the teacher's face is one they have never seen.\n\nThe Freehold did not leave the education of its great families to chance. If a child was badly taught, the dream-tutors simply taught them again.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may rewrite the education of [recipient.GetFirstName] with dreams of a childhood that never was. Will you send them back to school in their sleep?"
  zz_valyria_magic_dream_magic.006.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA child's slate and stylus are laid upon the subject's chest as they sleep. In the dream, they are young again, writing out lessons in a careful hand, while a patient voice corrects every mistake before it is made.\n\nThe Valyrians believed that no mind was ever finished, and that the right dream could undo a poor education as surely as a good one could create it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may rewrite the education of [recipient.GetFirstName] with dreams of a childhood that never was. Will you send them back to school in their sleep?"
  zz_valyria_magic_dream_magic.006.opt.a:0 "Let them learn anew."
  zz_valyria_magic_dream_magic.006.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.006.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.006.name$"
  zz_valyria_magic_dream_magic.006.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ rewriting the education of [recipient.GetFirstName] through dreams of a childhood that never was."
  zz_valyria_magic_dream_magic.006.toast.tt:0 "$zz_valyria_magic_dream_magic.006.toast.desc$"

  zz_valyria_magic_dream_magic.006.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.006.name$"
  zz_valyria_magic_dream_magic.006.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.006.f.toast.tt:0 "$zz_valyria_magic_dream_magic.006.f.toast.desc$"



  zz_valyria_magic_dream_magic_007.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_fasc$\n\nThe use of the arcane forces of [dream_magic|E] to inspire a culture's thinkers with dreams of the innovations to come.\n\nEvery great invention was first a dream. Through this mystery, the sleeping minds of a culture's scholars, artisans, and thinkers are filled with visions of the future, and the culture's current fascination advances far faster than it otherwise would.\n\nThe subject's culture progresses towards its next innovation with remarkable speed.\n\nThe Freehold seemed to discover in decades what took other peoples centuries. Its enemies never understood why."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.007.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.007.name$"
  zz_valyria_magic_dream_magic.007.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. Across the lands of a whole people, scholars stir in their sleep, murmuring of strange devices and new ideas they have never heard of.\n\nThe dream-sowers of the Freehold planted the seeds of invention in the minds of Valyria's thinkers, and harvested the results.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may inspire the culture of [recipient.GetFirstName] with dreams of the innovations to come. Will you sow the dreams of progress?"
  zz_valyria_magic_dream_magic.007.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster sets a model of a strange machine upon the table, made of brass and wood and parts that seem to serve no purpose. As they sleep, its shape slips into the dreams of scholars far away, who wake with sketches half-formed in their minds and an itch they cannot scratch.\n\nThe dream-sowers of the Freehold seeded ideas across whole peoples, and then waited patiently for them to grow.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may inspire the culture of [recipient.GetFirstName] with dreams of the innovations to come. Will you sow the dreams of progress?"
  zz_valyria_magic_dream_magic.007.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA blank sheet of vellum is laid at the caster's side as they sleep. By morning, it is covered in diagrams, drawn in a hand that is not the caster's, and across the land, scholars stir from sleep with the same diagrams burning behind their eyes.\n\nIn Valyria, inspiration was not left to the gods. It was sent.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may inspire the culture of [recipient.GetFirstName] with dreams of the innovations to come. Will you sow the dreams of progress?"
  zz_valyria_magic_dream_magic.007.opt.a:0 "Let them dream of progress."
  zz_valyria_magic_dream_magic.007.opt.b:0 "Add a new cultural tradition instead!"
  zz_valyria_magic_dream_magic.007.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.007.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.007.name$"
  zz_valyria_magic_dream_magic.007.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ inspiring the culture of [recipient.GetFirstName] with dreams of innovation."
  zz_valyria_magic_dream_magic.007.toast.tt:0 "$zz_valyria_magic_dream_magic.007.toast.desc$"

  zz_valyria_magic_dream_magic.007.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.007.name$"
  zz_valyria_magic_dream_magic.007.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.007.f.toast.tt:0 "$zz_valyria_magic_dream_magic.007.f.toast.desc$"




  zz_valyria_magic_dream_magic_008.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_duel_move$\n$zz_duel_skill$\n\nThe use of the arcane forces of [dream_magic|E] to strike down a chosen subject with murderous visions.\n\nDreams can kill. Through this mystery, a nightmare of such terrible force is loosed upon the subject that their body answers it: the heart stutters, the blood runs cold, and wounds open where the dream has struck.\n\nIn the moment of the nightmare, the caster may choose whether to cripple or to kill.\n\nMore than one enemy of the Freehold died in their sleep, with an expression of perfect terror upon their face."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.008.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.008.name$"
  zz_valyria_magic_dream_magic.008.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. Then the drowsiness turns sour. Shadows stretch, and somewhere in the dark a figure takes shape, wearing the face of the subject's deepest fear.\n\nThe dream-assassins of Valyria never needed to enter a bedchamber. They entered the dreams of those who slept within them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may loose a murderous nightmare upon [recipient.GetFirstName], and decide whether they wake broken or do not wake at all. Is such a death fitting?"
  zz_valyria_magic_dream_magic.008.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lies down in a darkened room, a lock of the subject's hair held in their fist. As sleep comes, they walk out of their own dream and into another, and the sleeper there turns, too late, to see what has come for them.\n\nThe dream-assassins of the Freehold left no wounds, no poison and no witnesses. Their victims simply never woke.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may loose a murderous nightmare upon [recipient.GetFirstName], and decide whether they wake broken or do not wake at all. Is such a death fitting?"
  zz_valyria_magic_dream_magic.008.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA single black candle burns at the head of the caster's bed, and they speak the subject's name three times into its flame. In their sleep, they find the subject's dreams, and in them, a door that should never have been opened.\n\nIt was said in Valyria that a nightmare could kill as surely as any blade, if it was sent by the right hand.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may loose a murderous nightmare upon [recipient.GetFirstName], and decide whether they wake broken or do not wake at all. Is such a death fitting?"
  zz_valyria_magic_dream_magic.008.opt.a:0 "Let the nightmare take them."
  zz_valyria_magic_dream_magic.008.opt.b:0 "Yes, send them to the dream!"
  zz_valyria_magic_dream_magic.008.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.008.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.008.name$"
  zz_valyria_magic_dream_magic.008.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ loosing a murderous nightmare upon [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.008.toast.tt:0 "$zz_valyria_magic_dream_magic.008.toast.desc$"

  zz_valyria_magic_dream_magic.008.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.008.name$"
  zz_valyria_magic_dream_magic.008.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.008.f.toast.tt:0 "$zz_valyria_magic_dream_magic.008.f.toast.desc$"



  zz_valyria_magic_dream_magic_009.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_skl$\n\nThe use of the arcane forces of [dream_magic|E] to grant a chosen subject flashes of insight glimpsed in prophetic dreams.\n\nThrough this mystery, the subject is granted scrying dreams that show them small glimpses of what is to come: a conversation, a battle, a ledger. Armed with this foreknowledge, they grow more capable in their dealings.\n\nThe subject's skills improve, the insight of the dream guiding their hand.\n\nThe insights are small, but the Valyrians knew that small insights, gathered over a lifetime, make the difference between a good ruler and a great one."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.009.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.009.name$"
  zz_valyria_magic_dream_magic.009.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, scenes flicker past like reflections in moving water: tomorrow's council, next week's hunt, a letter not yet written.\n\nThe scryers of the Freehold advised its archons, and their advice always seemed, somehow, to come just in time.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] glimpses of the future in their dreams, sharpening their skills. Will you show them what is to come?"
  zz_valyria_magic_dream_magic.009.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster pours clear water into a black basin and sets it beneath the subject's bed. As they sleep, its surface stirs, and in it, half-formed, the shapes of days to come drift past: a meeting, a quarrel, a choice that must soon be made.\n\nThe scryers of the Freehold did not tell the future. They showed it, a glimpse at a time, to those who were wise enough to listen.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] glimpses of the future in their dreams, sharpening their skills. Will you show them what is to come?"
  zz_valyria_magic_dream_magic.009.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA string of polished stones is wound about the subject's wrist, each one carved with a single rune. As they sleep, the stones grow warm in turn, and with each one, a scene of the days ahead unfolds behind their eyes.\n\nIn Valyria, a lord forewarned was a lord forearmed, and the dream-seers made sure the Freehold's lords were never caught unawares.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] glimpses of the future in their dreams, sharpening their skills. Will you show them what is to come?"
  zz_valyria_magic_dream_magic.009.opt.a:0 "Show them the future."
  zz_valyria_magic_dream_magic.009.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.009.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.009.name$"
  zz_valyria_magic_dream_magic.009.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ granting [recipient.GetFirstName] flashes of insight from prophetic dreams."
  zz_valyria_magic_dream_magic.009.toast.tt:0 "$zz_valyria_magic_dream_magic.009.toast.desc$"

  zz_valyria_magic_dream_magic.009.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.009.name$"
  zz_valyria_magic_dream_magic.009.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.009.f.toast.tt:0 "$zz_valyria_magic_dream_magic.009.f.toast.desc$"


  zz_valyria_magic_dream_magic_010.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_pdpg$\n$zz_dury$\n\nThe use of the arcane forces of [dream_magic|E] to draw upon the power of future dreams, strengthening a chosen subject's mystic power over time.\n\nThe power that flows through the world flows through dreams too, and dreams are not bound by time. Through this mystery, the subject draws upon the power of the dreams they have yet to dream, and their mystic strength grows over the months to come.\n\nThe effect is slow and enduring, a steady swelling of the subject's capacity to wield the Higher Mysteries.\n\nThe great sorcerers of the Freehold were said to borrow from their own futures. Some of them, it was whispered, borrowed too much."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.010.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.010.name$"
  zz_valyria_magic_dream_magic.010.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject's sleep is deep and still, and around them the air glimmers faintly, as though lit by stars that have not yet risen.\n\nThe soothsayers of Valyria taught that every dream holds a drop of power, and that a skilled practitioner could gather those drops before they fell.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw upon the dreams yet to come for [recipient.GetFirstName], strengthening their mystic power over time. Will you borrow from their future?"
  zz_valyria_magic_dream_magic.010.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA ring of white candles is lit around the subject's bed, and the caster speaks the old words softly as they sleep. One by one the flames bend inward, towards the sleeper, and a faint glow gathers about them like dew forming on grass.\n\nThe soothsayers of the Freehold taught that power drips from the dreams of the sleeping, and that those who know how may catch it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw upon the dreams yet to come for [recipient.GetFirstName], strengthening their mystic power over time. Will you borrow from their future?"
  zz_valyria_magic_dream_magic.010.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster draws a spiral of chalk upon the floor and lays the subject at its centre. As sleep takes them, the chalk lines begin to glimmer, and the light runs inward along the spiral until it pools about the sleeper.\n\nIn Valyria, it was said that dreams were the wellspring of all magic. Through this mystery, that wellspring is tapped.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw upon the dreams yet to come for [recipient.GetFirstName], strengthening their mystic power over time. Will you borrow from their future?"
  zz_valyria_magic_dream_magic.010.opt.a:0 "Draw on the dreams to come."
  zz_valyria_magic_dream_magic.010.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.010.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.010.name$"
  zz_valyria_magic_dream_magic.010.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ drawing upon future dreams to strengthen the mystic power of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.010.toast.tt:0 "$zz_valyria_magic_dream_magic.010.toast.desc$"

  zz_valyria_magic_dream_magic.010.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.010.name$"
  zz_valyria_magic_dream_magic.010.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.010.f.toast.tt:0 "$zz_valyria_magic_dream_magic.010.f.toast.desc$"


  zz_valyria_magic_dream_magic_011.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_exp$\n\nThe use of the arcane forces of [dream_magic|E] to expose one of the subject's own schemes.\n\nThrough this mystery, the dream-walker follows the subject's thoughts to a plot that is close to their heart, and drags it into the light, exposing it and those who take part in it.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.011.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.011.name$"
  zz_valyria_magic_dream_magic.011.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, a web of whispered conversations takes shape, every thread leading back to them.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and expose one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.011.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a spider's web, carefully gathered and kept whole, upon the subject's pillow. In their dream, the web grows vast, its threads stretching out into the dark, and along each one runs a whisper of plotting that leads back to them.\n\nThe dream-walkers of the Freehold saw every scheme in the city, and chose which of them would ever see the light of day.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and expose one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.011.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA game of pieces and squares is set out beside the sleeping subject, every piece standing in its place. As they dream, the pieces begin to move on their own, playing out moves that are being made, at that very moment, in the waking world.\n\nIn Valyria, it was said that no plot could be hidden from one who knew how to watch the dreams of its makers.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and expose one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.011.opt.a:0 "Expose the plot!"
  zz_valyria_magic_dream_magic.011.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.011.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.011.name$"
  zz_valyria_magic_dream_magic.011.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ exposing one of [recipient.GetFirstName]'s own schemes."
  zz_valyria_magic_dream_magic.011.toast.tt:0 "$zz_valyria_magic_dream_magic.011.toast.desc$"

  zz_valyria_magic_dream_magic.011.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.011.name$"
  zz_valyria_magic_dream_magic.011.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.011.f.toast.tt:0 "$zz_valyria_magic_dream_magic.011.f.toast.desc$"

  zz_valyria_magic_dream_magic_012.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_exp$\n\nThe use of the arcane forces of [dream_magic|E] to expose a scheme that targets the subject.\n\nThrough this mystery, the dream-walker follows the fears that trouble the subject's sleep to the plot that causes them, and drags it into the light, exposing it to the world.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.012.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.012.name$"
  zz_valyria_magic_dream_magic.012.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, half-seen figures gather in the shadows, whispering their name.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and expose a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.012.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster speaks the subject's name into a closed fist, then opens it over their sleeping face. In the dream, a crowd of whispering figures turns towards them, and the subject sees, clearly and suddenly, each of the hands that are reaching for them in the dark.\n\nThe dream-walkers of the Freehold made sure that their patrons always knew who was plotting against them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and expose a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.012.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA small silver bell is hung above the subject's bed, and it rings softly as they sleep, though no hand touches it. With each chime, a face appears in their dream, and each face belongs to someone who means them harm.\n\nIn Valyria, it was said that every plot leaves a mark in the dreams of its target. The dream-walkers knew how to read those marks.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and expose a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.012.opt.a:0 "Expose the plot!"
  zz_valyria_magic_dream_magic.012.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.012.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.012.name$"
  zz_valyria_magic_dream_magic.012.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ exposing a scheme aimed at [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.012.toast.tt:0 "$zz_valyria_magic_dream_magic.012.toast.desc$"

  zz_valyria_magic_dream_magic.012.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.012.name$"
  zz_valyria_magic_dream_magic.012.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.012.f.toast.tt:0 "$zz_valyria_magic_dream_magic.012.f.toast.desc$"


  zz_valyria_magic_dream_magic_013.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sec_rv$\n\nThe use of the arcane forces of [dream_magic|E] to uncover one of the subject's own secrets.\n\nThrough this mystery, the dream-walker enters the subject's mind and searches through their dreams for the things they most fear to have known. When one is found, it is laid bare.\n\nThe secret is revealed to the caster, to be used however they see fit.\n\nEvery secret lives in a mind, and every mind dreams. The dream-walkers of the Freehold held that there was no truth so well hidden that it could not be found by one who knew how to walk through sleep."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.013.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.013.name$"
  zz_valyria_magic_dream_magic.013.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject's dreams twist uneasily, circling something they will not look at directly.\n\nThe dream-walkers of Valyria served the dragonlords as keepers of secrets, and as their unmakers. The great families of the Freehold paid fortunes to know what their rivals dreamed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and uncover one of [recipient.GetFirstName]'s own secrets. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.013.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster draws a locked door upon the subject's palm in ink, and as they sleep, the door opens. In the dream, a dim room lies beyond it, cluttered with things the subject had tried very hard to forget, and every one of them is still there.\n\nThe dream-walkers of the Freehold held that no secret is ever truly buried, only hidden somewhere the waking mind refuses to go.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and uncover one of [recipient.GetFirstName]'s own secrets. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.013.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA small box of carved wood is set upon the subject's chest as they sleep, its lid closed. In their dream, they find the box again, and know without opening it what lies inside, and the caster, watching, knows too.\n\nThe great families of Valyria guarded their secrets with walls and oaths. The dream-walkers simply waited until they slept.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and uncover one of [recipient.GetFirstName]'s own secrets. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.013.opt.a:0 "Find what they hide."
  zz_valyria_magic_dream_magic.013.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.013.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.013.name$"
  zz_valyria_magic_dream_magic.013.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ uncovering one of [recipient.GetFirstName]'s own secrets."
