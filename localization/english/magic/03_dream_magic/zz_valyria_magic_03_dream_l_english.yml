  ## Spell Toast


  ## Interaction
  zz_valyria_magic_dream_magic_093.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_gflat_dn$\n$zz_dur10$\n$zz_stk$\n\nThe use of the arcane forces of [dream_magic|E] to send a county a nightmare of want that lingers for a decade.\n\nThrough this mystery, the people of a county dream of empty barns and shuttered stalls. Trade falters, wells go unmended, and each year leaves the county a little poorer than the last.\n\nThe county loses a small, steady amount of [prosperity|E] each month for ten years. The harm is slight, even for a great master, but every further casting adds to it."
  zz_valyria_magic_dream_magic.093.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.093.name$"
  zz_valyria_magic_dream_magic.093.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nGrains of wheat are poured from hand to hand, and fewer land each time. The caster does not look down."
  zz_valyria_magic_dream_magic.093.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe sound of an empty market fills the chamber: a shutter knocking, a dog, and nothing else."
  zz_valyria_magic_dream_magic.093.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA full bowl is set before the caster. By the end of the working it is dust, and the bowl has a crack in it."
  zz_valyria_magic_dream_magic.093.opt.a:0 "Let them dream of want."
  zz_valyria_magic_dream_magic.093.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.093.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.093.name$"
  zz_valyria_magic_dream_magic.093.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending a long nightmare of want to the lands of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.093.toast.tt:0 "$zz_valyria_magic_dream_magic.093.toast.desc$"
  zz_valyria_magic_dream_magic.093.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.093.name$"
  zz_valyria_magic_dream_magic.093.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.093.f.toast.tt:0 "$zz_valyria_magic_dream_magic.093.f.toast.desc$"
