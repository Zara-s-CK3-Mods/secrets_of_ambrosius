  zz_valyria_magic_dream_magic.073.f.toast.tt:0 "$zz_valyria_magic_dream_magic.073.f.toast.desc$"




  ## Dream Magic - Mystery of the Dreaming Road (Hasten)
  zz_valyria_magic_dream_magic_074.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_trvl_h$\n$zz_onroad$\n\nThe use of the arcane forces of [dream_magic|E] to walk again, in sleep, the road a travelling subject has already taken, and so draw the road still ahead of them straight.\n\nThe dreamers of old held that every journey is a single thread, and that what has been walked can be pulled tight. The longer the road behind the traveller, the more thread there is to work with: a journey of a few days can barely be touched, but one of many months can be hastened greatly.\n\nThe subject's [travel|E] is hastened for the rest of their journey, more so the further they have already travelled and the greater the caster's skill."
  zz_valyria_magic_dream_magic.074.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.074.name$"
  zz_valyria_magic_dream_magic.074.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lies down beside a map on which the subject's road has been traced in ink, from where they set out to where they now stand. As sleep comes, the ink seems to run and pool, and in the dream the caster walks that road again, mile upon mile, feeling every turn of it underfoot.\n\nAt the end of the inked line the road fades into mist. Here it can be drawn straight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you draw the road straight?"
  zz_valyria_magic_dream_magic.074.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lies down with a compass held against their chest, its needle trembling. As sleep comes, they find themselves on the subject's road, and they walk it backwards, from where the subject now stands to where they set out, gathering up every mile in their hands like thread.\n\nAt the end, the gathered thread lies loose and ready. Pulled tight, it will draw the road ahead of the subject shorter.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you draw the road straight?"
  zz_valyria_magic_dream_magic.074.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA pair of the subject's travelling boots is set at the foot of the caster's bed, their soles still caked with the dust of the road. In sleep, the caster puts them on and walks, and the road beneath their feet is the road the subject has already travelled.\n\nWhere the dust runs out, the road ahead begins, and there the dreamer may ease the way.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you draw the road straight?"
  zz_valyria_magic_dream_magic.074.opt.a:0 "Draw the road straight, let them travel swiftly!"
  zz_valyria_magic_dream_magic.074.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.074.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.074.name$"
  zz_valyria_magic_dream_magic.074.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ drawing straight the road beneath [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.074.toast.tt:0 "$zz_valyria_magic_dream_magic.074.toast.desc$"
  zz_valyria_magic_dream_magic.074.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.074.name$"
  zz_valyria_magic_dream_magic.074.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.074.f.toast.tt:0 "$zz_valyria_magic_dream_magic.074.f.toast.desc$"
  ## Dream Magic - Mystery of the Dreaming Road (Hinder)
  zz_valyria_magic_dream_magic_075.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_trvl_d$\n$zz_onroad$\n\nThe use of the arcane forces of [dream_magic|E] to walk again, in sleep, the road a travelling subject has already taken, and so knot the road still ahead of them.\n\nThe dreamers of old held that every journey is a single thread, and that what has been walked can be tangled. The longer the road behind the traveller, the more thread there is to work with: a journey of a few days can barely be touched, but one of many months can be snarled into long delay.\n\nThe subject's [travel|E] is delayed by a number of days, more so the further they have already travelled and the greater the caster's skill."
  zz_valyria_magic_dream_magic.075.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.075.name$"
  zz_valyria_magic_dream_magic.075.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lies down beside a map on which the subject's road has been traced in ink, from where they set out to where they now stand. As sleep comes, the ink seems to run and pool, and in the dream the caster walks that road again, mile upon mile, feeling every turn of it underfoot.\n\nAt the end of the inked line the road divides into mist, and the mist into a hundred paths. Here it can be knotted.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you tangle the road?"
  zz_valyria_magic_dream_magic.075.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lies down with a compass held against their chest, its needle trembling. As sleep comes, they find themselves on the subject's road, and they walk it backwards, from where the subject now stands to where they set out, gathering up every mile in their hands like thread.\n\nAt the end, the gathered thread lies loose and ready. Knotted, it will snag every step the subject has yet to take.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you tangle the road?"
  zz_valyria_magic_dream_magic.075.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA pair of the subject's travelling boots is set at the foot of the caster's bed, their soles still caked with the dust of the road. In sleep, the caster puts them on and walks, and the road beneath their feet is the road the subject has already travelled.\n\nWhere the dust runs out, the road ahead begins, and there the dreamer may lay down stones and thorns.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you tangle the road?"
  zz_valyria_magic_dream_magic.075.opt.a:0 "Tangle the road, let them wander!"
  zz_valyria_magic_dream_magic.075.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.075.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.075.name$"
  zz_valyria_magic_dream_magic.075.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ tangling the road beneath [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.075.toast.tt:0 "$zz_valyria_magic_dream_magic.075.toast.desc$"
  zz_valyria_magic_dream_magic.075.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.075.name$"
  zz_valyria_magic_dream_magic.075.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.075.f.toast.tt:0 "$zz_valyria_magic_dream_magic.075.f.toast.desc$"
  ## Dream Magic - Mystery of the Watchful Road
  zz_valyria_magic_dream_magic_076.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_tsaf$\n\nThe use of the arcane forces of [dream_magic|E] to send the caster's dreams ahead of a chosen subject on every road they take, so that danger is seen before it is met.\n\nThe dreamers of old were said to walk the roads of their patrons in sleep, a night before their patrons walked them awake. Bandits waiting in the pass, a bridge rotten through, fever in the next town: all of it came to the dreamer first, and the warning came with the morning.\n\nThe subject's [travel|E] is made safer for some years, more so the greater the caster's skill."
  zz_valyria_magic_dream_magic.076.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.076.name$"
  zz_valyria_magic_dream_magic.076.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA lantern of green glass is lit and set at the caster's head, and a cloak belonging to the subject is laid over the caster's sleeping body. As the incantation fades into sleep, the lantern's light seems to leave the room, wandering out along roads the subject has yet to take.\n\nWherever it goes, the dark draws back a little, and what waits in it is seen.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you watch over their roads?"
  zz_valyria_magic_dream_magic.076.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA small bronze bell is hung from a thread above the caster's bed, and a ribbon from the subject's sleeve is tied to its clapper. As the caster sleeps, the bell begins to sway, ringing softly whenever danger draws near to the subject on some distant road.\n\nEach chime is a warning, and each warning, carried through the dream, reaches the subject before the danger does.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you watch over their roads?"
  zz_valyria_magic_dream_magic.076.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lies down with a map of the subject's lands spread across their chest. In sleep, they rise from it like mist, drifting out ahead of the subject along every road they might take, looking into every shadow and every bend.\n\nWhat is seen in the dream is known in the waking, and the subject travels a little safer for it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you watch over their roads?"
  zz_valyria_magic_dream_magic.076.opt.a:0 "Let the dreams walk ahead of them!"
  zz_valyria_magic_dream_magic.076.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.076.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.076.name$"
  zz_valyria_magic_dream_magic.076.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ keeping watch over the roads of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.076.toast.tt:0 "$zz_valyria_magic_dream_magic.076.toast.desc$"
  zz_valyria_magic_dream_magic.076.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.076.name$"
  zz_valyria_magic_dream_magic.076.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.076.f.toast.tt:0 "$zz_valyria_magic_dream_magic.076.f.toast.desc$"


  ## Dream Magic - Mystery of Prophecy (Resources)
  zz_valyria_magic_dream_magic_077.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_tp$\n$zz_scq$\n$zz_prodg$\n\nThe use of the arcane forces of [dream_magic|E] to send a chosen subject a prophetic dream of riches hidden in the earth of a chosen [province|E].\n\nThrough this mystery, a prophecy is seeded in the subject's sleep: a vision of the land as it lies beneath the soil and the forest floor, where seams, springs and fertile ground wait unknown. Those who follow the prophecy to the place may find what it promised.\n\nIf the prophecy is fulfilled, the [province|E] permanently gains production of one of the [trade_goods|E] its land could yield, more so the greater the caster's skill."
  zz_valyria_magic_dream_magic.077.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.077.name$"
  zz_valyria_magic_dream_magic.077.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, the chosen land opens like a book: beneath grass and stone lie veins, springs and seams that no one living has seen.\n\nThe prophecy settles upon the place, waiting for someone to seek it out.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you send the prophecy, or let the land keep its secrets?"
  zz_valyria_magic_dream_magic.077.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA handful of earth from the chosen province is placed in a bowl beside the caster's bed. In sleep, the caster sinks down through that earth, through stone and root and dark water, until they find something waiting there, ready to be brought into the light.\n\nThe prophets of the Freehold knew that every land holds more than it shows. They needed only to dream of it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you send the prophecy, or let the land keep its secrets?"
  zz_valyria_magic_dream_magic.077.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a map of the chosen province beneath their pillow and sleeps upon it. In the dream, the map grows, its rivers running and its hills rising, and in one place, deep in its folds, something glints that no surveyor has ever found.\n\nIn Valyria, the riches of a land were measured not by what its people knew, but by what its prophets dreamed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you send the prophecy, or let the land keep its secrets?"
  zz_valyria_magic_dream_magic.077.opt.a:0 "Reveal what lies beneath."
  zz_valyria_magic_dream_magic.077.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.077.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.077.name$"
  zz_valyria_magic_dream_magic.077.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending [recipient.GetFirstName] a prophecy of hidden riches in [target.GetName]."
  zz_valyria_magic_dream_magic.077.toast.tt:0 "$zz_valyria_magic_dream_magic.077.toast.desc$"
  zz_valyria_magic_dream_magic.077.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.077.name$"
  zz_valyria_magic_dream_magic.077.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.077.f.toast.tt:0 "$zz_valyria_magic_dream_magic.077.f.toast.desc$"
  ## Dream Magic - Mystery of The Dreaming City
  zz_valyria_magic_dream_magic_078.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_tp$\n$zz_psb$\n\nThe use of the arcane forces of [dream_magic|E] to send one dream to every sleeper in a chosen [province|E], a dream of streets that run further and markets that never empty, so that the land itself is drawn to grow.\n\nThe dreamers of old said that a city is built first in the sleep of its people. Those who dream of crowded streets go looking for them, and those who find them stay. Through this mystery, the dream is planted in every bed at once.\n\nThe province's size baseline is raised for five years, more so the greater the caster's skill."
  zz_valyria_magic_dream_magic.078.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.078.name$"
  zz_valyria_magic_dream_magic.078.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA map of the chosen province is spread beneath the caster's pillow, and a candle of white wax burns beside it through the night. As the caster sleeps, the lines of the map seem to stir, the roads lengthening, the little squares of the towns spreading outward like ink in water.\n\nFar away, in a hundred beds, the people of the province dream of the same streets.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.078.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lies down upon a floor scattered with stones taken from the chosen province's walls and roads, and sinks into sleep with one clutched in each hand. In the dream, the stones become streets, and the streets fill with people who were not there before.\n\nWhen the caster wakes, the stones are warm, as though many feet had walked upon them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.078.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA bowl of water drawn from the chosen province's well is set at the caster's head, and as they sleep, its surface clouds with the reflection of rooftops that do not stand above it. Roof after roof appears, crowding the water to its edges.\n\nThe dreamers of old said that a city is built in sleep before it is built in stone. The caster has laid the first course.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.078.opt.a:0 "Let the city be dreamed into being!"
  zz_valyria_magic_dream_magic.078.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.078.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.078.name$"
  zz_valyria_magic_dream_magic.078.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ dreaming a greater city into being."
  zz_valyria_magic_dream_magic.078.toast.tt:0 "$zz_valyria_magic_dream_magic.078.toast.desc$"
  zz_valyria_magic_dream_magic.078.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.078.name$"
  zz_valyria_magic_dream_magic.078.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.078.f.toast.tt:0 "$zz_valyria_magic_dream_magic.078.f.toast.desc$"
  ## Dream Magic - Mystery of The Shared Dream
  zz_valyria_magic_dream_magic_079.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_tcc$\n$zz_popo$\n\nThe use of the arcane forces of [dream_magic|E] to send the same dream to every sleeper in a chosen [county|E], a dream in which their ruler stands beside them in their troubles, so that they wake thinking better of their lord.\n\nNo herald can reach every hearth, and no feast can feed every village. A dream can. The dreamers of old sent such visions to restless lands before the tax-gatherers came, and the gatherers found the people strangely willing.\n\nThe county's [popular_opinion|E] grows faster for five years, more so the greater the caster's skill."
  zz_valyria_magic_dream_magic.079.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.079.name$"
  zz_valyria_magic_dream_magic.079.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster sleeps beneath a banner of the subject's house, its hem weighted with soil from the chosen county. As the dream deepens, the banner's colours seem to brighten, and from far away comes a murmur, like a crowd speaking a name with warmth.\n\nIn every cottage of the county, the same face appears in the same dream, offering bread, and a hand.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.079.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA circle of small clay lamps is set around the caster's bed, one for each village in the chosen county, and each is lit from the same flame. As the caster drifts into sleep, the lamps burn lower and brighter together, as though breathing in one rhythm.\n\nWhen morning comes, the people of the county wake from one shared dream, and speak of their lord more kindly than they did the night before.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.079.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA coin bearing the subject's likeness is laid upon the caster's tongue, and they sleep with it there until dawn. In the dream, the coin passes from hand to hand through the markets and fields of the chosen county, and each hand that holds it closes on it gently.\n\nThe dreamers of old said that love can be sown like any other crop, if one knows the season.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.079.opt.a:0 "Let them dream of their lord!"
  zz_valyria_magic_dream_magic.079.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.079.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.079.name$"
  zz_valyria_magic_dream_magic.079.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending a shared dream to the sleepers of a county."
  zz_valyria_magic_dream_magic.079.toast.tt:0 "$zz_valyria_magic_dream_magic.079.toast.desc$"
  zz_valyria_magic_dream_magic.079.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.079.name$"
  zz_valyria_magic_dream_magic.079.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.079.f.toast.tt:0 "$zz_valyria_magic_dream_magic.079.f.toast.desc$"
  ## Dream Magic - Mystery of Soothsaying (Resilience)
  zz_valyria_magic_dream_magic_080.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_fac_dn$\n$zz_chg$\n\nThe use of the arcane forces of [dream_magic|E] to send dreams of warning to those who would conspire against a chosen subject.\n\nThe soothsayers of Valyria held that no oath is sworn in secret without first being dreamed. Through this mystery, those who gather against the subject see in their sleep the ruin that waits for them, and lose their nerve.\n\nEach month, while visions remain, one member of a [faction|E] against the subject leaves it, and cannot join a faction again for some years. The leader is turned away only when no one else is left. Stronger casters grant more visions and keep the turncoats away for longer."
  zz_valyria_magic_dream_magic.080.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.080.name$"
  zz_valyria_magic_dream_magic.080.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster burns a seal of the subject's house in a brazier and watches the smoke drift apart, thread by thread, towards every door where a plot is being whispered.\n\nThe soothsayers of Valyria held that no oath is sworn in secret without first being dreamed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send dreams of warning to those who would conspire against [recipient.GetFirstName]. Will you cast?"
  zz_valyria_magic_dream_magic.080.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA ring of candles is set around the subject's bed, one for every great house that owes them fealty. As the caster chants, some of the flames bend away from the sleeper, and those are the ones the caster marks.\n\nIn Valyria, it was said that a conspiracy dies the night its members dream of the gallows.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send dreams of warning to those who would conspire against [recipient.GetFirstName]. Will you cast?"
  zz_valyria_magic_dream_magic.080.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a dagger across the subject's chest as they sleep, its point turned outwards. In the dream, every hand raised against the subject finds that same blade turned back upon itself.\n\nThe soothsayers of the Freehold sold this working to many a ruler who feared their own vassals more than their enemies.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send dreams of warning to those who would conspire against [recipient.GetFirstName]. Will you cast?"
  zz_valyria_magic_dream_magic.080.opt.a:0 "Let the conspirators lose their nerve!"
  zz_valyria_magic_dream_magic.080.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.080.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.080.name$"
  zz_valyria_magic_dream_magic.080.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending dreams of warning to those who conspire against [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.080.toast.tt:0 "$zz_valyria_magic_dream_magic.080.toast.desc$"
  zz_valyria_magic_dream_magic.080.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.080.name$"
  zz_valyria_magic_dream_magic.080.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.080.f.toast.tt:0 "$zz_valyria_magic_dream_magic.080.f.toast.desc$"
  zz_valyria_magic_dream_magic.080.buff.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.080.name$"
  zz_valyria_magic_dream_magic.080.buff.toast.desc:0 "A conspirator dreamed of their ruin, and turned away from the faction"
  zz_valyria_magic_dream_magic.080.buff.toast.tt:0 "$zz_valyria_magic_dream_magic.080.buff.toast.desc$"
  ## Dream Magic - Mystery of Soothsaying (Longevity)
  zz_valyria_magic_dream_magic_081.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_lexp$\n\nThe use of the arcane forces of [dream_magic|E] to show a chosen subject the long years ahead of them, so clearly and so often that their body comes to believe in them.\n\nThe soothsayers of Valyria taught that death comes most easily to those who cannot see past it. Through this mystery, the subject dreams of their own old age, of grandchildren grown and seasons long turned, and holds to life the harder for it.\n\nEach time death comes for the subject, a vision turns it aside, and they live on, longer-lived and in better health than before. The greater the caster's skill, the more deaths may be turned aside."
  zz_valyria_magic_dream_magic.081.buff.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.081.name$"
  zz_valyria_magic_dream_magic.081.buff.toast.desc:0 "Death came for [zz_story_owner.GetFirstName], but a vision turned it aside"
  zz_valyria_magic_dream_magic.081.buff.toast.tt:0 "$zz_valyria_magic_dream_magic.081.buff.toast.desc$"
  zz_valyria_magic_dream_magic.081.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.081.name$"
  zz_valyria_magic_dream_magic.081.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster places an old coin in the subject's palm, worn smooth by a century of hands, and closes their fingers around it as they sleep. In the dream, the subject is old, white-haired and slow, but still standing, still breathing, still there.\n\nThey wake with the coin warm in their grip, and the years it showed them heavy in their bones.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.081.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA candle is lit that has been made to burn for a hundred nights, and the caster bids the subject watch it until they fall asleep. In the dream, the candle burns on, and on, and the subject grows old beside it while it shortens only a finger's width.\n\nThe soothsayers of the Freehold said that the candle is the life, and the dream is the wick trimmed short.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.081.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster draws the lines of the subject's palm in ink upon a sheet of vellum, and then, slowly, extends the life line far past where it ends. As the subject sleeps, their own palm itches, and when they wake, the line seems longer than they remember.\n\nIn Valyria, it was said that fate is written, but a skilled hand may add to the writing.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.081.opt.a:0 "Let them see their long years!"
  zz_valyria_magic_dream_magic.081.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.081.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.081.name$"
  zz_valyria_magic_dream_magic.081.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ showing [recipient.GetFirstName] the long years ahead of them."
  zz_valyria_magic_dream_magic.081.toast.tt:0 "$zz_valyria_magic_dream_magic.081.toast.desc$"
  zz_valyria_magic_dream_magic.081.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.081.name$"
  zz_valyria_magic_dream_magic.081.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.081.f.toast.tt:0 "$zz_valyria_magic_dream_magic.081.f.toast.desc$"
  ## Dream Magic - Mystery of Soothsaying (Health)
  zz_valyria_magic_dream_magic_082.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_hlw$\n$zz_dtrt$\n$zz_chg$\n\nThe use of the arcane forces of [dream_magic|E] to grant a chosen subject dreams that foresee every hurt and sickness before it arrives, so that the body is already mending, and its remedies already prepared.\n\nThe physicians of the Freehold often worked beside the soothsayers, who could tell them which wound would fester and which fever would come. Through this mystery, the subject's sleep is turned towards the ailments to come, and when one strikes, the healing of the Dream of Health follows it at once.\n\nWhenever the subject falls ill, is wounded, is otherwise afflicted or their [stress|E] nears its first break point, a vision is spent: they are healed, and a disease that remains meets a strong treatment. Stronger casters heal more deeply, treat better and grant more visions."
  zz_valyria_magic_dream_magic.082.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.082.name$"
  zz_valyria_magic_dream_magic.082.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster crushes dried herbs into a fine powder and scatters it over the subject's pillow as they sleep. In the dream, the subject walks through a physician's garden where every plant is labelled with the name of an illness, and every name is one they will one day suffer.\n\nWhen they wake, they remember where each plant grew.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.082.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA physician's satchel is laid open at the foot of the subject's bed, and the caster touches each vial within it, one by one, while the incantation is spoken. As the subject sleeps, the vials cloud and clear again, as though something had been poured into them from far away.\n\nIn Valyria, it was said that the soothsayers could fill a physician's bag with remedies from the future.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.082.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster takes the subject's wrist as they sleep and counts their pulse, slowly, through the night. Now and then the beat stumbles, and the caster speaks a word, and it steadies again.\n\nThe soothsayers of the Freehold said that every illness gives warning in the blood. The trick is to listen before it comes.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.082.opt.a:0 "Let their body remember its healing!"
  zz_valyria_magic_dream_magic.082.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.082.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.082.name$"
  zz_valyria_magic_dream_magic.082.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ granting [recipient.GetFirstName] dreams that heal their hurts and prepare their body for sickness."
  zz_valyria_magic_dream_magic.082.toast.tt:0 "$zz_valyria_magic_dream_magic.082.toast.desc$"
  zz_valyria_magic_dream_magic.082.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.082.name$"
  zz_valyria_magic_dream_magic.082.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.082.f.toast.tt:0 "$zz_valyria_magic_dream_magic.082.f.toast.desc$"
  zz_valyria_magic_dream_magic.082.buff.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.082.name$"
  zz_valyria_magic_dream_magic.082.buff.toast.desc:0 "A hurt or sickness was foreseen in a dream, and healed as it struck"
  zz_valyria_magic_dream_magic.082.buff.toast.tt:0 "$zz_valyria_magic_dream_magic.082.buff.toast.desc$"

  ## Dream Magic - Mystery of Soothsaying (Infant Sex)
  zz_valyria_magic_dream_magic_083.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_ccs$\n\nThe use of the arcane forces of [dream_magic|E] to foretell, and so fix, the sex of the children a chosen subject will bring into the world.\n\nBlood can change a child already in the womb. A soothsayer does not need to. Through this mystery, the subject dreams of the sons or daughters to come, and the children who follow come as they were dreamed.\n\nWhenever the subject, or a consort carrying the subject's child, becomes pregnant, the child will be of the chosen sex, until the visions are spent."
  zz_valyria_magic_dream_magic.083.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.083.name$"
  zz_valyria_magic_dream_magic.083.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster sets two cradles at the foot of the subject's bed, one carved with a sword and one with a spindle, and rocks the chosen one gently as the subject sleeps. In the dream, a child lies in it, and then another, and another, each face different, each the same.\n\nThe other cradle stays still all night.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.083.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA ribbon is tied about the subject's wrist as they sleep, its colour chosen for the children to come. The caster speaks the incantation into it, and the ribbon tightens, just a little, like a small hand grasping a finger.\n\nThe soothsayers of the Freehold kept long lists of the children they had foretold. They were seldom wrong.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.083.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster casts a handful of carved bones into a bowl beside the subject's bed and reads them without a word. Then they cast them again, and again, until every bone falls the same way.\n\nIn Valyria, it was said that the soothsayers did not read the future so much as argue with it, and that they rarely lost.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.083.opt.a:0 "Let the dream reveal the child!"
  zz_valyria_magic_dream_magic.083.opt.z:0 "No, do not cast!"
  ## Dream 083 - choices
  zz_soothsay_son:0 "A Son"
  zz_soothsay_daughter:0 "A Daughter"
