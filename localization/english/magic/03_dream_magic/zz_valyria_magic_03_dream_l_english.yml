  zz_valyria_magic_dream_magic.083.toast.tt:0 "$zz_valyria_magic_dream_magic.083.toast.desc$"
  zz_valyria_magic_dream_magic.083.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.083.name$"
  zz_valyria_magic_dream_magic.083.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
