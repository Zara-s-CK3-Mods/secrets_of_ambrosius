  zz_valyria_magic_dream_magic_028.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_fz$\n\nThe use of the arcane forces of [dream_magic|E] to freeze one of the subject's own schemes.\n\nThrough this mystery, the dream-walker fills the sleep of those involved in one of the subject's plots with lethargy, so that it stalls for a time.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.028.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.028.name$"
  zz_valyria_magic_dream_magic.028.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, the gears of their plot begin to slow, and then to stop.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and freeze one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.028.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a broken gear upon the subject's pillow as they sleep. In the dream, the machinery of their own plot grinds slowly, unwillingly, its wheels catching and slipping as though something had been thrust between them.\n\nThe dream-walkers of the Freehold were often hired by rivals, but it was said they could be turned upon their own patrons too, for the right price.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and freeze one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.028.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA thread is wound slowly about a spindle as the subject sleeps, each turn tighter than the last. In the dream, the scheme they are weaving tangles in the same way, its threads knotting and snarling until it can scarcely move.\n\nIn Valyria, it was not only enemies' plots that could be slowed. Sometimes it served a patron to slow their own.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and freeze one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.028.opt.a:0 "Let the plot stall."
  zz_valyria_magic_dream_magic.028.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.028.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.028.name$"
  zz_valyria_magic_dream_magic.028.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ freezing one of [recipient.GetFirstName]'s own schemes."
  zz_valyria_magic_dream_magic.028.toast.tt:0 "$zz_valyria_magic_dream_magic.028.toast.desc$"

  zz_valyria_magic_dream_magic.028.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.028.name$"
  zz_valyria_magic_dream_magic.028.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.028.f.toast.tt:0 "$zz_valyria_magic_dream_magic.028.f.toast.desc$"


  zz_valyria_magic_dream_magic_029.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_op_dn$\n\nThe use of the arcane forces of [dream_magic|E] to strip opportunities from a scheme that targets the subject.\n\nThrough this mystery, the dream-walker whispers caution into the sleep of all who stand near a plot against the subject, so that doors close, guards grow watchful, and the conspirators' chances slip away.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.029.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.029.name$"
  zz_valyria_magic_dream_magic.029.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, every door the conspirators reach for swings shut.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and weaken a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.029.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster speaks a word into each of a row of keyholes drawn upon a sheet of parchment. In the subject's dream, the conspirators against them reach for door after door, and each one, as they touch it, swings firmly shut.\n\nThe dream-walkers of the Freehold made sure that the plots against their patrons found every way barred.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and weaken a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.029.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA ring of iron nails is driven into the floor about the subject's bed. In the dream, the scheme against them runs up against walls on every side, its every opening sealed before it can be used.\n\nIn Valyria, it was said that a plot without openings was a plot already dead.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and weaken a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.029.opt.a:0 "Close every door."
  zz_valyria_magic_dream_magic.029.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.029.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.029.name$"
  zz_valyria_magic_dream_magic.029.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ weakening a scheme aimed at [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.029.toast.tt:0 "$zz_valyria_magic_dream_magic.029.toast.desc$"

