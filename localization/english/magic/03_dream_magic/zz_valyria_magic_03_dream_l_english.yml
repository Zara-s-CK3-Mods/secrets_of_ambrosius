  ## Interaction
  zz_valyria_magic_dream_magic_040.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_dsec$\n\nThe use of the arcane forces of [dream_magic|E] to erase one of the subject's own secrets.\n\nThrough this mystery, the dream-walker finds one of the subject's secrets in every mind that holds it, and unmakes it entirely.\n\nThe secret ceases to exist, as though it had never been.\n\nEvery secret lives in a mind, and every mind dreams. The dream-walkers of the Freehold held that there was no truth so well hidden that it could not be found by one who knew how to walk through sleep."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.040.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.040.name$"
  zz_valyria_magic_dream_magic.040.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject's dreams circle a single dark memory, and the dream-walker reaches out to snuff it like a candle.\n\nThe dream-walkers of Valyria served the dragonlords as keepers of secrets, and as their unmakers. The great families of the Freehold paid fortunes to know what their rivals dreamed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and erase one of [recipient.GetFirstName]'s own secrets. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.040.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lights a single candle and sets it upon the subject's pillow. In their dream, a dark memory flickers like the flame itself, and the caster leans close and, very gently, blows it out.\n\nThe dream-walkers of the Freehold could make a secret vanish as though it had never been.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and erase one of [recipient.GetFirstName]'s own secrets. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.040.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA small stone is placed upon the subject's chest as they sleep, and the caster speaks a word of forgetting into it. In the dream, a secret they had long carried grows heavy, then light, then is gone, sinking out of sight like a stone dropped into deep water.\n\nIn Valyria, it was said that there was no secret so dangerous it could not be dreamed away.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and erase one of [recipient.GetFirstName]'s own secrets. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.040.opt.a:0 "Unmake the secret."
  zz_valyria_magic_dream_magic.040.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.040.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.040.name$"
  zz_valyria_magic_dream_magic.040.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ erasing one of [recipient.GetFirstName]'s own secrets."
  zz_valyria_magic_dream_magic.040.toast.tt:0 "$zz_valyria_magic_dream_magic.040.toast.desc$"

  zz_valyria_magic_dream_magic.040.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.040.name$"
  zz_valyria_magic_dream_magic.040.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.040.f.toast.tt:0 "$zz_valyria_magic_dream_magic.040.f.toast.desc$"  

  ## Interaction
  zz_valyria_magic_dream_magic_041.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_dsec$\n\nThe use of the arcane forces of [dream_magic|E] to erase a secret that others hold against the subject.\n\nThrough this mystery, the dream-walker finds a secret held against the subject and unmakes it in every mind that knows it.\n\nThe secret ceases to exist, and with it, the threat it posed.\n\nEvery secret lives in a mind, and every mind dreams. The dream-walkers of the Freehold held that there was no truth so well hidden that it could not be found by one who knew how to walk through sleep."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.041.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.041.name$"
  zz_valyria_magic_dream_magic.041.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject's dreams are dark with the shadow of a threat, and the dream-walker sets about tearing it down.\n\nThe dream-walkers of Valyria served the dragonlords as keepers of secrets, and as their unmakers. The great families of the Freehold paid fortunes to know what their rivals dreamed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and erase a secret that is held against [recipient.GetFirstName]. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.041.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a likeness of the target beside the sleeping subject and covers its eyes with a strip of black cloth. In the dream, a secret that threatened the subject grows dim and grey in the target's mind, and then fades away altogether.\n\nThe dream-walkers of the Freehold could not always stop a secret from being learned, but they could always make sure it was forgotten.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and erase a secret that is held against [recipient.GetFirstName]. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.041.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA cup of water drawn from a still pool is set beside the subject's bed, and the caster stirs it until the surface is smooth again. In the dream, a memory held by another ripples and smooths in the same way, and when the ripples are gone, so is the secret.\n\nIn Valyria, the most dangerous knowledge was knowledge that others held. The dream-walkers made sure it did not stay held for long.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and erase a secret that is held against [recipient.GetFirstName]. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.041.opt.a:0 "Unmake the threat."
  zz_valyria_magic_dream_magic.041.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.041.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.041.name$"
  zz_valyria_magic_dream_magic.041.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ erasing a secret that is held against [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.041.toast.tt:0 "$zz_valyria_magic_dream_magic.041.toast.desc$"

  zz_valyria_magic_dream_magic.041.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.041.name$"
  zz_valyria_magic_dream_magic.041.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.041.f.toast.tt:0 "$zz_valyria_magic_dream_magic.041.f.toast.desc$"  

  ## Interaction
  zz_valyria_magic_dream_magic_042.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_dsec$\n\nThe use of the arcane forces of [dream_magic|E] to erase a secret that the subject happens to know.\n\nThrough this mystery, the dream-walker finds a secret that the subject knows and unmakes it in every mind that holds it.\n\nThe secret ceases to exist, as though no one had ever known it.\n\nEvery secret lives in a mind, and every mind dreams. The dream-walkers of the Freehold held that there was no truth so well hidden that it could not be found by one who knew how to walk through sleep."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.042.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.042.name$"
  zz_valyria_magic_dream_magic.042.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject's dreams hold a memory that is not their own, and the dream-walker reaches out to unmake it.\n\nThe dream-walkers of Valyria served the dragonlords as keepers of secrets, and as their unmakers. The great families of the Freehold paid fortunes to know what their rivals dreamed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and erase a secret that [recipient.GetFirstName] knows. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.042.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster burns a scrap of parchment on which a secret has been written, and lets its smoke drift over the sleeping subject. In the dream, a memory that is not theirs, but which they had come to know, curls and blackens like the parchment, and is gone.\n\nThe dream-walkers of the Freehold could unmake knowledge as easily as they could reveal it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and erase a secret that [recipient.GetFirstName] knows. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.042.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA small clay figure is broken over a bowl of water as the subject sleeps. In their dream, a secret they had learned shatters in the same way, its pieces sinking out of sight, and on waking they will not remember what it was.\n\nIn Valyria, some secrets were too dangerous even to know. Through this mystery, they can be put out of reach forever.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and erase a secret that [recipient.GetFirstName] knows. Will you walk among their secrets?"
  zz_valyria_magic_dream_magic.042.opt.a:0 "Unmake the secret."
  zz_valyria_magic_dream_magic.042.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.042.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.042.name$"
  zz_valyria_magic_dream_magic.042.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ erasing a secret that [recipient.GetFirstName] knows."
  zz_valyria_magic_dream_magic.042.toast.tt:0 "$zz_valyria_magic_dream_magic.042.toast.desc$"

  zz_valyria_magic_dream_magic.042.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.042.name$"
  zz_valyria_magic_dream_magic.042.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.042.f.toast.tt:0 "$zz_valyria_magic_dream_magic.042.f.toast.desc$"  

  ## Interaction
  zz_valyria_magic_dream_magic_043.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_cccon$\n\nThe use of the arcane forces of [dream_magic|E] to send ordered, obedient dreams to the people of a county, strengthening their ruler's control.\n\nThrough this mystery, the people of a county dream of order: of laws kept, taxes paid, and lords obeyed. They wake calmer and more pliant, and the ruler's grip on the land grows firmer.\n\nThe county's [county_control|E] increases.\n\nThe archons of the Freehold rarely needed to put down rebellions. Their provinces dreamed of obedience."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.043.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.043.name$"
  zz_valyria_magic_dream_magic.043.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. Across the chosen county, sleepers dream of quiet streets and well-tended fields, and wake with a strange contentment.\n\nThe dream-sowers of Valyria were sent to every newly conquered land, to quiet its people in their sleep.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send ordered dreams to the chosen county of [recipient.GetFirstName], strengthening their control over it. Will you quiet the land?"
  zz_valyria_magic_dream_magic.043.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster plays a slow, measured tune upon a set of pipes as they drift into sleep. Across the chosen county, the music follows them, and sleepers dream of ordered streets, well-kept fields and lords who keep their word.\n\nThe dream-sowers of the Freehold were sent to every newly conquered land, to settle its people in their beds before they could rise against their new masters.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send ordered dreams to the chosen county of [recipient.GetFirstName], strengthening their control over it. Will you quiet the land?"
  zz_valyria_magic_dream_magic.043.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA neatly folded cloth is laid across a map of the chosen county, its corners square and its edges straight. In the dreams of those who live there, the same sense of order settles over them, and they wake calmer, more patient and less inclined to trouble.\n\nIn Valyria, peace was something that could be woven, one dream at a time.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send ordered dreams to the chosen county of [recipient.GetFirstName], strengthening their control over it. Will you quiet the land?"
  zz_valyria_magic_dream_magic.043.opt.a:0 "Let them dream of order."
  zz_valyria_magic_dream_magic.043.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.043.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.043.name$"
  zz_valyria_magic_dream_magic.043.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending ordered dreams to the people of a county held by [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.043.toast.tt:0 "$zz_valyria_magic_dream_magic.043.toast.desc$"

  zz_valyria_magic_dream_magic.043.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.043.name$"
  zz_valyria_magic_dream_magic.043.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.043.f.toast.tt:0 "$zz_valyria_magic_dream_magic.043.f.toast.desc$"  

  ## Interaction
  zz_valyria_magic_dream_magic_044.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_cccon$\n\nThe use of the arcane forces of [dream_magic|E] to send restless, disordered dreams to the people of a county, weakening their ruler's control.\n\nThrough this mystery, the people of a county dream of chaos: of unjust lords, empty granaries, and burning manors. They wake restless and resentful, and the ruler's grip on the land weakens.\n\nThe county's [county_control|E] decreases.\n\nThe Freehold used this working to soften the lands of its enemies before the legions ever marched."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.044.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.044.name$"
  zz_valyria_magic_dream_magic.044.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. Across the chosen county, sleepers toss and turn, dreaming of flames and shouting crowds.\n\nThe dream-sowers of Valyria could make a province ungovernable without a single agent setting foot in it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send disordered dreams to the chosen county of [recipient.GetFirstName], weakening their control over it. Will you stir up unrest?"
  zz_valyria_magic_dream_magic.044.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster tears a cloth into ragged strips and scatters them across a map of the chosen county. In the dreams of the people there, everything is torn: oaths broken, fields burned, lords fleeing in the night, and they wake angry and restless.\n\nThe dream-sowers of the Freehold could make a province ungovernable without spending a single coin.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send disordered dreams to the chosen county of [recipient.GetFirstName], weakening their control over it. Will you stir up unrest?"
  zz_valyria_magic_dream_magic.044.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA pot of embers is set upon the map and stirred with an iron rod. Across the chosen county, sleepers dream of fire and shouting, of doors broken and laws ignored, and in the morning, the mood in the streets is ugly.\n\nIn Valyria, disorder could be sown as easily as order, and the dream-sowers did both, as their masters required.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send disordered dreams to the chosen county of [recipient.GetFirstName], weakening their control over it. Will you stir up unrest?"
  zz_valyria_magic_dream_magic.044.opt.a:0 "Let them dream of chaos."
  zz_valyria_magic_dream_magic.044.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.044.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.044.name$"
  zz_valyria_magic_dream_magic.044.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending disordered dreams to the people of a county held by [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.044.toast.tt:0 "$zz_valyria_magic_dream_magic.044.toast.desc$"

  zz_valyria_magic_dream_magic.044.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.044.name$"
  zz_valyria_magic_dream_magic.044.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.044.f.toast.tt:0 "$zz_valyria_magic_dream_magic.044.f.toast.desc$"  

  ## Interaction
  zz_valyria_magic_dream_magic_045.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_ccd$\n\nThe use of the arcane forces of [dream_magic|E] to inspire the people of a county with dreams of progress.\n\nThrough this mystery, the people of a county dream of better ways: of new tools, new crops, new crafts. They wake inspired, and the county advances faster than it otherwise would.\n\nThe county's progress is greatly advanced.\n\nThe provinces of the Freehold grew rich with remarkable speed. Its dreamers were part of the reason."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.045.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.045.name$"
  zz_valyria_magic_dream_magic.045.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. Across the chosen county, artisans and farmers murmur in their sleep of inventions they have never seen.\n\nThe dream-sowers of Valyria planted the seeds of progress wherever the dragonlords wished their lands to flourish.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may inspire the chosen county of [recipient.GetFirstName] with dreams of progress. Will you sow them?"
  zz_valyria_magic_dream_magic.045.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster sets out a row of small brass tools upon the map, each one of a kind never seen in that land. As they sleep, the craftsmen and farmers of the chosen county dream of those same tools, and wake with new ideas burning in their hands.\n\nThe dream-sowers of the Freehold seeded progress across the lands of the dragonlords, and the seeds grew quickly.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may inspire the chosen county of [recipient.GetFirstName] with dreams of progress. Will you sow them?"
  zz_valyria_magic_dream_magic.045.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA lamp of clear glass is lit beside a map of the chosen county, and its light falls across it, bright and steady. In the dreams of the people there, the same light falls upon their work, showing them faster ways, better methods, and wiser habits.\n\nIn Valyria, it was said that a single night of dreaming could teach more than a year of trial and error.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may inspire the chosen county of [recipient.GetFirstName] with dreams of progress. Will you sow them?"
  zz_valyria_magic_dream_magic.045.opt.a:0 "Let them dream of progress."
  zz_valyria_magic_dream_magic.045.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.045.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.045.name$"
  zz_valyria_magic_dream_magic.045.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ inspiring a county held by [recipient.GetFirstName] with dreams of progress."
  zz_valyria_magic_dream_magic.045.toast.tt:0 "$zz_valyria_magic_dream_magic.045.toast.desc$"

  zz_valyria_magic_dream_magic.045.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.045.name$"
  zz_valyria_magic_dream_magic.045.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.045.f.toast.tt:0 "$zz_valyria_magic_dream_magic.045.f.toast.desc$"  


  ## Interaction
  zz_valyria_magic_dream_magic_046.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_ccd$\n\nThe use of the arcane forces of [dream_magic|E] to strip the people of a county of their knowledge and skill in their sleep.\n\nThrough this mystery, the people of a county dream of forgetting: crafts half-remembered, techniques lost, plans misplaced. They wake clumsier and slower, and the county's progress falls back.\n\nThe county loses a great deal of its progress.\n\nThe Freehold used this working against the cities of its rivals, so that they fell slowly behind without ever knowing why."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.046.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.046.name$"
  zz_valyria_magic_dream_magic.046.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. Across the chosen county, craftsmen wake staring at their tools as though they had never seen them before.\n\nThe dream-sowers of Valyria could unmake the work of a generation in a single night.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may strip the chosen county of [recipient.GetFirstName] of its progress through dreams of forgetting. Will you make them forget?"
  zz_valyria_magic_dream_magic.046.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster breaks a fine tool across their knee and lets the pieces fall upon a map of the chosen county. In the dreams of the craftsmen there, their own tools break in the same way, and they wake unsure of skills they have practiced for a lifetime.\n\nThe dream-sowers of the Freehold could undo the progress of a generation in a single night.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may strip the chosen county of [recipient.GetFirstName] of its progress through dreams of forgetting. Will you make them forget?"
  zz_valyria_magic_dream_magic.046.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA page of careful instructions is held over a candle until it curls and blackens. Across the chosen county, sleepers dream of forgetting, and in the morning, the knowledge of their parents and grandparents seems to have slipped out of reach.\n\nIn Valyria, ignorance was as useful a weapon as fire, and far harder to trace.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may strip the chosen county of [recipient.GetFirstName] of its progress through dreams of forgetting. Will you make them forget?"
  zz_valyria_magic_dream_magic.046.opt.a:0 "Let them forget."
  zz_valyria_magic_dream_magic.046.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.046.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.046.name$"
