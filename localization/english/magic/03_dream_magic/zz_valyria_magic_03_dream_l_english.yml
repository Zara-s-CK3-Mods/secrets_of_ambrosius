  ## Interaction
  zz_valyria_magic_dream_magic_088.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_ctrl_up$\n$zz_dur10$\n$zz_stk$\n\nThe use of the arcane forces of [dream_magic|E] to send a county a dream of order that lingers for a decade.\n\nThrough this mystery, the people of a county dream of ledgers balanced and laws kept. Disorder comes to feel faintly shameful, and the ruler's officers find that they are seldom argued with.\n\nThe county's [county_control|E] recovers more quickly for ten years. The gain is slight, even for a great master, but every further casting adds to it."
  zz_valyria_magic_dream_magic.088.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.088.name$"
  zz_valyria_magic_dream_magic.088.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nSmall stones are set out across the ritual table in perfect rows. By morning, no one has moved them, and no one wishes to."
  zz_valyria_magic_dream_magic.088.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster paces the chamber in a slow, exact square, and the sound of their steps carries further than it should."
  zz_valyria_magic_dream_magic.088.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA great bell tolls once in the dream, and all across the county the sleepers breathe in time with it."
  zz_valyria_magic_dream_magic.088.opt.a:0 "Let them dream of order."
  zz_valyria_magic_dream_magic.088.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.088.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.088.name$"
  zz_valyria_magic_dream_magic.088.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending a long dream of order to the lands of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.088.toast.tt:0 "$zz_valyria_magic_dream_magic.088.toast.desc$"
  zz_valyria_magic_dream_magic.088.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.088.name$"
  zz_valyria_magic_dream_magic.088.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.088.f.toast.tt:0 "$zz_valyria_magic_dream_magic.088.f.toast.desc$"
