  zz_valyria_magic_dream_magic_091.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_grate_dn$\n$zz_dur10$\n$zz_stk$\n\nThe use of the arcane forces of [dream_magic|E] to send a county a nightmare of winter that lingers for a decade.\n\nThrough this mystery, the people of a county dream of a cold that never lifts. They sow less, hoard more, and leave their work unfinished, for what would be the use?\n\nThe county's [prosperity|E] grows at a slower rate for ten years. The harm is slight, even for a great master, but every further casting adds to it."
  zz_valyria_magic_dream_magic.091.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.091.name$"
  zz_valyria_magic_dream_magic.091.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nFrost creeps across the ritual table from no direction at all, and the caster's breath begins to show."
  zz_valyria_magic_dream_magic.091.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA green branch is held over the flame until the leaves curl. Across the county, the sleepers draw up their blankets."
  zz_valyria_magic_dream_magic.091.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster hums the planting song backwards, and a long stillness settles on the fields."
  zz_valyria_magic_dream_magic.091.opt.a:0 "Let them dream of winter."
  zz_valyria_magic_dream_magic.091.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.091.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.091.name$"
  zz_valyria_magic_dream_magic.091.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending a long nightmare of winter to the lands of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.091.toast.tt:0 "$zz_valyria_magic_dream_magic.091.toast.desc$"
  zz_valyria_magic_dream_magic.091.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.091.name$"
  zz_valyria_magic_dream_magic.091.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.091.f.toast.tt:0 "$zz_valyria_magic_dream_magic.091.f.toast.desc$"
