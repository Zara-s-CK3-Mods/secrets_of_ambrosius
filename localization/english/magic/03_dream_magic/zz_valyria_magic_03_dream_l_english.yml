  zz_valyria_magic_dream_magic_026.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_ag$\n\nThe use of the arcane forces of [dream_magic|E] to unmask an agent of one of the subject's own schemes.\n\nThrough this mystery, the dream-walker follows one of the subject's own plots to an agent carrying it out, and exposes them to the world.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.026.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.026.name$"
  zz_valyria_magic_dream_magic.026.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, the faces of those who serve their plots appear one by one, and one of them is lit by a cold and unforgiving light.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and unmask an agent of one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.026.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a list of names beside the subject as they sleep, each one belonging to an agent in their scheme. In the dream, the names glow faintly, and one of them, brighter than the rest, catches the subject's eye and will not let it go.\n\nThe dream-walkers of the Freehold could reveal to a schemer exactly who among their agents was not what they seemed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and unmask an agent of one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.026.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA cold silver mirror is held above the sleeping subject's face. In the dream, the faces of those who serve their plot appear in its surface one by one, and one of them is lit by a hard and merciless light.\n\nIn Valyria, it was said that every plot has its traitor. Through this mystery, the schemer may find theirs.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and unmask an agent of one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
