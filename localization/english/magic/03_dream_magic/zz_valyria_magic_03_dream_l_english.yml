  ## Interaction
  zz_valyria_magic_dream_magic_090.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_grate_up$\n$zz_dur10$\n$zz_stk$\n\nThe use of the arcane forces of [dream_magic|E] to send a county a dream of spring that lingers for a decade.\n\nThrough this mystery, the people of a county dream of thawing rivers and new shoots. They rise early, plant hopefully, and build as though there will always be another year.\n\nThe county's [prosperity|E] grows at a faster rate for ten years. The gain is slight, even for a great master, but every further casting adds to it."
  zz_valyria_magic_dream_magic.090.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.090.name$"
  zz_valyria_magic_dream_magic.090.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA dry seed is laid upon a sleeper's tongue. In the morning it has split, and something green is reaching out of it."
  zz_valyria_magic_dream_magic.090.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe chamber smells of wet earth and blossom, though the snow lies thick outside."
  zz_valyria_magic_dream_magic.090.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster hums a planting song, very slowly, and the rhythm of it slips out across the fields."
  zz_valyria_magic_dream_magic.090.opt.a:0 "Let them dream of spring."
  zz_valyria_magic_dream_magic.090.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.090.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.090.name$"
  zz_valyria_magic_dream_magic.090.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending a long dream of spring to the lands of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.090.toast.tt:0 "$zz_valyria_magic_dream_magic.090.toast.desc$"
  zz_valyria_magic_dream_magic.090.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.090.name$"
  zz_valyria_magic_dream_magic.090.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.090.f.toast.tt:0 "$zz_valyria_magic_dream_magic.090.f.toast.desc$"
