  ## Interaction
  zz_valyria_magic_dream_magic_071.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_scq$\n\nThe use of the arcane forces of [dream_magic|E] to send a chosen subject a prophetic dream that will guide them towards a nexus of magical power.\n\nThrough this mystery, a prophecy is seeded in the subject's sleep: a vision that shows them where a nexus of magical power may be found. They wake with the dream burning in their mind, and the chance to set out and seek its fulfilment.\n\nThe subject is given the chance to undertake a quest that may reward them with [drops_of_power|E].\n\nProphecy is a gift, but it is not a certainty. The dream shows the way; the dreamer must still walk it."

  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.071.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.071.name$"

  zz_valyria_magic_dream_magic.071.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, radiant lines of power cross the earth and converge upon a single point.\n\nThe prophets of the Freehold sent such dreams to the servants of the dragonlords, guiding them to treasures, allies, and opportunities that would otherwise have lain undiscovered for centuries.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards a nexus of magical power. Will you show them the way?"
  zz_valyria_magic_dream_magic.071.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster draws a web of lines across a map of the land, each one in silver ink, and sets it beside the sleeping subject. In the dream, the lines glow and pulse, and the subject sees where they cross, and where power gathers like water in a hollow.\n\nThe prophets of the Freehold guided its mages to places of power that had been forgotten since the world was young.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards a nexus of magical power. Will you show them the way?"
  zz_valyria_magic_dream_magic.071.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA crystal is hung on a cord above the subject's bed, and it turns slowly as they sleep, always coming to rest pointing the same way. In the dream, the subject follows it, across hills and rivers, to a place where magic wells up from the earth itself.\n\nIn Valyria, power was not only made. It was found, by those who knew how to dream of it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards a nexus of magical power. Will you show them the way?"

  zz_valyria_magic_dream_magic.071.opt.a:0 "Seek the nexus."
  zz_valyria_magic_dream_magic.071.opt.z:0 "No, do not cast!"

