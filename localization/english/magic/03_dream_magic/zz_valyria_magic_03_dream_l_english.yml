  ## Interaction
  zz_valyria_magic_dream_magic_092.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_gflat_up$\n$zz_dur10$\n$zz_stk$\n\nThe use of the arcane forces of [dream_magic|E] to send a county a dream of plenty that lingers for a decade.\n\nThrough this mystery, the people of a county dream of full barns and busy markets, and they spend the following years trying to make it so.\n\nThe county gains a small, steady amount of [prosperity|E] each month for ten years. The gain is slight, even for a great master, but every further casting adds to it."
  zz_valyria_magic_dream_magic.092.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.092.name$"
  zz_valyria_magic_dream_magic.092.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nGrains of wheat are poured from hand to hand, and somehow there are more of them each time."
  zz_valyria_magic_dream_magic.092.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe murmur of a market on a fair day fills the empty chamber, and the smell of fresh bread comes with it."
  zz_valyria_magic_dream_magic.092.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA bowl is set before the caster, and it fills slowly with something golden that no one has poured."
  zz_valyria_magic_dream_magic.092.opt.a:0 "Let them dream of plenty."
  zz_valyria_magic_dream_magic.092.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.092.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.092.name$"
  zz_valyria_magic_dream_magic.092.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending a long dream of plenty to the lands of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.092.toast.tt:0 "$zz_valyria_magic_dream_magic.092.toast.desc$"
  zz_valyria_magic_dream_magic.092.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.092.name$"
  zz_valyria_magic_dream_magic.092.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.092.f.toast.tt:0 "$zz_valyria_magic_dream_magic.092.f.toast.desc$"
  ## Spell Options
