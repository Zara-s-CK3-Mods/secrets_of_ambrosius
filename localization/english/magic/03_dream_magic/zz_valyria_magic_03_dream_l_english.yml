  ## Interaction
  zz_valyria_magic_dream_magic_068.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_scq$\n\nThe use of the arcane forces of [dream_magic|E] to send a chosen subject a prophetic dream that will guide them towards forgotten deeds that will add to their glory.\n\nThrough this mystery, a prophecy is seeded in the subject's sleep: a vision that shows them where forgotten deeds that will add to their glory may be found. They wake with the dream burning in their mind, and the chance to set out and seek its fulfilment.\n\nThe subject is given the chance to undertake a quest that may reward them with great [prestige|E].\n\nProphecy is a gift, but it is not a certainty. The dream shows the way; the dreamer must still walk it."

  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.068.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.068.name$"
  zz_valyria_magic_dream_magic.068.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, they see their own name carved into ancient stone, beside the names of heroes.\n\nThe prophets of the Freehold sent such dreams to the servants of the dragonlords, guiding them to treasures, allies, and opportunities that would otherwise have lain undiscovered for centuries.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards forgotten deeds that will add to their glory. Will you show them the way?"
  zz_valyria_magic_dream_magic.068.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a laurel wreath beside the subject's pillow as they sleep. In the dream, they see their own name carved in stone, beside those of heroes, and the deeds that would place it there unfold before them like a road.\n\nThe prophets of the Freehold sent such dreams to those they wished to see rise, and the dreams were seldom wrong.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards forgotten deeds that will add to their glory. Will you show them the way?"
  zz_valyria_magic_dream_magic.068.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA trumpet of polished brass is set at the foot of the subject's bed. In the dream, it sounds, and crowds cheer, and the subject sees the path that would earn them that acclaim, and the opportunities that lie along it.\n\nIn Valyria, glory was not left to chance. The prophets showed the ambitious where to find it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards forgotten deeds that will add to their glory. Will you show them the way?"

