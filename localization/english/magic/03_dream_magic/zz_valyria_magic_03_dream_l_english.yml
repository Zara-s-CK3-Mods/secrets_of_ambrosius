  #event
  zz_valyria_magic_dream_magic.070.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.070.name$"
  zz_valyria_magic_dream_magic.070.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, councils bow their heads and doors open before them.\n\nThe prophets of the Freehold sent such dreams to the servants of the dragonlords, guiding them to treasures, allies, and opportunities that would otherwise have lain undiscovered for centuries.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards favours and secrets that will grant them influence. Will you show them the way?"
  zz_valyria_magic_dream_magic.070.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a sealed letter, its wax still soft, beside the subject's pillow. In the dream, the letter opens, and within it is a summons to councils and courts, where every voice falls silent when the subject speaks.\n\nThe prophets of the Freehold guided the ambitious towards influence, and the influence they won was rarely questioned.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards favours and secrets that will grant them influence. Will you show them the way?"
  zz_valyria_magic_dream_magic.070.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA chain of office is laid across the subject's chest as they sleep. In the dream, doors open before them, and those who sit behind them rise to greet the subject as an equal, or more.\n\nIn Valyria, influence flowed like water, and the prophets knew where to dig the channels.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards favours and secrets that will grant them influence. Will you show them the way?"

