  ## Interaction
  zz_valyria_magic_dream_magic_032.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_rs$\n\nThe use of the arcane forces of [dream_magic|E] to undo the progress of one of the subject's own schemes.\n\nThrough this mystery, the dream-walker scatters the plans of one of the subject's own plots, so that it must begin again from nothing.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.032.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.032.name$"
  zz_valyria_magic_dream_magic.032.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, the careful plans they have laid begin to blur and fade.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and disrupt one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.032.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a carefully drawn plan beside the sleeping subject and pours water upon it. As the ink runs, the subject's own scheme blurs in their dreams, its paths and purposes slipping away like water through fingers.\n\nThe dream-walkers of the Freehold were sometimes hired to disrupt a patron's own plots, for reasons the patron rarely shared.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and disrupt one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.032.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA wax tablet bearing the outline of a scheme is warmed over a low flame. As the wax softens, the words upon it fade, and in the subject's dream, their plans dissolve in the same way, every detail sliding out of reach.\n\nIn Valyria, it was not unknown for a schemer to wish their own plot undone. The dream-walkers could oblige.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and disrupt one of [recipient.GetFirstName]'s own schemes. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.032.opt.a:0 "Scatter the plans."
  zz_valyria_magic_dream_magic.032.opt.z:0 "No, do not cast!"
