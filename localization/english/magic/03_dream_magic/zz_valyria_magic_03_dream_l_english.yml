  zz_valyria_magic_dream_magic_072.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_scq$\n\nThe use of the arcane forces of [dream_magic|E] to send a chosen subject a prophetic dream that will guide them towards forgotten stores of imperial wealth.\n\nThrough this mystery, a prophecy is seeded in the subject's sleep: a vision that shows them where forgotten stores of imperial wealth may be found. They wake with the dream burning in their mind, and the chance to set out and seek its fulfilment.\n\nThe subject is given the chance to undertake a quest that may enrich the [treasury|E] of their realm.\n\nProphecy is a gift, but it is not a certainty. The dream shows the way; the dreamer must still walk it."

