  zz_valyria_magic_dream_magic.096.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.096.name$"
  zz_valyria_magic_dream_magic.096.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe subject is given a cup of sweetened milk and nightshade and laid down to sleep. The caster sits beside them through the night, whispering, and walks into their dream to find the head for numbers and order.\n\nThe dreamers of the Freehold taught that the waking self is only the dream's shadow, and that what is reshaped in sleep is reshaped by day. Come morning, accounts balance in their mind unbidden, or slip away like water.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.096.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nIn the subject's dream they stand in a long hall of mirrors, and in each mirror is a version of themselves. The caster's voice tells them which one to walk toward, and slowly, step by step, they become it.\n\nIt is not done in a single night, and it does not need to be: the dream returns, and each time accounts balance in their mind unbidden, or slip away like water.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.096.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster binds a strip of black silk over the subject's eyes and speaks to them until they drift between waking and sleep. There, in the half-dream, the caster reaches into the head for numbers and order and gently turns it, as one turns a key.\n\nIn Valyria it was said that the greenseers of the east could make a fool wise or a wise man a fool, and never once wake him.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
