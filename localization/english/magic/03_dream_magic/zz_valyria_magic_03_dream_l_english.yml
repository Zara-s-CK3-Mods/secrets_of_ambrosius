  ## Interaction
  zz_valyria_magic_dream_magic_067.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_scq$\n\nThe use of the arcane forces of [dream_magic|E] to send a chosen subject a prophetic dream that will guide them towards a lost and sacred relic.\n\nThrough this mystery, a prophecy is seeded in the subject's sleep: a vision that shows them where a lost and sacred relic may be found. They wake with the dream burning in their mind, and the chance to set out and seek its fulfilment.\n\nThe subject is given the chance to undertake a quest that may reward them with great [piety|E].\n\nProphecy is a gift, but it is not a certainty. The dream shows the way; the dreamer must still walk it."

  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.067.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.067.name$"
  zz_valyria_magic_dream_magic.067.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, a light shines from behind a temple wall, and a voice calls them by name.\n\nThe prophets of the Freehold sent such dreams to the servants of the dragonlords, guiding them to treasures, allies, and opportunities that would otherwise have lain undiscovered for centuries.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards a lost and sacred relic. Will you show them the way?"
  zz_valyria_magic_dream_magic.067.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lights a temple lamp and sets it beside the subject's bed. In the dream, its glow spreads across a holy place long fallen into ruin, and a voice calls the subject by name, bidding them come and restore it.\n\nThe prophets of the Freehold sent such dreams to those they wished to raise high in the eyes of the faithful.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards a lost and sacred relic. Will you show them the way?"
  zz_valyria_magic_dream_magic.067.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA string of prayer beads is wound about the subject's hand as they sleep. In the dream, each bead becomes a sacred place, and in each one, a deed waits to be done that will win the favour of the gods and the faithful alike.\n\nIn Valyria, piety could be guided, like a river, towards whichever fields needed watering.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards a lost and sacred relic. Will you show them the way?"

  zz_valyria_magic_dream_magic.067.opt.a:0 "Seek the sacred relic."
