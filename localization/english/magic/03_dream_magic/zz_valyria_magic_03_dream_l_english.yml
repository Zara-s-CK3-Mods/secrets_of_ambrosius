  zz_valyria_magic_dream_magic_096.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_skl_pm$\n\nThe use of the arcane forces of [dream_magic|E] to permanently raise or lower the selected subject's [stewardship|E].\n\nWhat a person is by day is only what they dream themselves to be by night. Through this mystery the caster walks the subject's dreams to sharpen or dull their [stewardship|E].\n\nThe change is small and slow to grow: one point for every 75 points of the caster's skill, and never less than one."

