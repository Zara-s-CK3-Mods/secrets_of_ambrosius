  ## Dream Magic - Mystery of Soothsaying (Scheme Defence)
  zz_valyria_magic_dream_magic_084.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_exp_all$\n$zz_chg$\n\nThe use of the arcane forces of [dream_magic|E] to set a watch in a chosen subject's dreams over every plot that is turned against them.\n\nNo plot is hatched without first being imagined, and what is imagined passes, now and then, through the world of dreams. Through this mystery, the soothsayer's art waits there, and when a [scheme|E] against the subject stirs, it is dragged into the light.\n\nEach month, one hostile [scheme|E] targeting the subject is exposed, until the visions are spent."
  zz_valyria_magic_dream_magic.084.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.084.name$"
  zz_valyria_magic_dream_magic.084.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster hangs a small bronze bell above the subject's bed and stills it with a touch. All night, it does not ring. But in the subject's dream, it rings again and again, and each time it rings, a face looks up from a dark corner, caught.\n\nThe soothsayers of the Freehold said that a plot has a sound, if one knows how to listen.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.084.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster pours a ring of salt around the subject's bed and speaks the names of their enemies over it, known and unknown. Where the unknown names fall, the salt darkens, and the caster marks each place with a drop of wax.\n\nIn Valyria, it was said that no conspirator could cross a soothsayer's salt unseen.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.084.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA mirror is turned to face the door of the subject's chamber, and the caster breathes upon it until it fogs. As the subject sleeps, shapes move in the mist on the glass, figures whispering, hands passing letters, and one by one they turn to look out of the mirror, startled.\n\nThey know they have been seen.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.084.opt.a:0 "Let no plot against them stay hidden!"
  zz_valyria_magic_dream_magic.084.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.084.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.084.name$"
  zz_valyria_magic_dream_magic.084.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ setting a watch in the dreams of [recipient.GetFirstName] against plots aimed at them."
  zz_valyria_magic_dream_magic.084.toast.tt:0 "$zz_valyria_magic_dream_magic.084.toast.desc$"
  zz_valyria_magic_dream_magic.084.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.084.name$"
  zz_valyria_magic_dream_magic.084.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.084.f.toast.tt:0 "$zz_valyria_magic_dream_magic.084.f.toast.desc$"
  zz_valyria_magic_dream_magic.084.buff.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.084.name$"
  zz_valyria_magic_dream_magic.084.buff.toast.desc:0 "A plot was seen in a dream, and has been exposed"
  zz_valyria_magic_dream_magic.084.buff.toast.tt:0 "$zz_valyria_magic_dream_magic.084.buff.toast.desc$"

  ## Dream Magic - Mystery of Soothsaying (Secret Destruction)
  zz_valyria_magic_dream_magic_085.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_dsec_one$\n$zz_chg$\n\nThe use of the arcane forces of [dream_magic|E] to watch over a chosen subject's secrets in the world of dreams, and to unmake any secret that others have learned before it can be turned against them.\n\nA secret known to another is a blade in another's hand. Through this mystery, the soothsayer foresees each such blade and dissolves it, so that the knowledge fades from every mind that held it, and no [blackmail|E] can be built upon it.\n\nEach month, one of the subject's secrets known to someone else is destroyed, until the visions are spent."
  zz_valyria_magic_dream_magic.085.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.085.name$"
  zz_valyria_magic_dream_magic.085.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster writes the subject's name on a strip of parchment and lays it in a bowl of water beside their bed. As the subject sleeps, other words appear on the parchment around the name, small and cramped, and one by one the water rises to wash them away.\n\nBy morning, only the name remains.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.085.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA heavy iron key is set upon the subject's chest as they sleep, and the caster turns it once in the air above them. In the dream, doors close all through the subject's memory, softly, one after another, and in other houses, other sleepers forget what they had heard.\n\nThe soothsayers of the Freehold sold this working dearly, and never spoke of who had bought it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.085.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster burns a single page in a brazier at the foot of the subject's bed and lets the smoke drift over them. The smoke does not rise. It spreads outward, thin and grey, through the walls and out into the night, seeking every mind that holds what was on that page.\n\nIn Valyria, it was said that a secret is only a story, and a dream can end any story.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.085.opt.a:0 "Let their secrets be forgotten!"
  zz_valyria_magic_dream_magic.085.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.085.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.085.name$"
  zz_valyria_magic_dream_magic.085.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ setting a watch over the secrets of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.085.toast.tt:0 "$zz_valyria_magic_dream_magic.085.toast.desc$"
  zz_valyria_magic_dream_magic.085.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.085.name$"
  zz_valyria_magic_dream_magic.085.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.085.f.toast.tt:0 "$zz_valyria_magic_dream_magic.085.f.toast.desc$"
  zz_valyria_magic_dream_magic.085.buff.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.085.name$"
  zz_valyria_magic_dream_magic.085.buff.toast.desc:0 "A secret was foreseen in a dream, and unmade before it could be used"
  zz_valyria_magic_dream_magic.085.buff.toast.tt:0 "$zz_valyria_magic_dream_magic.085.buff.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_086.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_copn_up$\n$zz_dur10$\n$zz_stk$\n\nThe use of the arcane forces of [dream_magic|E] to send a county a dream of devotion that lingers for a decade.\n\nThrough this mystery, the people of a county dream the same dream of their ruler, night after night, until it has settled into them like a memory of something true.\n\nThe county's [popular_opinion|E] rises for ten years. The gain is slight, even for a great master, but every further casting adds to it."
  zz_valyria_magic_dream_magic.086.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.086.name$"
  zz_valyria_magic_dream_magic.086.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA single candle is set in the window and the caster begins to speak a name, softly, over and over. Far away, a village turns in its sleep."
  zz_valyria_magic_dream_magic.086.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster threads a long cord through their fingers, tying a knot for every household. By the last of them the cord hums like a plucked string."
  zz_valyria_magic_dream_magic.086.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe chamber fills with the murmur of many sleepers, though no one else is there. All of them are saying the same thing."
  zz_valyria_magic_dream_magic.086.opt.a:0 "Let them dream of devotion."
  zz_valyria_magic_dream_magic.086.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.086.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.086.name$"
  zz_valyria_magic_dream_magic.086.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending a long dream of devotion to the lands of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.086.toast.tt:0 "$zz_valyria_magic_dream_magic.086.toast.desc$"
  zz_valyria_magic_dream_magic.086.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.086.name$"
  zz_valyria_magic_dream_magic.086.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.086.f.toast.tt:0 "$zz_valyria_magic_dream_magic.086.f.toast.desc$"
