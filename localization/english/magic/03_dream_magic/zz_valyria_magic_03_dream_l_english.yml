    ## Interaction
  zz_valyria_magic_dream_magic_061.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_dcor$\n\nThe use of the arcane forces of [dream_magic|E] to sever a bond of fate between a chosen subject and another.\n\nThrough this mystery, a thread of fate binding the subject to another is cut in their sleep, so that they wake no longer bound: a friendship ended, a love forgotten, a rivalry dissolved.\n\nA chosen relationship between the subject and another character is destroyed.\n\nThe dream-weavers of the Freehold held that the bonds between people are threads spun in sleep, and that a skilled hand could tie them or cut them at will."
  
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.061.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.061.name$"
  zz_valyria_magic_dream_magic.061.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's dreams, a thread of light stretches away into the dark, and a blade hangs above it.\n\nThe dream-weavers of the Freehold held that the bonds between people are threads spun in sleep, and that a skilled hand could tie them or cut them at will.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may sever a bond between [recipient.GetFirstName] and another of your choosing. Will you cut the thread?"
  zz_valyria_magic_dream_magic.061.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a pair of silver shears beside the subject's pillow as they sleep. In the dream, a thread binding them to another person shines in the dark, and the shears rise, and cut it cleanly through.\n\nThe dream-weavers of the Freehold could untie the closest bonds, and the people they parted never quite remembered why.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may sever a bond between [recipient.GetFirstName] and another of your choosing. Will you cut the thread?"
  zz_valyria_magic_dream_magic.061.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA knotted cord is held over a candle flame until it burns through, and the two ends fall apart. In the subject's dream, a bond they shared with another frays and parts in the same way, and the space between them grows cold.\n\nIn Valyria, a bond that could be woven could also be unwoven, and the dream-weavers did both.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may sever a bond between [recipient.GetFirstName] and another of your choosing. Will you cut the thread?"
  zz_valyria_magic_dream_magic.061.opt.a:0 "Cut the thread."
  zz_valyria_magic_dream_magic.061.opt.z:0 "No, let their ties endure."
  
  ## Spell Toast
  zz_valyria_magic_dream_magic.061.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.061.name$"
  zz_valyria_magic_dream_magic.061.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ severing a bond of fate held by [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.061.toast.tt:0 "$zz_valyria_magic_dream_magic.061.toast.desc$"  

  zz_valyria_magic_dream_magic.061.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.061.name$"
  zz_valyria_magic_dream_magic.061.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$ as the destined threads knot and tighten, leaving their relationship untouched.."  
  zz_valyria_magic_dream_magic.061.f.toast.tt:0 "$zz_valyria_magic_dream_magic.061.f.toast.desc$"


    ## Interaction
  zz_valyria_magic_dream_magic_062.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_cch$\n\nThe use of the arcane forces of [dream_magic|E] to bind another character to a chosen subject through a hook woven in dreams.\n\nThrough this mystery, the dreams of another are filled with a debt they owe to the subject, a debt so real to them that they wake bound by it.\n\nThe subject gains a hook on another character.\n\nThe dream-weavers of the Freehold held that the bonds between people are threads spun in sleep, and that a skilled hand could tie them or cut them at will."
  
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.062.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.062.name$"
  zz_valyria_magic_dream_magic.062.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's dreams, a chain of light forms between their hand and another's throat.\n\nThe dream-weavers of the Freehold held that the bonds between people are threads spun in sleep, and that a skilled hand could tie them or cut them at will.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may weave a hook for [recipient.GetFirstName] over another of your choosing. Will you forge the chain?"
  zz_valyria_magic_dream_magic.062.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a chain of fine gold links upon the subject's chest as they sleep. In the dream, the chain stretches out into the dark and fastens about the neck of another, who kneels, and bows their head, and does not rise.\n\nThe dream-weavers of the Freehold could bind loyalty as easily as they bound love.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may weave a hook for [recipient.GetFirstName] over another of your choosing. Will you forge the chain?"
  zz_valyria_magic_dream_magic.062.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA ring of iron is slipped onto the subject's finger as they sleep, and the caster speaks a name into it. In the dream, the one named appears before them, kneeling, offering their hand, and their heart, in service.\n\nIn Valyria, loyalty was too important to leave to chance. The dream-weavers made sure it was given where it was needed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may weave a hook for [recipient.GetFirstName] over another of your choosing. Will you forge the chain?"
  zz_valyria_magic_dream_magic.062.opt.a:0 "Forge the chain."
  zz_valyria_magic_dream_magic.062.opt.z:0 "No, let their fates remain unentangled."
  
  ## Spell Toast
  zz_valyria_magic_dream_magic.062.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.062.name$"
  zz_valyria_magic_dream_magic.062.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ weaving a hook for [recipient.GetFirstName] over another."
  zz_valyria_magic_dream_magic.062.toast.tt:0 "$zz_valyria_magic_dream_magic.062.toast.desc$"  

  zz_valyria_magic_dream_magic.062.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.062.name$"
  zz_valyria_magic_dream_magic.062.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$ as the binding vision collapses, leaving no hook formed between the intended souls.."  
  zz_valyria_magic_dream_magic.062.f.toast.tt:0 "$zz_valyria_magic_dream_magic.062.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_dream_magic_063.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_dch$\n\nThe use of the arcane forces of [dream_magic|E] to break the hook that a chosen subject holds over another.\n\nThrough this mystery, the hold that the subject has over another is dissolved in their sleep, so that the debt is forgotten and the chain falls away.\n\nThe subject loses a hook they hold over another character.\n\nThe dream-weavers of the Freehold held that the bonds between people are threads spun in sleep, and that a skilled hand could tie them or cut them at will."

  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.063.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.063.name$"
  zz_valyria_magic_dream_magic.063.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's dreams, a chain they hold grows thin and brittle, and begins to crumble.\n\nThe dream-weavers of the Freehold held that the bonds between people are threads spun in sleep, and that a skilled hand could tie them or cut them at will.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may break a hook that [recipient.GetFirstName] holds over another. Will you shatter the chain?"
  zz_valyria_magic_dream_magic.063.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a rusted chain upon the subject's chest as they sleep. In the dream, the chain they hold over another grows brittle, its links cracking and falling away, until nothing binds them any more.\n\nThe dream-weavers of the Freehold could undo loyalties as easily as they made them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may break a hook that [recipient.GetFirstName] holds over another. Will you shatter the chain?"
  zz_valyria_magic_dream_magic.063.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA cup of salt water is poured slowly over an iron ring, and the caster speaks the old words of unbinding as the subject sleeps. In the dream, a bond of loyalty grows weak and rusted, and then crumbles to dust.\n\nIn Valyria, no oath was ever truly unbreakable. The dream-weavers knew where every oath was weakest.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may break a hook that [recipient.GetFirstName] holds over another. Will you shatter the chain?"

  zz_valyria_magic_dream_magic.063.opt.a:0 "Shatter the chain."
  zz_valyria_magic_dream_magic.063.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_dream_magic.063.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.063.name$"
  zz_valyria_magic_dream_magic.063.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ breaking a hook held by [recipient.GetFirstName]."

  zz_valyria_magic_dream_magic.063.toast.tt:0 "$zz_valyria_magic_dream_magic.063.toast.desc$"

  zz_valyria_magic_dream_magic.063.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.063.name$"
  zz_valyria_magic_dream_magic.063.f.toast.desc:0 "$zz_toast_01$ [dream_magic], $zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.063.f.toast.tt:0 "$zz_valyria_magic_dream_magic.063.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_064.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_ico$\n\nThe use of the arcane forces of [dream_magic|E] to warm a chosen subject's feelings towards another through dreams.\n\nThrough this mystery, the subject dreams warmly of another person: of kindness shown, of shared laughter, of trust earned. They wake regarding that person far more favourably.\n\nThe subject's opinion of another character improves.\n\nThe dream-weavers of the Freehold held that the bonds between people are threads spun in sleep, and that a skilled hand could tie them or cut them at will."

  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.064.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.064.name$"
  zz_valyria_magic_dream_magic.064.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's dreams, a familiar face smiles at them across a sunlit garden.\n\nThe dream-weavers of the Freehold held that the bonds between people are threads spun in sleep, and that a skilled hand could tie them or cut them at will.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may warm the feelings of [recipient.GetFirstName] towards another of your choosing. Will you sow affection?"
  zz_valyria_magic_dream_magic.064.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a sprig of jasmine upon a likeness of the target as the subject sleeps. In the target's dream, a familiar face appears in a sunlit garden, smiling warmly, and on waking, they feel a fondness they cannot quite explain.\n\nThe dream-weavers of the Freehold could make a rival into a friend, or a stranger into an ally, without a single word being spoken.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may warm the feelings of [recipient.GetFirstName] towards another of your choosing. Will you sow affection?"
  zz_valyria_magic_dream_magic.064.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA cup of sweet wine is poured out as an offering beside the sleeping subject. In the dream of another, they share a cup together, and laugh, and part as friends, and in the waking world, that warmth lingers long after.\n\nIn Valyria, it was said that a good opinion was the cheapest of all gifts to give, and the dream-weavers gave it freely, for a price.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may warm the feelings of [recipient.GetFirstName] towards another of your choosing. Will you sow affection?"

  zz_valyria_magic_dream_magic.064.opt.a:0 "Sow affection."
  zz_valyria_magic_dream_magic.064.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_dream_magic.064.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.064.name$"
  zz_valyria_magic_dream_magic.064.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ warming the feelings of [recipient.GetFirstName] towards another."

  zz_valyria_magic_dream_magic.064.toast.tt:0 "$zz_valyria_magic_dream_magic.064.toast.desc$"

  zz_valyria_magic_dream_magic.064.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.064.name$"
  zz_valyria_magic_dream_magic.064.f.toast.desc:0 "$zz_toast_01$ [dream_magic], $zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.064.f.toast.tt:0 "$zz_valyria_magic_dream_magic.064.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_dream_magic_065.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_deco$\n\nThe use of the arcane forces of [dream_magic|E] to sour a chosen subject's feelings towards another through dreams.\n\nThrough this mystery, the subject dreams darkly of another person: of slights, betrayals, and cruelties. They wake regarding that person with anger.\n\nThe subject's opinion of another character worsens.\n\nThe dream-weavers of the Freehold held that the bonds between people are threads spun in sleep, and that a skilled hand could tie them or cut them at will."

  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.065.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.065.name$"
  zz_valyria_magic_dream_magic.065.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's dreams, a familiar face turns away from them, smiling coldly.\n\nThe dream-weavers of the Freehold held that the bonds between people are threads spun in sleep, and that a skilled hand could tie them or cut them at will.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may sour the feelings of [recipient.GetFirstName] towards another of your choosing. Will you sow anger?"
  zz_valyria_magic_dream_magic.065.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a sprig of bitter wormwood upon a likeness of the target as the subject sleeps. In the target's dream, a familiar face turns from them, cold and sneering, and on waking, they find a resentment they cannot shake.\n\nThe dream-weavers of the Freehold could turn friends into enemies, and enemies into worse.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may sour the feelings of [recipient.GetFirstName] towards another of your choosing. Will you sow anger?"
  zz_valyria_magic_dream_magic.065.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA cup of vinegar is poured upon the ground beside the sleeping subject. In the dream of another, a slight is remembered, then another, then a hundred more, until the memory of the subject is bitter as the vinegar itself.\n\nIn Valyria, ill will could be sown in sleep, and it grew there, quietly, until it bore its fruit.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may sour the feelings of [recipient.GetFirstName] towards another of your choosing. Will you sow anger?"

  zz_valyria_magic_dream_magic.065.opt.a:0 "Sow anger."
  zz_valyria_magic_dream_magic.065.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_dream_magic.065.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.065.name$"
  zz_valyria_magic_dream_magic.065.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ souring the feelings of [recipient.GetFirstName] towards another."

  zz_valyria_magic_dream_magic.065.toast.tt:0 "$zz_valyria_magic_dream_magic.065.toast.desc$"

  zz_valyria_magic_dream_magic.065.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.065.name$"
  zz_valyria_magic_dream_magic.065.f.toast.desc:0 "$zz_toast_01$ [dream_magic], $zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.065.f.toast.tt:0 "$zz_valyria_magic_dream_magic.065.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_066.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_scq$\n\nThe use of the arcane forces of [dream_magic|E] to send a chosen subject a prophetic dream that will guide them towards a hidden hoard of gold.\n\nThrough this mystery, a prophecy is seeded in the subject's sleep: a vision that shows them where a hidden hoard of gold may be found. They wake with the dream burning in their mind, and the chance to set out and seek its fulfilment.\n\nThe subject is given the chance to undertake a quest that may reward them with a great deal of [gold|E].\n\nProphecy is a gift, but it is not a certainty. The dream shows the way; the dreamer must still walk it."

  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.066.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.066.name$"
  zz_valyria_magic_dream_magic.066.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, a glitter of gold shines in the dark beneath a forgotten floor.\n\nThe prophets of the Freehold sent such dreams to the servants of the dragonlords, guiding them to treasures, allies, and opportunities that would otherwise have lain undiscovered for centuries.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards a hidden hoard of gold. Will you show them the way?"
  zz_valyria_magic_dream_magic.066.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster sets a single gold coin upon the subject's pillow as they sleep. In the dream, it falls through the floor and leads them down into the dark, where a forgotten hoard glitters beneath dust and stone.\n\nThe prophets of the Freehold sent such dreams to the servants of the dragonlords, guiding them to riches that had lain unclaimed for centuries.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards a hidden hoard of gold. Will you show them the way?"
  zz_valyria_magic_dream_magic.066.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA map of the land is laid beside the sleeping subject, and the caster drips melted wax across it, one drop at a time. In the dream, one of those drops glows gold, and the subject knows, without knowing how, that treasure lies buried beneath it.\n\nIn Valyria, wealth was found as often by dreaming as by digging.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards a hidden hoard of gold. Will you show them the way?"

