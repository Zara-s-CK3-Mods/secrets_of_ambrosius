  zz_valyria_magic_dream_magic.073.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.073.name$"
  zz_valyria_magic_dream_magic.073.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, sealed granaries and forgotten wagons laden with grain appear from the mist.\n\nThe prophets of the Freehold sent such dreams to the servants of the dragonlords, guiding them to treasures, allies, and opportunities that would otherwise have lain undiscovered for centuries.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards hidden stores of provisions. Will you show them the way?"
  zz_valyria_magic_dream_magic.073.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a sheaf of wheat beside the subject's pillow as they sleep. In the dream, it leads them to a forgotten granary, its doors sealed, its store of grain still sound after years in the dark.\n\nThe prophets of the Freehold kept the armies of the dragonlords fed with such dreams, guiding them to supplies that others had long since forgotten.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards hidden stores of provisions. Will you show them the way?"
  zz_valyria_magic_dream_magic.073.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA loaf of bread is broken over the sleeping subject and its crumbs scattered upon the floor. In the dream, the crumbs become a trail, and the trail leads to wagons laden with stores, abandoned on a road no one now remembers.\n\nIn Valyria, an army marched on its provisions, and the prophets made sure those provisions were never far away.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards hidden stores of provisions. Will you show them the way?"
  zz_valyria_magic_dream_magic.073.opt.a:0 "Seek the hidden stores."
  zz_valyria_magic_dream_magic.073.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_dream_magic.073.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.073.name$"
  zz_valyria_magic_dream_magic.073.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending [recipient.GetFirstName] a prophecy of hidden provisions."
  zz_valyria_magic_dream_magic.073.toast.tt:0 "$zz_valyria_magic_dream_magic.073.toast.desc$"

  zz_valyria_magic_dream_magic.073.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.073.name$"
