  ## Interaction
  zz_valyria_magic_dream_magic_047.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_ta$\n$zz_da$\n$zz_cd$\n$zz_dbld$\n\nThe use of the arcane forces of [dream_magic|E] to call forth a cataclysm from the depths of nightmare and bring ruin upon an army.\n\nEvery army dreams of its own destruction. Through this mystery, those dreams are made real: the nightmares of every soldier in a host are drawn together into a single cataclysm and unleashed upon them.\n\nThe army suffers catastrophic losses. If it is locked in battle, the cataclysm may decide the battle outright, and the land around it may be scarred by the ruin.\n\nThe Valyrians called this the Waking Nightmare, and used it only when an army had to be destroyed utterly."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.047.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.047.name$"
  zz_valyria_magic_dream_magic.047.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. Then the drowsiness curdles into dread. A pressure builds in the air, the weight of ten thousand nightmares pressing against the walls of the waking world.\n\nThe dream-sorcerers of the Freehold rarely called the Waking Nightmare, for it was said that some of its terror stayed with the one who called it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may unleash a cataclysm of nightmare upon an army of [recipient.GetFirstName]. Is any victory worth such horror?"
  zz_valyria_magic_dream_magic.047.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lies upon a slab of cold stone and speaks words that have not been spoken aloud in centuries. Far away, and close at hand, sleepers begin to scream, and the scream spreads, from one dream to the next, until the whole land shakes with terror.\n\nThe Waking Nightmare was the most feared of all the arts of the Freehold's dream-sorcerers. It was said that even they could not always control it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may unleash a cataclysm of nightmare upon an army of [recipient.GetFirstName]. Is any victory worth such horror?"
  zz_valyria_magic_dream_magic.047.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nEvery candle in the chamber is snuffed at once, and in the darkness, the caster begins to dream. The dream does not stay within them. It spills outward, black and vast, into the sleep of everyone near and far, and the nightmares it brings will not end on waking.\n\nIn Valyria, the Waking Nightmare was called upon only in the direst need, and even then, its callers were never quite the same afterwards.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may unleash a cataclysm of nightmare upon an army of [recipient.GetFirstName]. Is any victory worth such horror?"
  zz_valyria_magic_dream_magic.047.opt.a:0 "Let the nightmare wake."
  zz_valyria_magic_dream_magic.047.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.047.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.047.name$"
  zz_valyria_magic_dream_magic.047.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ unleashing a cataclysm of nightmare upon an army of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.047.toast.tt:0 "$zz_valyria_magic_dream_magic.047.toast.desc$"

  zz_valyria_magic_dream_magic.047.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.047.name$"
  zz_valyria_magic_dream_magic.047.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.047.f.toast.tt:0 "$zz_valyria_magic_dream_magic.047.f.toast.desc$"  


  ## Interaction
  zz_valyria_magic_dream_magic_048.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_ppw$\n$zz_ongoing$\n\nThe use of the arcane forces of [dream_magic|E] to send a chosen subject foretelling dreams that keep the mothers of their family safe in childbirth.\n\nThrough this mystery, the subject is granted soothsaying dreams that foretell the dangers of childbirth before they come. Warned in their sleep, they are able to protect the mothers of their family from death in the birthing bed.\n\nThe protection endures for some time, guarding any pregnant women close to the subject.\n\nThe great houses of the Freehold lost few mothers to childbirth. The midwives credited their own skill; the soothsayers knew better."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.048.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.048.name$"
  zz_valyria_magic_dream_magic.048.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject's dreams fill with the sound of a newborn's cry, and of a mother's laughter in the morning.\n\nThe soothsayers of Valyria watched over the birthing chambers of the great families, warning of every danger before it came.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] foretelling dreams that will keep the mothers of their family safe in childbirth. Will you watch over them?"
  zz_valyria_magic_dream_magic.048.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a sprig of rosemary upon the mother's pillow and speaks softly over her as she sleeps. In the dream, a midwife's hands are calm and certain, and a newborn cries in a sunlit room, and the danger that might have come has passed by.\n\nThe soothsayers of the Freehold guarded the birthing beds of the great houses with dreams as well as with physicians.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] foretelling dreams that will keep the mothers of their family safe in childbirth. Will you watch over them?"
  zz_valyria_magic_dream_magic.048.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA small silver bell is hung above the mother's bed, and it chimes softly as she sleeps. With each chime, a danger to her is glimpsed and turned aside in the dream, like a cart steered away from the edge of a cliff.\n\nIn Valyria, a soothsayer's warnings had saved more mothers than any physician's art.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] foretelling dreams that will keep the mothers of their family safe in childbirth. Will you watch over them?"
  zz_valyria_magic_dream_magic.048.opt.a:0 "Keep the mothers safe."
  zz_valyria_magic_dream_magic.048.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.048.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.048.name$"
  zz_valyria_magic_dream_magic.048.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ granting [recipient.GetFirstName] dreams that keep the mothers of their family safe in childbirth."
  zz_valyria_magic_dream_magic.048.toast.tt:0 "$zz_valyria_magic_dream_magic.048.toast.desc$"

  zz_valyria_magic_dream_magic.048.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.048.name$"
  zz_valyria_magic_dream_magic.048.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.048.f.toast.tt:0 "$zz_valyria_magic_dream_magic.048.f.toast.desc$"  

  zz_valyria_magic_dream_magic.048.buff.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.048.name$"
  zz_valyria_magic_dream_magic.048.buff.toast.desc:0 "A tragic outcome has been prevented"
  zz_valyria_magic_dream_magic.048.buff.toast.tt:0 "$zz_valyria_magic_dream_magic.048.buff.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_049.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_puc$\n$zz_ongoing$\n\nThe use of the arcane forces of [dream_magic|E] to send a chosen subject foretelling dreams that keep the unborn children of their family safe.\n\nThrough this mystery, the subject is granted soothsaying dreams that foretell the dangers facing unborn children of their family. Warned in their sleep, they are able to protect those children from the perils of birth.\n\nThe protection endures for some time, guarding the unborn children of those close to the subject.\n\nThe dragonlords prized their bloodlines above all things. No child of a great house was allowed to come into the world unguarded."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.049.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.049.name$"
  zz_valyria_magic_dream_magic.049.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject's dreams fill with a small, steady heartbeat, and the warm darkness of the womb.\n\nThe soothsayers of Valyria watched over the unborn heirs of the great families as jealously as any dragon over its eggs.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] foretelling dreams that will keep the unborn children of their family safe. Will you watch over them?"
  zz_valyria_magic_dream_magic.049.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays their hand upon the mother's belly as she sleeps and speaks softly in High Valyrian. In the dream, a small heartbeat answers, strong and steady, and around it gathers a warm darkness that no harm can reach.\n\nThe soothsayers of the Freehold watched over the unborn heirs of the great houses as carefully as any nurse watched over the born.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] foretelling dreams that will keep the unborn children of their family safe. Will you watch over them?"
  zz_valyria_magic_dream_magic.049.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA tiny cradle of carved wood is set beside the mother's bed. In the dream, the cradle rocks gently, and within it a child sleeps, safe and whole, while every danger that might have threatened it is shown, and turned aside.\n\nIn Valyria, an heir was too precious to be left to chance. The soothsayers made sure that chance played no part.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] foretelling dreams that will keep the unborn children of their family safe. Will you watch over them?"
  zz_valyria_magic_dream_magic.049.opt.a:0 "Keep the children safe."
  zz_valyria_magic_dream_magic.049.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.049.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.049.name$"
  zz_valyria_magic_dream_magic.049.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ granting [recipient.GetFirstName] dreams that keep the unborn children of their family safe."
  zz_valyria_magic_dream_magic.049.toast.tt:0 "$zz_valyria_magic_dream_magic.049.toast.desc$"

  zz_valyria_magic_dream_magic.049.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.049.name$"
  zz_valyria_magic_dream_magic.049.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.049.f.toast.tt:0 "$zz_valyria_magic_dream_magic.049.f.toast.desc$"  

  zz_valyria_magic_dream_magic.049.buff.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.049.name$"
  zz_valyria_magic_dream_magic.049.buff.toast.desc:0 "A tragic outcome has been prevented from occuring to [PREV.GetName]"
  zz_valyria_magic_dream_magic.049.buff.toast.tt:0 "$zz_valyria_magic_dream_magic.049.buff.toast.desc$"



  ## Interaction
  zz_valyria_magic_dream_magic_050.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_trad$\n\nThe use of the arcane forces of [dream_magic|E] to plant a new tradition in the dreams of a whole people.\n\nTraditions begin as dreams shared by many. Through this mystery, a chosen tradition is sent into the sleep of a whole culture, until it seems to the people that they have always held it.\n\nA new [tradition|E] is added to the subject's culture.\n\nThe customs of the Freehold spread across the old world with remarkable speed. Not all of them spread by example."

  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.050.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.050.name$"
  zz_valyria_magic_dream_magic.050.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. Across the lands of a whole people, sleepers dream the same dream: a festival, a custom, a way of life that feels as old as the hills.\n\nThe dream-sowers of Valyria shaped the traditions of the peoples they ruled, so that each generation was a little more Valyrian than the last.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may plant a new tradition in the dreams of [recipient.GetFirstName]'s people. Will you shape their ways?"
  zz_valyria_magic_dream_magic.050.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lights a festival lamp, of a kind used by the people whose culture is to be shaped, and sets it upon a map of their lands. In their dreams, the people see new festivals, new customs, new ways of living, and wake to find that these feel as though they had always been theirs.\n\nThe dream-sowers of the Freehold shaped the traditions of whole peoples, so slowly that no one ever noticed the change.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may plant a new tradition in the dreams of [recipient.GetFirstName]'s people. Will you shape their ways?"
  zz_valyria_magic_dream_magic.050.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA tapestry, half woven, is hung in the chamber, and the caster works upon it as they drift into sleep. Across the lands of the chosen people, sleepers dream of the same patterns, and in time, those patterns find their way into their crafts, their songs and their laws.\n\nIn Valyria, a people's customs were not inherited. They were designed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may plant a new tradition in the dreams of [recipient.GetFirstName]'s people. Will you shape their ways?"
  zz_valyria_magic_dream_magic.050.opt.a:0 "Let them dream of a new way."
  zz_valyria_magic_dream_magic.050.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_dream_magic.050.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.050.name$"
  zz_valyria_magic_dream_magic.050.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ planting a new tradition in the dreams of the people of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.050.toast.tt:0 "$zz_valyria_magic_dream_magic.050.toast.desc$"

  zz_valyria_magic_dream_magic.050.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.050.name$"
  zz_valyria_magic_dream_magic.050.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.050.f.toast.tt:0 "$zz_valyria_magic_dream_magic.050.f.toast.desc$"

    ## Interaction
  zz_valyria_magic_dream_magic_051.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_hcm$\n\nThe use of the arcane forces of [dream_magic|E] to restore a chosen caster's endurance in the working of magic through restful dreams.\n\nEvery failed spell leaves its mark on the caster's soul. Through this mystery, the subject is granted deep and restorative dreams in which those marks are smoothed away.\n\nThe subject's capacity to cast safely is restored.\n\nThe dream-healers of the Freehold tended the sorcerers of Valyria as physicians tend soldiers, binding the wounds that magic leaves behind."

  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.051.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.051.name$"
  zz_valyria_magic_dream_magic.051.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject sinks into a sleep so deep and peaceful it seems almost like death, and their face slowly relaxes, years of strain falling away.\n\nThe Valyrians called this the Healing Sleep, and every great sorcerer of the Freehold returned to it often.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] the Healing Sleep, restoring their capacity to cast in safety. Will you let them rest?"
  zz_valyria_magic_dream_magic.051.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a cool cloth upon the subject's brow and sings softly as they sleep. In the dream, the subject lies in a meadow under a warm sun, and the weariness of years drains from them like water from a sieve.\n\nThe Healing Sleep was the refuge of the Freehold's greatest sorcerers, who returned to it whenever the strain of their arts grew too heavy to bear.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] the Healing Sleep, restoring their capacity to cast in safety. Will you let them rest?"
  zz_valyria_magic_dream_magic.051.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA bowl of steaming water scented with lavender is set beside the subject's bed. As they sleep, its scent fills their dreams, and in them, every ache and every hurt is gently soothed, as though by a mother's hand.\n\nIn Valyria, it was said that no wound of body or spirit was too deep for the Healing Sleep, if one was patient enough to let it work.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant [recipient.GetFirstName] the Healing Sleep, restoring their capacity to cast in safety. Will you let them rest?"
  zz_valyria_magic_dream_magic.051.opt.a:0 "Let them rest."
  zz_valyria_magic_dream_magic.051.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_dream_magic.051.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.051.name$"
  zz_valyria_magic_dream_magic.051.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ granting [recipient.GetFirstName] the Healing Sleep."
  zz_valyria_magic_dream_magic.051.toast.tt:0 "$zz_valyria_magic_dream_magic.051.toast.desc$"

  zz_valyria_magic_dream_magic.051.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.051.name$"
  zz_valyria_magic_dream_magic.051.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.051.f.toast.tt:0 "$zz_valyria_magic_dream_magic.051.f.toast.desc$"


    ## Interaction
  zz_valyria_magic_dream_magic_052.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_pcm$\n\nThe use of the arcane forces of [dream_magic|E] to raise a shield of dreams that protects a chosen caster from the backlash of a miscast spell.\n\nThrough this mystery, a shield woven from dream-stuff is laid over the subject's spirit, ready to swallow the wild energies of a failed working before they can do harm.\n\nThe shield lies dormant until it is needed. When a working fails, the backlash is drawn into the world of dreams and dispersed.\n\nThe teachers of the Freehold laid this shield upon their students before every dangerous lesson."

  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.052.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.052.name$"
  zz_valyria_magic_dream_magic.052.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. A faint shimmer, like the haze on the edge of sleep, settles over the subject and fades from sight.\n\nThe dream-sorcerers of Valyria never cast a dangerous working without a Shield of Dreams.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may lay a Shield of Dreams upon [recipient.GetFirstName], protecting them from the backlash of their next failed working. Will you raise it?"
  zz_valyria_magic_dream_magic.052.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster draws a circle of silver dust around the subject as they sleep. In the dream, the dust rises and hangs in the air about them, shimmering like a heat haze, and when they wake, it is gone, though they still feel it close.\n\nThe dream-sorcerers of the Freehold never attempted a perilous working without first raising a Shield of Dreams about themselves.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may lay a Shield of Dreams upon [recipient.GetFirstName], protecting them from the backlash of their next failed working. Will you raise it?"
  zz_valyria_magic_dream_magic.052.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA veil of the finest silk is laid across the subject's face, and the caster speaks the old words softly as they sleep. In the dream, the veil grows and spreads until it wraps them entirely, a cocoon of shimmering light that no harm can pierce.\n\nIn Valyria, magic was dangerous, and the wise prepared for its dangers before they came.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may lay a Shield of Dreams upon [recipient.GetFirstName], protecting them from the backlash of their next failed working. Will you raise it?"
  zz_valyria_magic_dream_magic.052.opt.a:0 "Raise the shield."
  zz_valyria_magic_dream_magic.052.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_dream_magic.052.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.052.name$"
  zz_valyria_magic_dream_magic.052.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ laying a Shield of Dreams upon [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.052.toast.tt:0 "$zz_valyria_magic_dream_magic.052.toast.desc$"

  zz_valyria_magic_dream_magic.052.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.052.name$"
  zz_valyria_magic_dream_magic.052.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.052.f.toast.tt:0 "$zz_valyria_magic_dream_magic.052.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_dream_magic_053.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_pdpg$\n\nThe use of the arcane forces of [dream_magic|E] to deepen a chosen subject's connection to the forces of magic, so that power flows to them more freely.\n\nPower flows through the world like water, and some are closer to its streams than others. Through this mystery, the subject dreams their way closer to those streams, so that power gathers in them more readily.\n\nThe subject's passive gain of [drops_of_power|E] increases permanently.\n\nThe great sorcerers of the Freehold were said to sleep upon beds carved with glyphs, so that their dreams might bring them ever closer to the source."

  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.053.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.053.name$"
  zz_valyria_magic_dream_magic.053.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's dreams, a river of light runs through a dark landscape, and they find themselves walking towards its banks.\n\nThe dream-sorcerers of Valyria guided promising students to the river in their sleep, so that they might drink from it for the rest of their lives.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw [recipient.GetFirstName] closer to the streams of power, so that it flows to them more freely. Will you lead them to the river?"
  zz_valyria_magic_dream_magic.053.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster pours a thin stream of water from a silver jug into a basin beside the sleeping subject, slow and steady and endless. In the dream, the stream becomes a river of light, and the subject drinks from it, and drinks again, and is never quite full.\n\nThe dream-sorcerers of the Freehold guided their students to this river, so that their power would grow, night after night, for the rest of their lives.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw [recipient.GetFirstName] closer to the streams of power, so that it flows to them more freely. Will you lead them to the river?"
  zz_valyria_magic_dream_magic.053.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA spiral of tiny candles is lit upon the floor around the subject's bed. As they sleep, the light flows inward along the spiral, and in the dream, it pools at the subject's feet, rising slowly like a tide.\n\nIn Valyria, power was not only won through study. It could also be gathered, drop by drop, in sleep.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may draw [recipient.GetFirstName] closer to the streams of power, so that it flows to them more freely. Will you lead them to the river?"
  zz_valyria_magic_dream_magic.053.opt.a:0 "Lead them to the river."
  zz_valyria_magic_dream_magic.053.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_dream_magic.053.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.053.name$"
  zz_valyria_magic_dream_magic.053.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ drawing [recipient.GetFirstName] closer to the streams of power."
  zz_valyria_magic_dream_magic.053.toast.tt:0 "$zz_valyria_magic_dream_magic.053.toast.desc$"

  zz_valyria_magic_dream_magic.053.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.053.name$"
  zz_valyria_magic_dream_magic.053.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.053.f.toast.tt:0 "$zz_valyria_magic_dream_magic.053.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_054.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_mdp$\n\nThe use of the arcane forces of [dream_magic|E] to magnify every drop of power that a chosen subject gathers.\n\nThrough this mystery, the subject's dreams are shaped into a vessel that magnifies the power poured into it, so that every drop they gather counts for more.\n\nThe subject's gains of [drops_of_power|E] are permanently multiplied.\n\nThe archmages of the Freehold were said to gather power as other men gather breath. This was one of their secrets."

  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.054.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.054.name$"
  zz_valyria_magic_dream_magic.054.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's dreams, a cup appears, and every drop that falls into it becomes two.\n\nThe dream-sorcerers of Valyria shaped such vessels only for those they trusted, for a mage with too much power was a danger to all.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may magnify the power that [recipient.GetFirstName] gathers. Will you shape their vessel?"
  zz_valyria_magic_dream_magic.054.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster sets a silver cup beside the subject's bed and fills it with water. As the subject sleeps, the water in the cup begins to rise, and every drop that falls from the jug becomes two, then four, until the cup overflows.\n\nThe dream-sorcerers of the Freehold forged such vessels only for those they trusted, for a mage whose power multiplied without limit was a danger to all.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may magnify the power that [recipient.GetFirstName] gathers. Will you shape their vessel?"
  zz_valyria_magic_dream_magic.054.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA mirror is set facing another, so that their reflections run on forever, and the subject sleeps between them. In the dream, their power is reflected again and again, each reflection a little brighter than the last.\n\nIn Valyria, it was said that power, properly shaped, could feed upon itself. This mystery is the shaping.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may magnify the power that [recipient.GetFirstName] gathers. Will you shape their vessel?"
  zz_valyria_magic_dream_magic.054.opt.a:0 "Shape the vessel."
  zz_valyria_magic_dream_magic.054.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_dream_magic.054.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.054.name$"
  zz_valyria_magic_dream_magic.054.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ magnifying the power that [recipient.GetFirstName] gathers."
  zz_valyria_magic_dream_magic.054.toast.tt:0 "$zz_valyria_magic_dream_magic.054.toast.desc$"

  zz_valyria_magic_dream_magic.054.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.054.name$"
  zz_valyria_magic_dream_magic.054.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.054.f.toast.tt:0 "$zz_valyria_magic_dream_magic.054.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_dream_magic_055.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_idpc$\n\nThe use of the arcane forces of [dream_magic|E] to deepen the well of power that a chosen subject can hold.\n\nEvery mage can hold only so much power before it spills away. Through this mystery, the subject's dreams are used to dig that well deeper, so that they can hold far more.\n\nThe subject's cap on [drops_of_power|E] is permanently increased.\n\nThe greatest sorcerers of the Freehold could hold enough power to raise storms or level cities. Their wells were dug in dreams."

  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.055.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.055.name$"
  zz_valyria_magic_dream_magic.055.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's dreams, they stand at the bottom of a well, and the walls are slowly sinking deeper into the earth.\n\nThe dream-sorcerers of Valyria deepened the wells of the Freehold's archmages, one dream at a time.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may deepen the well of power that [recipient.GetFirstName] can hold. Will you dig deeper?"
  zz_valyria_magic_dream_magic.055.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lowers a stone on a long cord into a deep jar of water beside the sleeping subject, slowly, as far as the cord will go. In the dream, the subject feels themselves sinking too, into a well of power that grows deeper with every breath.\n\nThe dream-sorcerers of the Freehold made the wells of its archmages deep, one dream at a time.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may deepen the well of power that [recipient.GetFirstName] can hold. Will you dig deeper?"
  zz_valyria_magic_dream_magic.055.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA great empty bowl of beaten bronze is set beside the subject's bed. As they sleep, the bowl seems to widen and deepen, though its shape does not change, and in the dream, the subject feels their own capacity for power stretch to match it.\n\nIn Valyria, a mage was only as strong as the vessel that held their power. This mystery makes that vessel larger.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may deepen the well of power that [recipient.GetFirstName] can hold. Will you dig deeper?"
  zz_valyria_magic_dream_magic.055.opt.a:0 "Dig the well deeper."
  zz_valyria_magic_dream_magic.055.opt.z:0 "No, do not cast!"

  ## Spell Toast
  zz_valyria_magic_dream_magic.055.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.055.name$"
  zz_valyria_magic_dream_magic.055.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ deepening the well of power that [recipient.GetFirstName] can hold."
  zz_valyria_magic_dream_magic.055.toast.tt:0 "$zz_valyria_magic_dream_magic.055.toast.desc$"

  zz_valyria_magic_dream_magic.055.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.055.name$"
  zz_valyria_magic_dream_magic.055.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.055.f.toast.tt:0 "$zz_valyria_magic_dream_magic.055.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_056.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_scq$\n\nThe use of the arcane forces of [dream_magic|E] to send a chosen subject a prophetic dream that will guide them towards forgotten magical knowledge.\n\nThrough this mystery, a prophecy is seeded in the subject's sleep: a vision that shows them where forgotten magical knowledge may be found. They wake with the dream burning in their mind, and the chance to set out and seek its fulfilment.\n\nThe subject is given the opportunity to undertake quests that may lead them to lost magical lore, practical experiments, and new mysteries.\n\nProphecy is a gift, but it is not a certainty. The dream shows the way; the dreamer must still walk it."
  
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.056.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.056.name$"
  zz_valyria_magic_dream_magic.056.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, ruined libraries and forgotten towers rise from the mist, their doors standing open.\n\nThe prophets of the Freehold sent such dreams to the servants of the dragonlords, guiding them to treasures, allies, and opportunities that would otherwise have lain undiscovered for centuries.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards forgotten magical knowledge. Will you show them the way?"
  zz_valyria_magic_dream_magic.056.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays an old book, its pages blank, upon the subject's chest as they sleep. In the dream, the pages fill with writing, and the writing becomes a map, and the map leads to forgotten towers where knowledge waits to be found.\n\nThe prophets of the Freehold sent such dreams to its scholars, guiding them to secrets that might otherwise have stayed lost.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards forgotten magical knowledge. Will you show them the way?"
  zz_valyria_magic_dream_magic.056.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA single key, old and heavy, is placed in the subject's hand as they drift into sleep. In the dream, it fits a door in a ruined library, and beyond the door lies a room filled with knowledge that has waited centuries for someone to find it.\n\nIn Valyria, it was said that the past keeps its secrets for those who know how to dream of them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send [recipient.GetFirstName] a prophetic dream that will guide them towards forgotten magical knowledge. Will you show them the way?"
  zz_valyria_magic_dream_magic.056.opt.a:0 "Follow the vision."
  zz_valyria_magic_dream_magic.056.opt.z:0 "No, let the ancient dead keep their silence."
  
  ## Spell Toast
  zz_valyria_magic_dream_magic.056.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.056.name$"
  zz_valyria_magic_dream_magic.056.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending [recipient.GetFirstName] a prophecy of forgotten magical knowledge."
  zz_valyria_magic_dream_magic.056.toast.tt:0 "$zz_valyria_magic_dream_magic.056.toast.desc$" 
  
  zz_valyria_magic_dream_magic.056.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.056.name$"
  zz_valyria_magic_dream_magic.056.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$ as the vision collapses into ash and screaming shadows before the secrets can be known.."  
  zz_valyria_magic_dream_magic.056.f.toast.tt:0 "$zz_valyria_magic_dream_magic.056.f.toast.desc$"

  dream_magic_prophecy_option_01:0 "Find a Scroll"
  dream_magic_prophecy_option_02:0 "Magical Experiments"
  dream_magic_prophecy_option_03:0 "Divine a Mystery"
  dream_magic_prophecy_option_04:0 "Legendary Scroll"


    ## Interaction
  zz_valyria_magic_dream_magic_057.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_rct$\n\nThe use of the arcane forces of [dream_magic|E] to unmake a single chosen trait within a chosen subject, rendering it to dreams.\n\nThrough this mystery, a single aspect of the subject's nature is drawn out of them in their sleep and dissolved into the world of dreams, never to return.\n\nOne chosen trait is removed from the subject.\n\nThe dream-sorcerers of the Freehold used this working to cure madness, cowardice, and cruelty. They also used it to remove the courage of their enemies."
  
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.057.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.057.name$"
  zz_valyria_magic_dream_magic.057.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's dreams, a part of them steps out of their body and walks away into the mist, and does not look back.\n\nThe Valyrians called this the Rendering, and considered it among the most delicate of all dream workings.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may render a chosen trait of [recipient.GetFirstName] to dreams, unmaking it entirely. But who will they be without it? Will you take it from them?"
  zz_valyria_magic_dream_magic.057.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster draws a line of salt down the middle of the subject's bed as they sleep. In the dream, the subject stands on one side of it, and on the other, a part of themselves turns and walks away into the mist, and does not return.\n\nThe Rendering was among the most delicate of all the Freehold's dream workings, for what is cut away in a dream cannot always be restored.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may render a chosen trait of [recipient.GetFirstName] to dreams, unmaking it entirely. But who will they be without it? Will you take it from them?"
  zz_valyria_magic_dream_magic.057.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA pair of fine silver scissors is laid upon the subject's chest as they sleep. In the dream, a thread binding them to some part of their nature is drawn out, taut and shining, and then, with a single snip, it is cut.\n\nIn Valyria, it was understood that a person could be made better by taking away, as well as by adding.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may render a chosen trait of [recipient.GetFirstName] to dreams, unmaking it entirely. But who will they be without it? Will you take it from them?"
  zz_valyria_magic_dream_magic.057.opt.a:0 "Render it to dreams."
  zz_valyria_magic_dream_magic.057.opt.z:0 "No, let fate remain untouched."
  
  ## Spell Toast
  zz_valyria_magic_dream_magic.057.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.057.name$"
  zz_valyria_magic_dream_magic.057.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ rendering a part of [recipient.GetFirstName] to dreams."
  zz_valyria_magic_dream_magic.057.toast.tt:0 "$zz_valyria_magic_dream_magic.057.toast.desc$" 
  
  zz_valyria_magic_dream_magic.057.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.057.name$"
  zz_valyria_magic_dream_magic.057.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$ as fractured visions war against one another, leaving [recipient.GetFirstName]'s nature unchanged.."  
  zz_valyria_magic_dream_magic.057.f.toast.tt:0 "$zz_valyria_magic_dream_magic.057.f.toast.desc$"

    ## Interaction
  zz_valyria_magic_dream_magic_058.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_hc$\n$zz_sh$\n\nThe use of the arcane forces of [dream_magic|E] to heal a chosen subject through dreams of wholeness.\n\nThe body believes what the mind dreams. Through this mystery, the subject dreams of perfect health so vividly that their body follows, closing wounds, mending bones, and casting out sickness and infirmity.\n\nThe subject is healed of many of their wounds, illnesses, and infirmities.\n\nThe dream-healers of the Freehold worked miracles that the physicians of other lands could only dream of."
  
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.058.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.058.name$"
  zz_valyria_magic_dream_magic.058.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The subject dreams of running through summer fields, of swimming in cold rivers, of a body that never tires and never aches.\n\nThe dream-healers of Valyria taught that every body remembers being whole, and that a skilled dreamer could remind it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may heal [recipient.GetFirstName] through dreams of wholeness. Will you let them dream themselves well?"
  zz_valyria_magic_dream_magic.058.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays sprigs of fresh herbs upon the subject's pillow, their scent sharp and green. In the dream, the subject runs through summer meadows, swims in cold clear water, and feels a strength in their limbs they have not felt in years.\n\nThe dream-healers of the Freehold taught that every body remembers being whole, and that a dream can remind it how.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may heal [recipient.GetFirstName] through dreams of wholeness. Will you let them dream themselves well?"
  zz_valyria_magic_dream_magic.058.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA bowl of spring water is set beside the subject's bed, and the caster dips their fingers in it and touches the subject's brow. In the dream, the water becomes a river, and the subject bathes in it, and every ill they carry washes away downstream.\n\nIn Valyria, health could be dreamed into being, and the dream-healers were never short of patients.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may heal [recipient.GetFirstName] through dreams of wholeness. Will you let them dream themselves well?"
  zz_valyria_magic_dream_magic.058.opt.a:0 "Let them dream themselves well."
  zz_valyria_magic_dream_magic.058.opt.z:0 "No, let the wounds remain."
  
  ## Spell Toast
  zz_valyria_magic_dream_magic.058.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.058.name$"
  zz_valyria_magic_dream_magic.058.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ healing [recipient.GetFirstName] through dreams of wholeness."
  zz_valyria_magic_dream_magic.058.toast.tt:0 "$zz_valyria_magic_dream_magic.058.toast.desc$"  

  zz_valyria_magic_dream_magic.058.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.058.name$"
  zz_valyria_magic_dream_magic.058.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$ as the healing vision fractures, leaving [recipient.GetFirstName] untouched by restoration.."  
  zz_valyria_magic_dream_magic.058.f.toast.tt:0 "$zz_valyria_magic_dream_magic.058.f.toast.desc$"
  

    ## Interaction
  zz_valyria_magic_dream_magic_059.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_cpt$\n\nThe use of the arcane forces of [dream_magic|E] to make a dream of the body manifest, reshaping a chosen subject's physical traits.\n\nThrough this mystery, the subject dreams of a different body, stronger, fairer, or more gifted, and the dream manifests in the flesh.\n\nOne of the subject's physical traits is granted or improved, or a chosen trait diminished.\n\nThe great families of the Freehold were famous for their beauty. Not all of it was born."
  
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.059.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.059.name$"
  zz_valyria_magic_dream_magic.059.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's dreams, they look into a mirror and see a face that is theirs, and yet subtly better.\n\nThe dream-sculptors of Valyria shaped the bodies of the dragonlords' children as surely as any flesh-sculptor, and far more gently.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may make the dreams of [recipient.GetFirstName] manifest in their flesh. Will you reshape them?"
  zz_valyria_magic_dream_magic.059.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA portrait of the subject, painted in their youth, is set beside them as they sleep. In the dream, the portrait and the sleeper begin to resemble one another more and more closely, until it is hard to tell which is which, and the subject on waking finds something in them changed.\n\nThe dream-sculptors of the Freehold shaped flesh with dreams, more gently and more surely than any knife.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may make the dreams of [recipient.GetFirstName] manifest in their flesh. Will you reshape them?"
  zz_valyria_magic_dream_magic.059.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lays a lump of soft clay upon the subject's chest and works it slowly with their fingers as the subject sleeps. In the dream, the subject feels their own body shaped in the same way, gently and patiently, towards a form they have always wished for.\n\nIn Valyria, it was said that a body is only a dream given weight. Change the dream, and the body follows.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may make the dreams of [recipient.GetFirstName] manifest in their flesh. Will you reshape them?"
  zz_valyria_magic_dream_magic.059.opt.a:0 "Let the dream become flesh."
  zz_valyria_magic_dream_magic.059.opt.z:0 "No, let the body remain as it is."
  
  ## Spell Toast
  zz_valyria_magic_dream_magic.059.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.059.name$"
  zz_valyria_magic_dream_magic.059.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ making a dream of the body manifest in [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.059.toast.tt:0 "$zz_valyria_magic_dream_magic.059.toast.desc$"  
  
  zz_valyria_magic_dream_magic.059.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.059.name$"
  zz_valyria_magic_dream_magic.059.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$ as the shaping vision dissolves, leaving [recipient.GetFirstName]'s form unchanged.."  
  zz_valyria_magic_dream_magic.059.f.toast.tt:0 "$zz_valyria_magic_dream_magic.059.f.toast.desc$"



    ## Interaction
  zz_valyria_magic_dream_magic_060.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_ccor$\n\nThe use of the arcane forces of [dream_magic|E] to weave a new bond of fate between a chosen subject and another.\n\nThrough this mystery, the dreams of two people are woven together, so that they wake bound by a new relationship: friendship, love, or rivalry.\n\nA chosen relationship is created between the subject and another character.\n\nThe dream-weavers of the Freehold held that the bonds between people are threads spun in sleep, and that a skilled hand could tie them or cut them at will."
  
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.060.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.060.name$"
  zz_valyria_magic_dream_magic.060.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's dreams, a thread of light reaches out into the dark, seeking another.\n\nThe dream-weavers of the Freehold held that the bonds between people are threads spun in sleep, and that a skilled hand could tie them or cut them at will.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may weave a new bond between [recipient.GetFirstName] and another of your choosing. Will you tie the thread?"
  zz_valyria_magic_dream_magic.060.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster ties a thread of red silk about the subject's wrist as they sleep, leaving its other end loose and trailing. In the dream, the loose end drifts out into the dark and finds another hand, and ties itself there, gently and firmly.\n\nThe dream-weavers of the Freehold held that every bond between people is a thread spun in sleep, and that new threads can be spun as easily as old ones.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may weave a new bond between [recipient.GetFirstName] and another of your choosing. Will you tie the thread?"
  zz_valyria_magic_dream_magic.060.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nTwo candles are lit on opposite sides of the chamber, and the caster slowly draws them together as the subject sleeps. In the dream, two people who had been strangers walk towards one another, and meet, and find they have known each other forever.\n\nIn Valyria, friendships and loves were made as often in dreams as in waking.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may weave a new bond between [recipient.GetFirstName] and another of your choosing. Will you tie the thread?"
  zz_valyria_magic_dream_magic.060.opt.a:0 "Tie the thread."
  zz_valyria_magic_dream_magic.060.opt.z:0 "No, let their paths remain apart."
  
  ## Spell Toast
  zz_valyria_magic_dream_magic.060.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.060.name$"
  zz_valyria_magic_dream_magic.060.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ weaving a new bond of fate for [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.060.toast.tt:0 "$zz_valyria_magic_dream_magic.060.toast.desc$"  

  zz_valyria_magic_dream_magic.060.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.060.name$"
  zz_valyria_magic_dream_magic.060.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$ as the threads of fate snarl and unravel, leaving both lives unchanged.."  
  zz_valyria_magic_dream_magic.060.f.toast.tt:0 "$zz_valyria_magic_dream_magic.060.f.toast.desc$"
