  zz_valyria_magic_dream_magic_089.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_ctrl_dn$\n$zz_dur10$\n$zz_stk$\n\nThe use of the arcane forces of [dream_magic|E] to send a county a nightmare of unrest that lingers for a decade.\n\nThrough this mystery, the people of a county dream of locked doors and marching feet. They wake on edge, and no decree quite settles them.\n\nThe county's [county_control|E] recovers more slowly and falls more quickly for ten years. The harm is slight, even for a great master, but every further casting adds to it."
  zz_valyria_magic_dream_magic.089.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.089.name$"
  zz_valyria_magic_dream_magic.089.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nSmall stones are set out in perfect rows, and the caster sweeps them to the floor with one hand. They roll for far too long."
  zz_valyria_magic_dream_magic.089.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA low drumming begins beneath the floor of the chamber and does not stop, though no drum can be found."
  zz_valyria_magic_dream_magic.089.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster whispers a rumour into a jar and seals it. Somewhere, a crowd starts to gather without knowing why."
  zz_valyria_magic_dream_magic.089.opt.a:0 "Let them dream of unrest."
  zz_valyria_magic_dream_magic.089.opt.z:0 "No, do not cast!"
  zz_valyria_magic_dream_magic.089.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.089.name$"
  zz_valyria_magic_dream_magic.089.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending a long nightmare of unrest to the lands of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.089.toast.tt:0 "$zz_valyria_magic_dream_magic.089.toast.desc$"
  zz_valyria_magic_dream_magic.089.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.089.name$"
  zz_valyria_magic_dream_magic.089.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_dream_magic.089.f.toast.tt:0 "$zz_valyria_magic_dream_magic.089.f.toast.desc$"
