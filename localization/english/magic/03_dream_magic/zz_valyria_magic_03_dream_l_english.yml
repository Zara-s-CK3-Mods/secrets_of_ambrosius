  ## Interaction
  zz_valyria_magic_dream_magic_033.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sa$\n\nThe use of the arcane forces of [dream_magic|E] to send the caster's mind into the bodies of beasts, and raise them as an army.\n\nThe skinchangers of the Freehold could slip their minds into the bodies of animals, seeing through their eyes and moving with their limbs. Through this mystery, that art is extended to a whole host of beasts, bound together and turned to war.\n\nAn army is raised for the subject, its soldiers the creatures of the wild, driven by the dreamer's will.\n\nSuch hosts do not last for ever. When the dream ends, the beasts scatter back into the wild, remembering nothing."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.033.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.033.name$"
  zz_valyria_magic_dream_magic.033.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. The caster's eyes roll back, and from the forests and hills beyond the walls comes a sound like a thousand creatures waking at once.\n\nThe beast-dreamers of Valyria marched with the legions at the head of wolves, bears, and stranger things, all moving as one.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send your mind out among the beasts and raise them as an army for [recipient.GetFirstName]. Will you wear their skins?"
  zz_valyria_magic_dream_magic.033.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lies down upon a bed of furs and closes their eyes, and their breathing slows until it matches the rhythm of something much larger. Beyond the walls, in forest and field, beasts stir in their dens, and lift their heads, and listen.\n\nThe beast-dreamers of the Freehold did not tame animals. They became them, and led them where they wished.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send your mind out among the beasts and raise them as an army for [recipient.GetFirstName]. Will you wear their skins?"
  zz_valyria_magic_dream_magic.033.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA wolf's skull is laid upon the caster's chest as they sink into sleep. Their dream runs out across the land on four feet, and wherever it goes, other creatures rise and follow, until a great host of beasts moves together under a single will.\n\nIn Valyria, the beast-dreamers marched beside the legions. Their armies needed no supplies, and never deserted.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send your mind out among the beasts and raise them as an army for [recipient.GetFirstName]. Will you wear their skins?"
  zz_valyria_magic_dream_magic.033.opt.a:0 "Let the beasts rise."
  dream_magic_skinchanging_ravens:0 "Ravens"
  dream_magic_skinchanging_direwolves:0 "Direwolves (12 Extra Mana)"
  dream_magic_skinchanging_bears:0 "Bears (45 Extra Mana)"
  zz_valyria_magic_dream_magic.033.opt.z:0 "No, do not cast!"
