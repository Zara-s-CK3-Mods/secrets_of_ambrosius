  ## Interaction
  zz_valyria_magic_dream_magic_094.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_skl_pm$\n\nThe use of the arcane forces of [dream_magic|E] to permanently raise or lower the selected subject's [diplomacy|E].\n\nWhat a person is by day is only what they dream themselves to be by night. Through this mystery the caster walks the subject's dreams to sharpen or dull their [diplomacy|E].\n\nThe change is small and slow to grow: one point for every 55 points of the caster's skill, and never less than one."

  ## Spell Options
  ## event
  zz_valyria_magic_dream_magic.094.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.094.name$"
  zz_valyria_magic_dream_magic.094.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe subject is given a cup of sweetened milk and nightshade and laid down to sleep. The caster sits beside them through the night, whispering, and walks into their dream to find the voice and the bearing.\n\nThe dreamers of the Freehold taught that the waking self is only the dream's shadow, and that what is reshaped in sleep is reshaped by day. Come morning, their words carry further, or falter and die in the mouth.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.094.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nIn the subject's dream they stand in a long hall of mirrors, and in each mirror is a version of themselves. The caster's voice tells them which one to walk toward, and slowly, step by step, they become it.\n\nIt is not done in a single night, and it does not need to be: the dream returns, and each time their words carry further, or falter and die in the mouth.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.094.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster binds a strip of black silk over the subject's eyes and speaks to them until they drift between waking and sleep. There, in the half-dream, the caster reaches into the voice and the bearing and gently turns it, as one turns a key.\n\nIn Valyria it was said that the greenseers of the east could make a fool wise or a wise man a fool, and never once wake him.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.094.opt.a:0 "Let the dream reshape their [diplomacy|E]!"
  zz_valyria_magic_dream_magic.094.opt.z:0 "No, do not cast!"

  zz_valyria_magic_dream_magic.094.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.094.name$"
  zz_valyria_magic_dream_magic.094.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ reshaping the [diplomacy|E] of [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.094.toast.tt:0 "$zz_valyria_magic_dream_magic.094.toast.desc$"

  zz_valyria_magic_dream_magic.094.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.094.name$"
  zz_valyria_magic_dream_magic.094.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_dream_magic.094.f.toast.tt:0 "$zz_valyria_magic_dream_magic.094.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_095.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_skl_pm$\n\nThe use of the arcane forces of [dream_magic|E] to permanently raise or lower the selected subject's [martial|E].\n\nWhat a person is by day is only what they dream themselves to be by night. Through this mystery the caster walks the subject's dreams to sharpen or dull their [martial|E].\n\nThe change is small and slow to grow: one point for every 85 points of the caster's skill, and never less than one."

  ## Spell Options
  ## event
  zz_valyria_magic_dream_magic.095.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.095.name$"
