  zz_valyria_magic_dream_magic_027.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_fz$\n\nThe use of the arcane forces of [dream_magic|E] to freeze a scheme that targets the subject.\n\nThrough this mystery, the dream-walker fills the sleep of those who plot against the subject with lethargy and doubt, so that their plot stalls and goes nowhere for a time.\n\nA scheme is only a thought shared between conspirators, and thoughts can be reached in sleep. Through the dreams of the subject, the dream-walker follows the threads of the plot to the minds that hold it.\n\nThe intrigues of the Freehold were played out as much in dreams as in the waking world, and no conspiracy among the dragonlords was ever truly safe from the sorcerers who walked between them."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.027.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.027.name$"
  zz_valyria_magic_dream_magic.027.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's sleep, the conspirators against them move as if through deep water, slower and slower.\n\nThe dream-walkers of Valyria were the hidden hand behind the politics of the Freehold, quietly helping some conspiracies to bloom and others to wither before they ever saw daylight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and freeze a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.027.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster pours sand slowly from one hand to the other, and the grains fall more slowly with each pass. In the subject's dream, the conspirators against them move as though through deep water, every step heavier than the last.\n\nThe dream-walkers of the Freehold could make a plot drag on for years, until its makers simply gave up.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and freeze a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.027.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA clock of brass and glass is set beside the sleeping subject, and the caster stops its pendulum with a single finger. In the dream, the scheme against them slows in the same way, its every motion grinding towards a halt.\n\nIn Valyria, time was a weapon, and the dream-walkers knew how to wield it against those who plotted in the dark.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may slip into the dreams of [recipient.GetFirstName] and freeze a scheme aimed at [recipient.GetFirstName]. Will you reach into the plot?"
  zz_valyria_magic_dream_magic.027.opt.a:0 "Let the plot stall."
  zz_valyria_magic_dream_magic.027.opt.z:0 "No, do not cast!"
  ## Spell Toast
