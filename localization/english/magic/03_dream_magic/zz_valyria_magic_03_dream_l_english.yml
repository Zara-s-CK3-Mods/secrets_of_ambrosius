  ## Interaction
  zz_valyria_magic_dream_magic_034.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_ccul$\n\nThe use of the arcane forces of [dream_magic|E] to change the cultural identity of a chosen subject through dreams of another people.\n\nThrough this mystery, the subject dreams night after night of another people's ways: their songs, their customs, their gods and heroes. When they wake, those dreams have become memories, and the subject belongs to that culture as though born to it.\n\nThe subject's culture is changed.\n\nThe Freehold made Valyrians of conquered peoples this way, one dreaming noble at a time."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.034.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.034.name$"
  zz_valyria_magic_dream_magic.034.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. In the subject's dreams, a foreign land unfolds: unfamiliar songs, unfamiliar faces, and slowly, a sense of having come home.\n\nThe dream-sowers of Valyria understood that conquest of the land meant nothing without conquest of the mind.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may change the culture of [recipient.GetFirstName] through dreams of another people. But who will they be when they wake? Will you remake them?"
  zz_valyria_magic_dream_magic.034.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster burns a bundle of herbs gathered from a distant land, and its strange scent fills the room. As the subject sleeps, they dream of that land: its food, its songs, its customs, and slowly, the dream begins to feel less like a visit and more like a homecoming.\n\nThe dream-sowers of the Freehold made Valyrians of the peoples they conquered, one sleeper at a time.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may change the culture of [recipient.GetFirstName] through dreams of another people. But who will they be when they wake? Will you remake them?"
  zz_valyria_magic_dream_magic.034.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA piece of cloth woven in a foreign style is laid over the subject as they sleep. In the dream, they wear it naturally, speak the tongue of those who made it, and find, to their quiet surprise, that they belong among them.\n\nIn Valyria, it was understood that a people could be conquered by fire, but only truly made one's own by dreams.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may change the culture of [recipient.GetFirstName] through dreams of another people. But who will they be when they wake? Will you remake them?"
  zz_valyria_magic_dream_magic.034.opt.a:0 "Let them belong to another people."
  zz_valyria_magic_dream_magic.034.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.034.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.034.name$"
  zz_valyria_magic_dream_magic.034.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ changing the culture of [recipient.GetFirstName] through dreams."
  zz_valyria_magic_dream_magic.034.toast.tt:0 "$zz_valyria_magic_dream_magic.034.toast.desc$"

  zz_valyria_magic_dream_magic.034.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.034.name$"
  zz_valyria_magic_dream_magic.034.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.034.f.toast.tt:0 "$zz_valyria_magic_dream_magic.034.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_035.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_cf$\n\nThe use of the arcane forces of [dream_magic|E] to turn a chosen subject to a new faith through visions in their sleep.\n\nThrough this mystery, the subject receives visions in their sleep: a god, a prophet, a revelation that shakes their old certainties to the core. They wake converted, as fervent in their new faith as any born to it.\n\nThe subject's faith is changed.\n\nThe priests of many faiths would call such a conversion a miracle. The dream-walkers of the Freehold called it a working."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.035.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.035.name$"
  zz_valyria_magic_dream_magic.035.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. A golden light fills the subject's dreams, and in it a voice speaks words of revelation that they will remember all their days.\n\nThe Valyrians were tolerant of all faiths, the scholars say. It is easy to be tolerant when one can change a mind at will.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn [recipient.GetFirstName] to a new faith through visions in the night. But is it right to counterfeit a revelation?"
  zz_valyria_magic_dream_magic.035.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA golden lamp is lit beside the subject's bed, and its light falls warm across their sleeping face. In the dream, the light grows brighter, and a voice speaks from within it, certain and kind, telling them truths they have always half-known.\n\nThe dream-prophets of the Freehold made converts of kings, and the kings never knew they had been made.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn [recipient.GetFirstName] to a new faith through visions in the night. But is it right to counterfeit a revelation?"
  zz_valyria_magic_dream_magic.035.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster sings a hymn from a faith not the subject's own as they drift to sleep. In the dream, the hymn becomes a choir, and the choir becomes a temple, and the subject finds themselves kneeling within it, weeping with a joy they cannot explain.\n\nIn Valyria, faith was a matter of policy, and the dream-prophets were its most effective servants.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn [recipient.GetFirstName] to a new faith through visions in the night. But is it right to counterfeit a revelation?"
  zz_valyria_magic_dream_magic.035.opt.a:0 "Grant them a revelation."
  zz_valyria_magic_dream_magic.035.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.035.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.035.name$"
  zz_valyria_magic_dream_magic.035.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ turning [recipient.GetFirstName] to a new faith through visions in the night."
  zz_valyria_magic_dream_magic.035.toast.tt:0 "$zz_valyria_magic_dream_magic.035.toast.desc$"

  zz_valyria_magic_dream_magic.035.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.035.name$"
  zz_valyria_magic_dream_magic.035.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.035.f.toast.tt:0 "$zz_valyria_magic_dream_magic.035.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_036.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_cnty_cul$\n\nThe use of the arcane forces of [dream_magic|E] to change the culture of an entire county through shared dreams.\n\nThrough this mystery, the same dream is sent to every sleeper in a county, night after night, until a whole people remembers a heritage that was never theirs.\n\nThe county's culture is changed.\n\nThis was how the Freehold made its provinces Valyrian. It took a generation of dreams, but the dream-sowers were patient."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.036.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.036.name$"
  zz_valyria_magic_dream_magic.036.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. Across the chosen county, sleepers stir and murmur in a tongue they did not know when they lay down.\n\nThe dream-sowers of Valyria worked in great circles, sending the same dream into thousands of minds at once.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may change the culture of the chosen county, held by [recipient.GetFirstName], through shared dreams. Will you remake a people?"
  zz_valyria_magic_dream_magic.036.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster spreads a map of the chosen county across the floor and lies down upon it. As they sleep, a song in a foreign tongue rises from them, and across the county, sleepers hum it in their dreams, and wake knowing words they never learned.\n\nThe dream-sowers of the Freehold could change the tongue and customs of a whole land in a single generation.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may change the culture of the chosen county, held by [recipient.GetFirstName], through shared dreams. Will you remake a people?"
  zz_valyria_magic_dream_magic.036.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA great brazier is lit in the chamber and fed with herbs and spices from a distant people. Its smoke drifts out through the windows and across the chosen county, and wherever it settles, sleepers dream of strange customs that feel, somehow, as old as their grandmothers.\n\nIn Valyria, conquest was never finished until the conquered dreamed as Valyrians.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may change the culture of the chosen county, held by [recipient.GetFirstName], through shared dreams. Will you remake a people?"
  zz_valyria_magic_dream_magic.036.opt.a:0 "Let them dream of a new people."
  zz_valyria_magic_dream_magic.036.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.036.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.036.name$"
  zz_valyria_magic_dream_magic.036.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ changing the culture of a county held by [recipient.GetFirstName] through shared dreams."
  zz_valyria_magic_dream_magic.036.toast.tt:0 "$zz_valyria_magic_dream_magic.036.toast.desc$"

  zz_valyria_magic_dream_magic.036.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.036.name$"
  zz_valyria_magic_dream_magic.036.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.036.f.toast.tt:0 "$zz_valyria_magic_dream_magic.036.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_dream_magic_037.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_cnty_fth$\n\nThe use of the arcane forces of [dream_magic|E] to turn an entire county to a new faith through shared visions.\n\nThrough this mystery, the same vision of revelation is sent to every sleeper in a county, until the whole people turns to a new faith as if by miracle.\n\nThe county's faith is changed.\n\nHoly men across the old world spoke of mass conversions in the lands near the Freehold. Few understood how they had happened."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.037.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.037.name$"
  zz_valyria_magic_dream_magic.037.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. Across the chosen county, sleepers see the same golden light and hear the same voice, and in the morning, they go to new altars.\n\nThe dream-sowers of Valyria could turn a province to a new faith in a single season.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn the chosen county, held by [recipient.GetFirstName], to a new faith through shared visions. Will you counterfeit a miracle?"
  zz_valyria_magic_dream_magic.037.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster lights a lamp of holy oil and sets it upon a map of the chosen county. As they sleep, its glow spreads across the parchment, and in the county itself, sleepers dream of that same light, and of a voice that calls them to new altars.\n\nThe dream-prophets of the Freehold could turn a province's faith in a single season, and seldom left any trace of their passing.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn the chosen county, held by [recipient.GetFirstName], to a new faith through shared visions. Will you counterfeit a miracle?"
  zz_valyria_magic_dream_magic.037.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA choir of priests sings softly in the chamber as the caster sinks into sleep. Their hymn travels with the caster's dream, across the chosen county, and in every home, sleepers hear it, and wake with tears upon their faces and a new faith in their hearts.\n\nIn Valyria, it was said that a god was only as strong as the dreams of their faithful. The dream-prophets chose which gods would be strong.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn the chosen county, held by [recipient.GetFirstName], to a new faith through shared visions. Will you counterfeit a miracle?"
  zz_valyria_magic_dream_magic.037.opt.a:0 "Let them see a new god."
  zz_valyria_magic_dream_magic.037.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.037.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.037.name$"
  zz_valyria_magic_dream_magic.037.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ turning a county held by [recipient.GetFirstName] to a new faith through shared visions."
  zz_valyria_magic_dream_magic.037.toast.tt:0 "$zz_valyria_magic_dream_magic.037.toast.desc$"

  zz_valyria_magic_dream_magic.037.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.037.name$"
  zz_valyria_magic_dream_magic.037.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.037.f.toast.tt:0 "$zz_valyria_magic_dream_magic.037.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_dream_magic_038.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_copn_up$\n\nThe use of the arcane forces of [dream_magic|E] to send soothing dreams to the people of a county, warming them towards their ruler.\n\nThrough this mystery, the people of a county are sent gentle, peaceful dreams in which their ruler appears as a protector and friend. They wake feeling kindly towards their lord, without quite knowing why.\n\nThe county's [popular_opinion|E] rises at once, more so the greater the caster's skill.\n\nThe archons of the Freehold were famously loved by their subjects. The dream-sowers made sure of it."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.038.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.038.name$"
  zz_valyria_magic_dream_magic.038.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. Across the chosen county, sleepers smile in their dreams, and wake rested and content.\n\nThe Valyrians called this the Lullaby, and sang it over restless provinces whenever discontent began to stir.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send soothing dreams to the chosen county of [recipient.GetFirstName], warming its people towards their ruler. Will you sing the Lullaby?"
  zz_valyria_magic_dream_magic.038.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster plays a soft tune upon a lyre as they sink into sleep, and the music drifts out across the chosen county. In every home, sleepers smile in their dreams, their worries easing, and wake to find the day brighter than they remember.\n\nThe Valyrians sang their Lullaby over every restless province, and the provinces grew quiet.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send soothing dreams to the chosen county of [recipient.GetFirstName], warming its people towards their ruler. Will you sing the Lullaby?"
  zz_valyria_magic_dream_magic.038.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nA bowl of warm milk and honey is set beside the caster as they sleep, and its sweet scent seems to travel far beyond the chamber walls. Across the chosen county, sleepers dream of comfort and plenty, and the anger in their hearts softens.\n\nIn Valyria, it was understood that a contented people does not rebel, and that contentment is easier to give in sleep than in waking.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send soothing dreams to the chosen county of [recipient.GetFirstName], warming its people towards their ruler. Will you sing the Lullaby?"
  zz_valyria_magic_dream_magic.038.opt.a:0 "Sing them the Lullaby."
  zz_valyria_magic_dream_magic.038.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.038.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.038.name$"
  zz_valyria_magic_dream_magic.038.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ sending soothing dreams to the people of a county held by [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.038.toast.tt:0 "$zz_valyria_magic_dream_magic.038.toast.desc$"

  zz_valyria_magic_dream_magic.038.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.038.name$"
  zz_valyria_magic_dream_magic.038.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.038.f.toast.tt:0 "$zz_valyria_magic_dream_magic.038.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_039.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_copn_dn$\n\nThe use of the arcane forces of [dream_magic|E] to plague the people of a county with nightmares that turn them against their ruler.\n\nThrough this mystery, the people of a county are plagued with nightmares in which their ruler appears as a tyrant and a monster. They wake fearful and angry, and their resentment festers.\n\nThe county's [popular_opinion|E] falls at once, more so the greater the caster's skill.\n\nThe Freehold used this working to stir rebellion in the lands of its enemies, without ever sending a single agent."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.039.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.039.name$"
  zz_valyria_magic_dream_magic.039.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe lights in the chamber dim of their own accord, and a heavy, honeyed drowsiness settles over all who are present. Then, across the chosen county, the sleepers begin to toss and moan, and their dreams fill with a cruel, familiar face.\n\nThe dream-sowers of Valyria could set a province against its lord in a single season of nightmares.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may plague the chosen county of [recipient.GetFirstName] with nightmares, turning its people against their ruler. Will you send the nightmares?"
  zz_valyria_magic_dream_magic.039.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster burns a bundle of nettles and thorns, and the bitter smoke drifts towards a map of the chosen county. In every home there, sleepers toss and moan, and in their dreams, the face of their lord looms above them, cruel and uncaring.\n\nThe dream-sowers of the Freehold could set a province against its lord without ever setting foot in it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may plague the chosen county of [recipient.GetFirstName] with nightmares, turning its people against their ruler. Will you send the nightmares?"
  zz_valyria_magic_dream_magic.039.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster speaks the name of the county's lord into a cup of vinegar, and pours it slowly across a map of the land. In the dreams of the people there, that lord appears again and again, always taking, always cruel, until hatred is all they feel on waking.\n\nIn Valyria, rebellion was a crop, and the dream-sowers knew how to plant it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may plague the chosen county of [recipient.GetFirstName] with nightmares, turning its people against their ruler. Will you send the nightmares?"
  zz_valyria_magic_dream_magic.039.opt.a:0 "Send the nightmares."
  zz_valyria_magic_dream_magic.039.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.039.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.039.name$"
  zz_valyria_magic_dream_magic.039.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ plaguing the people of a county held by [recipient.GetFirstName] with nightmares."
  zz_valyria_magic_dream_magic.039.toast.tt:0 "$zz_valyria_magic_dream_magic.039.toast.desc$"

  zz_valyria_magic_dream_magic.039.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.039.name$"
