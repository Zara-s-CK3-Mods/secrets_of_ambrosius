  zz_valyria_magic_dream_magic.027.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ freezing a scheme aimed at [recipient.GetFirstName]."
  zz_valyria_magic_dream_magic.027.toast.tt:0 "$zz_valyria_magic_dream_magic.027.toast.desc$"

