  zz_valyria_magic_dream_magic.095.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nIn the subject's dream they stand in a long hall of mirrors, and in each mirror is a version of themselves. The caster's voice tells them which one to walk toward, and slowly, step by step, they become it.\n\nIt is not done in a single night, and it does not need to be: the dream returns, and each time they read a field of battle as a scholar reads a page, or lose the thread of it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.095.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_dream_magic')]\n\nThe caster binds a strip of black silk over the subject's eyes and speaks to them until they drift between waking and sleep. There, in the half-dream, the caster reaches into the instinct for command and gently turns it, as one turns a key.\n\nIn Valyria it was said that the greenseers of the east could make a fool wise or a wise man a fool, and never once wake him.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]"
  zz_valyria_magic_dream_magic.095.opt.a:0 "Let the dream reshape their [martial|E]!"
  zz_valyria_magic_dream_magic.095.opt.z:0 "No, do not cast!"

