l_english:
  FURTHER_MAGICAL_EDUCATION_SUCCESS_DESC:0 "You advance your mastery of your chosen school of the [higher_mysteries|E]"
  zz_scheme_trait_diligent:0 "[GetTrait('diligent').GetName( owner.Self )]: $VALUE|+0=$"
  zz_scheme_trait_lazy:0 "[GetTrait('lazy').GetName( owner.Self )]: $VALUE|+0=$"
  zz_scheme_trait_patient:0 "[GetTrait('patient').GetName( owner.Self )]: $VALUE|+0=$"
  zz_scheme_trait_impatient:0 "[GetTrait('impatient').GetName( owner.Self )]: $VALUE|+0=$"
  zz_scheme_knows_study_language:0 "Reads Latin: $VALUE|+0=$"
  zz_valyria_magic_further_education.desc.school_win.generalist_magic:0 "\n\nThe threads of power feel a little more familiar beneath my fingers."
  zz_valyria_magic_further_education.desc.school_lose.generalist_magic:0 "\n\nThe underlying patterns of the art remain stubbornly hidden from me."
  zz_valyria_magic_further_education.desc.school_win.blood_magic:0 "\n\nMy veins seem to hum when I think on what I have learned."
  zz_valyria_magic_further_education.desc.school_lose.blood_magic:0 "\n\nI have bled for nothing, it seems. Not even a drop's worth of insight."
  zz_valyria_magic_further_education.desc.school_win.dream_magic:0 "\n\nTonight, I suspect, my dreams will be very vivid indeed."
  zz_valyria_magic_further_education.desc.school_lose.dream_magic:0 "\n\nMy sleep, when it comes, is dreamless and unhelpful."
  zz_valyria_magic_further_education.desc.school_win.alchemy_magic:0 "\n\nAlready I can see how this changes the proportions of my next mixture."
  zz_valyria_magic_further_education.desc.school_lose.alchemy_magic:0 "\n\nMy last mixture curdled into a foul-smelling sludge. A fitting summary."
  zz_valyria_magic_further_education.desc.school_win.shadow_magic:0 "\n\nThe shadows in the corners of the room seem to lean closer, as if they too were listening."
  zz_valyria_magic_further_education.desc.school_lose.shadow_magic:0 "\n\nThe darkness keeps its own counsel, and it is not inclined to share it with me."
  zz_valyria_magic_further_education.desc.school_win.air_magic:0 "\n\nA breeze stirs the pages, though every window is shut."
  zz_valyria_magic_further_education.desc.school_lose.air_magic:0 "\n\nThe air in my study is stale and still, and so, I fear, is my progress."
  zz_valyria_magic_further_education.desc.school_win.fire_magic:0 "\n\nThe candle flames gutter and leap in time with my pulse."
  zz_valyria_magic_further_education.desc.school_lose.fire_magic:0 "\n\nMy brazier has gone out, and I did not notice until I was shivering."
  zz_valyria_magic_further_education.desc.school_win.water_magic:0 "\n\nThe ink in my well trembles, though the desk is perfectly still."
  zz_valyria_magic_further_education.desc.school_lose.water_magic:0 "\n\nThe basin on my desk is as flat and lifeless as my understanding."
