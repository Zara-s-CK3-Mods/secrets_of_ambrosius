l_english:

  zz_valyria_magic_assassination.1001.a:0 "A foolish notion. I will not be troubled by it."
  zz_valyria_magic_assassination.1001.b:0 "Send for a healer who knows the old arts."
  zz_valyria_magic_assassination.1001.c:0 "I know this working. I will drive it out myself."
  zz_valyria_magic_assassination.1001.t:0 "A Taste of Salt"
  zz_valyria_magic_assassination.1001.desc:0 "I woke tonight with salt upon my tongue. The wine tastes of the sea, and so does the water. My cup, when I looked into it, held something grey that moved against the tide of my hand.\n\nNo one else tastes anything at all."
  zz_valyria_magic_assassination.1002.a:0 "Draw the water out, whatever the cost."
  zz_valyria_magic_assassination.1002.b:0 "Carry me inland, away from the sound of the sea."
  zz_valyria_magic_assassination.1002.c:0 "I will not take to my bed for a cough."
  zz_valyria_magic_assassination.1002.t:0 "Seawater in the Lungs"
  zz_valyria_magic_assassination.1002.desc:0 "The cough has grown worse. This morning it left seawater upon the sheets, and a thread of green weed that no physician can explain.\n\nI can feel it rising. Each breath is a little shorter than the last, and at night I hear the tide."
  zz_valyria_magic_assassination.1004.a:0 "I will live, at least."
  zz_valyria_magic_assassination.1004.t:0 "The Tide Recedes"
  zz_valyria_magic_assassination.1004.desc:0 "I drowned last night, and I woke. Water ran from my mouth until the basin was full, and I have not drawn a clean breath since.\n\nThe physicians say I have been spared. My lungs say otherwise."
  zz_valyria_magic_assassination.1005.a:0 "Let them try again."
  zz_valyria_magic_assassination.1005.t:0 "Clear Breath"
  zz_valyria_magic_assassination.1005.desc:0 "The cough broke at dawn. A cupful of brine came up, and then nothing. The air tastes of air again.\n\nWhoever sent this will have felt it fail."
  zz_valyria_magic_assassination.1006.t:0 "The Working Ends"
  zz_valyria_magic_assassination.1006.killed:0 "The bowl upon the altar has run dry. [recipient.GetFirstName] has drowned in their own bed, far from any sea."
  zz_valyria_magic_assassination.1006.survived:0 "The water fell back before it finished. [recipient.GetFirstName] lives, though they will never breathe easily again."
  zz_valyria_magic_assassination.1006.foiled:0 "The bowl upon the altar has filled again with clear water. [recipient.GetFirstName] has thrown off the working entirely."
  zz_valyria_magic_assassination.1006.a:0 "So be it."
  zz_valyria_magic_assassination.2002.a:0 "Light every lamp in the keep. Leave it nowhere to stand."
  zz_valyria_magic_assassination.2002.b:0 "I will not jump at my own shadow."
  zz_valyria_magic_assassination.2002.c:0 "I see you. Go back to the one who sent you."
  zz_valyria_magic_assassination.2002.t:0 "Something Follows"
  zz_valyria_magic_assassination.2002.desc:0 "My shadow fell the wrong way this evening. The candle was to my left, and so was the shadow.\n\nI said nothing and walked on. When I looked back it had stopped, and it was looking at me."
  zz_valyria_magic_assassination.2004.a:0 "I am still here."
  zz_valyria_magic_assassination.2004.t:0 "A Cold Hand"
  zz_valyria_magic_assassination.2004.desc:0 "Something touched me in the dark, and where it touched the flesh has gone cold and pale. The guards saw no one. The door was barred.\n\nThere is a mark upon my chest, in the shape of a hand."
  zz_valyria_magic_assassination.2005.a:0 "Keep the lamps burning."
  zz_valyria_magic_assassination.2005.t:0 "An Errand Unfinished"
  zz_valyria_magic_assassination.2005.desc:0 "I woke to find every lamp burning and a long black stain across the floor beside my bed. It stopped a single pace short.\n\nIt faded with the morning, and I do not know what stopped it."
  zz_valyria_magic_assassination.2006.t:0 "The Working Ends"
  zz_valyria_magic_assassination.2006.killed:0 "The shade has returned, and it lies down again at your feet as though it never left. [recipient.GetFirstName] is dead."
  zz_valyria_magic_assassination.2006.survived:0 "The shade has returned hungry. [recipient.GetFirstName] was touched, but not taken."
  zz_valyria_magic_assassination.2006.foiled:0 "The shade did not return. Something stood between it and [recipient.GetFirstName]."
  zz_valyria_magic_assassination.2006.a:0 "So be it."
  zz_valyria_magic_assassination.3001.a:0 "Out of the window, now!"
  zz_valyria_magic_assassination.3001.b:0 "Not without my household!"
  zz_valyria_magic_assassination.3001.c:0 "This fire answers to someone. It can answer to me."
  zz_valyria_magic_assassination.3001.t:0 "Fire in the Night"
  zz_valyria_magic_assassination.3001.desc:0 "I woke choking. The hangings are alight, the door is too hot to touch, and the fire is burning in a way that fire does not burn. It is moving towards me.\n\nThe whole keep is roused. There are people screaming on the stair."
  zz_valyria_magic_assassination.3003.a:0 "Find who did this!"
  zz_valyria_magic_assassination.3003.t:0 "Pulled from the Flames"
  zz_valyria_magic_assassination.3003.desc:0 "They dragged me out of the ruin at dawn. I remember the heat, and then nothing. The burns will never fully heal.\n\nThe whole realm knows of it by now. Fires like that do not start by themselves."
  zz_valyria_magic_assassination.3004.a:0 "Rebuild it, and keep buckets to hand."
  zz_valyria_magic_assassination.3004.t:0 "Ash and Morning"
  zz_valyria_magic_assassination.3004.desc:0 "It burned itself out before it reached me. My chamber is a blackened shell, and I stand in the middle of it without a mark.\n\nThe servants are whispering about it already."
  zz_valyria_magic_assassination.3005.t:0 "The Working Ends"
  zz_valyria_magic_assassination.3005.killed:0 "The sky above the keep of [recipient.GetFirstName] burned all night, and they did not survive it. Every tongue in the realm is asking who lit the fire."
  zz_valyria_magic_assassination.3005.survived:0 "The fire found [recipient.GetFirstName], but they were dragged out alive. All the realm is talking of it."
  zz_valyria_magic_assassination.3005.foiled:0 "The fire failed. [recipient.GetFirstName] walked out of the ashes unmarked, and the realm is talking of it."
  zz_valyria_magic_assassination.3005.a:0 "So be it."
  zz_valyria_magic_assassination.4001.a:0 "Under cover, quickly!"
  zz_valyria_magic_assassination.4001.b:0 "Bring me a warding charm, and pay whatever is asked."
  zz_valyria_magic_assassination.4001.c:0 "It is only the wind."
  zz_valyria_magic_assassination.4001.d:0 "I will turn the wind myself."
  zz_valyria_magic_assassination.4001.t:0 "The Rising Gale"
  zz_valyria_magic_assassination.4001.desc:0 "The wind has changed. It came up out of a still sky and it circles me, tugging at my clothes, and there is a high thin whistling in it that seems to grow closer.\n\nMy guards look at the sky and see nothing there to fight."
  zz_valyria_magic_assassination.4003.a:0 "A hand's breadth from my heart."
  zz_valyria_magic_assassination.4003.t:0 "A Blade from Nowhere"
  zz_valyria_magic_assassination.4003.desc:0 "I heard it a heartbeat before it struck. Something cold passed through my side and the wind died in the same moment.\n\nThere is no blade to be found. There is no one who could have held it."
  zz_valyria_magic_assassination.4004.a:0 "Keep it. Someone will want it back."
  zz_valyria_magic_assassination.4004.t:0 "The Wind Falls"
  zz_valyria_magic_assassination.4004.desc:0 "The whistling rose to a scream, and then the wind simply stopped. A thin steel blade fell out of the empty air and struck the ground at my feet.\n\nNo smith in the realm will admit to having made it."
  zz_valyria_magic_assassination.4005.t:0 "The Working Ends"
  zz_valyria_magic_assassination.4005.killed:0 "The wind came back to you with blood upon it. [recipient.GetFirstName] is dead."
  zz_valyria_magic_assassination.4005.survived:0 "The blade found [recipient.GetFirstName], but it did not find their heart."
  zz_valyria_magic_assassination.4005.foiled:0 "The wind fell before it struck. The blade never reached [recipient.GetFirstName]."
  zz_valyria_magic_assassination.4005.a:0 "So be it."

