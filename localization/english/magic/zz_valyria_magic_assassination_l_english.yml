  zz_valyria_shadow_host:0 "Host of Shadows"
  zz_shadow_shades:0 "Shadow Shades"
  zz_shadow_shades_flavor:0 "They slip through a broken line without a sound. Few who run from them are seen again."
  zz_ember_shades:0 "Ember Shades"
  zz_ember_shades_flavor:0 "They burn fiercely and they burn out quickly. A hard blow scatters them into sparks."
  zz_mist_shades:0 "Mist Shades"
  zz_mist_shades_flavor:0 "Blades pass through them and find little to cut. They do almost no harm, but they will not be moved."
  zz_gale_shades:0 "Gale Shades"
  zz_gale_shades_flavor:0 "They howl across the front of the line, turning arrows and blinding the enemy with dust."

