

l_english:

  ## Shadow Magic
  ## Interaction#

    
  zz_valyria_magic_shadow_magic_001.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tca$\n$zz_ms_up$\n\nThe use of the arcane forces of [shadow_magic|E] to provide your forces with a boost to mobility. \n\nThrough the arcane praxis of [shadow_magic|E], the boundaries between light and absence are violently rewritten. The shadows answer ancient Valyrian invocations, stretching and folding the world itself so that distance becomes uncertain and paths lose their meaning.\n\nSuch magics call forth the horrors that dwell in the shadows of man—things that remember Valyria before the Doom. They clutch at banners and boots alike, bearing your armies forward with inhuman speed, whispering directions only the darkness knows, and leaving behind only dread and confusion for those who attempt to follow."

  ## event 
  zz_valyria_magic_shadow_magic.001.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.001.name$"
  zz_valyria_magic_shadow_magic.001.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. It moves with purpose, thickening like spilled ink, as if listening. For the shadow mages of Valyria, this was no mere absence of flame, but a living thing—drawn forth from creatures that once lurked between worlds, then bound through blood, word, and will.\n\nIn ages past, a single shadow might be fused to a warrior to grant impossible speed. The greatest of the Valyrian shadow mages dared far more, binding entire armies to these stolen silhouettes, infusing them with unnatural movement and tireless advance.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may call forth the shadows and enfuse your forces, reducing the cruel logistics of war to murmurs and half-remembered distances. If you enfuse [recipient.GetFirstName] with these otherworldly forces, they shall outmanouver their foes as if the world itself bends aside for them.\nYet the shadows linger after the rite is complete, stretching long and breathing softly. They obey—but they remember. But can we truly trust what was never meant to walk beneath the sun?"
  zz_valyria_magic_shadow_magic.001.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nThe caster sets a single lantern upon the floor and walks slowly around it, and their shadow, thrown long across the stone, does not follow at the proper pace. It runs ahead, impatient, and then returns to circle them, like a hound eager to be let off its leash.\n\nThe outriders of the Freehold were said to cross a province in a night. Their horses were ordinary beasts. It was the shadows bound beneath their hooves that carried them so far and so fast.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may call forth the shadows and enfuse your forces, reducing the cruel logistics of war to murmurs and half-remembered distances. If you enfuse [recipient.GetFirstName] with these otherworldly forces, they shall outmanouver their foes as if the world itself bends aside for them.\nYet the shadows linger after the rite is complete, stretching long and breathing softly. They obey—but they remember. But can we truly trust what was never meant to walk beneath the sun?"
  zz_valyria_magic_shadow_magic.001.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nA bridle of black leather hangs upon a hook in the darkest corner of the chamber, and as the incantation is spoken, the shadow beneath it begins to fill out, taking on the shape of a long neck, a flowing mane, legs built for running. It stamps silently, and the candle flames gutter in the draught of its passing.\n\nThe shadow mages of Valyria bred such creatures from the darkness between worlds, and lent them to the armies of the dragonlords, so that no foe could ever outrun the Freehold's vengeance.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may call forth the shadows and enfuse your forces, reducing the cruel logistics of war to murmurs and half-remembered distances. If you enfuse [recipient.GetFirstName] with these otherworldly forces, they shall outmanouver their foes as if the world itself bends aside for them.\nYet the shadows linger after the rite is complete, stretching long and breathing softly. They obey—but they remember. But can we truly trust what was never meant to walk beneath the sun?"
  zz_valyria_magic_shadow_magic.001.opt.a:0 "Yes, from darkness!"
  zz_valyria_magic_shadow_magic.001.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.001.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.001.name$"
  zz_valyria_magic_shadow_magic.001.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ granting profound mobility to [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.001.toast.tt:0 "$zz_valyria_magic_shadow_magic.001.toast.desc$"

  zz_valyria_magic_shadow_magic.001.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.001.name$"
  zz_valyria_magic_shadow_magic.001.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.001.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.001.f.toast.desc$"


  ## Interaction#
  
  zz_valyria_magic_shadow_magic_002.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_ssg_up$\n\nThe use of the arcane forces of [shadow_magic|E] to improve the success chance of a selected subject's schemes. \n\nThrough the veiled praxis of [shadow_magic|E], intent itself is sharpened and concealed. The shadows coil not around armies, but around secrets—listening, learning, and carrying whispered designs where mortal messengers would fail.\n\nSuch sorcery grants your plots and schemes the hidden edge of a dagger cloaked in shadow. Doors are left unbarred, tongues loosen at the wrong moment, and chance itself seems to conspire in your favour. None can say why a scheme succeeds—only that the darkness was watching, and it approved."




  ## event
  zz_valyria_magic_shadow_magic.002.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.002.name$"
  zz_valyria_magic_shadow_magic.002.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. It clings to corners and crawls across the floor, thick with intent. For the shadow mages of the lost Freehold, it was no great transgression to call upon such darkness and bid it become the unseen edge of a blade within a plot or scheme.\n\nIn these rites, the shadows were not merely tools but conspirators. They whispered to servants, obscured truth from prying eyes, and bent fragile moments so that betrayal bloomed at precisely the right hour. The scheme did not simply unfold—it was guided.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may soak your plots in shadow, letting the darkness seep into every promise and every lie, improving the likelihood of success. If you choose this path, the schemes of [recipient.GetFirstName] will be empowered by unseen hands and listening silence.\nYet the shadows linger long after the rite is complete, patient and knowing. They have helped—but they have learned. But can you trust the shadows?"
  zz_valyria_magic_shadow_magic.002.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster drives a knife into the table before them and lets it stand. Its shadow lies across the wood, and as the words are spoken, the shadow slowly pulls free of the knife, sliding away across the table and dropping to the floor, where it slips beneath the door and is gone.\n\nThe great houses of the Freehold did not fear the knives they could see. They feared the ones that moved without hands, guided through their halls by mages who never left their towers.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may soak your plots in shadow, letting the darkness seep into every promise and every lie, improving the likelihood of success. If you choose this path, the schemes of [recipient.GetFirstName] will be empowered by unseen hands and listening silence.\nYet the shadows linger long after the rite is complete, patient and knowing. They have helped—but they have learned. But can you trust the shadows?"
  zz_valyria_magic_shadow_magic.002.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA map of a great house is laid out upon the floor, every corridor and stair carefully drawn. The caster snuffs out the candles one by one, and as each flame dies, a shadow detaches itself from the edge of the map and creeps inward, finding the servants' passages, the unlatched windows, the doors left carelessly ajar.\n\nIn Valyria, it was said that no scheme succeeded without the shadows' consent. Its shadow mages made sure that their patrons' schemes always had it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may soak your plots in shadow, letting the darkness seep into every promise and every lie, improving the likelihood of success. If you choose this path, the schemes of [recipient.GetFirstName] will be empowered by unseen hands and listening silence.\nYet the shadows linger long after the rite is complete, patient and knowing. They have helped—but they have learned. But can you trust the shadows?"
  zz_valyria_magic_shadow_magic.002.opt.a:0 "Yes, from darkness!"
  zz_valyria_magic_shadow_magic.002.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.002.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.002.name$"
  zz_valyria_magic_shadow_magic.002.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ manipulating the scheme success of [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.002.toast.tt:0 "$zz_valyria_magic_shadow_magic.002.toast.desc$"

  zz_valyria_magic_shadow_magic.002.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.002.name$"
  zz_valyria_magic_shadow_magic.002.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.002.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.002.f.toast.desc$"


  ## Interaction
  
  zz_valyria_magic_shadow_magic_003.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sr_up$\n\nThe use of the arcane forces of [shadow_magic|E] to increase scheme resistance of the selected subject. \n\nThrough the defensive mysteries of [shadow_magic|E], the darkness is not commanded to strike, but to watch. Shadows are bound to linger close, listening for ill intent and drinking deep of whispered treachery before it can take form.\n\nThe use of [shadow_magic|E] is capable of providing you with a powerful shield against plots and schemes. Malice falters, secrets fray, and hostile designs lose their certainty as unseen sentinels coil around your fate.\n\nThis shadowy shield clings to you like a second skin—cold, patient, and ever‑present—keeping you secure so long as the darkness remains willing."

  ## event
  zz_valyria_magic_shadow_magic.003.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.003.name$"
  zz_valyria_magic_shadow_magic.003.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. It stretches and recoils as if tasting the air. For the shadow mages who dwell along the dark edges of the world, such shadows were not merely weapons, but watchers—called forth to offer warning of what moves unseen within their silky depths.\n\nBound by Valyrian word and will, these shadows may be set to coil about [recipient.GetFirstName], whispering of false smiles, concealed knives, and schemes yet unspoken. Ill intent dulls in their presence, and conspiracies falter as if the darkness itself disapproves.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To accept such protection is to trust the shadows to guard your designs and reveal those of your enemies. Yet the darkness listens as much as it watches, and it remembers all it learns. But can we truly trust the shadows?"
  zz_valyria_magic_shadow_magic.003.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster lays a dark cloak across the subject's shoulders and binds it at the throat with a clasp of black iron. As the words are spoken, the cloak seems to deepen, its edges blurring into the shadows of the room, until it is hard to tell where the cloth ends and the darkness begins.\n\nThe dragonlords of the Freehold were murdered seldom, for all their many enemies. Their shadow mages saw to it that every knife raised against them was seen long before it fell.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To accept such protection is to trust the shadows to guard your designs and reveal those of your enemies. Yet the darkness listens as much as it watches, and it remembers all it learns. But can we truly trust the shadows?"
  zz_valyria_magic_shadow_magic.003.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA ring of candles is set about [recipient.GetFirstName], and the caster speaks the names of the shadows one by one. With each name, the shadows cast by the candles turn inward, until all of them point towards the subject, standing about them like sentries facing outward into the dark.\n\nThe shadow mages of Valyria held that darkness sees what light never can. Through this mystery, it is set to watch over the subject, and to whisper when danger draws near.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] To accept such protection is to trust the shadows to guard your designs and reveal those of your enemies. Yet the darkness listens as much as it watches, and it remembers all it learns. But can we truly trust the shadows?"

  zz_valyria_magic_shadow_magic.003.opt.a:0 "Yes, from darkness!"
  zz_valyria_magic_shadow_magic.003.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.003.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.003.name$"
  zz_valyria_magic_shadow_magic.003.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ manipulating the scheme vulnerabilities of [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.003.toast.tt:0 "$zz_valyria_magic_shadow_magic.003.toast.desc$"

  zz_valyria_magic_shadow_magic.003.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.003.name$"
  zz_valyria_magic_shadow_magic.003.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.003.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.003.f.toast.desc$"


  ## Interaction
 
  zz_valyria_magic_shadow_magic_004.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_esd_up$\n$zz_epr$\n\nThe use of the arcane forces of [shadow_magic|E] extending the time for enemy plots to be successful. \n\nThrough the forbidden manipulations of [shadow_magic|E], the shadows are taught not merely to conceal, but to linger. Moments stretch unnaturally long, intent falters, and hostile designs find themselves trapped in an ever‑lengthening dusk.\n\nThe use of [shadow_magic|E] is capable of providing your realm with a suffocating cloak of shadow, one that drags upon the passage of time itself. Enemy plots advance as if wading through cold pitch, their completion delayed by unseen resistance, while the darkness patiently ensures that nothing hostile reaches its end swiftly—or cleanly."

  ##Spell Options
  ## event
  zz_valyria_magic_shadow_magic.004.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.004.name$"
  zz_valyria_magic_shadow_magic.004.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. It quivers and folds in on itself, as though moments are being stretched thin within its depths. For the greatest masters of shadow magic in Valyria, it was known that shadows could be used to twist not only sight and intent, but time itself.\n\nThrough forbidden rites, they learned to weight moments with shadow, to elongate the dark silhouette of a plot so that its completion lingered in a stolen eternity. The shadows would churn and coil, dragging schemes into prolonged uncertainty, exhausting conspirators and unraveling their resolve long before success could be claimed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] By turning the shadows against themselves, you may force the plots aimed at [recipient.GetFirstName] to stumble and stretch, their fruition delayed by oppressive darkness and gnawing doubt. \nYet such magic trespasses upon forces even Valyria feared to name. Time resists captivity, and the shadows remember every moment they are made to hold. But is it truly right to bind eternity, even for protection?"
  zz_valyria_magic_shadow_magic.004.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster turns an hourglass upon its side, so that the sand lies still, neither falling nor rising. Its shadow, cast upon the wall, begins to stretch, longer and longer, until it reaches across the whole chamber and the room itself seems to grow quiet and slow.\n\nThe shadow mages of the Freehold could not stop a plot, but they could make it drag on, its every step weighted with shadow, until those behind it lost heart or lost their chance.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] By turning the shadows against themselves, you may force the plots aimed at [recipient.GetFirstName] to stumble and stretch, their fruition delayed by oppressive darkness and gnawing doubt. \nYet such magic trespasses upon forces even Valyria feared to name. Time resists captivity, and the shadows remember every moment they are made to hold. But is it truly right to bind eternity, even for protection?"
  zz_valyria_magic_shadow_magic.004.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nStrands of black thread are wound slowly about a spindle, and the caster speaks a word with each turn. The spindle grows heavier, the thread thicker, and the shadows in the room seem to tangle themselves in it, catching and knotting as they are drawn in.\n\nIn Valyria, plots were measured not only by their cunning but by their speed. Through this mystery, every scheme turned against the subject will find its thread knotted and its progress slowed to a crawl.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] By turning the shadows against themselves, you may force the plots aimed at [recipient.GetFirstName] to stumble and stretch, their fruition delayed by oppressive darkness and gnawing doubt. \nYet such magic trespasses upon forces even Valyria feared to name. Time resists captivity, and the shadows remember every moment they are made to hold. But is it truly right to bind eternity, even for protection?"
  zz_valyria_magic_shadow_magic.004.opt.a:0 "Yes, the darkness is my ally!"
  zz_valyria_magic_shadow_magic.004.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.004.toast.t:0  "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.004.name$"
  zz_valyria_magic_shadow_magic.004.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ changing the vulnerabilities of disease in the country of [target.GetFirstName]"
  zz_valyria_magic_shadow_magic.004.toast.tt:0 "$zz_valyria_magic_shadow_magic.004.toast.desc$"

  zz_valyria_magic_shadow_magic.004.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.004.name$"
  zz_valyria_magic_shadow_magic.004.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.004.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.004.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_shadow_magic_005.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tca$\n$zz_ms_dn$\n\nThe use of the arcane forces of [shadow_magic|E] slowing armies commanded by the chosen subject.\n\nThrough the baleful applications of [shadow_magic|E], the darkness itself is taught to grasp and hinder. Shadows stretch beyond their bounds, reaching for marching feet and tightening around banners and blades alike.\n\nThe use of [shadow_magic|E] is capable of seizing a chosen character's army in grasping hands of living shadow. Paths lengthen, strides falter, and progress slows to a suffocating crawl as unseen restraints coil about every step, dragging the host into a reluctant, creeping advance."

  ##Spell Options
  ## event
  zz_valyria_magic_shadow_magic.005.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.005.name$"
  zz_valyria_magic_shadow_magic.005.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. It twists and knots like a mass of coiling limbs, heavy with malice. The shadow mages of Valyria long ago learned to wield such darkness as a weapon, afflicting the armies of their enemies with delay and disorder drawn from the inky blackness between moments.\n\nIn these fell workings, shadows were shaped into chains and grasping hands, clutching at ranks and supply lines alike. Marches became ordeals, commands went unanswered, and whole hosts found themselves mired as if the land itself had turned against them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] By binding coils of raw shadow, you may impair the ability of [recipient.GetFirstName]'s forces to mobilise, slowing their advance and sapping their momentum. Yet to invite the darkness to restrain mortal men is to grant it power over flesh and will alike. Such an act may win wars—but is it truly one of virtue?"
  zz_valyria_magic_shadow_magic.005.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA bowl of black tar is warmed over a low flame, and the caster stirs it slowly with a rod of iron. As the tar thickens, the shadows of the room begin to sag and pool, dripping from the walls like the tar itself, and gathering in a slow, heavy mass upon the map where the enemy host is marked.\n\nThe armies that marched against the Freehold often found their roads turning to mire, their wagons sinking and their horses balking at nothing. The shadow mages of Valyria were seldom thanked for their part in it, for few ever knew they had played one.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] By binding coils of raw shadow, you may impair the ability of [recipient.GetFirstName]'s forces to mobilise, slowing their advance and sapping their momentum. Yet to invite the darkness to restrain mortal men is to grant it power over flesh and will alike. Such an act may win wars—but is it truly one of virtue?"
  zz_valyria_magic_shadow_magic.005.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster lays a length of chain across the map, its links following the roads along which the enemy host must march. As the incantation is spoken, the chain's shadow grows heavier and darker than the iron itself, and the links seem to tighten, as though holding something down.\n\nThe Freehold's enemies spoke of marches that never ended, of armies that woke each morning no closer to their goal than they had been the night before. This was the work of shadow, binding their every step.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] By binding coils of raw shadow, you may impair the ability of [recipient.GetFirstName]'s forces to mobilise, slowing their advance and sapping their momentum. Yet to invite the darkness to restrain mortal men is to grant it power over flesh and will alike. Such an act may win wars—but is it truly one of virtue?"
  zz_valyria_magic_shadow_magic.005.opt.a:0 "Yes, The shadows tie!"
  zz_valyria_magic_shadow_magic.005.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.005.toast.t:0  "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.005.name$"
  zz_valyria_magic_shadow_magic.005.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ impacting the movement speed of [target.GetFirstName]'s army."
  zz_valyria_magic_shadow_magic.005.toast.tt:0 "$zz_valyria_magic_shadow_magic.005.toast.desc$"

  zz_valyria_magic_shadow_magic.005.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.005.name$"
  zz_valyria_magic_shadow_magic.005.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.005.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.005.f.toast.desc$"

  
  zz_valyria_magic_shadow_magic_006.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_ssg_dn$\n\nThe use of the arcane forces of [shadow_magic|E] lowering the success chance of the chosen subject's schemes.\n\nThrough the perverse inversion of [shadow_magic|E], the darkness is commanded to betray its own kind. Shadows turn against hidden intent, thickening around whispered plans and smothering them before they can take form.\n\nThe use of [shadow_magic|E] is capable of grasping a chosen character's nefarious plots and bluting their effectiveness. With this spell plots and schemes shall be negatively affected, their precision dulled and their momentum choked, as if every secret is weighed down by watching, uncooperative gloom."

  ##Spell Options
  ## event
  zz_valyria_magic_shadow_magic.006.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.006.name$"
  zz_valyria_magic_shadow_magic.006.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. It lies heavy and inert, resistant rather than eager. If shadows can enhance the hidden blade, then they may also be unmade into tools of impediment—rotting secrecy itself and reducing the effectiveness of all things that move unseen.\n\nAmong the shadow mages who once dwelt within the Freehold, it was not uncommon to armour oneself in shadow, layering eldritch protections upon flesh and fate alike. Such wards did not merely deflect daggers; they caused hidden blades to falter, strikes to mistime, and conspiracies to collapse under their own obscured weight.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may reduce the hidden blades of [recipient.GetFirstName] to mere shadows of their true nature, taking the knife drawn from darkness and rendering its edge little more than vapour and doubt. Yet to trust one's security to the shadows is to invite them close—too close. They will blunt the blade, yes, but they will also listen. But is such trust truly wise?"
  zz_valyria_magic_shadow_magic.006.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster takes a dagger and draws it slowly through a candle flame, again and again, until its blade is black with soot. They lay it at the subject's feet, and as the words are spoken, its shadow curls in upon itself, blunting, dulling, until it is no more than the shadow of a stick.\n\nThe shadow mages of Valyria held that every hidden blade casts a shadow, and that a shadow, once caught, can be made to fail. Through this mystery, the blades raised against the subject in secret will falter before they reach their mark.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may reduce the hidden blades of [recipient.GetFirstName] to mere shadows of their true nature, taking the knife drawn from darkness and rendering its edge little more than vapour and doubt. Yet to trust one's security to the shadows is to invite them close—too close. They will blunt the blade, yes, but they will also listen. But is such trust truly wise?"
  zz_valyria_magic_shadow_magic.006.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA veil of grey gauze is hung across the doorway of the chamber, and the caster breathes upon it, speaking the old words softly. The gauze grows dark, then darker, until it is no longer cloth at all but a hanging curtain of shadow that seems to swallow the light behind it.\n\nAmong the shadow mages of the Freehold, such veils were hung across the doors of their patrons. Those who crept through them with ill intent found their courage failing and their cunning deserting them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may reduce the hidden blades of [recipient.GetFirstName] to mere shadows of their true nature, taking the knife drawn from darkness and rendering its edge little more than vapour and doubt. Yet to trust one's security to the shadows is to invite them close—too close. They will blunt the blade, yes, but they will also listen. But is such trust truly wise?"
  zz_valyria_magic_shadow_magic.006.opt.a:0 "Yes, I trust the shadows!"
  zz_valyria_magic_shadow_magic.006.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.006.toast.t:0  "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.006.name$"
  zz_valyria_magic_shadow_magic.006.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ constraining the plots of [target.GetFirstName]."
  zz_valyria_magic_shadow_magic.006.toast.tt:0 "$zz_valyria_magic_shadow_magic.006.toast.desc$"

  zz_valyria_magic_shadow_magic.006.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.006.name$"
  zz_valyria_magic_shadow_magic.006.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.006.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.006.f.toast.desc$"


  
  zz_valyria_magic_shadow_magic_007.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sr_dn$\n\nThe use of the arcane forces of [shadow_magic|E] weakening the defenses of the chosen subject against schemes.\n\nThrough the insidious applications of [shadow_magic|E], the darkness is not unleashed outward, but sown within. Shadows are whispered into halls of power and seeded into thought itself, eroding vigilance and dulling the instinct to resist hidden threats.\n\nThe use of [shadow_magic|E] is capable of planting invasive shadows within the mind and realm of a chosen character. With this [zz_mystery|E], doubt festers, watchfulness wanes, and defenses against plots and schemes weaken, leaving the target's domain permeable to secret knives and silent ruin."
  ##Spell Options
  ## event
  zz_valyria_magic_shadow_magic.007.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.007.name$"
  zz_valyria_magic_shadow_magic.007.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. It creeps low and slow, thin as breath, heavy as dread. For the shadow mages of Valyria, to twist such darkness was little more than child's play. With murmured words and careful bindings, they could subtly weaken the minds of their foes, allowing hostile plots to slip past notice like whispers half‑heard in a dream.\n\nThese shadows did not announce themselves. They settled into councils and corridors, into habits and assumptions, blunting suspicion and softening resolve. By the time the blade was revealed, the will to resist had already been eaten away.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] By binding and dispersing the shadows, you may saturate [recipient.GetFirstName] in living darkness, shrouding mind and realm alike. Such a veil will make attempts to bring harm to them more likely to succeed, reducing their ability to endure secret strikes and unseen conspiracies.\n\nYet to fill another with shadow is to invite it to linger, to listen, and to learn. Once sown, the darkness is difficult to uproot. Is it wise to weaken another so profoundly, knowing what the shadows may take in return?"
  zz_valyria_magic_shadow_magic.007.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster fills a bowl with ink and gazes into it, speaking softly. The ink begins to swirl, and in its depths shapes appear: a council chamber, a guard post, a sleeping household. Into each the caster breathes a single word, and the shapes grow dim and blurred, as though seen through tired eyes.\n\nThe shadow mages of Valyria knew that a careful foe is dangerous, but a weary one is not. Through this mystery, the vigilance of those who guard against your schemes is quietly worn away.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] By binding and dispersing the shadows, you may saturate [recipient.GetFirstName] in living darkness, shrouding mind and realm alike. Such a veil will make attempts to bring harm to them more likely to succeed, reducing their ability to endure secret strikes and unseen conspiracies.\n\nYet to fill another with shadow is to invite it to linger, to listen, and to learn. Once sown, the darkness is difficult to uproot. Is it wise to weaken another so profoundly, knowing what the shadows may take in return?"
  zz_valyria_magic_shadow_magic.007.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA string of small bells is hung across the chamber, each one representing a guard, a spy, an informant in the service of the caster's foes. As the incantation is spoken, the shadows creep along the string, and one by one the bells fall silent, their clappers wrapped in darkness.\n\nIn the halls of the Freehold, alarms were sounded far less often than they should have been. Its shadow mages saw to that.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] By binding and dispersing the shadows, you may saturate [recipient.GetFirstName] in living darkness, shrouding mind and realm alike. Such a veil will make attempts to bring harm to them more likely to succeed, reducing their ability to endure secret strikes and unseen conspiracies.\n\nYet to fill another with shadow is to invite it to linger, to listen, and to learn. Once sown, the darkness is difficult to uproot. Is it wise to weaken another so profoundly, knowing what the shadows may take in return?"
  zz_valyria_magic_shadow_magic.007.opt.a:0 "Yes, and in the darkness bind them!"
  zz_valyria_magic_shadow_magic.007.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.007.toast.t:0  "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.007.name$"
  zz_valyria_magic_shadow_magic.007.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ weakening[target.GetFirstName] against all plots and schemes."
  zz_valyria_magic_shadow_magic.007.toast.tt:0 "$zz_valyria_magic_shadow_magic.007.toast.desc$"

  zz_valyria_magic_shadow_magic.007.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.007.name$"
  zz_valyria_magic_shadow_magic.007.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.007.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.007.f.toast.desc$"


  
  zz_valyria_magic_shadow_magic_008.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_esd_dn$\n\nThe use of the arcane forces of [shadow_magic|E] decreasing the duration of schemes of the enemies of the selected subject.\n\nThrough a perilous inversion of [shadow_magic|E], the darkness is compelled to withdraw rather than conceal. Shadows are stripped from hidden designs, exposing their outlines and forcing them to race toward conclusion before they are ready.\n\nThe use of [shadow_magic|E] is capable of revealing the things that lurk in the dark. With this [zz_mystery|E], the schemes of the enemies of the chosen subject are driven forward with unnatural haste, advancing rapidly as secrecy collapses and conspirators are denied the safety of patience."
  ##Spell Options
  ## event
  zz_valyria_magic_shadow_magic.008.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.008.name$"
  zz_valyria_magic_shadow_magic.008.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. Yet this time it recoils when named, shuddering as if wounded. In lost Valyria, the mightiest shadow mages knew that darkness could be made not only to hide, but to flee—its sudden absence forcing secrets into motion.\n\nIn such rites, shadows were torn away from schemes and cloaks of inky blackness unraveled. Deprived of concealment, plots were driven to proceed with reckless speed, maturing too quickly, revealing their shape before they were honed. Many a conspiracy perished not by discovery, but by being rushed into the open.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may force the shadows to withdraw from [recipient.GetFirstName], compelling the schemes of their enemies to advance with unnatural rapidity, stripped of patience and care.\n\nYet this is a dangerous mercy. A hastened blade still cuts, and a revealed plot may strike sooner than expected. Shall we truly use the shadows themselves to protect against the knife hidden in the dusk?"
  zz_valyria_magic_shadow_magic.008.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster opens every shutter in the chamber at once, and a hard white light floods in. The shadows that had gathered in the corners writhe and shrink, fleeing towards the doorway, and the caster speaks after them, sending them away towards a distant place where secrets are kept.\n\nThe shadow mages of Valyria could hide a plot, but they could also strip one bare. Without its shadows, a scheme cannot wait or linger; it must move, and move quickly, or be seen.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may force the shadows to withdraw from [recipient.GetFirstName], compelling the schemes of their enemies to advance with unnatural rapidity, stripped of patience and care.\n\nYet this is a dangerous mercy. A hastened blade still cuts, and a revealed plot may strike sooner than expected. Shall we truly use the shadows themselves to protect against the knife hidden in the dusk?"
  zz_valyria_magic_shadow_magic.008.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA tall mirror is uncovered at the centre of the room, and the caster turns it slowly, catching the light and throwing it into every corner. Wherever the light falls, the shadows break and scatter, and the caster's voice rises, bidding them flee further, and further still.\n\nIn the Freehold, a scheme that was rushed was a scheme half-ruined. The shadow mages of Valyria knew how to force a plot's hand, and they knew how to watch it fail.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may force the shadows to withdraw from [recipient.GetFirstName], compelling the schemes of their enemies to advance with unnatural rapidity, stripped of patience and care.\n\nYet this is a dangerous mercy. A hastened blade still cuts, and a revealed plot may strike sooner than expected. Shall we truly use the shadows themselves to protect against the knife hidden in the dusk?"
  zz_valyria_magic_shadow_magic.008.opt.a:0 "Yes, Keep them secure!"
  zz_valyria_magic_shadow_magic.008.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.008.toast.t:0  "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.008.name$"
  zz_valyria_magic_shadow_magic.008.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ weakening all plots and schemes targeting[target.GetFirstName]."
  zz_valyria_magic_shadow_magic.008.toast.tt:0 "$zz_valyria_magic_shadow_magic.008.toast.desc$"

  zz_valyria_magic_shadow_magic.008.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.008.name$"
  zz_valyria_magic_shadow_magic.008.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.008.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.008.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_shadow_magic_009.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_duel_move$\n$zz_duel_skill$\n\nThe use of the arcane forces of [shadow_magic|E] to directly strike the selected subject. \n\nThrough one of the darkest applications of [shadow_magic|E], the shadows are shaped into instruments of silent death. Guilt is unmoored from action, and causality itself is obscured as the darkness is taught to strike where no hand may be seen.\n\nThis use of the shadows calls them forth to pool around the caster, thick and suffocating, drawing upon the esoteric powers that dwell in the gaps between moments and intentions. From this gathering gloom, crackling bolts of eldritch shadow are loosed, leaping toward their victim with lethal purpose, leaving behind only uncertainty, fear, and unanswered questions."
  ## event
  zz_valyria_magic_shadow_magic.009.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.009.name$"
  zz_valyria_magic_shadow_magic.009.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. It pulses like a living thing, eager and impatient. The shadow mages of Valyria were not beyond wielding such creeping darkness as an implement of far‑reaching violence, conjuring raw, writhing shadow and setting it loose to hunt an unfortunate victim.\n\nIn these forbidden rites, the shadows were given fleeting shape and murderous intent—creatures of absence and hunger, formed only long enough to strike. They moved without footfall, without witness, and when their work was done they unraveled, leaving no blade to trace and no hand to blame.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure from the shadows a creature of the blade, one that will seek to end the life of [recipient.GetFirstName]. Such an action is fraught with peril, for shadows are fickle servants, and secrets are never as secure as they seem.\n\nYet if the darkness is sated and the rite precisely bound, it may be possible to keep your act of murder hidden, buried in the silence between light and night. But can any killing wrought by shadow truly remain unseen forever?"
  zz_valyria_magic_shadow_magic.009.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster draws a figure upon the floor in charcoal, a crude outline of a person with no face. As the words are spoken, the outline begins to darken, its edges blurring and rising from the stone, until a figure of pure shadow stands within the chamber, waiting for a name.\n\nThe great houses of the Freehold seldom died by poison or by blade. More often they died alone in locked rooms, with no wound upon them and no witness to tell how. Everyone knew who had done it; no one could ever prove it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure from the shadows a creature of the blade, one that will seek to end the life of [recipient.GetFirstName]. Such an action is fraught with peril, for shadows are fickle servants, and secrets are never as secure as they seem.\n\nYet if the darkness is sated and the rite precisely bound, it may be possible to keep your act of murder hidden, buried in the silence between light and night. But can any killing wrought by shadow truly remain unseen forever?"
  zz_valyria_magic_shadow_magic.009.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA single candle is lit and then snuffed, and the caster speaks into the thin trail of smoke that rises from the wick. The smoke does not disperse. It thickens and lengthens, taking the shape of a long, thin hand, and when the caster speaks the name of the target, the hand closes into a fist.\n\nThe assassins of the Freehold did not need to climb walls or bribe servants. They needed only a name, a shadow, and a mage willing to set the one upon the other.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may conjure from the shadows a creature of the blade, one that will seek to end the life of [recipient.GetFirstName]. Such an action is fraught with peril, for shadows are fickle servants, and secrets are never as secure as they seem.\n\nYet if the darkness is sated and the rite precisely bound, it may be possible to keep your act of murder hidden, buried in the silence between light and night. But can any killing wrought by shadow truly remain unseen forever?"
  zz_valyria_magic_shadow_magic.009.opt.a:0 "Yes, Kill them!"
  zz_valyria_magic_shadow_magic.009.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.009.toast.t:0  "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.009.name$"
  zz_valyria_magic_shadow_magic.009.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ striking to kill from the shadows at[recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.009.toast.tt:0 "$zz_valyria_magic_shadow_magic.009.toast.desc$"

  zz_valyria_magic_shadow_magic.009.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.009.name$"
  zz_valyria_magic_shadow_magic.009.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.009.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.009.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_shadow_magic_010.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_ta$\n$zz_da$\n$zz_ld$\n\nThe use of the arcane forces of [shadow_magic|E] to directly strike an army belonging to the selected subject. \n\nThrough the most ruinous expressions of [shadow_magic|E], the shadows are unleashed not as subtle agents, but as engines of obliteration. Darkness is gathered, shaped, and hurled forth to fall upon an enemy host with merciless intent.\n\nThe use of the arcane forces of [shadow_magic|E] allows the caster to strike directly at an army, seeking not delay or confusion, but utter ruin. Shields blacken, formations fracture, and courage withers as the light itself is devoured.\n\nThis secret and dread art calls forth bolts of shadowy sorcery, tearing open a passage to a realm of horror and despair. From this abyss the shadows surge, dragging the forces of your chosen subject into suffocating darkness as the night itself seeks to unmake them."
  ## event
  zz_valyria_magic_shadow_magic.010.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.010.name$"
  zz_valyria_magic_shadow_magic.010.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. It deepens unnaturally, as though the world itself is thinning. Among common soldiers, the most terrifying tales whispered of Valyrian shadow mages spoke of entire hosts swallowed by an abyss of twisting darkness, consumed body and soul, leaving only silence where banners once stood.\n\nSuch magic was not subtle, nor merciful. The shadows were torn wide, shaped into a ravenous void that drank light, sound, and hope alike. Those caught within were said to march no more, their names erased as thoroughly as their forms.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]\nWith the shadows aligned and bound to your will, you may draw forth a hungry abyss and strike one of the armies of [recipient.GetFirstName], casting it into a realm of terror and despair where the darkness itself labours to ruin all that enters.\n\nYet this is destruction writ large, a reminder of the hubris that doomed Valyria itself. Once loosed, such shadows are difficult to recall. Are you prepared to unleash a power that remembers how empires fall?"
  zz_valyria_magic_shadow_magic.010.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster stands at the centre of a ring of black stones, and one by one the candles about the chamber gutter and die. The darkness does not simply fill the room; it deepens, as though falling away into some great pit, and a cold wind blows up from it, carrying no sound at all.\n\nThe soldiers of the Freehold's enemies told stories of hosts that vanished in a single night, their camps found empty in the morning, their fires still warm. The shadow mages of Valyria never told any stories at all.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]\nWith the shadows aligned and bound to your will, you may draw forth a hungry abyss and strike one of the armies of [recipient.GetFirstName], casting it into a realm of terror and despair where the darkness itself labours to ruin all that enters.\n\nYet this is destruction writ large, a reminder of the hubris that doomed Valyria itself. Once loosed, such shadows are difficult to recall. Are you prepared to unleash a power that remembers how empires fall?"
  zz_valyria_magic_shadow_magic.010.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA great black cloth is spread across the map, covering the place where the enemy host is camped. The caster speaks, and the cloth begins to sink, slowly, as though the table beneath it were giving way, and where it sinks, the map itself seems to darken and disappear.\n\nAmong the arts of the Freehold's shadow mages, few were more feared than this. It did not wound or weaken. It simply took, and what it took was never seen again.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]\nWith the shadows aligned and bound to your will, you may draw forth a hungry abyss and strike one of the armies of [recipient.GetFirstName], casting it into a realm of terror and despair where the darkness itself labours to ruin all that enters.\n\nYet this is destruction writ large, a reminder of the hubris that doomed Valyria itself. Once loosed, such shadows are difficult to recall. Are you prepared to unleash a power that remembers how empires fall?"
  zz_valyria_magic_shadow_magic.010.opt.a:0 "Yes, Kill them!"
  zz_valyria_magic_shadow_magic.010.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.010.toast.t:0  "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.010.name$"
  zz_valyria_magic_shadow_magic.010.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ calling forth a blast of hidden shadow to strike at [target.GetFirstName]."
  zz_valyria_magic_shadow_magic.010.toast.tt:0 "$zz_valyria_magic_shadow_magic.010.toast.desc$"

  zz_valyria_magic_shadow_magic.010.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.010.name$"
  zz_valyria_magic_shadow_magic.010.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
