  ## Interaction
  zz_valyria_magic_shadow_magic_011.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tr$\n$zz_dr$\n$zz_ld$\n\nThe use of the arcane forces of [shadow_magic|E] to directly strike a MAA regiment belonging to the selected subject. \n\nThrough the most violent invocations of [shadow_magic|E], the darkness is awakened to hunger. Shadows rise not as passive absence, but as living, yearning things, called forth by Valyrian words etched deep into forgotten sorcery.\n\nThe shadows twist and churn with unspeakable desire, their deep and gnawing hunger becoming palpable as the world itself seems to recoil. At the height of the rite they leap forth—biting, screaming, writhing—seizing a chosen regiment and dragging it toward the abyssal depths. Armour cracks, formations unravel, and men vanish screaming into a darkness that devours light, sound, and hope alike."
  ## event
  zz_valyria_magic_shadow_magic.011.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.011.name$"
  zz_valyria_magic_shadow_magic.011.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. It pulses with a terrible vitality, its edges distorting as though something vast presses from within, eager to be born into the world.\n\nAmong the most forbidden teachings of Valyria were rites that did not merely command shadow, but fed it—allowing it to take on a monstrous semblance, a twisted abomination formed of hunger and absence. Such entities consumed light itself, their gaping maws opening where reality grew thin.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]\nWith the aid of these shadowy beasts, it is possible to draw forth a ravenous manifestation from the abyss, unleashing it upon the battlefield. It will seek out one of the regiments of [recipient.GetFirstName], devouring ranks and resolve alike as it drags the doomed into suffocating darkness.\n\nYet once the shadows have tasted such slaughter, they rarely forget the flavour. Is it wise to unleash a hunger that even Valyria feared to name?"
  zz_valyria_magic_shadow_magic.011.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster draws a ring of salt upon the floor and steps outside it. Within the ring, the shadows begin to gather, swelling and rising until they form a shape that fills the space: something with too many limbs and a mouth that opens far too wide. It turns its eyeless head towards the caster, waiting.\n\nThe shadow mages of Valyria did not merely command darkness. They gave it hunger, gave it shape, and set it loose upon their enemies. Few of those enemies lived long enough to describe it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]\nWith the aid of these shadowy beasts, it is possible to draw forth a ravenous manifestation from the abyss, unleashing it upon the battlefield. It will seek out one of the regiments of [recipient.GetFirstName], devouring ranks and resolve alike as it drags the doomed into suffocating darkness.\n\nYet once the shadows have tasted such slaughter, they rarely forget the flavour. Is it wise to unleash a hunger that even Valyria feared to name?"
  zz_valyria_magic_shadow_magic.011.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA mirror of black glass is set upon the ritual stone, and the caster speaks into it. The reflection that looks back is not the caster's own, but something else, something vast and patient, pressing against the glass from the other side. Slowly, the glass begins to bulge outward.\n\nThe Freehold's most forbidden teachings spoke of rites that opened doors into places of utter darkness. What came through such doors was never fully controlled, but it could be pointed in the right direction.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]\nWith the aid of these shadowy beasts, it is possible to draw forth a ravenous manifestation from the abyss, unleashing it upon the battlefield. It will seek out one of the regiments of [recipient.GetFirstName], devouring ranks and resolve alike as it drags the doomed into suffocating darkness.\n\nYet once the shadows have tasted such slaughter, they rarely forget the flavour. Is it wise to unleash a hunger that even Valyria feared to name?"
  zz_valyria_magic_shadow_magic.011.opt.a:0 "Yes, Kill them!"
  zz_valyria_magic_shadow_magic.011.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.011.toast.t:0  "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.011.name$"
  zz_valyria_magic_shadow_magic.011.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ calling forth a blade of hidden shadow to strike at [target.GetFirstName]."
  zz_valyria_magic_shadow_magic.011.toast.tt:0 "$zz_valyria_magic_shadow_magic.011.toast.desc$"

  zz_valyria_magic_shadow_magic.011.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.011.name$"
  zz_valyria_magic_shadow_magic.011.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.011.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.011.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_shadow_magic_012.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_prw$\n\nThe use of the arcane forces of [shadow_magic|E] to directly empower the [prowess_i][prowess|E] of the selected subject.\n\nThrough a dread and intimate working of [shadow_magic|E], the darkness is bound not to armies or realms, but to flesh, steel, and will. Shadow is drawn thin and sharp, distilled into a weapon that drinks strength from those who face it.\n\nThe use of the arcane forces of [shadow_magic|E] allows a blade to be enfused with living darkness, its edge wreathed in unseen hunger. Each strike is guided by whispers older than Valyria, ensuring greater success in the clash of steel and sinew.\n\nBy wielding a shadow‑enfused blade, personal combat is far more likely to end in triumph. The shadow laps at the vitality and resolve of an enemy, gnawing at their spirit, imparing and weakening them without ever needing to touch flesh—until the final blow is inevitable."

  ## event
  zz_valyria_magic_shadow_magic.012.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.012.name$"
  zz_valyria_magic_shadow_magic.012.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. At the caster's command it gathers, thickens, and draws itself out into a long and narrow shape, like a blade of black glass that reflects nothing at all.\n\nThe shadow mages of Valyria enchanted the weapons of the Freehold's champions in this way before their duels, coating the steel in a tar-like darkness that seemed to drink the light around it. Opponents swore that the blades moved a heartbeat before the arm that held them, and that every parry met only empty air.\n\nThe shadow will settle into the arm and weapon of [recipient.GetFirstName], making them a deadlier fighter for as long as the darkness lingers. Yet a blade that strikes from the shadows wins no honour in the light.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you lend [recipient.GetFirstName] a blade of living shadow, or let the darkness disperse unformed?"
  zz_valyria_magic_shadow_magic.012.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster draws the subject's blade from its scabbard and holds it in the darkness beyond the candlelight. The steel does not gleam. Instead, the shadows of the room seem to flow towards it, coating the blade in a thin film of darkness that ripples like oil upon water.\n\nThe duellists of the Freehold were feared across the world, and not all of their fame was earned through practice. Their shadow mages ensured that their blades struck truer, and from angles no opponent could see.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you lend [recipient.GetFirstName] a blade of living shadow, or let the darkness disperse unformed?"
  zz_valyria_magic_shadow_magic.012.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA whetstone is dipped in ink and drawn slowly along the subject's weapon, once for every word of the incantation. With each pass, the blade grows darker, until it seems not to be made of steel at all, but of a shadow given edge and weight.\n\nIn Valyria, the shadow mages lent their arts to the Freehold's champions before every great duel. Their blades moved faster than the eye could follow, and they never once missed their mark.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] Will you lend [recipient.GetFirstName] a blade of living shadow, or let the darkness disperse unformed?"
  zz_valyria_magic_shadow_magic.012.opt.a:0 "Let the shadow take the blade."
  zz_valyria_magic_shadow_magic.012.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.012.toast.t:0  "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.012.name$"
  zz_valyria_magic_shadow_magic.012.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ calling forth a spine of shadow, that settles within the blade of [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.012.toast.tt:0 "$zz_valyria_magic_shadow_magic.012.toast.desc$"

  zz_valyria_magic_shadow_magic.012.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.012.name$"
  zz_valyria_magic_shadow_magic.012.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.012.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.012.f.toast.desc$"


  ## Interaction
  
  zz_valyria_magic_shadow_magic_013.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_prw_dn$\n\nThe use of the arcane forces of [shadow_magic|E] to directly weaken the [prowess_i][prowess|E] of the selected subject.\n\nThrough a withering invocation of [shadow_magic|E], the darkness is compelled to unmake rather than empower. Shadows are drawn close to the chosen subject, clinging to sinew and steel alike, leeching strength and resolve.\n\nThe shadows can be called to claw and restrain a selected subject, dulling reflexes and sapping the certainty of each strike. Weapons feel heavier in the hand, armour grows ill‑fitting and brittle, and the instinct for combat falters beneath unseen pressure.\n\nSuch magics call forth aspects of shadow bound deeply to decay and sorrow. They strip and weaken, eroding vitality and will, breaking the chosen subject not with a single blow, but with the slow certainty of unraveling darkness."

  ## event
  zz_valyria_magic_shadow_magic.013.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.013.name$"
  zz_valyria_magic_shadow_magic.013.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. It moves sluggishly, heavy with age and grief, as though burdened by centuries of rot and remembrance.\n\nThe ancient shadow mages who dwelt within the Freehold held little regard for fairness in battle. To them, victory was secured long before blades crossed. It was not uncommon for such mages to call upon the hidden decay that writhes within the shadows, laying curses of weakness upon their enemies so that defeat was already written into their limbs.\n\nThese rites did not strike swiftly. Instead, they hollowed. Strength ebbed, confidence curdled into doubt, and even the finest steel seemed to betray its bearer, as if sharing in the shadow’s sorrow.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]\nWith a carefully bound curse, it would be yours to strip the capacity for personal combat from [recipient.GetFirstName], greatly increasing the chance that they will fall in any clash of arms.\n\nYet decay is a patient thing, and shadows that are invited to erode another may linger longer than intended. Is it truly wise to invoke the shadows of decay, knowing how eagerly they gnaw at all that lives?"
  zz_valyria_magic_shadow_magic.013.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster takes a shield painted with the arms of the subject's house and lays it face down upon the floor. Its shadow, cast long by the candles, begins to crack and crumble, flaking away like rust, until only a thin and broken outline remains.\n\nThe shadow mages of the Freehold held that a warrior's strength lies as much in their shadow as in their arm. Wither the shadow, and the arm will follow, failing at the moment it is needed most.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]\nWith a carefully bound curse, it would be yours to strip the capacity for personal combat from [recipient.GetFirstName], greatly increasing the chance that they will fall in any clash of arms.\n\nYet decay is a patient thing, and shadows that are invited to erode another may linger longer than intended. Is it truly wise to invoke the shadows of decay, knowing how eagerly they gnaw at all that lives?"
  zz_valyria_magic_shadow_magic.013.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA cup of black water is set before the caster, and they breathe upon its surface until it ripples. With each breath, the shadows of the room grow heavier and slower, and somewhere far away, the subject feels a weariness settle into their limbs that no rest will lift.\n\nIn Valyria, it was considered a mark of skill to win a duel before it began. The shadow mages of the Freehold made sure that their patrons' foes stepped into the circle already beaten.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')]\nWith a carefully bound curse, it would be yours to strip the capacity for personal combat from [recipient.GetFirstName], greatly increasing the chance that they will fall in any clash of arms.\n\nYet decay is a patient thing, and shadows that are invited to erode another may linger longer than intended. Is it truly wise to invoke the shadows of decay, knowing how eagerly they gnaw at all that lives?"
  zz_valyria_magic_shadow_magic.013.opt.a:0 "Let their strength wither."
  zz_valyria_magic_shadow_magic.013.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.013.toast.t:0  "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.013.name$"
  zz_valyria_magic_shadow_magic.013.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ laying a withering curse of shadow upon [recipient.GetFirstName], sapping their strength in combat."
  zz_valyria_magic_shadow_magic.013.toast.tt:0 "$zz_valyria_magic_shadow_magic.013.toast.desc$"

  zz_valyria_magic_shadow_magic.013.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.013.name$"
  zz_valyria_magic_shadow_magic.013.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.013.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.013.f.toast.desc$"


  ## Interaction
  ##\n\nThe use of the arcane forces of [shadow_magic|E] to reduce the selected subject's miscast counter.
  zz_valyria_magic_shadow_magic_014.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_hcm$\n\nThe use of the arcane forces of [shadow_magic|E] to reduce the selected subject's miscast counter.\n\nThe shadows are bound to magic itself, ancient witnesses to every spell ever spoken and every folly ever committed. By invoking them, a mage may allow the shadows to creep across the scars left by reckless sorcery, chiseling away the lingering consequences of reaching too far beyond mortal grasp.\n\nThe arcane forces of [shadow_magic|E] do not heal — they erase. Like ink swallowed by darkness, the legacy of miscasting is gently caressed, unraveled, and drawn away into the waiting abyss, leaving only a faint chill where the mistake once lingered."
  ## event
  zz_valyria_magic_shadow_magic.014.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.014.name$"
  zz_valyria_magic_shadow_magic.014.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. It crawls across stone and skin alike, heavy with unspoken memory, as though it remembers every failed spell ever uttered.\n\nFor the shadow mages of the lost Freehold, the shadows offered a rare mercy — a means of respite from the follies of magic itself. By calling forth these patient voids, it was possible to draw the permanent scars of magical mishaps from flesh and soul alike, reducing them to formless vapour and unremembered regret.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] \nThe shadows wait, eager to unmake what magic has broken. It is possible to wipe away the magical mistakes of [recipient.GetFirstName] — but such forgiveness is never freely given, and the darkness always remembers what it has taken."
  zz_valyria_magic_shadow_magic.014.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nThe caster lays their hands upon the subject's scars and speaks softly in High Valyrian. The shadows in the room gather about their fingers, and where they touch, the old marks of magic gone wrong begin to fade, drawn out and drunk down by the darkness as a sponge drinks water.\n\nThe shadow mages of the Freehold were not only feared. They were also, at times, the only ones who could undo the damage done by other, more reckless mages.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] \nThe shadows wait, eager to unmake what magic has broken. It is possible to wipe away the magical mistakes of [recipient.GetFirstName] — but such forgiveness is never freely given, and the darkness always remembers what it has taken."
  zz_valyria_magic_shadow_magic.014.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nA basin of cool, dark water is set beside the subject, and the caster dips a cloth into it and lays it upon their brow. The water is not quite water; it is too dark, too still, and as it touches the skin, the subject feels something old and painful being slowly lifted away.\n\nIn Valyria, the scars left by magic were often worse than those left by any blade. The shadows, it was said, could take them back, swallowing the harm whole and leaving only forgetting behind.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] \nThe shadows wait, eager to unmake what magic has broken. It is possible to wipe away the magical mistakes of [recipient.GetFirstName] — but such forgiveness is never freely given, and the darkness always remembers what it has taken."
  zz_valyria_magic_shadow_magic.014.opt.a:0 "Yes, soothe their souls them!"
  zz_valyria_magic_shadow_magic.014.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.014.toast.t:0  "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.014.name$"
  zz_valyria_magic_shadow_magic.014.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ calling forth the shadows to cleanse [recipient.GetFirstName] of the consequences of their magical mishaps."
  zz_valyria_magic_shadow_magic.014.toast.tt:0 "$zz_valyria_magic_shadow_magic.014.toast.desc$"

  zz_valyria_magic_shadow_magic.014.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.014.name$"
  zz_valyria_magic_shadow_magic.014.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.014.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.014.f.toast.desc$"


  ## Interaction
  ##\n\nThe use of the arcane forces of [shadow_magic|E] to prevent the selected subject from miscasting.
  zz_valyria_magic_shadow_magic_015.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_pcm$\n\nThe use of the arcane forces of [shadow_magic|E] to prevent the selected subject from miscasting.\n\nThrough a careful and forbidden weaving of [shadow_magic|E], the darkness itself is shaped into a silent sentinel. The shadows coil close about the chosen subject, watching the flow of power as it gathers, ready to smother errant surges before they fracture mind or flesh.\n\nThe arcane forces of [shadow_magic|E] do not strengthen the spell — they restrain it. They gently caress the edges of forming mysteries, dulling excess, swallowing instability, and manifesting an unseen barrier against magical mistakes. Power is allowed to breathe, but never to rage beyond control."
  ## event
  zz_valyria_magic_shadow_magic.015.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.015.name$"
  zz_valyria_magic_shadow_magic.015.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. Yet this darkness does not lunge nor claw — it gathers with deliberate patience, encircling the ritual space like a ring of silent watchers.\n\nAmong the shadow mages of Valyria, such workings were considered acts of refined mastery. Rather than unleash devastation, they would bind the shadows into veils and lattices, forming unseen wards that drank in excess power and silenced reckless surges before they could erupt into catastrophe.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] \nIt is possible to provide a ward against magical mishaps to [recipient.GetFirstName], wrapping them in a shroud that tempers ambition and steadies trembling forces. The shadows will cradle each forming mystery, absorbing instability and ensuring that no miscast takes root.\n\nYet even a ward woven of darkness must feed upon something. Should the shadows be invited so close, they may grow accustomed to guarding more than mere mistakes."
  zz_valyria_magic_shadow_magic.015.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nThe caster draws a lattice of lines upon the floor in powdered charcoal, a web of crossing paths that covers the whole chamber. As the incantation is spoken, the shadows settle into the lattice, filling its lines, and the air within the room grows calm and still, as though a storm had been quietly put to bed.\n\nThe shadow mages of Valyria knew that magic is a wild thing, and that every spell carries the risk of disaster. Through this mystery, the shadows are set to catch that wildness before it can break free.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] \nIt is possible to provide a ward against magical mishaps to [recipient.GetFirstName], wrapping them in a shroud that tempers ambition and steadies trembling forces. The shadows will cradle each forming mystery, absorbing instability and ensuring that no miscast takes root.\n\nYet even a ward woven of darkness must feed upon something. Should the shadows be invited so close, they may grow accustomed to guarding more than mere mistakes."
  zz_valyria_magic_shadow_magic.015.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nA thin veil of black silk is drawn across the caster's face, and they breathe slowly through it, speaking the words of binding. The veil grows heavy and dark, and the subject feels a strange quiet settle over their mind, as though a great noise they had never noticed had suddenly stopped.\n\nAmong the shadow mages of the Freehold, the greatest masters were known not for the power they unleashed, but for the power they held back. This mystery was the foundation of that restraint.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] \nIt is possible to provide a ward against magical mishaps to [recipient.GetFirstName], wrapping them in a shroud that tempers ambition and steadies trembling forces. The shadows will cradle each forming mystery, absorbing instability and ensuring that no miscast takes root.\n\nYet even a ward woven of darkness must feed upon something. Should the shadows be invited so close, they may grow accustomed to guarding more than mere mistakes."
  zz_valyria_magic_shadow_magic.015.opt.a:0 "Yes, soothe their souls them!"
  zz_valyria_magic_shadow_magic.015.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.015.toast.t:0  "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.015.name$"
  zz_valyria_magic_shadow_magic.015.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ calling forth a barrier of shadows around [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.015.toast.tt:0 "$zz_valyria_magic_shadow_magic.015.toast.desc$"

  zz_valyria_magic_shadow_magic.015.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.015.name$"
  zz_valyria_magic_shadow_magic.015.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.015.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.015.f.toast.desc$"

  ## Interaction
  ##\n\nThe use of the arcane forces of [shadow_magic|E] to increase the fortication level of a province belonging to the selected subject.
  zz_valyria_magic_shadow_magic_016.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tp$\n$zz_ccf$\n\nThe use of the arcane forces of [shadow_magic|E] to increase the fortication level of a province belonging to the selected subject.\n\nThrough solemn invocations in the tongue of the Freehold, [shadow_magic|E] is drawn down into stone, soil, and foundation. The darkness seeps into mortar and marrow alike, binding walls with unseen sinew and filling every crack with watchful gloom.\n\nThe use of the arcane forces of [shadow_magic|E] to fortify a province does not merely raise stronger ramparts — it awakens them. Gates groan with low whispers, towers stand wreathed in clinging dusk, and the very ground resists intrusion. Enemies will find their efforts blunted, their sieges slowed, as if the land itself recoils from their touch."
  ## event
  zz_valyria_magic_shadow_magic.016.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.016.name$"
  zz_valyria_magic_shadow_magic.016.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. It stretches outward in thin, questing tendrils, as though seeking distant walls and silent battlements to claim.\n\nIn the days of the Freehold, the shadow mages of Valyria did not trust stone alone to guard their dominions. They wove darkness into their fortresses, threading it through towers and curtain walls so that every parapet stood beneath a veil of patient malice. Such places did not simply endure assault — they watched it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] \nBy binding shadow to foundation and threshold, it is possible to form a defensive barrier to protect the chosen province. The province will be swathed in a dim and watchful shroud, its defenses strengthened not only by mortar and iron, but by a living dusk that clings to every gate and rampart.\n\nYet when shadows are given walls to inhabit, they rarely depart willingly. Should this rite be completed, the darkness will remember the shape of these stones — and what it was summoned to defend."
  zz_valyria_magic_shadow_magic.016.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nThe caster sets a small carved model of the province's chief fortress upon the ritual stone and surrounds it with candles. As the incantation is spoken, the shadows cast by the model grow longer and darker, stretching out across the floor and wrapping around it like a cloak.\n\nIn the days of the Freehold, no fortress was ever truly unguarded. Even when the garrison slept, the shadows watched, and the walls themselves seemed to resist those who would climb them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] \nBy binding shadow to foundation and threshold, it is possible to form a defensive barrier to protect the chosen province. The province will be swathed in a dim and watchful shroud, its defenses strengthened not only by mortar and iron, but by a living dusk that clings to every gate and rampart.\n\nYet when shadows are given walls to inhabit, they rarely depart willingly. Should this rite be completed, the darkness will remember the shape of these stones — and what it was summoned to defend."
  zz_valyria_magic_shadow_magic.016.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nA handful of earth taken from the province's walls is scattered across a map of the land, and the caster bleeds a single drop upon it. The earth darkens, and the shadows in the room begin to drift towards the map, settling over the province like a fog that does not lift.\n\nThe shadow mages of Valyria wove darkness into the stones of their fortresses, so that the walls themselves stood watch. Attackers spoke of a creeping dread as they approached, and of defenders who seemed to know their every move.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] \nBy binding shadow to foundation and threshold, it is possible to form a defensive barrier to protect the chosen province. The province will be swathed in a dim and watchful shroud, its defenses strengthened not only by mortar and iron, but by a living dusk that clings to every gate and rampart.\n\nYet when shadows are given walls to inhabit, they rarely depart willingly. Should this rite be completed, the darkness will remember the shape of these stones — and what it was summoned to defend."
  zz_valyria_magic_shadow_magic.016.opt.a:0 "Yes, let the shadows shield them!"
  zz_valyria_magic_shadow_magic.016.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.016.toast.t:0  "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.016.name$"
  zz_valyria_magic_shadow_magic.016.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ calling forth a barrier of shadow to protect [target.GetFirstName]."
  zz_valyria_magic_shadow_magic.016.toast.tt:0 "$zz_valyria_magic_shadow_magic.016.toast.desc$"

  zz_valyria_magic_shadow_magic.016.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.016.name$"
  zz_valyria_magic_shadow_magic.016.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.016.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.016.f.toast.desc$"


  ## Interaction
  ##\n\nThe use of the arcane forces of [shadow_magic|E] to decrease the fortication level of a province belonging to the selected subject.
  zz_valyria_magic_shadow_magic_017.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tp$\n$zz_ccf$\n\nThe use of the arcane forces of [shadow_magic|E] to decrease the fortication level of a province belonging to the selected subject.\n\nThrough a blighted invocation of [shadow_magic|E], the shadows are not set to guard but to gnaw. They are sent slithering through gatehouses and curtain walls, seeping into mortar, timber, and iron, whispering of collapse and surrender.\n\nThe use of the arcane forces of [shadow_magic|E] to infest their defenses does not shatter stone in an instant — it hollows it. Ramparts weaken from within, foundations tremble beneath unseen pressure, and watchmen grow uneasy as darkness pools where it should not. Thus are the defenses of a chosen province reduced, their strength quietly devoured in preparation for siege."
  ## event
  zz_valyria_magic_shadow_magic.017.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.017.name$"
  zz_valyria_magic_shadow_magic.017.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nA dark and unsettling shadow has begun to seep into the room, swelling and gorging itself on the darkness cast by the light. Unlike a warding veil, this darkness spreads with hungry intent, stretching thin as smoke before sinking into distant stone.\n\nAmong the more ruthless arts of the Valyrian shadow mages was the unmaking of fortresses without a single thrown stone. They would call the darkness into walls and towers, bidding it settle deep within the bones of a province. There it would coil patiently, eroding certainty, rotting timber, loosening iron, and filling the hearts of defenders with creeping dread.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] \nIt is possible to wipe away the defences of the chosen province, preparing the province for invasion. The shadows will infest parapets and gatehouses alike, gnawing at strength and resolve until the proudest bastion stands weakened and uncertain.\n\nYet when stone is taught to remember weakness, it may never fully forget. The ruin invited for an enemy can linger long after conquest is won."
  zz_valyria_magic_shadow_magic.017.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nThe caster takes a handful of grey ash and scatters it across a map of the enemy province. Where the ash falls, the shadows of the room begin to gather, sinking into the parchment and darkening the land beneath, until the whole province lies under a pall of shadow.\n\nThe shadow mages of the Freehold did not need siege engines. They sent their darkness ahead of the army, to soften walls and hearts alike, so that by the time the Freehold's soldiers arrived, the defenders were half beaten already.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] \nIt is possible to wipe away the defences of the chosen province, preparing the province for invasion. The shadows will infest parapets and gatehouses alike, gnawing at strength and resolve until the proudest bastion stands weakened and uncertain.\n\nYet when stone is taught to remember weakness, it may never fully forget. The ruin invited for an enemy can linger long after conquest is won."
  zz_valyria_magic_shadow_magic.017.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')] \n\nA cracked stone, taken from a fallen tower, is set at the centre of the circle. The caster whispers to it, and the shadows of the room flow into the crack, widening it slowly, until the stone splits apart with a sound like distant thunder.\n\nIn Valyria, it was said that no fortress could stand against a patient shadow. This mystery sends that patience into the stones of a distant province, to do its slow and silent work.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] \nIt is possible to wipe away the defences of the chosen province, preparing the province for invasion. The shadows will infest parapets and gatehouses alike, gnawing at strength and resolve until the proudest bastion stands weakened and uncertain.\n\nYet when stone is taught to remember weakness, it may never fully forget. The ruin invited for an enemy can linger long after conquest is won."
  zz_valyria_magic_shadow_magic.017.opt.a:0 "Yes, let the shadows strip them!"
  zz_valyria_magic_shadow_magic.017.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_shadow_magic.017.toast.t:0  "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.017.name$"
  zz_valyria_magic_shadow_magic.017.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ calling forth the shadows to overcome the defenses of [target.GetName]."
  zz_valyria_magic_shadow_magic.017.toast.tt:0 "$zz_valyria_magic_shadow_magic.017.toast.desc$"

  zz_valyria_magic_shadow_magic.017.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.017.name$"
  zz_valyria_magic_shadow_magic.017.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_shadow_magic.017.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.017.f.toast.desc$"


  ## Shadow 018
  zz_valyria_magic_shadow_magic_018.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_strs$\n\nThe use of the arcane forces of [shadow_magic|E] to crowd a chosen subject's nights with dread.\n\nThrough this mystery, the shadows of the subject's chamber begin to move when no one is watching. They sleep poorly, wake afraid, and find every burden heavier than the last.\n\nThis is not the working of dreams. These terrors stand awake at the foot of the bed."
  zz_valyria_magic_shadow_magic.018.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.018.name$"
  zz_valyria_magic_shadow_magic.018.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room. It slides beneath the door and is gone, leaving only the sense that something has left to pay a visit."
  zz_valyria_magic_shadow_magic.018.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster casts a shadow upon the wall, and then steps away from it. The shadow stays a moment longer, then turns and walks out of the light."
  zz_valyria_magic_shadow_magic.018.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA single candle is set before a mirror. The flame in the glass goes out, while the one upon the table burns on."
  zz_valyria_magic_shadow_magic.018.opt.a:0 "Let them wake afraid!"
  zz_valyria_magic_shadow_magic.018.opt.z:0 "No, do not cast!"
  zz_valyria_magic_shadow_magic.018.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.018.name$"
  zz_valyria_magic_shadow_magic.018.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ sending terrors to the bedside of [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.018.toast.tt:0 "$zz_valyria_magic_shadow_magic.018.toast.desc$"
  zz_valyria_magic_shadow_magic.018.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.018.name$"
  zz_valyria_magic_shadow_magic.018.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_shadow_magic.018.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.018.f.toast.desc$"


  ## Shadow 019
  zz_valyria_magic_shadow_magic_019.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tp$\n$zz_cccon$\n$zz_spr$\n\nThe use of the arcane forces of [shadow_magic|E] to loose a slow dread upon a chosen province.\n\nThrough this mystery, a sense of nameless fear settles upon the province. Control falters and levies desert. Once the county has fallen far enough into disorder the dread moves on, always towards the weakest neighbouring land.\n\nThe dread will not leave the realm where it began, and it avoids lands that are firmly held."
  zz_valyria_magic_shadow_magic.019.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.019.name$"
  zz_valyria_magic_shadow_magic.019.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room. It spreads across the map upon the table, and where it passes the names of towns grow hard to read."
  zz_valyria_magic_shadow_magic.019.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA hush falls. Nothing in the chamber has changed, and yet everyone present feels a strong wish to leave it."
  zz_valyria_magic_shadow_magic.019.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster sets a black stone upon the map. A stain slowly spreads from beneath it, patient and in no hurry at all."
  zz_valyria_magic_shadow_magic.019.opt.a:0 "Let the dread spread!"
  zz_valyria_magic_shadow_magic.019.opt.z:0 "No, do not cast!"
  zz_valyria_magic_shadow_magic.019.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.019.name$"
  zz_valyria_magic_shadow_magic.019.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ loosing a creeping dread in the lands of [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.019.toast.tt:0 "$zz_valyria_magic_shadow_magic.019.toast.desc$"
  zz_valyria_magic_shadow_magic.019.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.019.name$"
  zz_valyria_magic_shadow_magic.019.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_shadow_magic.019.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.019.f.toast.desc$"


  ## Shadow 020
  zz_valyria_magic_shadow_magic_020.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_prw_dn$\n$zz_ms_dn$\n\nThe use of the arcane forces of [shadow_magic|E] to bind a chosen subject in chains of darkness.\n\nThrough this mystery, the subject's own shadow grows heavy and clings to their heels. Their arm slows and their armies follow them sluggishly.\n\nEach effect is weaker than the great mysteries of Cloying Shadows and Feeble Shield, but this working lays both upon the victim at once."
  zz_valyria_magic_shadow_magic.020.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.020.name$"
  zz_valyria_magic_shadow_magic.020.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room. It coils about the legs of the altar in slow loops, link after link, like a chain being laid out."
  zz_valyria_magic_shadow_magic.020.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster loops a length of black cord about their own wrist and draws it tight. Far away, another hand falters."
  zz_valyria_magic_shadow_magic.020.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe sound of dragging iron crosses the chamber, though nothing moves. The shadows on the floor have drawn together into something very like a fetter."
  zz_valyria_magic_shadow_magic.020.opt.a:0 "Bind them!"
  zz_valyria_magic_shadow_magic.020.opt.z:0 "No, do not cast!"
  zz_valyria_magic_shadow_magic.020.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.020.name$"
  zz_valyria_magic_shadow_magic.020.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ binding [recipient.GetFirstName] in shackles of shadow."
  zz_valyria_magic_shadow_magic.020.toast.tt:0 "$zz_valyria_magic_shadow_magic.020.toast.desc$"
  zz_valyria_magic_shadow_magic.020.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.020.name$"
  zz_valyria_magic_shadow_magic.020.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_shadow_magic.020.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.020.f.toast.desc$"


  ## Shadow 021
  zz_valyria_magic_shadow_magic_021.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_silence$\n$zz_chg$\n\nThe use of the arcane forces of [shadow_magic|E] to draw a veil across a chosen subject's secrets.\n\nThrough this mystery, a watch is set upon the subject's secrets. Anyone who newly learns of them is silenced by shadow, and can never expose them. Those who knew before the casting are untouched.\n\nThe veil can bind only so many tongues before it is spent, and it binds whoever comes next, wise or not. Every silence it lays is permanent."
  zz_valyria_magic_shadow_magic.021.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.021.name$"
  zz_valyria_magic_shadow_magic.021.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room. It settles upon the caster's papers, and the ink beneath it fades from sight."
  zz_valyria_magic_shadow_magic.021.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA thin black cloth is drawn across the altar. As it settles, every word spoken in the chamber seems to fall dead a hand's breadth from the lips."
  zz_valyria_magic_shadow_magic.021.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster presses a finger to their lips, and the shadows in the room do the same. The silence that follows has a weight to it."
  zz_valyria_magic_shadow_magic.021.opt.a:0 "Draw the veil!"
  zz_valyria_magic_shadow_magic.021.opt.z:0 "No, do not cast!"
  zz_valyria_magic_shadow_magic.021.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.021.name$"
  zz_valyria_magic_shadow_magic.021.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ drawing a veil across the secrets of [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.021.toast.tt:0 "$zz_valyria_magic_shadow_magic.021.toast.desc$"
  zz_valyria_magic_shadow_magic.021.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.021.name$"
  zz_valyria_magic_shadow_magic.021.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_shadow_magic.021.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.021.f.toast.desc$"


  ## Shadow 022
  zz_valyria_magic_shadow_magic_022.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_asn$\n$zz_resm$\n\nThe use of the arcane forces of [shadow_magic|E] to send a killing shade after a chosen subject.\n\nThrough this mystery, a shade is sent out upon a single errand. It gives no warning, and few ever sense it coming. Only a mage or a very watchful target has any chance to prepare.\n\nIt is the hardest of the killing mysteries to trace back to its caster. Skilled mages resist it through their own Higher Mysteries."
  zz_valyria_magic_shadow_magic.022.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.022.name$"
  zz_valyria_magic_shadow_magic.022.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room. It gathers itself before the caster and waits, as a hound waits, for a single word."
  zz_valyria_magic_shadow_magic.022.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster whispers a name to the wall. The shadow there lifts away from the stone and slips out beneath the door."
  zz_valyria_magic_shadow_magic.022.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dagger is laid upon the altar. Its shadow rises from the stone, takes up the shape of the blade, and is gone."
  zz_valyria_magic_shadow_magic.022.opt.a:0 "Go, and return with nothing."
  zz_valyria_magic_shadow_magic.022.opt.z:0 "No, do not cast!"
  zz_valyria_magic_shadow_magic.022.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.022.name$"
  zz_valyria_magic_shadow_magic.022.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ sending a shade upon an errand."
  zz_valyria_magic_shadow_magic.022.toast.tt:0 "$zz_valyria_magic_shadow_magic.022.toast.desc$"
  zz_valyria_magic_shadow_magic.022.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.022.name$"
  zz_valyria_magic_shadow_magic.022.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_shadow_magic.022.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.022.f.toast.desc$"


  ## Shadow 023
  zz_valyria_magic_shadow_magic_023.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sa$\n$zz_nrep$\n\nThe use of the arcane forces of [shadow_magic|E] to raise a host from the darkness.\n\nThrough this mystery, a company of shades stands up out of the shadows beside a chosen subject. They need no supply and they fight without fear, but they are weak, and it takes many of them to win a battle.\n\nThey are not men, and they cannot be replaced. Each one that falls is gone for good."
  zz_valyria_magic_shadow_magic.023.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.023.name$"
  zz_valyria_magic_shadow_magic.023.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA dark and unsettling shadow has begun to seep into the room. It pools upon the floor, deepens, and then slowly begins to stand."
  zz_valyria_magic_shadow_magic.023.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster walks a circle about the chamber, and their shadow does not follow. It waits, and others gather to it, rank upon silent rank."
  zz_valyria_magic_shadow_magic.023.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nEvery candle dims at once. In the gloom there is a sound of many feet moving together, and when the light returns the walls have grown very dark."
  zz_valyria_magic_shadow_magic.023.opt.a:0 "Rise and march!"
  zz_valyria_magic_shadow_magic.023.opt.z:0 "No, do not cast!"
  zz_valyria_magic_shadow_magic.023.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.023.name$"
  zz_valyria_magic_shadow_magic.023.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ raising a host of shadows for [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.023.toast.tt:0 "$zz_valyria_magic_shadow_magic.023.toast.desc$"
  zz_valyria_magic_shadow_magic.023.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.023.name$"
  zz_valyria_magic_shadow_magic.023.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_shadow_magic.023.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.023.f.toast.desc$"


  ## Shadow 024
  zz_valyria_magic_shadow_magic_024.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_stltr$\n\nThe use of the arcane forces of [shadow_magic|E] to rob a treasury from within.\n\nThrough this mystery, the shadows of a strongroom are sent to carry off what lies in it, and the coin arrives in the caster's patron's coffers before the loss is ever noticed. Locks and guards are no hindrance to a thing with no body.\n\nThe shadows can only take what is there. An empty treasury gives them nothing to carry."
  zz_valyria_magic_shadow_magic.024.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.024.name$"
  zz_valyria_magic_shadow_magic.024.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nCoins laid out on the ritual table lose their shadows, one by one. The shadows slide away over the edge of the table and are gone."
  zz_valyria_magic_shadow_magic.024.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster draws a narrow doorway in soot upon the floor. Something passes out through it, and before long something heavier passes back in."
  zz_valyria_magic_shadow_magic.024.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA quiet clinking begins in the dark corner of the chamber, though nothing there is moving. It sounds like counting."
  zz_valyria_magic_shadow_magic.024.opt.a:0 "Empty their coffers."
  zz_valyria_magic_shadow_magic.024.opt.z:0 "No, do not cast!"
  zz_valyria_magic_shadow_magic.024.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.024.name$"
  zz_valyria_magic_shadow_magic.024.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ sending shadows to rob the coffers of [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.024.toast.tt:0 "$zz_valyria_magic_shadow_magic.024.toast.desc$"
  zz_valyria_magic_shadow_magic.024.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.024.name$"
  zz_valyria_magic_shadow_magic.024.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_shadow_magic.024.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.024.f.toast.desc$"


  ## Shadow 025
  zz_valyria_magic_shadow_magic_025.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_deco$\n\nThe use of the arcane forces of [shadow_magic|E] to hollow out the loyalty of a realm.\n\nThrough this mystery, a shadow of doubt falls across every oath sworn to the chosen ruler. Their vassals wake uneasy, certain of a slight that none of them can name, and the feeling fades only slowly.\n\nA ruler without vassals has no oaths to hollow."
  zz_valyria_magic_shadow_magic.025.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.025.name$"
  zz_valyria_magic_shadow_magic.025.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA sealed oath is laid upon the ritual table. The wax stays whole, but the shadow beneath it splits slowly in two."
  zz_valyria_magic_shadow_magic.025.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster recites a vow backwards, word by word. With each word the shadows in the chamber lean further from the ruler's name."
  zz_valyria_magic_shadow_magic.025.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA crown of black thread is set upon the table. The caster cuts the threads one by one, and each falls with a soft and final sound."
  zz_valyria_magic_shadow_magic.025.opt.a:0 "Let their oaths ring hollow."
  zz_valyria_magic_shadow_magic.025.opt.z:0 "No, do not cast!"
  zz_valyria_magic_shadow_magic.025.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.025.name$"
  zz_valyria_magic_shadow_magic.025.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ hollowing the oaths sworn to [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.025.toast.tt:0 "$zz_valyria_magic_shadow_magic.025.toast.desc$"
  zz_valyria_magic_shadow_magic.025.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.025.name$"
  zz_valyria_magic_shadow_magic.025.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_shadow_magic.025.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.025.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_shadow_magic_026.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sec_rv$\n\nThe use of the arcane forces of [shadow_magic|E] to steal one secret the selected subject knows about someone else, chosen by chance, and carry it back to the commander.\n\nA secret is a shadow cast by a deed, and shadows can be cut loose and carried off. The caster does not choose which one comes away; Dream Magic can pick and choose, but the shadow takes whatever is nearest."

  ## Spell Options
  ## event
  zz_valyria_magic_shadow_magic.026.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.026.name$"
  zz_valyria_magic_shadow_magic.026.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster stands where the subject's shadow falls at dusk and cuts it with a knife of black glass. Something small and dark slips free and runs to the caster's feet."
  zz_valyria_magic_shadow_magic.026.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA candle is lit behind the subject as they sleep. The caster catches the shadow it throws in a silver bowl and reads what is written in it."
  zz_valyria_magic_shadow_magic.026.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster whispers the subject's name into a dark corner and waits. In time the corner whispers back, and what it says was never meant to be heard."
  zz_valyria_magic_shadow_magic.026.opt.a:0 "Steal what they know."
  zz_valyria_magic_shadow_magic.026.opt.z:0 "No, do not cast!"

  zz_valyria_magic_shadow_magic.026.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.026.name$"
  zz_valyria_magic_shadow_magic.026.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ stealing a secret from [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.026.toast.tt:0 "$zz_valyria_magic_shadow_magic.026.toast.desc$"

  zz_valyria_magic_shadow_magic.026.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.026.name$"
  zz_valyria_magic_shadow_magic.026.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_shadow_magic.026.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.026.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_shadow_magic_027.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sch_rs$\n\nThe use of the arcane forces of [shadow_magic|E] to set back the progress of a scheme against the selected subject.\n\nEvery plot is a flame kept alive in the dark, and shadow can smother it. Unlike Dream Magic, which unpicks a plot entirely, the shadow only snuffs out part of the work: 10 progress, plus one for every 5 points of the caster's skill, up to 40."

  ## Spell Options
  ## event
  zz_valyria_magic_shadow_magic.027.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.027.name$"
  zz_valyria_magic_shadow_magic.027.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA row of candles is lit, one for each conspirator. The caster passes a hand over them and they gutter and smoke, though none quite goes out."
  zz_valyria_magic_shadow_magic.027.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster draws the plot as a web of black thread across the floor, then cuts strands at random until it sags."
  zz_valyria_magic_shadow_magic.027.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nShadows are gathered in a cupped hand and blown across a map. Wherever they settle, the conspirators lose their nerve for a time."
  zz_valyria_magic_shadow_magic.027.opt.a:0 "Snuff out their plot."
  zz_valyria_magic_shadow_magic.027.opt.z:0 "No, do not cast!"

  zz_valyria_magic_shadow_magic.027.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.027.name$"
  zz_valyria_magic_shadow_magic.027.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ snuffing out a plot against [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.027.toast.tt:0 "$zz_valyria_magic_shadow_magic.027.toast.desc$"

  zz_valyria_magic_shadow_magic.027.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.027.name$"
  zz_valyria_magic_shadow_magic.027.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_shadow_magic.027.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.027.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_shadow_magic_028.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_frp$\n\nThe use of the arcane forces of [shadow_magic|E] to free the selected prisoner from whoever holds them; an unlanded prisoner arrives at the commander's court.\n\nNo cell is wholly without shadow, and every shadow is a door to those who know how to open it."

  ## Spell Options
  ## event
  zz_valyria_magic_shadow_magic.028.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.028.name$"
  zz_valyria_magic_shadow_magic.028.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster draws a door in charcoal on the wall of their own chamber. Far away, the same door opens in a dungeon wall, and someone steps through it."
  zz_valyria_magic_shadow_magic.028.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nAt midnight the caster blows out every light in the tower. In a distant cell the darkness thickens, then empties."
  zz_valyria_magic_shadow_magic.028.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA key is cut from shadow and dropped down a well. By morning a gaoler finds the cell open and the chains still locked."
  zz_valyria_magic_shadow_magic.028.opt.a:0 "Open the way."
  zz_valyria_magic_shadow_magic.028.opt.z:0 "No, do not cast!"

  zz_valyria_magic_shadow_magic.028.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.028.name$"
  zz_valyria_magic_shadow_magic.028.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ spiriting [recipient.GetFirstName] out of prison."
  zz_valyria_magic_shadow_magic.028.toast.tt:0 "$zz_valyria_magic_shadow_magic.028.toast.desc$"

  zz_valyria_magic_shadow_magic.028.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.028.name$"
  zz_valyria_magic_shadow_magic.028.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_shadow_magic.028.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.028.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_shadow_magic_029.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_stla$\n\nThe use of the arcane forces of [shadow_magic|E] to steal one of the selected subject's artifacts for the commander.\n\nWhat lies in shadow belongs to no one, and the caster can make anything lie in shadow for long enough to take it."

  ## Spell Options
  ## event
  zz_valyria_magic_shadow_magic.029.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.029.name$"
  zz_valyria_magic_shadow_magic.029.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster wraps their hand in black cloth and reaches into a mirror. When the hand comes back, it is holding something."
  zz_valyria_magic_shadow_magic.029.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe shadow of the treasure is traced onto vellum, then the vellum is folded shut. Far away, the treasure is gone."
  zz_valyria_magic_shadow_magic.029.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA servant's shadow is borrowed for a single night. It walks through locked doors and comes home heavier."
  zz_valyria_magic_shadow_magic.029.opt.a:0 "Take it."
  zz_valyria_magic_shadow_magic.029.opt.z:0 "No, do not cast!"

  zz_valyria_magic_shadow_magic.029.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.029.name$"
  zz_valyria_magic_shadow_magic.029.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ stealing an artifact from [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.029.toast.tt:0 "$zz_valyria_magic_shadow_magic.029.toast.desc$"

  zz_valyria_magic_shadow_magic.029.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.029.name$"
  zz_valyria_magic_shadow_magic.029.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_shadow_magic.029.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.029.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_shadow_magic_030.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_csec$\n$zz_sec_rv$\n\nThe use of the arcane forces of [shadow_magic|E] to plant a secret of the commander's choosing on the selected subject; the commander knows it, but it is not exposed.\n\nGuilt is only a shadow that clings. The caster can make one cling where there was none before."

  ## Spell Options
  ## event
  zz_valyria_magic_shadow_magic.030.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.030.name$"
  zz_valyria_magic_shadow_magic.030.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster speaks a crime aloud in the subject's name, and the subject's shadow flinches as though it remembers."
  zz_valyria_magic_shadow_magic.030.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA false letter is written, sealed and burned. Its ashes are scattered where the subject walks, and the shadow of the lie follows them home."
  zz_valyria_magic_shadow_magic.030.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster stitches a dark thread into the hem of the subject's shadow. It will never quite come out."
  zz_valyria_magic_shadow_magic.030.opt.a:0 "Let the guilt cling."
  zz_valyria_magic_shadow_magic.030.opt.z:0 "No, do not cast!"

  zz_valyria_magic_shadow_magic.030.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.030.name$"
  zz_valyria_magic_shadow_magic.030.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ casting a shadow of guilt over [recipient.GetFirstName]."
  zz_valyria_magic_shadow_magic.030.toast.tt:0 "$zz_valyria_magic_shadow_magic.030.toast.desc$"

  zz_valyria_magic_shadow_magic.030.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.030.name$"
  zz_valyria_magic_shadow_magic.030.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_shadow_magic.030.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.030.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_shadow_magic_031.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_cch$\n\nThe use of the arcane forces of [shadow_magic|E] to give the selected subject a weak hook on a chosen character, a favour owed that was never agreed to.\n\nA promise made in the dark is still a promise. Dream Magic can bind a will entirely; the shadow only whispers a debt into being."

  ## Spell Options
  ## event
  zz_valyria_magic_shadow_magic.031.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.031.name$"
  zz_valyria_magic_shadow_magic.031.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nThe caster whispers into the chosen one's shadow while they sleep. In the morning they wake owing a favour and cannot say why."
  zz_valyria_magic_shadow_magic.031.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nTwo shadows are pinned together on the wall with a silver needle until one of them bows to the other."
  zz_valyria_magic_shadow_magic.031.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA false memory of kindness is spun from shadow and laid beside a sleeper's pillow."
  zz_valyria_magic_shadow_magic.031.opt.a:0 "Whisper the debt."
  zz_valyria_magic_shadow_magic.031.opt.z:0 "No, do not cast!"

  zz_valyria_magic_shadow_magic.031.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.031.name$"
  zz_valyria_magic_shadow_magic.031.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ whispering a debt in [recipient.GetFirstName]'s favour."
  zz_valyria_magic_shadow_magic.031.toast.tt:0 "$zz_valyria_magic_shadow_magic.031.toast.desc$"

  zz_valyria_magic_shadow_magic.031.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.031.name$"
  zz_valyria_magic_shadow_magic.031.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_shadow_magic.031.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.031.f.toast.desc$"

  ## The Shadow of Guilt - secret choices
  zz_guilt_deviant:0 "Deviancy"
  zz_guilt_homosexual:0 "Sodomy"
  zz_guilt_incest:0 "Incest"
  zz_guilt_cannibal:0 "Cannibalism"
  zz_guilt_witch:0 "Witchcraft"
  zz_guilt_non_believer:0 "Unbelief"

  # Shadow 032 - the Forged Lineage (Create Claim)
  zz_valyria_magic_shadow_magic_032.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_clm$\n\nThe use of the arcane forces of [shadow_magic|E] to forge a lineage that gives the commander a claim on one of a chosen subject's titles.\n\nThe commander gains an unpressed claim on the subject's highest title within the caster's reach: a county at first, a duchy, a kingdom and at last an empire as mastery grows.\n\nIn the shadow-archives of the Freehold, it was said that every bloodline has a page missing, and that a skilled hand can always write it in."
  zz_valyria_magic_shadow_magic.032.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.032.name$"
  zz_valyria_magic_shadow_magic.032.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nIn the dark of a records hall, the caster lays a hand on a genealogy, and the ink shifts. A name that was never there now always has been, linking the commander to [recipient.GetFirstName]'s house.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may forge a claim upon [recipient.GetFirstName]'s lands for [actor.GetFirstName]. Will you write it?"
  zz_valyria_magic_shadow_magic.032.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nA seal is pressed into warm wax by a hand that is not quite there. The charter it closes is old, and genuine in every particular, save that it did not exist this morning.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may forge a claim upon [recipient.GetFirstName]'s lands for [actor.GetFirstName]. Will you write it?"
  zz_valyria_magic_shadow_magic.032.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_shadow_magic')]\n\nShadows gather over a family tree painted on a chapel wall. When they part, a new branch has grown, and the line it traces ends at the commander.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may forge a claim upon [recipient.GetFirstName]'s lands for [actor.GetFirstName]. Will you write it?"
  zz_valyria_magic_shadow_magic.032.opt.a:0 "Write the lineage."
  zz_valyria_magic_shadow_magic.032.opt.z:0 "No, let the records stand."
  zz_valyria_magic_shadow_magic.032.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.032.name$"
  zz_valyria_magic_shadow_magic.032.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ forging a claim on [recipient.GetFirstName]'s titles."
  zz_valyria_magic_shadow_magic.032.toast.tt:0 "$zz_valyria_magic_shadow_magic.032.toast.desc$"
  zz_valyria_magic_shadow_magic.032.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.032.name$"
  zz_valyria_magic_shadow_magic.032.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$ as the forged page crumbles to ash."
  zz_valyria_magic_shadow_magic.032.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.032.f.toast.desc$"

  # Shadow 033 - the Shadow Feint (Single Combat)
  zz_valyria_magic_shadow_magic_033.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_duel_move$\n$zz_duel_skill$\n\nThe use of the arcane forces of [shadow_magic|E] to send a shadow of the caster lunging where the caster is not, so that the foe guards against nothing and is struck from elsewhere.\n\nThe foe's duel success falls and their injury risk rises, the more so with greater skill in Shadow Magic."
  zz_valyria_magic_shadow_magic.033.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.033.name$"
  zz_valyria_magic_shadow_magic.033.desc:0 "This [zz_mystery|E] is worked only in [single_combat_fight|E]."
  zz_valyria_magic_shadow_magic.033.opt.z:0 "Very well."
  zz_valyria_magic_shadow_magic.033.toast.t:0 "[shadow_magic|E] - $zz_valyria_magic_shadow_magic.033.name$"
  zz_valyria_magic_shadow_magic.033.toast.desc:0 "$zz_toast_01$ [shadow_magic|E], $zz_toast_02$ in single combat."
  zz_valyria_magic_shadow_magic.033.toast.tt:0 "$zz_valyria_magic_shadow_magic.033.toast.desc$"
  zz_valyria_magic_shadow_magic.033.f.toast.t:0 "Failure [shadow_magic|E] - $zz_valyria_magic_shadow_magic.033.name$"
  zz_valyria_magic_shadow_magic.033.f.toast.desc:0 "$zz_toast_01$ [shadow_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_shadow_magic.033.f.toast.tt:0 "$zz_valyria_magic_shadow_magic.033.f.toast.desc$"
