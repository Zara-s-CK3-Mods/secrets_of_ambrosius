  ## Interaction
  zz_valyria_magic_water_magic_008.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tca$\n$zz_scr_dn$\n\nThe use of the arcane forces of [water_magic|E] to shroud a commander's armies in blinding mists.\n\nThrough this mystery, thick and clinging mists are bound to the armies of a chosen subject, following them wherever they march. Their scouts lose their way, their flanks go unwatched, and their enemies approach unseen.\n\nThe subject's armies screen themselves far less effectively, leaving them exposed to pursuit and flanking.\n\nThe tide-sorcerers of the Freehold wrapped their enemies in fog before battle, so that the legions could strike from nowhere."
  ##event
  zz_valyria_magic_water_magic.008.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.008.name$"
  zz_valyria_magic_water_magic.008.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA cold grey mist seeps up from the floor of the chamber, curling around ankles and rising until the far walls disappear. Voices sound strangely distant within it.\n\nIn the wars of the Freehold, the mists were the herald of the legions. Where the fog rolled in, the enemy did not see the morning.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may shroud the armies of [recipient.GetFirstName] in blinding mists, leaving their flanks unwatched. Will you call the fog?"
  zz_valyria_magic_water_magic.008.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster breathes slowly into a bowl of cold water, and a thin mist rises from its surface. It spreads across the floor and up the walls, until the candles are only faint smudges of light and the far side of the room has vanished entirely.\n\nIn the wars of the Freehold, the mist came first, and the legions came out of it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may shroud the armies of [recipient.GetFirstName] in blinding mists, leaving their flanks unwatched. Will you call the fog?"
  zz_valyria_magic_water_magic.008.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA wet cloth is held over the brazier, and a thick white steam rises from it. The caster speaks, and the steam does not disperse. It rolls outward in a slow grey wave, swallowing the room, and every sound within it seems muffled and far away.\n\nIn Valyria, it was said that the mist was the legion's cloak, and that no enemy could find a foe they could not see.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may shroud the armies of [recipient.GetFirstName] in blinding mists, leaving their flanks unwatched. Will you call the fog?"
  zz_valyria_magic_water_magic.008.opt.a:0 "Call the mists!"
  zz_valyria_magic_water_magic.008.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.008.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.008.name$"
  zz_valyria_magic_water_magic.008.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ shrouding the armies of [recipient.GetFirstName] in blinding mists."
  zz_valyria_magic_water_magic.008.toast.tt:0 "$zz_valyria_magic_water_magic.008.toast.desc$"
  zz_valyria_magic_water_magic.008.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.008.name$"
  zz_valyria_magic_water_magic.008.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.008.f.toast.tt:0 "$zz_valyria_magic_water_magic.008.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_water_magic_009.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tca$\n$zz_cav_dn$\n\nThe use of the arcane forces of [water_magic|E] to turn the ground beneath a commander's armies to clinging mud.\n\nThrough this mystery, the earth beneath the armies of a chosen subject is soaked through, becoming a sucking, clinging mire wherever they fight.\n\nThe subject's cavalry, elephants, and heavy infantry fight far less effectively, floundering in mud that seems to rise to meet them.\n\nThe heavy horse of many a proud kingdom was broken by the Freehold not with lances, but with mud."
  ##event
  zz_valyria_magic_water_magic.009.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.009.name$"
  zz_valyria_magic_water_magic.009.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nWater seeps up through the floor of the chamber, slow and steady, until the flagstones are slick and the caster's feet sink into a mud that should not exist.\n\nThe tide-sorcerers of Valyria were masters of the battlefield's ground as much as its skies. Armies that relied on the charge learned to dread the rain.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn the ground beneath the armies of [recipient.GetFirstName] to clinging mud, crippling their heavy troops. Will you soak the field?"
  zz_valyria_magic_water_magic.009.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster pours a jug of water onto the stone floor, and the stone drinks it. Then the floor grows soft beneath their feet, sinking slightly, until they stand ankle-deep in a thick, sucking mud that was not there a moment before.\n\nThe cavalry that charged the legions of the Freehold often found their horses floundering in mire before they reached the line.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn the ground beneath the armies of [recipient.GetFirstName] to clinging mud, crippling their heavy troops. Will you soak the field?"
  zz_valyria_magic_water_magic.009.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA heavy rain begins to fall upon a map of the battlefield, though no clouds hang above it. The ink of the roads and fields runs and blurs, and the parchment grows soft and sodden under the caster's hands.\n\nIn Valyria, it was said that the tide-sorcerers could turn any field into a swamp, and any charge into a slow and deadly crawl.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may turn the ground beneath the armies of [recipient.GetFirstName] to clinging mud, crippling their heavy troops. Will you soak the field?"
  zz_valyria_magic_water_magic.009.opt.a:0 "Soak the field!"
  zz_valyria_magic_water_magic.009.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.009.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.009.name$"
  zz_valyria_magic_water_magic.009.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ turning the ground beneath the armies of [recipient.GetFirstName] to clinging mud."
  zz_valyria_magic_water_magic.009.toast.tt:0 "$zz_valyria_magic_water_magic.009.toast.desc$"
  zz_valyria_magic_water_magic.009.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.009.name$"
  zz_valyria_magic_water_magic.009.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.009.f.toast.tt:0 "$zz_valyria_magic_water_magic.009.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_water_magic_010.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tca$\n$zz_tough$\n\nThe use of the arcane forces of [water_magic|E] to grant a commander's armies the enduring resilience of water.\n\nWater cannot be broken. Strike it and it parts; let go and it closes again. Through this mystery, that resilience is bound to the armies of a chosen subject.\n\nThe subject's armies become far tougher, and fewer of those who fall in battle are lost for good.\n\nThe legions of the Freehold were said to be like the sea: you could cut them, but you could never make them bleed."
  ##event
  zz_valyria_magic_water_magic.010.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.010.name$"
  zz_valyria_magic_water_magic.010.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe water in the ritual basin begins to move, flowing in slow circles. When the caster plunges a blade into it, the water parts, then closes again without a ripple.\n\nThe tide-sorcerers of the Freehold blessed its legions with Water's Resilience before every great battle, so that no blow could break them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant the resilience of water to the armies of [recipient.GetFirstName], making them far harder to break. Will you bless them?"
  zz_valyria_magic_water_magic.010.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster plunges a knife into a bowl of water and draws it out again. The water closes behind the blade without a ripple, as though it had never been cut, and the caster speaks the words that will bind that same quality to the subject's soldiers.\n\nThe legions of the Freehold were hard to break. Like water, they bent around every blow and closed again behind it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant the resilience of water to the armies of [recipient.GetFirstName], making them far harder to break. Will you bless them?"
  zz_valyria_magic_water_magic.010.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA great jar of water is set at the centre of the circle, and the caster strikes it with an iron rod. The jar does not crack. The water inside ripples, settles, and is still, and the blow seems to vanish into it as though it had never been struck.\n\nIn Valyria, the tide-sorcerers taught that water cannot be broken, only displaced. They taught the same to the soldiers they blessed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may grant the resilience of water to the armies of [recipient.GetFirstName], making them far harder to break. Will you bless them?"
  zz_valyria_magic_water_magic.010.opt.a:0 "Let them endure like water."
  zz_valyria_magic_water_magic.010.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.010.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.010.name$"
  zz_valyria_magic_water_magic.010.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ granting the resilience of water to the armies of [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.010.toast.tt:0 "$zz_valyria_magic_water_magic.010.toast.desc$"
  zz_valyria_magic_water_magic.010.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.010.name$"
  zz_valyria_magic_water_magic.010.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.010.f.toast.tt:0 "$zz_valyria_magic_water_magic.010.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_water_magic_011.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_hc$\n$zz_mh$\n\nThe use of the arcane forces of [water_magic|E] to wash away a chosen subject's diseases and infections.\n\nWater cleanses. Through this mystery, purifying waters are passed through the body of the chosen subject, washing away disease, infection, and festering wounds.\n\nThe subject is healed of their illnesses and gains a lasting resistance to the sicknesses that would otherwise afflict them.\n\nThe healers of the Freehold built their temples beside springs and rivers, for they held that no fever could survive the touch of truly pure water."
  ##event
  zz_valyria_magic_water_magic.011.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.011.name$"
  zz_valyria_magic_water_magic.011.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA clear, cool water rises from the ritual basin and flows over the subject, though none of it falls to the floor. Where it passes, fever-flush fades and inflamed flesh cools.\n\nThe water-healers of Valyria were revered across the Freehold, and their temples were places of pilgrimage for the sick of a hundred cities.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may wash away the diseases and infections of [recipient.GetFirstName], granting them lasting protection. Will you purify them?"
  zz_valyria_magic_water_magic.011.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster fills a cup with water from a clear spring and holds it to the subject's lips. As they drink, a cool calm spreads through their body, and the heat of fever and inflammation ebbs away like a tide going out.\n\nThe water-healers of Valyria were revered across the Freehold. Pilgrims came from a hundred cities to drink from their wells.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may wash away the diseases and infections of [recipient.GetFirstName], granting them lasting protection. Will you purify them?"
  zz_valyria_magic_water_magic.011.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA cloth soaked in cold water is laid across the subject's brow, and the caster sings softly as it rests there. The water seems to sink into the skin, and as it does, the pain and sickness within begin to dissolve, like salt in a stream.\n\nIn Valyria, it was said that there was no ill so deep that clean water could not wash it away.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may wash away the diseases and infections of [recipient.GetFirstName], granting them lasting protection. Will you purify them?"
  zz_valyria_magic_water_magic.011.opt.a:0 "Let them be purified!"
  zz_valyria_magic_water_magic.011.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.011.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.011.name$"
  zz_valyria_magic_water_magic.011.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ washing away the diseases and infections of [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.011.toast.tt:0 "$zz_valyria_magic_water_magic.011.toast.desc$"

  zz_valyria_magic_water_magic.011.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.011.name$"
  zz_valyria_magic_water_magic.011.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.011.f.toast.tt:0 "$zz_valyria_magic_water_magic.011.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_water_magic_012.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_prw$\n\nThe use of the arcane forces of [water_magic|E] to lend a chosen warrior the flowing strength of water.\n\nWater flows around every obstacle and wears down every stone. Through this mystery, that quality is bound to a single warrior, so that their movements flow without pause and their strikes wear down any defence.\n\nThe subject's [prowess|E] increases for as long as the blessing endures.\n\nThe duellists of the Freehold who bore Water's Edge fought without a single wasted motion, and their opponents tired long before they did."
  ##event
  zz_valyria_magic_water_magic.012.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.012.name$"
  zz_valyria_magic_water_magic.012.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA thin film of water slides over the subject's arms and hands, and when they move, it moves with them, smooth and unbroken.\n\nThe champions of the Freehold's arenas who fought with Water's Edge were said to be impossible to strike cleanly. Every blow simply slid away.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may lend the flowing strength of water to [recipient.GetFirstName], making them a deadlier fighter. Will you grant it?"
  zz_valyria_magic_water_magic.012.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster dips the subject's hands into a bowl of cool water and holds them there. When they draw them out, the water clings to their skin in a thin, shining film that does not drip or dry, and moves with their fingers as they flex them.\n\nThe champions of the Freehold's arenas who fought with Water's Edge were notoriously hard to hit. Every blow simply slid away.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may lend the flowing strength of water to [recipient.GetFirstName], making them a deadlier fighter. Will you grant it?"
  zz_valyria_magic_water_magic.012.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA fine spray of water is breathed over the subject's sword arm, and it settles upon the skin like dew. When they lift their blade, the water flows along it, and every movement becomes smoother, quicker, more fluid than before.\n\nIn Valyria, it was said that a duellist touched by water was like a river: impossible to grasp, and impossible to stop.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may lend the flowing strength of water to [recipient.GetFirstName], making them a deadlier fighter. Will you grant it?"
  zz_valyria_magic_water_magic.012.opt.a:0 "Let their blade flow like water."
  zz_valyria_magic_water_magic.012.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.012.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.012.name$"
  zz_valyria_magic_water_magic.012.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ lending the flowing strength of water to [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.012.toast.tt:0 "$zz_valyria_magic_water_magic.012.toast.desc$"
  zz_valyria_magic_water_magic.012.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.012.name$"
  zz_valyria_magic_water_magic.012.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.012.f.toast.tt:0 "$zz_valyria_magic_water_magic.012.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_water_magic_013.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_nwp$\n\nThe use of the arcane forces of [water_magic|E] to bind a barrier of condensed water about a chosen warrior, so that their wounds no longer weigh upon them.\n\nThrough this mystery, a barrier of condensed water is bound around a chosen warrior, cooling their wounds and steadying their limbs, so that injuries no longer slow them.\n\nThe subject ignores the penalties that their wounds would otherwise impose upon their [prowess|E].\n\nThe wounds themselves remain beneath the barrier, waiting for the water to recede."
  ##event
  zz_valyria_magic_water_magic.013.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.013.name$"
  zz_valyria_magic_water_magic.013.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA cool, shimmering film of water settles over the subject like a second skin. Where it touches old wounds, the heat of inflammation fades and stiff joints loosen.\n\nThe legion commanders of the Freehold were often wrapped in the Condensed Barrier before battle, so that no wound could keep them from the front.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bind a barrier of water about [recipient.GetFirstName], so that their wounds no longer hinder them in combat. Will you grant it?"
  zz_valyria_magic_water_magic.013.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster pours a slow stream of water over the subject's shoulders, and it does not run off. It spreads across them in a thin, shimmering layer, cool and close, and settles into the folds of their clothing like a second skin.\n\nThe commanders of the Freehold went into battle wrapped in water, and many a blow that should have killed them merely glanced aside.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bind a barrier of water about [recipient.GetFirstName], so that their wounds no longer hinder them in combat. Will you grant it?"
  zz_valyria_magic_water_magic.013.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA fine mist rises from the ritual basin and drifts towards the subject, wrapping itself around them until they are hidden in a cool, glimmering cloud. When the mist clears, it leaves behind a faint sheen upon their skin that does not fade.\n\nIn Valyria, it was said that water could turn a blade as well as any steel, if it was called upon by the right hand.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bind a barrier of water about [recipient.GetFirstName], so that their wounds no longer hinder them in combat. Will you grant it?"
  zz_valyria_magic_water_magic.013.opt.a:0 "Raise the barrier."
  zz_valyria_magic_water_magic.013.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.013.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.013.name$"
  zz_valyria_magic_water_magic.013.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ binding a barrier of condensed water about [recipient.GetFirstName], so that their wounds no longer hinder them."
  zz_valyria_magic_water_magic.013.toast.tt:0 "$zz_valyria_magic_water_magic.013.toast.desc$"
  zz_valyria_magic_water_magic.013.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.013.name$"
  zz_valyria_magic_water_magic.013.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.013.f.toast.tt:0 "$zz_valyria_magic_water_magic.013.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_water_magic_014.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_hcm$\n\nThe use of the arcane forces of [water_magic|E] to wash away the lingering taint of failed and miscast workings.\n\nEvery failed spell leaves a residue in the soul of its caster. Through this mystery, pure water is passed through the subject's spirit, washing that residue away.\n\nThe subject's capacity to cast safely is restored, the scars of past miscasts cleansed.\n\nThe tide-sorcerers of the Freehold bathed in sacred springs at the turning of every season, so that no failure would cling to them."
  ##event
  zz_valyria_magic_water_magic.014.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.014.name$"
  zz_valyria_magic_water_magic.014.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA clear spring wells up from the floor of the chamber and flows over the subject's feet. Where it passes, something dark and clinging seems to dissolve and drift away.\n\nThe Valyrians called this the Rite of the Clean Spring, and no sorcerer of the Freehold went long without it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may wash [recipient.GetFirstName] clean of the lingering taint of their failed workings. Will you cleanse them?"
  zz_valyria_magic_water_magic.014.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster draws a basin of cold, clear water from a spring and bids the subject wash their hands and face in it. As they do, the water darkens, as though something were being drawn out of them, and when it is poured away, they feel lighter and cleaner than before.\n\nThe Rite of the Clean Spring was performed often in the towers of the Freehold, for no sorcerer could afford to carry the debris of their failures for long.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may wash [recipient.GetFirstName] clean of the lingering taint of their failed workings. Will you cleanse them?"
  zz_valyria_magic_water_magic.014.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA slow trickle of water is poured over the subject's head, from a jug that never seems to empty. Where it runs, the dark marks left by old and failed workings seem to loosen and wash away, carried off down the drain in the floor.\n\nIn Valyria, it was understood that water carries away all things in time. The tide-sorcerers only hastened it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may wash [recipient.GetFirstName] clean of the lingering taint of their failed workings. Will you cleanse them?"
  zz_valyria_magic_water_magic.014.opt.a:0 "Wash them clean."
  zz_valyria_magic_water_magic.014.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.014.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.014.name$"
  zz_valyria_magic_water_magic.014.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ washing away the lingering taint of failed workings from [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.014.toast.tt:0 "$zz_valyria_magic_water_magic.014.toast.desc$"

  zz_valyria_magic_water_magic.014.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.014.name$"
