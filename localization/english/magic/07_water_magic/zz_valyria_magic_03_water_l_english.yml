  ## Interaction
  zz_valyria_magic_water_magic_015.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_pcm$\n\nThe use of the arcane forces of [water_magic|E] to raise a ward of water that absorbs the backlash of a miscast spell.\n\nThrough this mystery, a ward of still water is laid around the subject's spirit, ready to absorb the wild energies of a failed working as the sea absorbs a falling stone.\n\nThe ward lies dormant until it is needed. When a working fails, the water rises, and the backlash is swallowed without harm.\n\nThe teachers of the Freehold laid this ward upon their students before every dangerous lesson."
  ##event
  zz_valyria_magic_water_magic.015.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.015.name$"
  zz_valyria_magic_water_magic.015.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA ring of still water forms in the air around the subject, smooth as glass, then sinks out of sight, leaving behind only a faint coolness that lingers.\n\nThe tide-sorcerers of the Freehold never attempted a dangerous working without such a ward. They had seen too many towers fall.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may lay a warding water upon [recipient.GetFirstName], protecting them from the backlash of their next failed working. Will you raise the ward?"
  zz_valyria_magic_water_magic.015.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster draws a circle of water around the subject with a wet finger, and the water rises from the floor in a thin, shining ring. It hangs in the air for a moment, smooth as glass, and then sinks out of sight, leaving a faint coolness in its place.\n\nThe tide-sorcerers of the Freehold never cast a dangerous working without such a ward. They had seen too many towers fall.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may lay a warding water upon [recipient.GetFirstName], protecting them from the backlash of their next failed working. Will you raise the ward?"
  zz_valyria_magic_water_magic.015.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA small crystal flask of water is hung on a cord about the subject's neck, and the caster speaks the words of binding over it. The water within begins to glow faintly, and the subject feels a quiet calm settle over them, as though the sea itself were standing guard.\n\nIn Valyria, it was said that water was the most patient of all guardians. It would wait forever for a mistake, and catch it when it came.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may lay a warding water upon [recipient.GetFirstName], protecting them from the backlash of their next failed working. Will you raise the ward?"
  zz_valyria_magic_water_magic.015.opt.a:0 "Raise the ward."
  zz_valyria_magic_water_magic.015.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.015.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.015.name$"
  zz_valyria_magic_water_magic.015.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ laying a ward of still water upon [recipient.GetFirstName] that will absorb the backlash of a failed working."
  zz_valyria_magic_water_magic.015.toast.tt:0 "$zz_valyria_magic_water_magic.015.toast.desc$"
  zz_valyria_magic_water_magic.015.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.015.name$"
  zz_valyria_magic_water_magic.015.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.015.f.toast.tt:0 "$zz_valyria_magic_water_magic.015.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_water_magic_016.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tp$\n$zz_ccf$\n\nThe use of the arcane forces of [water_magic|E] to raise a great fortress of water around the defences of a chosen province.\n\nThrough this mystery, the defences of a chosen province are ringed by deep and treacherous waters: moats that fill of their own accord, marshes that rise around the walls, and rivers that turn to guard the gates.\n\nThe province's fortifications are made enormously stronger for as long as the waters endure.\n\nThe great river-fortresses of old were said to be impregnable. The Valyrians, who eventually took them, learned the secret and made it their own."
  ##event
  zz_valyria_magic_water_magic.016.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.016.name$"
  zz_valyria_magic_water_magic.016.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe sound of deep water fills the chamber, the slow surge of a river in flood. Far away, the ditches and moats of the chosen province begin to fill.\n\nThe tide-sorcerers of the Freehold raised such fortresses around its river-cities, and the armies that came against them drowned in the attempt.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may raise a fortress of water around the defences of the chosen province, making them nearly impregnable. Will you raise it?"
  zz_valyria_magic_water_magic.016.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster pours a jug of water slowly around a model of the chosen province's chief fortress. The water does not spread across the floor. It gathers itself into a deep, swirling moat around the model, and far away, the moats and ditches of the real fortress begin to fill.\n\nThe river-cities of the Freehold were surrounded by water that rose and fell at their sorcerers' command, and few besiegers ever crossed it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may raise a fortress of water around the defences of the chosen province, making them nearly impregnable. Will you raise it?"
  zz_valyria_magic_water_magic.016.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA bowl of river water is set upon a map of the chosen province, and the caster stirs it slowly with a rod of silver. As the water turns, the rivers on the map seem to swell and spread, flowing around the province's walls and filling every hollow.\n\nIn Valyria, the tide-sorcerers made rivers into walls, and walls of water could not be climbed.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may raise a fortress of water around the defences of the chosen province, making them nearly impregnable. Will you raise it?"
  zz_valyria_magic_water_magic.016.opt.a:0 "Raise the fortress of water!"
  zz_valyria_magic_water_magic.016.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.016.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.016.name$"
  zz_valyria_magic_water_magic.016.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ raising a fortress of water around the defences of [target.GetName]."
  zz_valyria_magic_water_magic.016.toast.tt:0 "$zz_valyria_magic_water_magic.016.toast.desc$"
  zz_valyria_magic_water_magic.016.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.016.name$"
  zz_valyria_magic_water_magic.016.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.016.f.toast.tt:0 "$zz_valyria_magic_water_magic.016.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_water_magic_017.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tp$\n$zz_ccf$\n\nThe use of the arcane forces of [water_magic|E] to seep oppressive mists and damp into the defences of a chosen province.\n\nThrough this mystery, oppressive mists and creeping damp are sent into the defences of a chosen province. Mortar softens, timbers rot, and the defenders grow sick and weary.\n\nThe province's fortifications are weakened, leaving it more vulnerable to assault.\n\nWater wears down stone. The tide-sorcerers of the Freehold simply made it work faster."
  ##event
  zz_valyria_magic_water_magic.017.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.013.name$"
  zz_valyria_magic_water_magic.017.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA cold, clammy mist seeps into the chamber, and the walls begin to sweat. Far away, the same mist creeps over the walls of the chosen province.\n\nIn the wars of the Freehold, a fortress that had endured the Oppression of the Mists for a season was rarely in a state to resist the legions.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send oppressive mists into the defences of the chosen province, weakening them against your armies. Will you send the mist?"
  zz_valyria_magic_water_magic.017.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster breathes slowly upon a cold stone taken from the walls of the chosen province. A damp mist rises from it and spreads across the chamber, and far away, the same mist creeps up the walls of the province, seeping into every crack and crevice.\n\nThe fortresses of the Freehold's enemies grew damp and weak under the mists, their timbers rotting and their mortar crumbling, long before the legions arrived.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send oppressive mists into the defences of the chosen province, weakening them against your armies. Will you send the mist?"
  zz_valyria_magic_water_magic.017.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA wet cloth is wrapped around a model of the chosen province's walls, and the caster speaks the words of creeping cold. The cloth begins to steam, and the model beneath it grows dark and soft, its edges crumbling under the weight of the damp.\n\nIn Valyria, it was said that a fortress could withstand the battering ram, but not the slow and patient mist.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send oppressive mists into the defences of the chosen province, weakening them against your armies. Will you send the mist?"
  zz_valyria_magic_water_magic.017.opt.a:0 "Let the mists creep in."
  zz_valyria_magic_water_magic.017.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.017.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.017.name$"
  zz_valyria_magic_water_magic.017.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ sending oppressive mists into the defences of [target.GetName], weakening them."
  zz_valyria_magic_water_magic.017.toast.tt:0 "$zz_valyria_magic_water_magic.017.toast.desc$"

  zz_valyria_magic_water_magic.017.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.017.name$"
  zz_valyria_magic_water_magic.017.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.017.f.toast.tt:0 "$zz_valyria_magic_water_magic.017.f.toast.desc$"


  ## Water 018
  zz_valyria_magic_water_magic_018.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tr$\n$zz_dr$\n$zz_md$\n\nThe use of the arcane forces of [water_magic|E] to drown a single company where it stands.\n\nThrough this mystery, water fills helm and breastplate, rising from nothing around the men of one chosen company. They drown on dry ground, in full sight of their comrades.\n\nOf the mysteries of water this is the most direct, and the river-sorcerers of the Freehold kept it for the enemy's finest soldiers."
  zz_valyria_magic_water_magic.018.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.018.name$"
  zz_valyria_magic_water_magic.018.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe water in the ritual basin begins to rise without being poured. It climbs over the rim and hangs in the air in a trembling column, reaching towards something far away."
  zz_valyria_magic_water_magic.018.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster lowers an iron helm into a basin and holds it under. Somewhere distant, men begin to choke, and the bubbles that rise from the helm are not the caster's."
  zz_valyria_magic_water_magic.018.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA wet handprint appears upon the flagstones, then another. They cross the chamber in a slow line, as though something unseen has already gone out to find its prey."
  zz_valyria_magic_water_magic.018.opt.a:0 "Pull them under!"
  zz_valyria_magic_water_magic.018.opt.z:0 "No, do not cast!"
  zz_valyria_magic_water_magic.018.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.018.name$"
  zz_valyria_magic_water_magic.018.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ drowning a company of [recipient.GetFirstName]'s soldiers where they stood."
  zz_valyria_magic_water_magic.018.toast.tt:0 "$zz_valyria_magic_water_magic.018.toast.desc$"
  zz_valyria_magic_water_magic.018.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.018.name$"
  zz_valyria_magic_water_magic.018.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_water_magic.018.f.toast.tt:0 "$zz_valyria_magic_water_magic.018.f.toast.desc$"


  ## Water 019
  zz_valyria_magic_water_magic_019.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_ta$\n$zz_da$\n$zz_md$\n\nThe use of the arcane forces of [water_magic|E] to drag an enemy host away with an unseen current.\n\nThrough this mystery, a pull like the sea's own undertow seizes a chosen army. An army near a coast or riverbank suffers far worse, for there the working has real water to command.\n\nThe fisherfolk of the Freehold's coasts are said to have feared this working above all others, and with good cause."
  zz_valyria_magic_water_magic.019.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.019.name$"
  zz_valyria_magic_water_magic.019.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe water in the ritual basin draws back from one side and piles against the other, leaning like a tide. The caster's robes begin to tug in the same direction."
  zz_valyria_magic_water_magic.019.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA coil of wet rope lying upon the floor begins to pay itself out, slowly at first and then faster, hauled by nothing that anyone can see."
  zz_valyria_magic_water_magic.019.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe floor seems to tilt. Candles, cups and loose papers all begin to slide towards the same wall, and the sound of a retreating wave fills the room."
  zz_valyria_magic_water_magic.019.opt.a:0 "Drag them out!"
  zz_valyria_magic_water_magic.019.opt.z:0 "No, do not cast!"
  zz_valyria_magic_water_magic.019.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.019.name$"
  zz_valyria_magic_water_magic.019.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ sending a riptide through an army of [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.019.toast.tt:0 "$zz_valyria_magic_water_magic.019.toast.desc$"
  zz_valyria_magic_water_magic.019.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.019.name$"
  zz_valyria_magic_water_magic.019.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_water_magic.019.f.toast.tt:0 "$zz_valyria_magic_water_magic.019.f.toast.desc$"


  ## Water 020
  zz_valyria_magic_water_magic_020.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tp$\n$zz_dar$\n$zz_sd$\n$zz_ccd$\n$zz_mov$\n\nThe use of the arcane forces of [water_magic|E] to send a flood down the waterways of a chosen province.\n\nThrough this mystery, a great flood begins in the chosen province and strikes it with terrible force. It then runs on from one riverside or coastal province to the next, drowning armies and tearing down buildings as it goes.\n\nA flood cannot leave the water behind it. Where no river or coast lies ahead, the working ends."
  zz_valyria_magic_water_magic.020.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.020.name$"
  zz_valyria_magic_water_magic.020.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA deep groan rises from below the floor, the sound of stone giving way. The water in the ritual basin begins to shake, and then to climb the walls of the bowl."
  zz_valyria_magic_water_magic.020.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster draws a line of wet chalk across a map and breaks a clay seal upon it. Water runs from the crack and follows the line of the rivers."
  zz_valyria_magic_water_magic.020.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nAll at once every jug, cup and basin in the chamber overflows. The water runs together upon the floor and moves away as one, in a single purposeful stream."
  zz_valyria_magic_water_magic.020.opt.a:0 "Break the dams!"
  zz_valyria_magic_water_magic.020.opt.z:0 "No, do not cast!"
  zz_valyria_magic_water_magic.020.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.020.name$"
  zz_valyria_magic_water_magic.020.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ loosing a great flood in the lands of [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.020.toast.tt:0 "$zz_valyria_magic_water_magic.020.toast.desc$"
  zz_valyria_magic_water_magic.020.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.020.name$"
  zz_valyria_magic_water_magic.020.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_water_magic.020.f.toast.tt:0 "$zz_valyria_magic_water_magic.020.f.toast.desc$"


  ## Water 021
  zz_valyria_magic_water_magic_021.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tr$\n$zz_hr$\n$zz_mh$\n\nThe use of the arcane forces of [water_magic|E] to restore a wounded company with waters that mend.\n\nThrough this mystery, a spring rises in the camp of a chosen company. Those who drink from it find fever gone and wounds closed, and many who were counted lost return to the line.\n\nIt lacks the terrible strength of the blood mysteries, but it asks a far smaller price."
  zz_valyria_magic_water_magic.021.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.021.name$"
  zz_valyria_magic_water_magic.021.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nClear water wells up through a crack in the flagstones, cold and sweet. A smell of moss and wet stone fills the chamber, and the ache of old wounds fades from the room."
  zz_valyria_magic_water_magic.021.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster fills a clay bowl from the ritual basin and pours it upon the ground. The earth drinks, and then gives back more than it was given."
  zz_valyria_magic_water_magic.021.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA slow drip begins from the ceiling, falling in time with a heartbeat. Each drop strikes the basin with a clear note, and each note leaves the air a little cleaner."
  zz_valyria_magic_water_magic.021.opt.a:0 "Let the springs rise!"
  zz_valyria_magic_water_magic.021.opt.z:0 "No, do not cast!"
  zz_valyria_magic_water_magic.021.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.021.name$"
  zz_valyria_magic_water_magic.021.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ raising healing springs for a company of [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.021.toast.tt:0 "$zz_valyria_magic_water_magic.021.toast.desc$"
  zz_valyria_magic_water_magic.021.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.021.name$"
  zz_valyria_magic_water_magic.021.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_water_magic.021.f.toast.tt:0 "$zz_valyria_magic_water_magic.021.f.toast.desc$"


  ## Water 022
  zz_valyria_magic_water_magic_022.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_dsick$\n$zz_coast$\n$zz_resm$\n\nThe use of the arcane forces of [water_magic|E] to fill a chosen subject's lungs with the sea.\n\nThrough this mystery, a slow sickness of salt and water takes root in the subject. It gives warning, and a skilled healer or mage may yet turn it aside, but those who ignore the taste of brine drown in their own beds.\n\nThe working grows stronger when the victim is at sea or upon the coast. Skilled mages resist it through their own Higher Mysteries."
  zz_valyria_magic_water_magic.022.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.022.name$"
  zz_valyria_magic_water_magic.022.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster breathes slowly over a bowl of seawater. With each breath the level in the bowl falls, though nothing is drunk, and nothing is spilled."
  zz_valyria_magic_water_magic.022.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA lock of the subject's hair is dropped into a jar of brine and the lid is sealed with wax. The caster sets it upon the altar and begins, softly, to cough."
  zz_valyria_magic_water_magic.022.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA cup is filled with salt water and turned over upon the altar. Not a drop falls. It has already gone where it was sent."
  zz_valyria_magic_water_magic.022.opt.a:0 "Fill their lungs!"
  zz_valyria_magic_water_magic.022.opt.z:0 "No, do not cast!"
  zz_valyria_magic_water_magic.022.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.022.name$"
  zz_valyria_magic_water_magic.022.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ sending a slow tide against [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.022.toast.tt:0 "$zz_valyria_magic_water_magic.022.toast.desc$"
  zz_valyria_magic_water_magic.022.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.022.name$"
  zz_valyria_magic_water_magic.022.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_water_magic.022.f.toast.tt:0 "$zz_valyria_magic_water_magic.022.f.toast.desc$"


  ## Water 023
  zz_valyria_magic_water_magic_023.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_nav_up$\n$zz_sea$\n\nThe use of the arcane forces of [water_magic|E] to make the sea an ally to a chosen subject.\n\nThrough this mystery, tides turn early and currents run true beneath the subject's keels. Their fleets sail faster, and the cost of putting to sea is lessened.\n\nThis working has no power on land. It is the sea alone that answers it."
  zz_valyria_magic_water_magic.023.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.023.name$"
  zz_valyria_magic_water_magic.023.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe water in the ritual basin begins to rise and fall in a slow, steady rhythm, as though the chamber itself had put out to sea."
  zz_valyria_magic_water_magic.023.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA small boat of folded parchment is set upon the basin. There is no wind in the chamber, yet it sails, straight and sure, against the edge of the bowl."
  zz_valyria_magic_water_magic.023.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA smell of salt and tar fills the room. Far away, gulls begin to cry, and the floor seems to rock gently beneath the caster's feet."
  zz_valyria_magic_water_magic.023.opt.a:0 "Turn the tide!"
  zz_valyria_magic_water_magic.023.opt.z:0 "No, do not cast!"
  zz_valyria_magic_water_magic.023.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.023.name$"
  zz_valyria_magic_water_magic.023.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ binding the tides to the favour of [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.023.toast.tt:0 "$zz_valyria_magic_water_magic.023.toast.desc$"
  zz_valyria_magic_water_magic.023.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.023.name$"
  zz_valyria_magic_water_magic.023.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_water_magic.023.f.toast.tt:0 "$zz_valyria_magic_water_magic.023.f.toast.desc$"


  ## Water 024
  zz_valyria_magic_water_magic_024.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_sa$\n$zz_nrep$\n$zz_coast$\n\nThe use of the arcane forces of [water_magic|E] to raise a host from the mist.\n\nThrough this mystery, a small company of Mist Shades forms around the chosen commander. They strike feebly, but no other summoned host is so hard to bring down.\n\nWhen called beside a coast or a river, half as many again rise from the water."
  zz_valyria_magic_water_magic.024.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.024.name$"
  zz_valyria_magic_water_magic.024.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe water in the ritual basin begins to steam, though no fire is near it. The vapour settles along the floor and slowly stands."
  zz_valyria_magic_water_magic.024.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster breathes out across a still pool. The mist of that breath does not fade, but thickens, and stays."
  zz_valyria_magic_water_magic.024.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe chamber grows damp and cold. Pale figures gather in the fog, patient as the tide."
  zz_valyria_magic_water_magic.024.opt.a:0 "Rise from the mist."
  zz_valyria_magic_water_magic.024.opt.z:0 "No, do not cast!"
  zz_valyria_magic_water_magic.024.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.024.name$"
  zz_valyria_magic_water_magic.024.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ raising a host of mist for [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.024.toast.tt:0 "$zz_valyria_magic_water_magic.024.toast.desc$"
  zz_valyria_magic_water_magic.024.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.024.name$"
  zz_valyria_magic_water_magic.024.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_water_magic.024.f.toast.tt:0 "$zz_valyria_magic_water_magic.024.f.toast.desc$"


  ## Water 025
  zz_valyria_magic_water_magic_025.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_rstr$\n$zz_strs_dn$\n\nThe use of the arcane forces of [water_magic|E] to calm a troubled mind.\n\nThrough this mystery, the turmoil of the chosen character settles like silt in a quiet pool. Their stress drains away at once, and for some time after the world weighs less heavily upon them.\n\nOf all the mysteries of water this is the gentlest, and the most often asked for in secret."
  zz_valyria_magic_water_magic.025.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.025.name$"
  zz_valyria_magic_water_magic.025.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe surface of the ritual basin trembles, and then stops. The stillness spreads outward from it until the whole chamber seems to be holding its breath."
  zz_valyria_magic_water_magic.025.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster bathes the subject's brow with cool water, and speaks low and slowly. The tension leaves their shoulders by degrees."
  zz_valyria_magic_water_magic.025.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA single drop falls into a dark bowl. The ring it makes goes on widening, long after it ought to have faded."
  zz_valyria_magic_water_magic.025.opt.a:0 "Be at peace."
  zz_valyria_magic_water_magic.025.opt.z:0 "No, do not cast!"
  zz_valyria_magic_water_magic.025.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.025.name$"
  zz_valyria_magic_water_magic.025.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ calming the troubled mind of [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.025.toast.tt:0 "$zz_valyria_magic_water_magic.025.toast.desc$"
  zz_valyria_magic_water_magic.025.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.025.name$"
  zz_valyria_magic_water_magic.025.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."
  zz_valyria_magic_water_magic.025.f.toast.tt:0 "$zz_valyria_magic_water_magic.025.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_water_magic_026.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_cf$\n\nThe use of the arcane forces of [water_magic|E] to convert the selected subject to the faith of the commander.\n\nWater washes away the old and makes all things new. Dream Magic can lead a mind to any faith; the water can only bring it to the commander's own."

  ## Spell Options
  ## event
  zz_valyria_magic_water_magic.026.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.026.name$"
  zz_valyria_magic_water_magic.026.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe subject is lowered into a pool beneath the tower. When they rise, they pray with different words."
  zz_valyria_magic_water_magic.026.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster pours water over the subject's head from a silver ewer, three times, and speaks the commander's creed."
  zz_valyria_magic_water_magic.026.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nHoly water is dripped onto the subject's lips while they sleep. They wake remembering a faith they never learned."
  zz_valyria_magic_water_magic.026.opt.a:0 "Baptise them."
  zz_valyria_magic_water_magic.026.opt.z:0 "No, do not cast!"

  zz_valyria_magic_water_magic.026.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.026.name$"
  zz_valyria_magic_water_magic.026.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ baptising [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.026.toast.tt:0 "$zz_valyria_magic_water_magic.026.toast.desc$"

  zz_valyria_magic_water_magic.026.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.026.name$"
  zz_valyria_magic_water_magic.026.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_water_magic.026.f.toast.tt:0 "$zz_valyria_magic_water_magic.026.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_water_magic_027.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_ccul$\n\nThe use of the arcane forces of [water_magic|E] to change the selected subject's culture to one of the commander's choosing.\n\nThe sea changes all who cross it. Those it changes most come ashore as strangers to their own kin."

  ## Spell Options
  ## event
  zz_valyria_magic_water_magic.027.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.027.name$"
  zz_valyria_magic_water_magic.027.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe subject drinks a cup of seawater drawn from a far coast. By morning their speech has the accent of that shore."
  zz_valyria_magic_water_magic.027.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster pours river water over the subject's hands until it runs clear. They no longer remember the songs of their childhood."
  zz_valyria_magic_water_magic.027.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe subject bathes in a tide pool at moonrise and walks out of it speaking another tongue."
  zz_valyria_magic_water_magic.027.opt.a:0 "Let the sea change them."
  zz_valyria_magic_water_magic.027.opt.z:0 "No, do not cast!"

  zz_valyria_magic_water_magic.027.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.027.name$"
  zz_valyria_magic_water_magic.027.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ changing [recipient.GetFirstName] as the sea changes all things."
  zz_valyria_magic_water_magic.027.toast.tt:0 "$zz_valyria_magic_water_magic.027.toast.desc$"

  zz_valyria_magic_water_magic.027.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.027.name$"
  zz_valyria_magic_water_magic.027.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_water_magic.027.f.toast.tt:0 "$zz_valyria_magic_water_magic.027.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_water_magic_028.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_dcor$\n\nThe use of the arcane forces of [water_magic|E] to wash away one relationship between the selected subject and a chosen character.\n\nWhat has passed is water under the bridge, and water does not flow back."

  ## Spell Options
  ## event
  zz_valyria_magic_water_magic.028.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.028.name$"
  zz_valyria_magic_water_magic.028.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe subject and the caster stand on a bridge at dawn. The caster lets a ribbon fall into the river, and the subject forgets why it ever mattered."
  zz_valyria_magic_water_magic.028.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster pours a cup of wine into a stream and lets it carry away the memory of every quarrel and kiss."
  zz_valyria_magic_water_magic.028.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA letter between the two is soaked until the ink runs, then left in the rain."
  zz_valyria_magic_water_magic.028.opt.a:0 "Let it pass."
  zz_valyria_magic_water_magic.028.opt.z:0 "No, do not cast!"

  zz_valyria_magic_water_magic.028.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.028.name$"
  zz_valyria_magic_water_magic.028.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ washing away a bond of [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.028.toast.tt:0 "$zz_valyria_magic_water_magic.028.toast.desc$"

  zz_valyria_magic_water_magic.028.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.028.name$"
  zz_valyria_magic_water_magic.028.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_water_magic.028.f.toast.tt:0 "$zz_valyria_magic_water_magic.028.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_water_magic_029.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_dsec$\n\nThe use of the arcane forces of [water_magic|E] to wash one chosen secret away from the selected subject.\n\nWater washes out every stain, given time. The caster gives it no time at all. Water must scrub what a dream would simply forget, so this costs more than Dream Magic's version."

  ## Spell Options
  ## event
  zz_valyria_magic_water_magic.029.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.029.name$"
  zz_valyria_magic_water_magic.029.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe subject's hands are washed in a basin of cold spring water until the water runs dark. When it clears, so has their conscience."
  zz_valyria_magic_water_magic.029.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA bloodstained cloth is soaked in the river overnight. In the morning it is white, and no one remembers the blood."
  zz_valyria_magic_water_magic.029.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster bathes the subject in rainwater gathered on a moonless night, and what they did is gone from the world."
  zz_valyria_magic_water_magic.029.opt.a:0 "Wash it away."
  zz_valyria_magic_water_magic.029.opt.z:0 "No, do not cast!"

  zz_valyria_magic_water_magic.029.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.029.name$"
  zz_valyria_magic_water_magic.029.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ washing a stain from [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.029.toast.tt:0 "$zz_valyria_magic_water_magic.029.toast.desc$"

  zz_valyria_magic_water_magic.029.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.029.name$"
  zz_valyria_magic_water_magic.029.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_water_magic.029.f.toast.tt:0 "$zz_valyria_magic_water_magic.029.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_water_magic_030.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_ccd$\n\nThe use of the arcane forces of [water_magic|E] to flood the selected county, enriching its soil with prosperity progress of half the caster's skill, but its levies and supply suffer while the waters stand.\n\nThe river gives as it takes. When it withdraws, the fields are black and rich."

  ## Spell Options
  ## event
  zz_valyria_magic_water_magic.030.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.030.name$"
  zz_valyria_magic_water_magic.030.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster pours a jug of river water onto the county map, and far away the river bursts its banks."
  zz_valyria_magic_water_magic.030.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nRain falls for three days over the county. When it stops, the fields are drowned and the silt lies thick."
  zz_valyria_magic_water_magic.030.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA dam of reeds is cut at the caster's word, and the floodwaters spread across the fields."
  zz_valyria_magic_water_magic.030.opt.a:0 "Release the flood."
  zz_valyria_magic_water_magic.030.opt.z:0 "No, do not cast!"

  zz_valyria_magic_water_magic.030.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.030.name$"
  zz_valyria_magic_water_magic.030.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ flooding the fields of [target.GetName]."
  zz_valyria_magic_water_magic.030.toast.tt:0 "$zz_valyria_magic_water_magic.030.toast.desc$"

  zz_valyria_magic_water_magic.030.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.030.name$"
  zz_valyria_magic_water_magic.030.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_water_magic.030.f.toast.tt:0 "$zz_valyria_magic_water_magic.030.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_water_magic_031.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_dch$\n\nThe use of the arcane forces of [water_magic|E] to wash away a weak hook the selected subject holds on a chosen character.\n\nWater loosens every knot in time. A weak bond it unties at once; a strong one is beyond it, where Dream Magic is not."

  ## Spell Options
  ## event
  zz_valyria_magic_water_magic.031.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.031.name$"
  zz_valyria_magic_water_magic.031.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA knotted cord is dropped into a fast stream. By the time it reaches the sea, the knot has come loose."
  zz_valyria_magic_water_magic.031.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster pours water over a signed promise until the signature runs and fades."
  zz_valyria_magic_water_magic.031.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe two are made to wash their hands in the same basin, and what one owed the other drains away with the water."
  zz_valyria_magic_water_magic.031.opt.a:0 "Loosen the bond."
  zz_valyria_magic_water_magic.031.opt.z:0 "No, do not cast!"

  zz_valyria_magic_water_magic.031.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.031.name$"
  zz_valyria_magic_water_magic.031.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ breaking a bond held by [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.031.toast.tt:0 "$zz_valyria_magic_water_magic.031.toast.desc$"

  zz_valyria_magic_water_magic.031.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.031.name$"
  zz_valyria_magic_water_magic.031.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$."
  zz_valyria_magic_water_magic.031.f.toast.tt:0 "$zz_valyria_magic_water_magic.031.f.toast.desc$"

  # Water 032 - the Drowning Deep (Strike Embarked Army)
  zz_valyria_magic_water_magic_032.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_ta$\n$zz_sea$\n$zz_cd$\n\nThe use of the arcane forces of [water_magic|E] to drag an army at sea down into the deep.\n\nAn embarked army suffers catastrophic losses, growing with the caster's mastery. It has no effect on an army on land.\n\nThe sea-mages of the Freehold said that every ship floats only by the sea's leave, and that the sea can always be persuaded to withdraw it."
  zz_valyria_magic_water_magic.032.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.032.name$"
  zz_valyria_magic_water_magic.032.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster lowers a hand into a basin of seawater and closes it into a fist. Far away, beneath a fleet under full sail, the sea opens.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may drown [recipient.GetFirstName]'s army at sea. Will you call the deep?"
  zz_valyria_magic_water_magic.032.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA wave rises from a flat calm, taller than any mast, and falls upon the ships with the weight of a mountain. When the spray clears, there is much less fleet than before.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may drown [recipient.GetFirstName]'s army at sea. Will you call the deep?"
  zz_valyria_magic_water_magic.032.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster sings a drowned sailor's song, and the deep answers. Hands of black water rise around the hulls and pull, and the timbers groan and split.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may drown [recipient.GetFirstName]'s army at sea. Will you call the deep?"
  zz_valyria_magic_water_magic.032.opt.a:0 "Call up the deep."
  zz_valyria_magic_water_magic.032.opt.z:0 "No, let the sea be calm."
  zz_valyria_magic_water_magic.032.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.032.name$"
  zz_valyria_magic_water_magic.032.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ dragging an army down into the deep."
  zz_valyria_magic_water_magic.032.toast.tt:0 "$zz_valyria_magic_water_magic.032.toast.desc$"
  zz_valyria_magic_water_magic.032.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.032.name$"
  zz_valyria_magic_water_magic.032.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$ as the sea settles and the ships sail on."
  zz_valyria_magic_water_magic.032.f.toast.tt:0 "$zz_valyria_magic_water_magic.032.f.toast.desc$"

  # Water 033 - the Undertow (Single Combat)
  zz_valyria_magic_water_magic_033.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_duel_move$\n$zz_duel_skill$\n\nThe use of the arcane forces of [water_magic|E] to pull the ground from beneath the foe like a wave drawing back from the shore.\n\nThe foe's duel success falls, the more so with greater skill in Water Magic."
  zz_valyria_magic_water_magic.033.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.033.name$"
