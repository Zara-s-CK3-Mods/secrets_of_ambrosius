

l_english:

 
  ## Water Magic
  ## Interaction
  zz_valyria_magic_water_magic_001.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_duel_move$\n$zz_duel_skill$\n\nThe use of the arcane forces of [water_magic|E] to strike a chosen subject with the crushing weight of water.\n\nWater is patient, but it is never weak. Through this mystery, the full weight of the deep sea is summoned and brought down upon a single subject, crushing bone and driving the breath from their lungs.\n\nIn the instant of the strike, the caster may choose whether to cripple or to kill. Those who survive often carry the memory of drowning for the rest of their lives.\n\nThe tide-sorcerers of the Freehold used this working rarely and quietly. A body found drowned far from any water tells its own story to those who know how to read it."

  ##Spell Options
  ##event
  zz_valyria_magic_water_magic.001.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.001.name$"
  zz_valyria_magic_water_magic.001.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe air in the chamber grows heavy and damp. Water beads upon the walls and runs down in slow rivulets, and the pressure builds until every breath feels like breathing at the bottom of a well.\n\nThe tide-sorcerers of Valyria learned this working from the sea itself, which has drowned more men than every army in history.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bring the crushing weight of water down upon [recipient.GetFirstName], and decide in the moment whether to maim or to slay. Is such a death fitting for them?"
  zz_valyria_magic_water_magic.001.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster fills a heavy bronze bowl to the brim and holds it above their head. The water does not spill. It grows heavier and heavier, pressing down upon their arms, until they lower it slowly and the floor beneath it cracks under the weight.\n\nThe tide-sorcerers of the Freehold held that the sea's strength lies not in its waves but in its weight, and they learned to wield that weight like a hammer.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bring the crushing weight of water down upon [recipient.GetFirstName], and decide in the moment whether to maim or to slay. Is such a death fitting for them?"
  zz_valyria_magic_water_magic.001.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA single drop of water is let fall from a glass rod onto the ritual stone. It does not splash. It spreads, flat and heavy, and the stone beneath it groans, and the air in the chamber grows thick and damp, as though the whole room had sunk beneath the sea.\n\nIn Valyria, it was said that the deep waters remember every ship they have ever crushed, and that the tide-sorcerers could call that memory up.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bring the crushing weight of water down upon [recipient.GetFirstName], and decide in the moment whether to maim or to slay. Is such a death fitting for them?"
  zz_valyria_magic_water_magic.001.opt.a:0 "Crush them, but let them live!"
  zz_valyria_magic_water_magic.001.opt.b:0 "Yes, strike them down with the waves, even unto death!"

  zz_valyria_magic_water_magic.001.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.001.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.001.name$"
  zz_valyria_magic_water_magic.001.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ bringing the crushing weight of water down upon [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.001.toast.tt:0 "$zz_valyria_magic_water_magic.001.toast.desc$"
  zz_valyria_magic_water_magic.001.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.001.name$"
  zz_valyria_magic_water_magic.001.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.001.f.toast.tt:0 "$zz_valyria_magic_water_magic.001.f.toast.desc$"

  zz_valyria_magic_water_magic.001.toast.tyranny:0 ""

  ## Interaction

  zz_valyria_magic_water_magic_002.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_ta$\n$zz_da$\n$zz_ld$\n\nThe use of the arcane forces of [water_magic|E] to sweep an enemy army away with a surging torrent.\n\nThrough this mystery, a torrent of water is summoned out of nothing and sent surging through an enemy host. Men are swept from their feet, wagons overturned, and supplies carried off in the flood.\n\nThe damage is modest compared with the great war-workings of fire and air, but the torrent leaves chaos in its wake, and chaos is its own kind of wound.\n\nThe tide-sorcerers of the Freehold used this working to harry armies on the march, breaking up columns and scattering baggage trains."
  ##event
  zz_valyria_magic_water_magic.002.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.002.name$"
  zz_valyria_magic_water_magic.002.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA sound like rushing water fills the chamber, growing louder until it drowns out every other noise. The floor grows slick and wet, and the smell of river mud rises from nowhere.\n\nThe Valyrians called this the Breaking of the Banks, and their enemies came to fear the sound of running water as much as the sound of war-horns.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send a surging torrent through an army of [recipient.GetFirstName], scattering its soldiers and sweeping away its supplies. Will you let the waters rise?"
  zz_valyria_magic_water_magic.002.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster tips a jug of water onto the floor, and instead of spreading, it gathers itself into a narrow, rushing stream that runs straight across the chamber and strikes the far wall with the force of a battering ram.\n\nThe enemies of the Freehold learned to dread the sound of rushing water. It meant the tide-sorcerers had come, and that the river would soon be in their camp.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send a surging torrent through an army of [recipient.GetFirstName], scattering its soldiers and sweeping away its supplies. Will you let the waters rise?"
  zz_valyria_magic_water_magic.002.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA model of a river dam, made of clay and wood, is set upon the ritual stone. The caster speaks a word, and the dam cracks, and a torrent of water bursts through it, far more than the little model could ever have held.\n\nIn Valyria, the tide-sorcerers could turn a gentle river into a raging flood, and turn it upon whatever army was unwise enough to camp beside it.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may send a surging torrent through an army of [recipient.GetFirstName], scattering its soldiers and sweeping away its supplies. Will you let the waters rise?"
  zz_valyria_magic_water_magic.002.opt.a:0 "Let the waters rise!"
  zz_valyria_magic_water_magic.002.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.002.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.002.name$"
  zz_valyria_magic_water_magic.002.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ sweeping through an army of [recipient.GetFirstName] with a surging torrent."
  zz_valyria_magic_water_magic.002.toast.tt:0 "$zz_valyria_magic_water_magic.002.toast.desc$"
  zz_valyria_magic_water_magic.002.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.002.name$"
  zz_valyria_magic_water_magic.002.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.002.f.toast.tt:0 "$zz_valyria_magic_water_magic.002.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_water_magic_003.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_ta$\n$zz_as$\n\nThe use of the arcane forces of [water_magic|E] to replenish the supplies of a chosen army.\n\nAn army marches on its stomach, and dies of thirst long before it dies of hunger. Through this mystery, the stores of a chosen army are replenished: water-skins refill, barrels grow heavy, and the wagons groan beneath renewed supplies.\n\nThe army can march further and fight longer before hunger and thirst begin to take their toll.\n\nThe legions of the Freehold crossed deserts that had swallowed every army before them. The tide-sorcerers who marched with them were the reason."
  ##event
  zz_valyria_magic_water_magic.003.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.003.name$"
  zz_valyria_magic_water_magic.003.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA cool, clean smell of fresh water fills the chamber. The empty cup upon the altar fills, slowly at first, then overflows, and keeps on flowing.\n\nThe quartermasters of the Freehold prized their tide-sorcerers above any wagon-master. Logistics, they said, win wars; and water is the first of all logistics.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may replenish the supplies of an army of [recipient.GetFirstName], allowing it to march further and fight longer. Will you fill their stores?"
  zz_valyria_magic_water_magic.003.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nAn empty wineskin is laid upon the ritual stone, and the caster pours a single cup of water into it. The skin swells, and keeps swelling, until it is taut and full and the water is spilling from its mouth in a steady stream.\n\nThe quartermasters of the Freehold never feared a dry march. Their tide-sorcerers carried rivers with them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may replenish the supplies of an army of [recipient.GetFirstName], allowing it to march further and fight longer. Will you fill their stores?"
  zz_valyria_magic_water_magic.003.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA bucket is lowered into the ritual basin and drawn up full. The caster empties it and lowers it again, and it comes up full again, and again, each time with more water than the basin could ever have held.\n\nIn Valyria, it was said that an army marches on its water before its bread. The tide-sorcerers made sure neither ever ran short.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may replenish the supplies of an army of [recipient.GetFirstName], allowing it to march further and fight longer. Will you fill their stores?"
  zz_valyria_magic_water_magic.003.opt.a:0 "Logistics win wars!"
  zz_valyria_magic_water_magic.003.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.003.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.003.name$"
  zz_valyria_magic_water_magic.003.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ replenishing the supplies of an army of [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.003.toast.tt:0 "$zz_valyria_magic_water_magic.003.toast.desc$"
  zz_valyria_magic_water_magic.003.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.003.name$"
  zz_valyria_magic_water_magic.003.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.003.f.toast.tt:0 "$zz_valyria_magic_water_magic.003.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_water_magic_004.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tp$\n$zz_se$\n\nThe use of the arcane forces of [water_magic|E] to corrupt the waters of a chosen province and loose a pestilence upon it.\n\nWater gives life, and water can take it. Through this mystery, the wells, rivers, and rains of a chosen province are corrupted, and a pestilence rises from them to sweep through the land.\n\nThe severity of the plague depends upon how much power the caster is willing to pour into the working.\n\nIt is said that a great river was once poisoned in this way, in the wars between the Freehold and the river-folk. If so, the river remembers."
  ##event
  zz_valyria_magic_water_magic.004.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.004.name$"
  zz_valyria_magic_water_magic.004.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe water in the basin upon the altar turns cloudy, then grey, then black. A sickly-sweet smell rises from it, the smell of stagnant pools and fever-wards, and those nearby find their throats suddenly dry.\n\nFew practitioners of the Freehold would admit to knowing this working, for even among the sorcerers of Valyria, to poison the waters of a land was considered an abomination.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may corrupt the waters of the chosen province and loose a pestilence upon its people. But a plague cares nothing for borders. Is any enemy worth such a crime?"
  zz_valyria_magic_water_magic.004.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster lets a single drop of a dark, oily liquid fall into the ritual basin. It spreads through the clear water like ink, turning it grey, then black, and a smell of rot and fever rises from its surface.\n\nEven in Valyria, the poisoning of rivers was spoken of with distaste. Those who practised it were paid well, and spoken of seldom.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may corrupt the waters of the chosen province and loose a pestilence upon its people. But a plague cares nothing for borders. Is any enemy worth such a crime?"
  zz_valyria_magic_water_magic.004.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA dead fish is laid in a bowl of clean water, and the caster speaks the words of corruption over it. The water clouds at once, a sickly green spreading through it, and the smell that rises from it makes the watchers turn away.\n\nThe tide-sorcerers of the Freehold could heal a river or kill it. Few of them ever admitted to doing the latter.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may corrupt the waters of the chosen province and loose a pestilence upon its people. But a plague cares nothing for borders. Is any enemy worth such a crime?"
  
  water_magic_intensity_01:0 "Small"
  water_magic_intensity_02:0 "Major"
  water_magic_intensity_03:0 "Apocalyptic"
  zz_valyria_magic_water_magic.004.opt.e:0 "Let a plague ravage! "
  zz_valyria_magic_water_magic.004.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.004.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.004.name$"
  zz_valyria_magic_water_magic.004.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ corrupting the waters of [target.GetName] and loosing a pestilence upon it."
  zz_valyria_magic_water_magic.004.toast.tt:0 "$zz_valyria_magic_water_magic.004.toast.desc$"
  zz_valyria_magic_water_magic.004.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.004.name$"
  zz_valyria_magic_water_magic.004.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.004.f.toast.tt:0 "$zz_valyria_magic_water_magic.004.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_water_magic_005.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tca$\n$zz_wadv$\n\nThe use of the arcane forces of [water_magic|E] to bind the bitter strength of winter to a commander's armies.\n\nWater in its winter form is ice, snow, and bitter cold. Through this mystery, the strength of winter itself is bound to the armies of a chosen subject, so that they fight as if the season were their ally.\n\nThe subject's armies gain a substantial advantage when fighting in winter, while their enemies freeze and falter around them.\n\nThe legions of the Freehold rarely campaigned in winter. When they did, it was because they knew the cold would fight for them."
  ##event
  zz_valyria_magic_water_magic.005.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.005.name$"
  zz_valyria_magic_water_magic.005.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe chamber grows bitterly cold. Frost spreads across the flagstones, breath steams in the air, and the water in the ritual basin freezes solid with a sharp crack.\n\nThe tide-sorcerers of the Freehold who mastered the winter waters were sent north with the legions, where the cold would otherwise have been their enemy.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bind winter's strength to the armies of [recipient.GetFirstName], so that the cold fights at their side. Will you let winter's wind blow?"
  zz_valyria_magic_water_magic.005.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster breathes upon a pane of glass, and frost blooms across it in delicate, spreading patterns. The frost does not stop at the edge of the glass. It creeps outward onto the walls, the floor, the ceiling, until the whole chamber glitters with ice.\n\nThe tide-sorcerers who mastered winter were sent north with the Freehold's legions, and the cold that should have stopped them did not.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bind winter's strength to the armies of [recipient.GetFirstName], so that the cold fights at their side. Will you let winter's wind blow?"
  zz_valyria_magic_water_magic.005.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA cup of water is set upon the ritual stone and the caster speaks a single word over it. The water freezes from the top down with a sharp crackling sound, and the cold spreads out from it in a wave that numbs fingers and turns breath to mist.\n\nIn Valyria, it was said that the tide-sorcerers could call winter in the middle of summer, and turn it upon their enemies.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bind winter's strength to the armies of [recipient.GetFirstName], so that the cold fights at their side. Will you let winter's wind blow?"
  zz_valyria_magic_water_magic.005.opt.a:0 "Let winter's wind blow!"
  zz_valyria_magic_water_magic.005.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.005.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.005.name$"
  zz_valyria_magic_water_magic.005.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ binding the bitter strength of winter to the armies of [recipient.GetFirstName]."
  zz_valyria_magic_water_magic.005.toast.tt:0 "$zz_valyria_magic_water_magic.005.toast.desc$"
  zz_valyria_magic_water_magic.005.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.005.name$"
  zz_valyria_magic_water_magic.005.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.005.f.toast.tt:0 "$zz_valyria_magic_water_magic.005.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_water_magic_006.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tp$\n$zz_epr$\n$zz_tax$\n\nThe use of the arcane forces of [water_magic|E] to purify the waters of a chosen province, warding it against disease and enriching its people.\n\nClean water is the foundation of every healthy city. Through this mystery, the wells, rivers, and springs of a chosen province are purified, so that sickness finds it harder to take root and the people grow healthier and more prosperous.\n\nThe province becomes far more resistant to [epidemic|E]s, and its taxes increase as its people thrive.\n\nThe cities of the Freehold were famed for their fountains and their health. Visitors marvelled that plague so rarely touched them."
  ##event
  zz_valyria_magic_water_magic.006.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.006.name$"
  zz_valyria_magic_water_magic.006.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe water in the ritual basin clears until it is so transparent it seems not to be there at all. A smell of fresh rain and green growth fills the chamber.\n\nThe water-wardens of the Freehold walked the aqueducts and cisterns of every great city, singing to the waters and keeping them pure.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may purify the waters of the chosen province, warding it against disease and enriching its people. Will you let it flower?"
  zz_valyria_magic_water_magic.006.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster pours muddy water from a jug into a crystal bowl, and as it falls, it clears. By the time the bowl is full, the water is so clean and bright it seems to glow, and the smell of a mountain spring fills the chamber.\n\nThe water-wardens of the Freehold kept the cisterns of its great cities pure, and no plague ever took root within their walls.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may purify the waters of the chosen province, warding it against disease and enriching its people. Will you let it flower?"
  zz_valyria_magic_water_magic.006.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA sprig of mint and a handful of silver coins are dropped into the ritual basin, and the caster sings softly over the water. The water grows clear and sweet, and the coins shine at the bottom like stars.\n\nIn Valyria, it was understood that clean water was the foundation of every city, and the water-wardens were its keepers.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may purify the waters of the chosen province, warding it against disease and enriching its people. Will you let it flower?"
  zz_valyria_magic_water_magic.006.opt.a:0 "Let it flower!"
  zz_valyria_magic_water_magic.006.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.006.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.006.name$"
  zz_valyria_magic_water_magic.006.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ purifying the waters of [target.GetName], warding it against disease and enriching its people."
  zz_valyria_magic_water_magic.006.toast.tt:0 "$zz_valyria_magic_water_magic.006.toast.desc$"
  zz_valyria_magic_water_magic.006.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.006.name$"
  zz_valyria_magic_water_magic.006.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.006.f.toast.tt:0 "$zz_valyria_magic_water_magic.006.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_water_magic_007.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tcc$\n$zz_ccd$\n\nThe use of the arcane forces of [water_magic|E] to bless a chosen county with waters of fertility.\n\nThrough this mystery, the waters of a chosen county are made fertile: rivers run richer, rains fall more kindly, and the land answers with abundance.\n\nThe county grows in wealth and vigour, its fields and towns flourishing beneath the blessing.\n\nThe river-provinces of the Freehold were the breadbasket of the world. Their fertility was no accident."
  ##event
  zz_valyria_magic_water_magic.007.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.007.name$"
  zz_valyria_magic_water_magic.007.desc:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA warm, soft rain begins to fall within the chamber, though there is a roof overhead. Where it lands, green shoots push up between the flagstones.\n\nThe water-wardens of the Freehold blessed the fields of the empire each spring, and the harvests that followed were the envy of every other land.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bless the waters of the chosen county, letting its land flourish beneath your art. Will you let it flower?"
  zz_valyria_magic_water_magic.007.desc_02:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nThe caster holds a bowl of seeds beneath a slow drip of water, and as each drop falls, a seed splits and sends out a pale green shoot. By the end of the incantation, the bowl is a tangle of tiny green leaves.\n\nThe water-wardens of the Freehold blessed its fields each spring, and its granaries were never empty.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bless the waters of the chosen county, letting its land flourish beneath your art. Will you let it flower?"
  zz_valyria_magic_water_magic.007.desc_03:0 "[secondary_recipient.Custom('zz_valyria_magic_cast_opener_water_magic')]\n\nA soft mist rises from the ritual basin and drifts across a map of the chosen land. Where it settles, the parchment darkens as if wet with rain, and the faint scent of new growth fills the chamber.\n\nIn Valyria, the harvests were richer than in any other land. The farmers gave thanks to the gods; the water-wardens did not correct them.\n\n[secondary_recipient.Custom('zz_valyria_magic_cast_moment')] You may bless the waters of the chosen county, letting its land flourish beneath your art. Will you let it flower?"
  zz_valyria_magic_water_magic.007.opt.a:0 "Let the land flourish!"
  zz_valyria_magic_water_magic.007.opt.z:0 "No, do not cast!"
  ## Spell Toast
